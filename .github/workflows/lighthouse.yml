name: Lighthouse CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [desktop, mobile]
        # 20 адресов по 3 замера на каждый. Делим на четыре части и считаем
        # параллельно: на двух частях замер занимал 13 минут, из них около шести
        # — сама сборка. Ниже сборки не опуститься, поэтому четыре части это
        # практический предел, дальше дробить бессмысленно.
        #
        # Число замеров на адрес не трогаем: срезать его — самый лёгкий способ
        # ускориться и самый плохой, вырастет разброс и гейт начнёт врать.
        shard: [1, 2, 3, 4]
    name: ${{ matrix.preset }} (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # См. пояснение в build.yml. Здесь минификация HTML НЕ отключается: этот
      # шаг меряет вес страницы, и мерить надо то, что реально уедет на прод.
      - name: Кэш обработанных картинок
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png') }}
          restore-keys: astro-assets-${{ runner.os }}-

      - run: npm run build
      - name: Run Lighthouse (${{ matrix.preset }}, часть ${{ matrix.shard }})
        env:
          PRESET: ${{ matrix.preset }}
          SHARD: ${{ matrix.shard }}
          SHARDS: '4'
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          npm install -g @lhci/cli
          CONF=./lighthouserc.json
          [ "$PRESET" = "mobile" ] && CONF=./lighthouserc.mobile.json
          # Свой кусок списка адресов; остальное берётся из конфига как было.
          # Раскладываем по кругу, а не подряд: тяжёлые страницы в списке идут
          # рядом, и нарезка ломтями свалила бы их все в одну часть.
          URLS=$(node -e "
            const all = require('$CONF').ci.collect.url;
            const n = Number(process.env.SHARDS), i = Number(process.env.SHARD);
            const part = all.filter((_, k) => k % n === i - 1);
            if (part.length === 0) { console.error('пустая часть — адресов меньше, чем частей'); process.exit(1); }
            console.log(part.map((u) => '--collect.url=' + u).join(' '));
          ")
          echo "часть $SHARD из $SHARDS: $(echo "$URLS" | wc -w) адресов"
          lhci autorun --config="$CONF" $URLS
