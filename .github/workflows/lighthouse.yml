name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    # ⛔ Замер скорости держал мерж дольше всех: восемь частей по ~10 минут,
    # 26,5 мин машинного времени на прогон. При этом текстовая правка скорость
    # страницы не меняет — меняет её код, вёрстка, шрифты и картинки.
    # Поэтому на правки ТОЛЬКО контента замер не гоняем: заметка ленты и текст
    # статьи уезжают на сайт без лишних десяти минут ожидания.
    # Всё, что способно испортить скорость, под фильтр НЕ попадает и проверяется
    # как раньше. Раз в неделю замер идёт по расписанию на всём сайте — если
    # что-то деградировало от накопления контента, это видно там.
    paths-ignore:
      - 'src/content/**'
      - 'news/**'
      - 'public/llms*.txt'
      - '**/*.md'
  schedule:
    # Понедельник, 04:20 UTC — полный замер по всему сайту независимо от правок.
    - cron: '20 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [desktop, mobile]
        # 20 адресов по 3 замера на каждый. Делим на четыре части и считаем
        # параллельно: на двух частях замер занимал 13 минут, из них около шести
        # — сама сборка. Ниже сборки не опуститься, поэтому четыре части это
        # практический предел, дальше дробить бессмысленно.
        #
        # Число замеров на адрес не трогаем: срезать его — самый лёгкий способ
        # ускориться и самый плохой, вырастет разброс и гейт начнёт врать.
        shard: [1, 2, 3, 4]
    name: ${{ matrix.preset }} (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Полная история нужна дате актуальности (она считается по git log).
          # blob:none качает граф коммитов без СТАРЫХ версий файлов: git log
          # работает, а 2,1 ГБ истории эталонных скриншотов не едут вовсе.
          # Замер 03.08.2026: выкачка занимала 14,4 мин из 24,6 мин выкладки.
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # См. пояснение в build.yml. Здесь минификация HTML НЕ отключается: этот
      # шаг меряет вес страницы, и мерить надо то, что реально уедет на прод.
      - name: Кэш обработанных картинок
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png') }}
          restore-keys: astro-assets-${{ runner.os }}-

      - run: npm run build
      - name: Run Lighthouse (${{ matrix.preset }}, часть ${{ matrix.shard }})
        env:
          PRESET: ${{ matrix.preset }}
          SHARD: ${{ matrix.shard }}
          SHARDS: '4'
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          npm install -g @lhci/cli
          CONF=./lighthouserc.json
          [ "$PRESET" = "mobile" ] && CONF=./lighthouserc.mobile.json
          # Свой кусок списка адресов; остальное берётся из конфига как было.
          # Раскладываем по кругу, а не подряд: тяжёлые страницы в списке идут
          # рядом, и нарезка ломтями свалила бы их все в одну часть.
          URLS=$(node -e "
            const all = require('$CONF').ci.collect.url;
            const n = Number(process.env.SHARDS), i = Number(process.env.SHARD);
            const part = all.filter((_, k) => k % n === i - 1);
            if (part.length === 0) { console.error('пустая часть — адресов меньше, чем частей'); process.exit(1); }
            console.log(part.map((u) => '--collect.url=' + u).join(' '));
          ")
          echo "часть $SHARD из $SHARDS: $(echo "$URLS" | wc -w) адресов"
          lhci autorun --config="$CONF" $URLS
