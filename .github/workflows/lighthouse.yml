name: Lighthouse CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Free ephemeral runner disk
        run: |
          df -h "$GITHUB_WORKSPACE"
          sudo rm -rf -- /usr/local/lib/android
          df -h "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: node_modules/.astro
          key: astro-assets-v2-${{ runner.os }}-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.webp', 'src/**/*.astro', 'package-lock.json', 'astro.config.mjs') }}
          restore-keys: |
            astro-assets-v2-${{ runner.os }}-
            astro-assets-${{ runner.os }}-
      - run: rm -f node_modules/.astro/data-store.json
      - name: Build the exact candidate
        run: npm run build
        env:
          SKIP_HTML_MIN: '1'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium webkit
      - name: Install WebKit system libraries
        timeout-minutes: 10
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors[.]txt|https://archive.ubuntu.com/ubuntu/|g; s|http://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          grep -Eq '^URIs:[[:space:]]+https://archive[.]ubuntu[.]com/ubuntu/?([[:space:]]|$)' /etc/apt/sources.list.d/ubuntu.sources
          if grep -Eq '^URIs:.*(mirror[+]file:|azure[.]archive[.]ubuntu[.]com)' /etc/apt/sources.list.d/ubuntu.sources; then exit 1; fi
          npx playwright install-deps webkit
      - name: Focused browser diagnostics
        id: focused
        continue-on-error: true
        run: npx playwright test tests/editorial-hero-preload.spec.ts tests/editorial-release-visual.spec.ts tests/editorial-typography.spec.ts tests/editorial-font-baseline.spec.ts --project=chromium-desktop --project=webkit-mobile --reporter=line,json
        env:
          TT_COMPARE_LIVE_FONTS: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: .probe/tests.json
      - name: Three mobile Lighthouse samples per target
        id: lighthouse
        continue-on-error: true
        run: |
          npm install -g @lhci/cli
          lhci collect --config=./lighthouserc.mobile.json --numberOfRuns=3 \
            --url=http://localhost/blog/index.html \
            --url=http://localhost/blog/hram-uluvatu-bali/index.html \
            --url=http://localhost/blog/bali-guide-2026/index.html \
            --url=http://localhost/bali/index.html \
            --url=http://localhost/novosti/2026-05-01-torres-del-paine-tariff/index.html \
            --url=http://localhost/novosti/2026-11-08-loi-krathong-2026/index.html \
            --url=http://localhost/novosti/tema/kultura-i-sobytiya/index.html \
            --url=http://localhost/blog/tag/%D0%91%D0%B0%D0%BB%D0%B8/index.html
      - name: Save original diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-focused-diagnostic-${{ github.sha }}
          path: |
            .lighthouseci/lhr-*.json
            .probe/tests.json
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
      - name: Check diagnostic outcomes
        if: always()
        run: |
          test '${{ steps.focused.outcome }}' = success
          test '${{ steps.lighthouse.outcome }}' = success
