name: Lighthouse CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [desktop, mobile]
        # 20 адресов по 3 замера на каждый — 13 минут подряд. Делим пополам и
        # считаем параллельно; число замеров на адрес не трогаем, иначе вырастет
        # разброс и гейт начнёт врать.
        shard: [1, 2]
    name: ${{ matrix.preset }} (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # См. пояснение в build.yml. Здесь минификация HTML НЕ отключается: этот
      # шаг меряет вес страницы, и мерить надо то, что реально уедет на прод.
      - name: Кэш обработанных картинок
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png') }}
          restore-keys: astro-assets-${{ runner.os }}-

      - run: npm run build
      - name: Run Lighthouse (${{ matrix.preset }}, часть ${{ matrix.shard }})
        env:
          PRESET: ${{ matrix.preset }}
          SHARD: ${{ matrix.shard }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          npm install -g @lhci/cli
          CONF=./lighthouserc.json
          [ "$PRESET" = "mobile" ] && CONF=./lighthouserc.mobile.json
          # Свой кусок списка адресов; остальное берётся из конфига как было.
          URLS=$(node -e "
            const all = require('$CONF').ci.collect.url;
            const half = Math.ceil(all.length / 2);
            const part = Number(process.env.SHARD) === 1 ? all.slice(0, half) : all.slice(half);
            console.log(part.map((u) => '--collect.url=' + u).join(' '));
          ")
          echo "часть $SHARD: $(echo "$URLS" | wc -w) адресов"
          lhci autorun --config="$CONF" $URLS
