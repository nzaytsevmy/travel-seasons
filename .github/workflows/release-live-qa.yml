name: Release live browser QA

on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'JSON-массив опубликованных путей, максимум 100'
        required: true
        type: string
      expected_commit:
        description: 'Точный commit из build-version.json после выкладки'
        required: true
        type: string

      capture:
        description: 'Сохранить изображения выбранных страниц на 402 и 1280 px'
        type: boolean
        default: false
      hotel_guides:
        description: 'Дополнительно проверить все галереи отелей в четырёх браузерных проектах'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        timeout-minutes: 10
        run: |
          # Hosted runners use an indirect mirror list. Resolve it as well as
          # direct Azure URIs; leave Ubuntu suites, components and trust intact.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors[.]txt|https://archive.ubuntu.com/ubuntu/|g; s|http://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          grep -Eq '^URIs:[[:space:]]+https://archive[.]ubuntu[.]com/ubuntu/?([[:space:]]|$)' /etc/apt/sources.list.d/ubuntu.sources
          if grep -Eq '^URIs:.*(mirror[+]file:|azure[.]archive[.]ubuntu[.]com)' /etc/apt/sources.list.d/ubuntu.sources; then
            echo 'Ubuntu mirror replacement did not take effect' >&2
            exit 1
          fi
          grep -E '^(URIs|Suites|Components|Signed-By):' /etc/apt/sources.list.d/ubuntu.sources
          npx playwright install --with-deps chromium
      - name: Проверить страницы опубликованной версии
        run: node scripts/release-browser-qa.mjs
        env:
          QA_PATHS: ${{ inputs.paths }}
          QA_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          QA_SHARD: ${{ matrix.shard }}
          QA_SHARDS: '4'
          QA_CAPTURE: ${{ inputs.capture && '1' || '0' }}
      - name: Сохранить полный результат
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-qa-${{ matrix.shard }}
          path: artifacts/release-browser-qa/
          if-no-files-found: error
          retention-days: 7

  hotel-guides-live:
    if: inputs.hotel_guides
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: [chromium-desktop, webkit-desktop, chromium-tablet, webkit-mobile]
        shard: [1, 2, 3, 4]
    env:
      QA_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      HOTEL_PROJECT: ${{ matrix.project }}
      PREVIEW_URL: https://traveltribe.ru
      PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/hotel-guides-live-${{ matrix.project }}-${{ matrix.shard }}/tests.json
      HOTEL_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install cached browser engines
        timeout-minutes: 10
        run: npx playwright install chromium webkit
      - name: Install WebKit system libraries
        timeout-minutes: 10
        run: |
          # Hosted runners use an indirect mirror list. Resolve it as well as
          # direct Azure URIs; leave Ubuntu suites, components and trust intact.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors[.]txt|https://archive.ubuntu.com/ubuntu/|g; s|http://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          grep -Eq '^URIs:[[:space:]]+https://archive[.]ubuntu[.]com/ubuntu/?([[:space:]]|$)' /etc/apt/sources.list.d/ubuntu.sources
          if grep -Eq '^URIs:.*(mirror[+]file:|azure[.]archive[.]ubuntu[.]com)' /etc/apt/sources.list.d/ubuntu.sources; then
            echo 'Ubuntu mirror replacement did not take effect' >&2
            exit 1
          fi
          grep -E '^(URIs|Suites|Components|Signed-By):' /etc/apt/sources.list.d/ubuntu.sources
          npx playwright install-deps webkit
      - name: Verify exact published build before hotel journeys
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          assert.match(process.env.QA_EXPECTED_COMMIT, /^[a-f0-9]{40}$/);
          assert.equal(process.env.QA_EXPECTED_COMMIT, process.env.GITHUB_SHA, 'Live QA must execute the exact trusted dispatch source');
          const r = await fetch(`https://traveltribe.ru/build-version.json?hotel_qa=${Date.now()}`, { signal: AbortSignal.timeout(30000), headers: { 'Cache-Control': 'no-cache' } });
          assert.equal(r.status, 200);
          const value = await r.json();
          assert.equal(value.commit, process.env.QA_EXPECTED_COMMIT);
          const dir = `artifacts/hotel-guides-live-${process.env.HOTEL_PROJECT}-${process.env.HOTEL_SHARD}`;
          await fs.mkdir(dir, { recursive: true });
          await fs.writeFile(`${dir}/identity-before.json`, JSON.stringify(value));
          console.log(JSON.stringify(value));
          JS
      - name: Check every hotel gallery, booking target and country journey
        run: node scripts/run-hotel-live-shard.mjs "$HOTEL_SHARD"
      - name: Verify published build did not change during hotel journeys
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const r = await fetch(`https://traveltribe.ru/build-version.json?hotel_qa=${Date.now()}`, { signal: AbortSignal.timeout(30000), headers: { 'Cache-Control': 'no-cache' } });
          assert.equal(r.status, 200);
          const value = await r.json();
          assert.equal(value.commit, process.env.QA_EXPECTED_COMMIT);
          const dir = `artifacts/hotel-guides-live-${process.env.HOTEL_PROJECT}-${process.env.HOTEL_SHARD}`;
          const before = JSON.parse(await fs.readFile(`${dir}/identity-before.json`, 'utf8'));
          assert.deepEqual(value, before);
          await fs.writeFile(`${dir}/identity-after.json`, JSON.stringify(value));
          console.log(JSON.stringify(value));
          JS
      - name: Preserve hotel journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-guides-live-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            artifacts/hotel-guides-live-${{ matrix.project }}-${{ matrix.shard }}/
            test-results/
          if-no-files-found: error
          retention-days: 7
