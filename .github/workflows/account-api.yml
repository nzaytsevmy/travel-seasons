name: Account API

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/account-api/**'
      - 'infra/yandex/**'
      - '.github/workflows/account-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment
        required: true
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: account-api-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: services/account-api/package-lock.json
      - run: npm ci
        working-directory: services/account-api
      - run: npm test
        working-directory: services/account-api
      - run: docker build --tag traveltribe-account-api:test services/account-api

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to Yandex Container Registry with GitHub OIDC
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-id: ${{ vars.YC_DEPLOY_SA_ID }}
      - name: Build and push immutable image
        env:
          IMAGE_URL: cr.yandex/${{ vars.YC_REGISTRY_ID }}/traveltribe-account-api:${{ github.sha }}
        run: |
          docker build --tag "$IMAGE_URL" services/account-api
          docker push "$IMAGE_URL"
      - name: Deploy private Serverless Container revision
        uses: yc-actions/yc-sls-container-deploy@v5
        with:
          yc-sa-id: ${{ vars.YC_DEPLOY_SA_ID }}
          folder-id: ${{ vars.YC_FOLDER_ID }}
          container-name: ${{ vars.TT_ACCOUNT_CONTAINER_NAME }}
          public: 'false'
          revision-service-account-id: ${{ vars.YC_RUNTIME_SA_ID }}
          revision-image-url: cr.yandex/${{ vars.YC_REGISTRY_ID }}/traveltribe-account-api:${{ github.sha }}
          revision-cores: '1'
          revision-memory: 256Mb
          revision-core-fraction: '20'
          revision-concurrency: '8'
          revision-zone-instances-limit: '2'
          revision-zone-requests-limit: '8'
          revision-execution-timeout: '15'
          revision-log-options-folder-id: ${{ vars.YC_FOLDER_ID }}
          revision-log-options-min-level: ERROR
          revision-env: |
            NODE_ENV=production
            REPOSITORY=ydb
            RUN_MIGRATIONS=${{ vars.TT_RUN_MIGRATIONS }}
            FRONTEND_ORIGIN=${{ vars.TT_FRONTEND_ORIGIN }}
            PUBLIC_API_ORIGIN=${{ vars.TT_PUBLIC_API_ORIGIN }}
            YANDEX_CLIENT_ID=${{ vars.TT_YANDEX_CLIENT_ID }}
            YDB_CONNECTION_STRING=${{ vars.TT_YDB_CONNECTION_STRING }}
          revision-secrets: |
            YANDEX_CLIENT_SECRET=${{ vars.YC_LOCKBOX_SECRET_ID }}/${{ vars.YC_LOCKBOX_VERSION_ID }}/YANDEX_CLIENT_SECRET
            SESSION_HMAC_SECRET=${{ vars.YC_LOCKBOX_SECRET_ID }}/${{ vars.YC_LOCKBOX_VERSION_ID }}/SESSION_HMAC_SECRET
            SUBJECT_HMAC_SECRET=${{ vars.YC_LOCKBOX_SECRET_ID }}/${{ vars.YC_LOCKBOX_VERSION_ID }}/SUBJECT_HMAC_SECRET
      - name: Smoke-check gateway when configured
        if: vars.TT_PUBLIC_API_ORIGIN != ''
        env:
          API_ORIGIN: ${{ vars.TT_PUBLIC_API_ORIGIN }}
          FRONTEND_ORIGIN: ${{ vars.TT_FRONTEND_ORIGIN }}
        run: |
          curl --fail --silent --show-error --max-time 20 "$API_ORIGIN/healthz"
          curl --fail --silent --show-error --max-time 20 -H "Origin: $FRONTEND_ORIGIN" "$API_ORIGIN/readyz"
