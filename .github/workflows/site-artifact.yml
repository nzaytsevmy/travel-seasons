name: Build site artifact

on:
  workflow_call:
    inputs:
      skip_html_min:
        type: string
        default: '1'
    outputs:
      digest:
        value: ${{ jobs.artifact.outputs.digest }}
      artifact_name:
        value: ${{ jobs.artifact.outputs.artifact_name }}
      producer_attempt:
        value: ${{ jobs.artifact.outputs.producer_attempt }}

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    # Native hotel run 39364546751 finished the cold image build in 14m40s,
    # then reached 20 minutes while uploading the exact archive. Keep time for
    # checkout, the complete image set, transfer and cache save on this runner.
    timeout-minutes: 40
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      producer_attempt: ${{ steps.pack.outputs.producer_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          # New widths/quality and WebP originals must produce a writable cache
          # entry even when the JPEG/PNG originals were staged in an earlier PR.
          key: astro-assets-v2-${{ runner.os }}-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.webp', 'src/**/*.astro', 'package-lock.json', 'astro.config.mjs') }}
          restore-keys: |
            astro-assets-v2-${{ runner.os }}-
            astro-assets-${{ runner.os }}-
      - run: npm run build
        env:
          SKIP_HTML_MIN: ${{ inputs.skip_html_min }}
      - name: Pack exact build
        id: pack
        run: node scripts/build-artifact.mjs pack
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
