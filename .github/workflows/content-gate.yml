name: Content Gate

# Обязательный статус — на каждой заявке. Только обычная правка одной очереди
# DAILY-ARTICLE-QUEUE.md проверяется Node-контрактами без сборки и браузеров.
# Любой контент, код или смешанная правка сохраняет полный прогон.
#
# Зачем отдельный прогон. Эти тесты жили внутри «Visual Regression», а у той
# стоит `paths-ignore: src/content/**` — фильтр правильный для пиксельного
# сравнения (под эталоном 14 канареек, текста среди них нет), но он уносил с
# собой и инварианты. Получалось наоборот: гейт, созданный ДЛЯ контента, не
# запускался именно на правках контента.
#
# Проверено на живой заявке 03.08.2026: изменено четыре статьи, Playwright-тестов
# запущено ноль. Правку тогда спасло только то, что я прогнал гейт руками.
#
# Что здесь ловится и почему это нельзя пропускать на текстовых правках:
#   · видимая надпись «реклама» рядом с партнёрской ссылкой (38-ФЗ);
#   · внутренние имена файлов в тексте читателю;
#   · «от <не-цифра>» в блоке рейсов;
#   · декоративная стрелка в конце ссылки или кнопки;
#   · партнёрская ссылка без метки страницы или с двумя метками сразу;
#   · жирный лид под заголовком-утверждением и перебор предложений с двумя тире;
#   · структура изменённых страниц на 402/768/1024/1280: вылет по ширине, битые
#     картинки, «undefined» в тексте, отсутствие H1 — пиксельные канарейки на
#     правках контента не запускаются, это их замена (не больше 12 страниц за прогон).
# Всё это — дефекты САМОГО ТЕКСТА. Скриншоты их не видят.
#
# Прогон дешёвый: один браузер, без матрицы и шардов, сами тесты идут секунды —
# почти всё время занимает сборка, и та с кэшем картинок.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Отмена устаревших прогонов: два пуша в одну заявку давали ДВА полных набора,
# и первый доезжал до конца впустую. Замер 03.08.2026 на заявке #171: набор в
# 13:47 отработал целиком (8 прогонов Lighthouse + 4 визуальных), хотя коммит
# уже был заменён пушем в 14:14, и новый набор ждал освободившихся раннеров.
# Отменяем только у заявок: пуш в main обязан досчитать до конца.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  content-gate:
    name: контент и функциональные тесты
    runs-on: ubuntu-latest
    # The 70 hotel collections add complete gallery and booking journeys.
    # Native run 39109102041 reached the 15-minute job deadline mid-suite.
    # Native run 39759289195 reached 30 minutes after 451 successful cases,
    # with the last hotel collections still pending. Keep the complete suite
    # and its per-test limits; allow build plus the full seven-width audit.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # ⛔ Даты в карте сайта считаются по истории правок. Без полной истории
          #    все страницы получали одну дату, и проверка карты сайта краснела —
          #    12.09.2026 это вскрылось в первый же прогон, когда проверки перестали
          #    выбираться ручным списком: гейт проверял не ту сборку, что уезжает на
          #    сайт. blob:none — граф коммитов без старых версий файлов, как в выкладке.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Объём выпуска и ранняя проверка метаданных
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          node scripts/release-scope.mjs --base "$BASE_SHA" --head HEAD --github-output "$GITHUB_OUTPUT"
          node scripts/check-journal-metadata.mjs --base "$BASE_SHA" --head HEAD

      - name: Контракты служебной отметки
        if: steps.scope.outputs.mode == 'accounting'
        run: npm run check:delivery

      # Один браузер: гоняем только контентную часть и только в chromium.
      # Ставить оба — минусы четыре минуты на установку ради тестов, которые
      # всё равно идут в одном окружении.
      # Кеш браузеров: без него каждый прогон лезет в apt за системными
      # пакетами и рискует повиснуть на недоступном зеркале Ubuntu — 19.08.2026
      # так пропали два прогона по 40 минут.
      - name: Кеш браузеров Playwright
        if: steps.scope.outputs.mode != 'accounting'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        if: steps.scope.outputs.mode != 'accounting'
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            # Hosted runners use an indirect mirror list. Resolve it as well as
            # direct Azure URIs; leave Ubuntu suites, components and trust intact.
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors[.]txt|https://archive.ubuntu.com/ubuntu/|g; s|http://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            grep -Eq '^URIs:[[:space:]]+https://archive[.]ubuntu[.]com/ubuntu/?([[:space:]]|$)' /etc/apt/sources.list.d/ubuntu.sources
            if grep -Eq '^URIs:.*(mirror[+]file:|azure[.]archive[.]ubuntu[.]com)' /etc/apt/sources.list.d/ubuntu.sources; then
              echo 'Ubuntu mirror replacement did not take effect' >&2
              exit 1
            fi
            grep -E '^(URIs|Suites|Components|Signed-By):' /etc/apt/sources.list.d/ubuntu.sources
            npx playwright install --with-deps chromium
          fi

      # Тот же кэш, что у сборки: обработка картинок занимает под две минуты,
      # а результат для одного файла всегда одинаковый.
      - name: Кэш обработанных картинок
        if: steps.scope.outputs.mode != 'accounting'
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-v2-${{ runner.os }}-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.webp', 'src/**/*.astro', 'package-lock.json', 'astro.config.mjs') }}
          restore-keys: |
            astro-assets-v2-${{ runner.os }}-
            astro-assets-${{ runner.os }}-

      # Only image assets are reusable: restored rendered content can retain an old rehype result.
      - name: Recompile content with the current article plugins
        if: steps.scope.outputs.mode != 'accounting'
        run: rm -f node_modules/.astro/data-store.json

      - run: npm run build
        if: steps.scope.outputs.mode != 'accounting'
        env:
          SKIP_HTML_MIN: '1'   # инварианты читают текст, минификация им не мешает

      # Порт 4322 — тот же, что у визуального гейта и предпушевого хука.
      - name: Start preview server
        if: steps.scope.outputs.mode != 'accounting'
        run: npx astro preview --port 4322 &
        env:
          NODE_ENV: production

      - name: Wait for server
        if: steps.scope.outputs.mode != 'accounting'
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4322/ > /dev/null && exit 0
            sleep 2
          done
          echo "✖ preview-сервер не поднялся за 120с"; exit 1

      # ⛔ ТОЛЬКО то, что охраняет ТЕКСТ, и только в одном браузере.
      # Первый вариант гонял тут всё, кроме пикселей, в четырёх окружениях —
      # и занял 20 минут, упёршись в таймаут. Стал самым долгим прогоном и
      # удвоил ожидание. Замер 03.08.2026: 1217 с против 542 с у прежнего лидера.
      # Функциональные тесты (чек-лист, калькулятор, личные страницы, поездки)
      # проверяют КОД и нужны только на правках кода — они остались в
      # шардированном визуальном прогоне, который на таких правках и запускается.
      # Список изменённых файлов заявки — для структурного теста изменённых страниц.
      # checkout здесь неглубокий, поэтому основу тянем отдельно и сравниваем деревья.
      - name: Изменённые файлы заявки
        if: steps.scope.outputs.mode != 'accounting'
        id: changed
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref || 'main' }}"
          {
            echo 'files<<EOF'
            git diff --name-only --diff-filter=d "origin/${{ github.base_ref || 'main' }}" HEAD -- src/content
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Инварианты контента, ритм, новости и денежное поведение
        if: steps.scope.outputs.mode != 'accounting'
        run: |
          # ⛔ Не список файлов, а фильтр. 12.09.2026: из 22 прогонов в списке было 5, а 16
          #    не запускались в облаке вовсе — в том числе давние (шапка, главный экран,
          #    размеры целей, сохранение поездки). Список молча терял проверки, и два
          #    сторожа того же дня оказались мёртвыми. Фильтр берёт всё, кроме пиксельных
          #    снимков: замер на машине — 307 проверок за 2,8 минуты.
          SKIP_PAGE_MTIME_TESTS=1 npx playwright test --grep-invert "— visual" --project=chromium-desktop
          SKIP_PAGE_MTIME_TESTS=1 node scripts/check-remaining-changed-pages.mjs
        env:
          PREVIEW_URL: http://localhost:4322
          CHANGED_FILES: ${{ steps.changed.outputs.files }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: content-gate-report
          path: |
            tests/.html-report/
            tests/.results/
            test-results/
          retention-days: 14
