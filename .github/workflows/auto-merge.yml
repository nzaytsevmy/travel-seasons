name: Auto Merge

# Доверенный main читает метаданные PR и результаты CI; код PR не исполняется.
# Проверенные боты получают разрешение запусков и общий обязательный статус.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [Required PR checks]
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Одна заявка; пусто — проверить все доверенные заявки'
        type: string
        default: ''

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || 'sweep' }}
  cancel-in-progress: false # Do not interrupt a confirmed merge before its deploy dispatch.

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge-after-green:
    name: слить после полного зелёного CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts
      - name: Проверить происхождение, дождаться обязательных проверок и слить
        uses: actions/github-script@v7
        with:
          retries: 0 # Reads have one bounded retry layer; writes are never blindly repeated.
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const { pathToFileURL } = require('node:url');
            const controller = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/checked-pr-controller.mjs`,
            ).href);
            await controller.runCheckedController({ github, context, core });
