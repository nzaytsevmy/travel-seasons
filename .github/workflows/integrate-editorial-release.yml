name: Integrate editorial release
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
concurrency:
  group: integrate-editorial-release-744
  cancel-in-progress: true
jobs:
  integrate:
    if: github.event.pull_request.number == 744 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'tt-publish/2026-10-14-prepared-package'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Integrate the scoped change
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git switch -c tt-publish/2026-10-14-prepared-package
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, subprocess
          root = Path.cwd()
          staged = root / 'research/releases/2026-10-14-publication'
          changed = []
          def write(path, text):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text)
              if path not in changed: changed.append(path)
          def replace(path, old, new):
              text = (root / path).read_text()
              if text.count(old) != 1: raise RuntimeError('Source mismatch: ' + path + ' / ' + old[:90])
              write(path, text.replace(old, new))
          def block(path, start, end, text):
              source = (root / path).read_text()
              a = source.index(start); b = source.index(end, a)
              replace(path, source[a:b], text)
          cfg = json.loads((root / 'news/config.json').read_text())
          if cfg.get('targetPerDay') != 5 or cfg.get('maxPerDay') != 5 or cfg.get('minScore') != 3:
              raise RuntimeError('Editorial configuration changed; rebase the implementation before retrying.')
          cfg.update(selectionMode='editorial', targetPerDay=None, maxPerDay=None)
          write('news/config.json', json.dumps(cfg, ensure_ascii=False, indent=2) + '\n')
          cap = (staged / 'proposal/scripts/news-cap.mjs').read_text()
          cap = cap.replace('// Proposed replacement: inventories news candidates without deleting files.\n// This is not an approval, source check, independent review, or publication.', '// Редакционный отбор без дневной квоты: сохраняем все файлы кандидатов.\n// Реестр не заменяет source-gate, независимое ревью и подтверждённую публикацию.')
          cap = cap.replace('appendFileSync, mkdirSync, readFileSync }', 'appendFileSync, mkdirSync, readFileSync, lstatSync }')
          cap = cap.replace("if (value == null || value === '') return null;", "if (!(value instanceof Date) && (typeof value !== 'string' || !value.trim())) return null;")
          cap = cap.replace("if (rel === '..' || rel.startsWith('../') || isAbsolute(rel)) throw new Error(`Outside news directory: ${file}`);", "if (!/^[a-z0-9-]+\\.md$/.test(rel) || isAbsolute(rel) || !lstatSync(absolute).isFile()) {\n      throw new Error(`Invalid news file: ${file}`);\n    }")
          write('scripts/news-cap.mjs', cap)
          block('NEWS-SELECTION-PROMPT.md', '**Цель запуска — норма', '**1. Это интересно читать.', '''**Редакционный отбор — решение Никиты 14.10.2026.** Режим `news_selection_mode` в `GROWTH-CONTROL.md` — `editorial`, `news_quota` — `null`; в `news/config.json` стоят `selectionMode: "editorial"`, `targetPerDay: null` и `maxPerDay: null`. Обязательная пятёрка и числовой потолок отменены. Недельное решение всё равно перечитывать перед коммитом: `HOLD` может выйти после начала работы.

          Обход полный — не останавливаться после первой принятой темы; проверить недельное окно по рубрикам и географиям, отдельно свежие события последних 24–48 часов. Выбирать действительно интересные, актуальные и резонансные поводы: что хочется открыть и пересказать, что изменилось и что это даёт читателю. Ноль сильных тем после полноценного поиска допустим; шестую сильную тему не отклонять из-за числа. Слабые заметки для количества не добавлять и дефицит до пяти не считать. `scripts/news-cap.mjs` сохраняет все файлы и составляет предварительный реестр, но никого сам не одобряет и не публикует. Источники, независимая оценка 3+ и все проверки выпуска обязательны.

          ''')
          replace('NEWS-SELECTION-PROMPT.md', '**Места под спрос (решение Никиты 11.09.2026).** Одно-два места из пяти отдаются под событие, которое прямо сейчас ищут по-русски и которое меняет поездку:', '**Спрос и резонанс (уточнение 14.10.2026).** Приоритет получает подтверждённое событие, которое прямо сейчас ищут по-русски и которое меняет поездку:')
          replace('NEWS-SELECTION-PROMPT.md', 'а если такого события нет, место уходит под обычный отбор.', 'отсутствие такого события не требует искать замену ради количества.')
          replace('NEWS-SELECTION-PROMPT.md', '**Пять — цель выпуска, а не разрешение на слабый текст.** Нулевая или неполная подборка допустима только после полного поиска: не публиковать пустой текст ради календаря, но и не устраивать ложный пустой день или одиночный выпуск из-за ранней остановки и поисковой выдачи.', '**Количество — результат отбора, не план.** Нулевой выпуск допустим после полного поиска. Не публиковать слабый текст ради календаря и не объявлять пустой день из-за ранней остановки или вида поисковой выдачи. В отчёте — принятые темы, отклонённые поводы и проверенные причины, без недостающих слотов.')
          block('news/RUBRIC.md', 'Оценку 0–5', '**Поиск не голосует', '''Оценку 0–5 ставит модель, которая заметку **не писала**. Автор записывается в `authoredBy`, а отдельная модель создаёт `news/reviews/<slug>.json`; путь указывается в `reviewRef`. Без другого reviewer, даты и содержательного rationale гейт новую заметку не пропустит. Публикуем от 3.

          **Редакционный режим — решение Никиты 14.10.2026.** `news_selection_mode: editorial` и `news_quota: null` в `GROWTH-CONTROL.md`; числовой цели и потолка нет. Число новостей определяется интересом, актуальностью и резонансом, а не календарём. Полный поиск по недельному окну обязателен; не останавливаться после первой принятой темы. Ноль подходящих тем допустим, шестая сильная тема не отбрасывается из-за количества. Предварительный реестр сохраняет слабые и неоценённые файлы, но не считает их одобренными или опубликованными. Порог и независимая редактура не меняются.

          ''')
          block('GROWTH-CONTROL.md', '- `news_quota`: **5**.', '  ⛔ Замер, который был', '''- `news_selection_mode`: **editorial**. Решение Никиты 14.10.2026: интерес,
            актуальность и резонанс определяют число публикаций; нет обязательной пятёрки.
          - `news_quota`: **null**. Числовые цель и потолок отменены. В `news/config.json`
            этому соответствуют `selectionMode: "editorial"`, `targetPerDay: null`,
            `maxPerDay: null`; контракт проверяет согласованность правил и исполнения.
            Полный поиск обязателен, ноль сильных тем допустим, слабые для числа не добавляются.
            Порог 3+, независимая редактура и публикационные проверки сохранены.
            Реестр кандидатов ничего не удаляет и не называет файлы публикациями.
            Это изменение редакционного решения, не новый аналитический замер:
            исторические показатели ниже и денежный HOLD сохранены.
          ''')
          old = next(line for line in (root / 'CLAUDE.md').read_text().splitlines() if line.startswith('**Сколько заметок в день — пять'))
          replace('CLAUDE.md', old, '**Число новостей — по редакционному отбору, решение Никиты 14.10.2026.** Оно заменяет норму от 11.09.2026: обязательная пятёрка и числовой потолок отменены. В `GROWTH-CONTROL.md` стоят `news_selection_mode: editorial` и `news_quota: null`; в `news/config.json` — `selectionMode: "editorial"`, `targetPerDay: null`, `maxPerDay: null`. Полный поиск по рубрикам и географиям обязателен. Выпускаются действительно интересные, актуальные и резонансные поводы с независимой оценкой 3+; ноль после полного поиска допустим. Не добивать число слабыми текстами и не отклонять шестую сильную тему из-за квоты. `news-cap.mjs` только составляет недеструктивный реестр: наличие файла и предварительного балла не доказывает независимого одобрения или публикации. Все проверки качества, фактов, прав на фото, CI и живых страниц сохраняются.')
          replace('CLAUDE.md', 'Число по-прежнему живёт в одном поле — теперь это решение Никиты.', 'Это история прежней квоты; с 14.10.2026 действует редакционный режим без числовой нормы.')
          block('tests/growth-control-contract.test.mjs', "test('лимиты новостного пайплайна", "test('очередь гайдов", r'''test('редакционный режим согласован, квота отменена без ослабления качества', async () => {
            const [prompt, rubric, projectRules, configRaw, cap, control] = await Promise.all([
              read('NEWS-SELECTION-PROMPT.md'), read('news/RUBRIC.md'), read('CLAUDE.md'),
              read('news/config.json'), read('scripts/news-cap.mjs'), read('GROWTH-CONTROL.md'),
            ]);
            const config = JSON.parse(configRaw);
            assert.equal(config.selectionMode, 'editorial');
            assert.equal(config.targetPerDay, null);
            assert.equal(config.maxPerDay, null);
            assert.equal(config.minScore, 3);
            assert.match(control, /`news_quota`:\s*\*\*null\*\*/);
            assert.match(control, /`news_selection_mode`:\s*\*\*editorial\*\*/);
            for (const text of [prompt, rubric, projectRules]) {
              assert.match(text, /14\.10\.2026/);
              assert.match(text, /news_quota/);
              assert.match(text, /независим/i);
              assert.doesNotMatch(text, /максимум 5 заметок в день|пять, решение Никиты 11\.09\.2026, насовсем/i);
            }
            assert.doesNotMatch(cap, /unlinkSync|rmSync|dropped_over_cap|deficit/);
            assert.match(cap, /NOT_ATTEMPTED/);
            assert.match(prompt, /не останавливаться после первой принятой темы/i);
            assert.match(prompt, /капсула ответа \*\*40–60 слов\*\*/i);
            assert.match(rubric, /заметка — 150–350 слов[^\n]{0,80}до 600/i);
            assert.match(projectRules, /новостная заметка 150–350/i);
            assert.doesNotMatch(projectRules, /новостная заметка 600–1200/i);
          });

          ''')
          write('src/data/news-discovery.js', r'''// Discovery data uses publication/check dates, never an invented date of the event.
          export const NEWS_WINDOW_MS = 48 * 60 * 60 * 1000;
          export const NEWS_SITEMAP_SIZE = 1000;
          export const NEWS_SITE = 'https://traveltribe.ru';
          function validDate(value) {
            if (!(value instanceof Date) && (typeof value !== 'string' || !value.trim())) return null;
            const date = new Date(value);
            return Number.isFinite(date.valueOf()) ? date : null;
          }
          export function latestFeedCheck(entries) {
            const dates = entries.map(e => validDate(e?.data?.checked)).filter(Boolean);
            return dates.length ? new Date(Math.max(...dates.map(d => d.valueOf()))) : null;
          }
          export function recentNews(entries, now = new Date()) {
            const time = validDate(now);
            if (!time) throw new TypeError('A valid build date is required.');
            const seen = new Set();
            return entries.flatMap(entry => {
              const d = entry.data ?? {};
              // checked is mutable and cannot establish first publication.
              const published = validDate(d.added);
              if (d.archived || !published || published > time || time - published >= NEWS_WINDOW_MS) return [];
              if (!/^[a-z0-9][a-z0-9-]*$/.test(entry.slug) || !String(d.title ?? '').trim()) throw new Error('Invalid news slug or title.');
              if (seen.has(entry.slug)) throw new Error(`Duplicate news URL: ${entry.slug}`);
              seen.add(entry.slug);
              return [{ slug: entry.slug, title: d.title, published: published.toISOString() }];
            }).sort((a, b) => b.published.localeCompare(a.published) || (a.slug < b.slug ? -1 : a.slug > b.slug ? 1 : 0));
          }
          export function splitNews(records) {
            const pages = [];
            for (let i = 0; i < records.length; i += NEWS_SITEMAP_SIZE) pages.push(records.slice(i, i + NEWS_SITEMAP_SIZE));
            return pages;
          }
          export function escapeXml(value) {
            return String(value).replace(/[<>&"']/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' })[c]);
          }
          export function renderNewsSitemap(records) {
            if (records.length > NEWS_SITEMAP_SIZE) throw new Error('Split news sitemaps into at most 1000 entries.');
            return '<?xml version="1.0" encoding="UTF-8"?>\n' +
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9" xmlns:news="http://www.google.com/schemas/sitemap-news/0.9">\n' +
              records.map(n => `  <url><loc>${NEWS_SITE}/novosti/${escapeXml(n.slug)}/</loc><news:news>` +
                '<news:publication><news:name>TravelTribe</news:name><news:language>ru</news:language></news:publication>' +
                `<news:publication_date>${escapeXml(n.published)}</news:publication_date>` +
                `<news:title>${escapeXml(n.title)}</news:title></news:news></url>`).join('\n') + '\n</urlset>\n';
          }
          export function renderNewsSitemapIndex(pages) {
            return '<?xml version="1.0" encoding="UTF-8"?>\n' +
              '<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' +
              pages.map((_, i) => `  <sitemap><loc>${NEWS_SITE}/sitemap-news/${i + 1}.xml</loc></sitemap>`).join('\n') + '\n</sitemapindex>\n';
          }
          ''')
          for path in ['src/pages/novosti/index.astro', 'src/pages/novosti/[month].astro']:
              replace(path, "import { plural } from '../../data/plural.js';", "import { plural } from '../../data/plural.js';\nimport { latestFeedCheck } from '../../data/news-discovery.js';")
          replace('src/pages/novosti/index.astro', 'const lastChecked = fresh.length ? fresh[0].data.checked : null;', 'const lastChecked = latestFeedCheck(fresh);')
          replace('src/pages/novosti/[month].astro', 'const lastChecked = items.reduce((a, e) => (e.data.checked > a ? e.data.checked : a), items[0].data.checked);', 'const lastChecked = latestFeedCheck(items);')
          replace('src/pages/novosti/[month].astro', '"dateModified": lastChecked.toISOString().slice(0, 10),', '...(lastChecked ? { "dateModified": lastChecked.toISOString().slice(0, 10) } : {}),')
          replace('astro.config.mjs', "import { monthKey, FEED_SIZE } from './src/data/news.js';", "import { monthKey, FEED_SIZE, feedEntries } from './src/data/news.js';\nimport { latestFeedCheck } from './src/data/news-discovery.js';")
          replace('astro.config.mjs', "    added: new Date(added || checked), slug: f.replace(/\\.mdx?$/, ''),", "    added: new Date(added || checked), slug: f.replace(/\\.mdx?$/, ''),\n    archived: /^archived:\\s*true\\s*$/m.test(fm),")
          replace('astro.config.mjs', 'const maxChecked = (list) => (list.length ? new Date(Math.max(...list.map((e) => e.checked))) : null);', 'const maxChecked = (list) => latestFeedCheck(list.map(data => ({ data })));')
          replace('astro.config.mjs', '  [...newsChecked].sort((a, b) => b.added - a.added || b.date - a.date).slice(0, FEED_SIZE),', '  feedEntries(newsChecked.map(data => ({ slug: data.slug, data })), FEED_SIZE).map(entry => entry.data),')
          replace('astro.config.mjs', "&& !page.includes('sitemap-images')", "&& !page.includes('sitemap-images')\n        && !page.includes('/sitemap-news')")
          write('src/pages/sitemap-news.xml.js', '''import { getCollection } from 'astro:content';
          import { recentNews, splitNews, renderNewsSitemap, renderNewsSitemapIndex } from '../data/news-discovery.js';
          export async function GET() {
            const records = recentNews(await getCollection('news'));
            const pages = splitNews(records);
            const xml = pages.length > 1 ? renderNewsSitemapIndex(pages) : renderNewsSitemap(records);
            return new Response(xml, { headers: { 'Content-Type': 'application/xml; charset=utf-8' } });
          }
          ''')
          write('src/pages/sitemap-news/[page].xml.js', '''import { getCollection } from 'astro:content';
          import { recentNews, splitNews, renderNewsSitemap } from '../../data/news-discovery.js';
          export async function getStaticPaths() {
            const pages = splitNews(recentNews(await getCollection('news')));
            return pages.length > 1 ? pages.map((records, i) => ({ params: { page: String(i + 1) }, props: { records } })) : [];
          }
          export function GET({ props }) {
            return new Response(renderNewsSitemap(props.records), { headers: { 'Content-Type': 'application/xml; charset=utf-8' } });
          }
          ''')
          replace('public/robots.txt', 'Sitemap: https://traveltribe.ru/sitemap-images.xml', 'Sitemap: https://traveltribe.ru/sitemap-images.xml\nSitemap: https://traveltribe.ru/sitemap-news.xml')
          path = 'src/data/programmatic-seasons.js'
          source = (root / path).read_text(); a = source.index('      november: {', source.index('  vietnam: {')); b = source.index('      december: {', a)
          old = next(line for line in source[a:b].splitlines() if line.lstrip().startswith('weatherDesc:'))
          replace(path, old, "        weatherDesc: 'Для пляжной недели в ноябре выбирайте Фукуок с одной базой, но оставляйте запас на ливни: это переход к сухому сезону, не гарантия ясного неба. Для городов и прогулок подходит север — Ханой, Ниньбинь и бухта Халонг; по станции Ханой днём 26 °C, ночью 19, осадков 48 мм. Нячанг в ноябре получает 400 мм за 18 дождливых дней, Дананг — 486 мм за 21 день. Их имеет смысл выбирать ради города и еды с гибким планом, а не обещанного пляжа. Общая оценка страны наверху не заменяет выбор побережья: у юга, центра и севера разные сезоны.',")
          replace(path, "          'Фукуок: около 180 мм против 326 в октябре — на 45% меньше',", "          'Пляжная неделя: одна база на Фукуоке, около 180 мм осадков за ноябрь; сухие дни не гарантированы',")
          tests = (staged / 'proposal/tests/editorial-proposal.test.mjs').read_text().replace('../src/data/news-feed-check.mjs', '../src/data/news-discovery.js')
          write('tests/editorial-news-release.test.mjs', tests)
          write('tests/news-discovery.test.mjs', r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { mkdtempSync, mkdirSync, writeFileSync, readFileSync, existsSync, rmSync, symlinkSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { main as runInventory } from '../scripts/news-cap.mjs';
          import { recentNews, splitNews, renderNewsSitemap, renderNewsSitemapIndex } from '../src/data/news-discovery.js';
          const config = { selectionMode: 'editorial', targetPerDay: null, maxPerDay: null, minScore: 3, paused: false };
          function fixture() {
            const root = mkdtempSync(join(tmpdir(), 'tt-news-editorial-'));
            mkdirSync(join(root, 'src/content/news'), { recursive: true }); mkdirSync(join(root, 'news'), { recursive: true });
            writeFileSync(join(root, 'news/config.json'), JSON.stringify(config)); execFileSync('git', ['init', '-q'], { cwd: root }); return root;
          }
          const rawNote = score => `---\ntitle: "Test"\nadded: "2026-10-14"\nchecked: "2026-10-14"\n${score == null ? '' : `score: ${score}\n`}---\nText.\n`;
          test('actual CLI preserves seven strong, weak and unscored files on repeat', async () => {
            const root = fixture();
            try {
              for (let i = 0; i < 7; i++) writeFileSync(join(root, `src/content/news/story-${i}.md`), rawNote(4));
              writeFileSync(join(root, 'src/content/news/weak.md'), rawNote(2)); writeFileSync(join(root, 'src/content/news/unscored.md'), rawNote(null));
              const first = await runInventory(root);
              assert.equal(first.ready_for_source_and_independent_review.length, 7); assert.equal(first.below_score_floor.length, 1); assert.equal(first.unscored.length, 1);
              execFileSync('git', ['add', 'src/content/news/story-0.md'], { cwd: root });
              const second = await runInventory(root); assert.equal(second.candidate_count, 8);
              for (let i = 0; i < 7; i++) assert.equal(readFileSync(join(root, `src/content/news/story-${i}.md`), 'utf8'), rawNote(4));
              assert.equal(second.publication, 'NOT_ATTEMPTED'); assert.equal(readFileSync(join(root, 'news/log.jsonl'), 'utf8').trim().split('\n').length, 2);
            } finally { rmSync(root, { recursive: true, force: true }); }
          });
          test('actual empty checkout has no quota deficit', async () => {
            const root = fixture(); try { const report = await runInventory(root); assert.equal(report.candidate_count, 0); assert.equal('deficit' in report, false); }
            finally { rmSync(root, { recursive: true, force: true }); }
          });
          test('a symlink candidate is rejected without touching its target', async () => {
            const root = fixture(); try {
              writeFileSync(join(root, 'outside.md'), rawNote(4)); symlinkSync(join(root, 'outside.md'), join(root, 'src/content/news/link.md'));
              await assert.rejects(() => runInventory(root), /Invalid news file/); assert.ok(existsSync(join(root, 'outside.md')));
            } finally { rmSync(root, { recursive: true, force: true }); }
          });
          const e = (slug, added, extra = {}) => ({ slug, data: { title: 'A & B <C>', added, checked: '2026-10-14', ...extra } });
          const now = new Date('2026-10-14T12:00:00Z');
          test('only first publications in the last 48 hours enter news sitemaps', () => {
            const records = recentNews([e('fresh', '2026-10-14'), e('near', '2026-10-12T12:00:01Z'), e('boundary', '2026-10-12T12:00:00Z'), e('rechecked', '2026-10-01'), e('future', '2026-10-15'), e('archived', '2026-10-14', { archived: true }), e('missing', undefined), e('invalid', 'bad')], now);
            assert.deepEqual(records.map(x => x.slug), ['fresh', 'near']);
          });
          test('rechecking an old publication does not make it new', () => assert.equal(recentNews([e('old', '2026-09-01', { checked: now })], now).length, 0));
          test('XML text and publication date are accurate and escaped', () => {
            const xml = renderNewsSitemap(recentNews([e('fresh', '2026-10-13')], now));
            assert.match(xml, /A &amp; B &lt;C&gt;/); assert.match(xml, /2026-10-13T00:00:00.000Z/);
            assert.doesNotMatch(xml, /lastmod|2026-10-14/); assert.match(xml, /<news:language>ru<\/news:language>/);
          });
          test('more than 1000 news entries are sharded, not dropped', () => {
            const records = recentNews(Array.from({ length: 1001 }, (_, i) => e(`fresh-${i}`, '2026-10-14')), now);
            const pages = splitNews(records); assert.deepEqual(pages.map(x => x.length), [1000, 1]);
            assert.throws(() => renderNewsSitemap(records), /1000/); assert.match(renderNewsSitemapIndex(pages), /sitemap-news\/2\.xml/);
            assert.equal((renderNewsSitemap(pages[0]).match(/<url>/g) ?? []).length, 1000);
          });
          test('an empty sitemap does not substitute old articles', () => {
            const xml = renderNewsSitemap([]); assert.match(xml, /<urlset[\s\S]*<\/urlset>/); assert.doesNotMatch(xml, /<url>/);
          });
          test('unsafe or duplicate URLs stop sitemap generation', () => {
            assert.throws(() => recentNews([e('../outside', '2026-10-14')], now), /Invalid/);
            assert.throws(() => recentNews([e('same', '2026-10-14'), e('same', '2026-10-14')], now), /Duplicate/);
          });
          ''')
          report = {'status': 'INTEGRATED_NOT_PUBLISHED', 'files': {path: hashlib.sha256((root / path).read_bytes()).hexdigest() for path in changed}, 'aldabra': 'DUPLICATE_OF_2026-10-08_EXISTING_URL_UNCHANGED', 'namibia': 'INDEPENDENT_REVIEW_AND_IMAGE_PENDING', 'vietnam': 'EXISTING_REGION_DATA_PRESERVED_ROUTE_CHOICE_REVISED'}
          Path('/tmp/tt-publication-integration.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          subprocess.check_call(['git', 'add', '--', *changed])
          # The one-off write-capable helper is not shipped to main.
          subprocess.check_call(['git', 'rm', '--', '.github/workflows/integrate-editorial-release.yml'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(news): editorial selection, news sitemap and November route choices'
          mkdir -p work
          printf 'HEAD: %s\nBase: %s\nURLs: /novosti/ /sitemap-news.xml /trips/november/vietnam/ and news month archives\nRequired: all 26 existing CI checks plus source preflight; deploy/live not confirmed\nRelease: ordinary pre-push, fast-forward PR branch, required CI, exact deploy/live\n' "$(git rev-parse HEAD)" "$(git merge-base HEAD origin/main)" > work/state.md
      - name: Native exact-commit gate before branch push
        shell: bash
        run: |
          set -o pipefail
          bash scripts/pre-push.sh </dev/null 2>&1 | tee /tmp/tt-publication-integration-preflight.log
      - name: Push only the checked fast-forward release branch
        run: git push origin HEAD:refs/heads/tt-publish/2026-10-14-prepared-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-integration-${{ github.run_id }}
          path: |
            /tmp/tt-publication-integration.json
            /tmp/tt-publication-integration-preflight.log
            /tmp/ttb_prepush_*.log
          if-no-files-found: warn
          retention-days: 7
