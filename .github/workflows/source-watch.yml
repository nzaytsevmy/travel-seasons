name: Source Watch

# Сторож первоисточников. Раз в неделю проверяет, не изменились ли страницы, по
# которым сверялись факты статей, и присылает список тех, что поменялись.
#
# Почему это отдельная задача, а не часть понедельничного отчёта: обход трёх
# десятков госсайтов занимает минуты и часть из них регулярно отвечает отказом.
# Внутри общего отчёта такая секция роняла бы его целиком либо заставляла ждать.
#
# Слепки коммитятся в репозиторий: сравнивать не с чем, если хранить их в
# памяти задачи.

on:
  schedule:
    - cron: '0 5 * * 3'      # среда 05:00 UTC = 08:00 МСК, за пять дней до отчёта
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Снять посещаемость статей
        env:
          METRIKA_OAUTH_TOKEN: ${{ secrets.METRIKA_OAUTH_TOKEN }}
        run: node scripts/traffic-snapshot.mjs

      - name: Перезамер правок денежной логики
        run: node scripts/remeasure-check.mjs

      - name: Отправить перезамер в Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          [ -s /tmp/remeasure.txt ] || exit 0
          [ -z "$TG_BOT_TOKEN" ] && exit 0
          curl -s --max-time 20 -o /dev/null \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=$(cat /tmp/remeasure.txt)"

      - name: Проверить первоисточники
        id: watch
        run: |
          node scripts/source-watch.mjs --write > /tmp/watch.txt 2>&1 || true
          cat /tmp/watch.txt
          # ⛔ В переменные задачи уходит только флаг, а не текст отчёта: в отчёте
          # адреса и сообщения чужих сайтов, то есть недоверенный ввод. Пропускать
          # его через GITHUB_OUTPUT — приглашение сломать разбор или подставить
          # своё содержимое. Сам текст живёт в файле и уходит в сообщение как
          # данные формы, где интерпретировать его нечему.
          if grep -q 'Изменились' /tmp/watch.txt; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Сообщить, если что-то изменилось
        if: steps.watch.outputs.changed == 'yes'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          [ -z "$TG_BOT_TOKEN" ] && exit 0
          TEXT=$(printf '🔎 Первоисточники изменились — статьи ниже пора сверить заново.\n\n%s' "$(cat /tmp/watch.txt)")
          curl -s --max-time 20 -o /dev/null \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"

      - name: Проверить контракт издателя
        run: node --test tests/bot-updates.test.mjs tests/auto-merge-policy.test.mjs

      - name: Создать или обновить проверяемую заявку
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/bot-publish.mjs source-watch
