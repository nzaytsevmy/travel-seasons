name: Visual Regression

on:
  pull_request:
    branches: [main]
    # ⛔ Под пиксельным эталоном стоят 14 КАНАРЕЕК — по одному представителю
    # каждого типа страниц (сборы, сезоны, сравнение, хаб страны, поездки, две
    # статьи блога). Ни ленты новостей, ни листинга блога среди них нет.
    # Значит правка только контента физически не может сдвинуть ни один эталон,
    # и пять минут сравнения на такой заявке — чистое ожидание.
    # ⚠ Правки в src/data/** под фильтр НЕ попадают и проверяются как раньше:
    # оттуда кормятся программные страницы, и они среди канареек есть.
    # Если однажды под эталон возьмут страницу, зависящую от текста, фильтр
    # придётся сузить — иначе регресс проедет незамеченным.
    # ⚠ Фильтр относится ТОЛЬКО к пиксельному сравнению. Инварианты контента и
    # сторож ритма гоняются в content-gate.yml на КАЖДОЙ заявке, без фильтра.
    paths-ignore:
      - 'src/content/**'
      - 'news/**'
      - 'public/llms*.txt'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      gen_linux:
        description: 'Снять linux-эталоны и проверить их стабильность (одноразово)'
        type: boolean
        default: false

# Отмена устаревших прогонов: два пуша в одну заявку давали ДВА полных набора,
# и первый доезжал до конца впустую. Замер 03.08.2026 на заявке #171: набор в
# 13:47 отработал целиком (8 прогонов Lighthouse + 4 визуальных), хотя коммит
# уже был заменён пушем в 14:14, и новый набор ждал освободившихся раннеров.
# Отменяем только у заявок: пуш в main обязан досчитать до конца.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Одноразовая ручная джоба: снять linux-эталоны на самом раннере (darwin-снимки
  # с мака сюда не годятся — другие шрифты/сглаживание) и заодно проверить, что
  # скриншоты на ubuntu СТАБИЛЬНЫ между прогонами (иначе linux-эталоны дадут флейки,
  # что хуже нынешнего состояния). Запуск вручную: gh workflow run visual-tests.yml -f gen_linux=true
  gen-linux-baselines:
    # inputs с type: boolean в контексте — БУЛЕВО, а не строка: сравнение с 'true'
    # всегда ложно, из-за этого джоба молча скипалась при первом запуске 17.07.2026.
    if: github.event_name == 'workflow_dispatch' && inputs.gen_linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Start preview server
        run: npx astro preview --port 4322 &
        env:
          NODE_ENV: production
      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4322/ > /dev/null && exit 0
            sleep 2
          done
          echo "✖ preview не поднялся"; exit 1
      - name: Snap linux baselines (прогон 1 — генерация)
        run: npx playwright test -g "— visual" --update-snapshots
        env:
          PREVIEW_URL: http://localhost:4322
      - name: Проверка стабильности (прогон 2 — сравнение с только что снятыми)
        run: npx playwright test -g "— visual"
        env:
          PREVIEW_URL: http://localhost:4322
      - name: Upload linux baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-baselines
          path: tests/visual.spec.ts-snapshots/*-linux.png
          retention-days: 3

  visual:
    runs-on: ubuntu-latest
    # Без лимита job наследовал дефолтные 6 ч — зависший прогон крутился часами.
    timeout-minutes: 40
    # Прогон скриншотов делится на четыре части, каждая на своём раннере: было
    # 10,4 минуты подряд, стало примерно три параллельно. Playwright сам режет
    # набор по --shard и не требует, чтобы части были равными.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: visual (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # См. пояснение в build.yml: обработка картинок занимала 115 секунд в
      # КАЖДОЙ сборке, а результат для одного файла всегда одинаковый.
      - name: Кэш обработанных картинок
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png') }}
          restore-keys: astro-assets-${{ runner.os }}-

      - run: npm run build
        env:
          SKIP_HTML_MIN: '1'   # на отрисовку страницы минификация не влияет

      # Явный порт 4322: `astro preview` по умолчанию поднимается на 4321, а гейт
      # ждёт/тестит на 4322 — из-за этого «Wait for server» висел бесконечно
      # (прогоны отваливались по 6-часовому таймауту). Совпадает с pre-push-хуком.
      - name: Start preview server
        run: npx astro preview --port 4322 &
        env:
          NODE_ENV: production

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4322/ > /dev/null && exit 0
            sleep 2
          done
          echo "✖ preview-сервер не поднялся за 120с"; exit 1

      # Пиксельные скриншот-эталоны платформозависимы (`-darwin.png`), а раннер —
      # Linux: их тут нет и сгенерировать негде. Поэтому в CI гоняем только
      # Полный прогон, включая пиксельную регрессию: в репо теперь есть linux-эталоны
      # (сняты на этом же раннере, проверены на стабильность прогоном 2 в
      # gen-linux-baselines — расхождений нет). Playwright сам берёт *-linux.png на
      # ubuntu по суффиксу платформы. Раньше здесь стоял --grep-invert "— visual" —
      # скриншоты в CI не сравнивались вообще, потому что linux-эталонов не было.
      # Весь набор, как и было: он шардирован на четверых и укладывается в 2–3 мин.
      # Отдельный прогон content-gate дублирует ОТСЮДА только контентную часть —
      # она идёт секунды, и это дешевле, чем городить деление без пересечений.
      - name: Run visual regression tests
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          PREVIEW_URL: http://localhost:4322

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/.html-report/
            test-results/
          retention-days: 14
