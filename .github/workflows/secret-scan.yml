name: secret-scan
# CI-бэкстоп: ищет закоммиченные секреты (форматы ключей / PGPASSWORD-литерал).
# grep-based, без внешних экшенов/лицензий. Консистентно с ~/.claude/hooks/secret-scan.sh.
on:
  push:
    branches: [main]
  pull_request:

# Прав по минимуму: скану достаточно прочитать файлы. Без этого блока прогон
# получает права по умолчанию для репозитория, а они могут быть на запись —
# на это и указало сканирование кода GitHub.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Стенд до проверки: подложенный ключ в первом из нескольких заходов обязан дать
      # красный и не попасть в журнал, ссылка фотостока — зелёный. Без стенда 12.09.2026
      # шаг ниже печатал найденный ключ и объявлял «чисто».
      - name: Стенд проверки секретов
        run: python3 scripts/secret-scan-oracle.py
      - name: Scan tracked files for secret formats
        shell: bash
        run: |
          python3 scripts/secret-scan.py --tree HEAD
