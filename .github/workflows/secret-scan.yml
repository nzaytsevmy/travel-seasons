name: secret-scan
# CI-бэкстоп: ищет закоммиченные секреты (форматы ключей / PGPASSWORD-литерал).
# grep-based, без внешних экшенов/лицензий. Консистентно с ~/.claude/hooks/secret-scan.sh.
on:
  push:
    branches: [main]
  pull_request:

# Прав по минимуму: скану достаточно прочитать файлы. Без этого блока прогон
# получает права по умолчанию для репозитория, а они могут быть на запись —
# на это и указало сканирование кода GitHub.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Стенд до проверки: подложенный ключ в первом из нескольких заходов обязан дать
      # красный и не попасть в журнал, ссылка фотостока — зелёный. Без стенда 12.09.2026
      # шаг ниже печатал найденный ключ и объявлял «чисто».
      - name: Стенд проверки секретов
        run: python3 scripts/secret-scan-oracle.py
      - name: Scan tracked files for secret formats
        shell: bash
        run: |
          set -uo pipefail
          # ⛔ Граница перед префиксом обязательна: без неё префикс ловится ВНУТРИ слова.
          # 18.08.2026 проверка покраснела на ссылке фотостока murman<префикс>-factory-sea-6715517.
          PAT='(^|[^A-Za-z0-9_-])(sk-(ant-)?[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|glpat-[A-Za-z0-9_-]{16,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|AIza[A-Za-z0-9_-]{30,}|y0_[A-Za-z0-9_-]{20,}|fc-[A-Za-z0-9]{20,}|(sk|rk|pk)_live_[A-Za-z0-9]{16,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,})'
          PG='PGPASSWORD[[:space:]]*=[[:space:]]*['"'"'"]?[^$ ]{6,}'
          # ⛔ Вердикт — по НАЛИЧИЮ находок, а не по коду xargs. Список файлов длиннее одной
          #    команды, xargs режет его на заходы и отвечает кодом последнего: до 12.09.2026
          #    ключ из первого захода печатался, а итог выходил «чисто». Печатаем только файл
          #    и строку — сам ключ в журнал не попадает. Стенд — scripts/secret-scan-oracle.py.
          fail=0
          hits=$(git ls-files -z | xargs -0 grep -nEI "$PAT" 2>/dev/null | cut -d: -f1,2 || true)
          if [ -n "$hits" ]; then printf '%s\n' "$hits"; echo "::error::Возможный секрет (формат ключа) в коммите"; fail=1; fi
          hits=$(git ls-files -z | xargs -0 grep -nEI "$PG" 2>/dev/null | cut -d: -f1,2 || true)
          if [ -n "$hits" ]; then printf '%s\n' "$hits"; echo "::error::Возможный PGPASSWORD-литерал в коммите"; fail=1; fi
          if [ "$fail" = 0 ]; then echo "secret-scan: clean"; fi
          exit $fail
