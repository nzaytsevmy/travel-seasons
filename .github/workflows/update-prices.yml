name: Update flight prices

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flight-prices
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    # 1 044 запроса с паузой 250 мс — минут пять; без предела задача наследует шесть часов.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch prices from Travelpayouts
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: node scripts/fetch-prices.mjs
      - name: Проверить контракт издателя
        run: node --test tests/bot-updates.test.mjs tests/auto-merge-policy.test.mjs

      - name: Создать или обновить проверяемую заявку
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/bot-publish.mjs prices

      - name: Alert on job failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=🚨 Цены билетов: обновление упало (run ${{ github.run_id }}). Сайт показывает прошлые цены — проверь Actions." \
            >/dev/null || true
