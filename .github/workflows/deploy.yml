name: Deploy to REG.RU

on:
  push:
    branches: [main]
  schedule:
    # Ежедневный ребилд+деплой: месяц-зависимый контент («сейчас, в июле» в
    # /compare/ и /trips/) запечён на билд-тайме и без пересборки протух бы.
    - cron: '30 6 * * *'
  workflow_dispatch:

# Сериализуем деплои: при быстрых мержах рейс «кто допушил последним» затирал прод
# промежуточным SHA. Очередь по группе, без cancel — текущий rsync доезжает, последний main деплоится последним.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 0, а не 2: дата актуальности данных считается из истории git
          # (scripts/gen-freshness.mjs). На обрезанной истории git решит, что
          # все файлы созданы в момент сборки, и подпись соврёт.
          fetch-depth: 0
          # Полная история нужна дате актуальности (она считается по git log).
          # blob:none качает граф коммитов без СТАРЫХ версий файлов: git log
          # работает, а 2,1 ГБ истории эталонных скриншотов не едут вовсе.
          # Замер 03.08.2026: выкачка занимала 14,4 мин из 24,6 мин выкладки.
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install deps (on cache miss)
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Astro asset transforms
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.astro
            .astro
          key: astro-cache-${{ runner.os }}-${{ hashFiles('src/**', 'public/**', 'astro.config.mjs', 'package-lock.json') }}
          restore-keys: |
            astro-cache-${{ runner.os }}-

      - run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan server290.hosting.reg.ru >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          # Два прохода, и это не перестраховка.
          # Astro даёт ассетам имя по содержимому (cover.D2h5mlPF_Z1IPP4R.jpg). Любая
          # пересборка картинки меняет хэш, старый файл пропадает из dist/, и общий
          # rsync --delete стирал его с сервера. А HTML у людей в браузере лежит в кэше:
          # на этом хостинге (nginx REG.RU) заголовок Cache-Control для HTML не отдаётся
          # вовсе — public/_headers это формат Netlify, здесь он не применяется. Итог:
          # закэшированная страница ссылается на уже удалённый файл и показывает битую
          # картинку. Именно так 31.07.2026 поехала карточка Roys Peak на главной.
          # Ассеты неизменяемы по своей природе, поэтому их НЕ удаляем — только досылаем.
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/_astro/ \
            u3502181@server290.hosting.reg.ru:/var/www/u3502181/data/www/traveltribe.ru/_astro/
          # Всё остальное синхронизируем с удалением — иначе накопятся страницы-призраки.
          rsync -avz --delete \
            --exclude='.well-known' \
            --exclude='_astro' \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            u3502181@server290.hosting.reg.ru:/var/www/u3502181/data/www/traveltribe.ru/

      - name: Smoke-check live prod
        run: |
          set -e
          for url in "https://traveltribe.ru/" "https://traveltribe.ru/trips/" "https://traveltribe.ru/visa/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || { echo "✖ smoke-check: $url вернул $code"; exit 1; }
          done
          echo "✔ прод отвечает 200 на ключевых маршрутах"

      - name: Проверить, что картинки на проде не битые
        run: |
          # Локальный визуал-гейт этот класс поломок не ловит в принципе: там HTML и
          # файлы всегда из одной сборки. Битые картинки возникают ИМЕННО на проде,
          # когда страница ссылается на ассет, которого на сервере нет. Поэтому
          # проверяем живой сайт после выкатки.
          python3 - <<'PYCHECK'
          import re, html, sys, urllib.request, urllib.error
          PAGES = ["/", "/blog/", "/countries/", "/trips/"]
          bad, checked = [], set()
          for page in PAGES:
              url = "https://traveltribe.ru" + page
              try:
                  t = urllib.request.urlopen(url, timeout=30).read().decode("utf-8", "replace")
              except Exception as e:
                  print("✖ не открылась страница %s: %s" % (page, e)); sys.exit(1)
              urls = set()
              for tag in re.findall(r"<img[^>]*>", t):
                  for attr in ("src", "srcset"):
                      m = re.search(attr + r'=("([^"]*)"|([^\s>]+))', tag)
                      if not m: continue
                      raw = html.unescape(m.group(2) or m.group(3) or "")
                      for part in raw.split(","):
                          u = part.strip().split(" ")[0]
                          if u.startswith("/"): urls.add(u)
              for u in sorted(urls):
                  if u in checked: continue
                  checked.add(u)
                  try:
                      code = urllib.request.urlopen(
                          urllib.request.Request("https://traveltribe.ru" + u, method="HEAD"), timeout=20).status
                  except urllib.error.HTTPError as e: code = e.code
                  except Exception as e: code = str(e)[:40]
                  if code != 200: bad.append((page, code, u))
          print("проверено картинок: %d" % len(checked))
          if bad:
              print("✖ битые картинки на проде:")
              for page, code, u in bad[:20]: print("   %s  %s  %s" % (code, page, u))
              sys.exit(1)
          print("✔ все картинки на ключевых страницах отдаются")
          PYCHECK

      - name: Collect changed files
        id: changed
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            FILES=$(git show --pretty="" --name-only HEAD)
          fi
          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Ping IndexNow + Yandex recrawl
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          YANDEX_USER_ID: ${{ secrets.YANDEX_USER_ID }}
        run: python3 .github/scripts/seo_ping.py
