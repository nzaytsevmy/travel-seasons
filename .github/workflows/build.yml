name: Build

on:
  pull_request:
    branches: [main]

# Отмена устаревших прогонов: два пуша в одну заявку давали ДВА полных набора,
# и первый доезжал до конца впустую. Замер 03.08.2026 на заявке #171: набор в
# 13:47 отработал целиком (8 прогонов Lighthouse + 4 визуальных), хотя коммит
# уже был заменён пушем в 14:14, и новый набор ждал освободившихся раннеров.
# Отменяем только у заявок: пуш в main обязан досчитать до конца.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # дата актуальности считается из истории git
          # blob:none качает граф коммитов без СТАРЫХ версий файлов: git log
          # работает, а 2,1 ГБ истории эталонных скриншотов не едут вовсе.
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci

      # Сломанное расписание CI не падает красным — оно просто не запускается, и
      # проверки нет в списке. Секунда здесь дешевле, чем выкладка без проверки.
      - name: Расписания CI без повторов ключей
        run: node scripts/check-workflows.mjs

      - name: Политика безопасного auto-merge
        run: npm run check:delivery

      # Обработка 208 картинок — 115 секунд каждой сборки, и результат для одного
      # и того же файла всегда один и тот же. Astro складывает его сюда, локально
      # поэтому пересборка занимает минуту, а не семь. Ключ по самим картинкам:
      # добавили кадр — переиспользуем всё остальное, а не начинаем заново.
      - name: Кэш обработанных картинок
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png') }}
          restore-keys: astro-assets-${{ runner.os }}-

      - run: npm run build
        env:
          SKIP_HTML_MIN: '1'   # минификация нужна проду, а не проверке

      - name: Full-site SEO audit
        run: npm run check:seo

      - name: Денежный контракт и full-site аудит
        run: npm run check:monetization

  # Гейт свежести: правка контента/данных обязана бампать DATA_UPDATED (meta.js),
  # иначе sitemap lastmod и byline «данные проверены …» соврут о дате. Ловит
  # застой даты (было: 5 релизов подряд на замороженной 2026-06-29).
  # Джоба freshness-gate удалена 01.08.2026.
  #
  # Она следила, чтобы человек не забыл обновить дату актуальности данных, и
  # угадывала по диффу, правка это фактуры или плумбинга. Угадывать намерение
  # по диффу не выходит: список исключений правился шесть раз, каждый новый
  # служебный файл ронял сборку, а автор получал уведомление о падении вместо
  # работающего CI.
  #
  # Устранена сама обязанность помнить дату: теперь она считается из истории
  # git по файлам с меткой «@freshness: DATA_UPDATED» (scripts/gen-freshness.mjs
  # в prebuild). Подпись «данные проверены на дату X» верна по построению —
  # забыть невозможно, соврать нечем, следить не за чем.
  #
  # ⛔ Требует fetch-depth: 0 в build.yml и deploy.yml: на обрезанной истории
  # git отдаст дату сборки. Скрипт это проверяет и честно откатывается.
