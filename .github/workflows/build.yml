name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  # Гейт свежести: правка контента/данных обязана бампать DATA_UPDATED (meta.js),
  # иначе sitemap lastmod и byline «данные проверены …» соврут о дате. Ловит
  # застой даты (было: 5 релизов подряд на замороженной 2026-06-29).
  freshness-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: DATA_UPDATED freshness gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # core.quotePath=false обязателен: иначе git экранирует не-ASCII пути в
          # "src/content/\320\262..." — строка начинается с кавычки, grep '^src/' мимо,
          # и файл с кириллическим слагом молча минует гейт целиком.
          CHANGED=$(git -c core.quotePath=false diff --name-only "$BASE_SHA" "$HEAD_SHA")
          CONTENT=$(echo "$CHANGED" | grep -E '^src/(content|data)/' | grep -vE '^src/(data/(prices-cache\.json|meta\.js|affiliate\.js|related-posts\.js|visa-changes\.js|news\.js)|content/config\.ts)$' || true)
          # У поста и у программных данных РАЗНЫЕ носители свежести, гейт их не смешивает:
          #  • пост  → его собственный updatedDate (из неё astro.config.mjs берёт sitemap
          #    lastmod — там прямо сказано, что иначе sitemap инфлирует свежесть всех URL);
          #  • src/data/*.js → DATA_UPDATED (meta.js), её byline программных страниц
          #    (visa/hub/seasons/calculator) заявляет как «цены и визовые правила
          #    проверены на дату X».
          # Требовать бамп DATA_UPDATED за правку поста — значит заставлять врать о
          # проверке цен, которой не было.
          # related-posts.js исключён по той же логике: это перелинковка «хаб → гайд»,
          # добавление ссылки на новую статью фактуру цен/виз не трогает.
          # visa-changes.js исключён по ДРУГОЙ причине, чем остальные: он несёт
          # свежесть САМ. У каждой записи ленты есть своя дата события (`date`) и
          # дата нашей сверки (`checked`), они и показываются читателю. DATA_UPDATED
          # описывает срез цен и визовых таблиц, а не хронологию — требовать его бамп
          # за добавление одной записи в ленту значит врать о пересмотре всех данных.
          # news.js и content/config.ts исключены по той же причине, что meta.js:
          # это схема коллекции и хелперы формата даты, а не датированная фактура.
          # Бампать за них DATA_UPDATED значило бы заявить читателю «цены и визовые
          # правила проверены сегодня», чего не было. Сами заметки ленты несут
          # свежесть сами — у каждой своя `date` и своя `checked`.
          # affiliate.js исключён (как meta.js/prices-cache.json): это трекинг-плумбинг
          # партнёрских ссылок (erid/sub_id/дип-линки), а НЕ датированная фактура цен/виз.
          # Его правка byline «данные проверены на дату X» не затрагивает — бампать нечего.
          # Помечаем разбор префиксом: POST = пост правлен без бампа updatedDate,
          # DATA = фактура данных, ждёт DATA_UPDATED.
          VERDICT=$(
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              # Скобки у шаблонов case обязательны: без ведущей `(` bash принимает
              # закрывающую `)` за конец подстановки $( ... ) — синтаксическая ошибка.
              # Исключение — только текстовые посты: у бинарников (картинки в
              # src/content/blog/_images/) дифф не даёт строк +/-, и они молча
              # сошли бы за «не фактуру». Они падают в общий случай, как раньше.
              case "$f" in
                (src/content/*)
                  ST=$(git -c core.quotePath=false diff --name-status "$BASE_SHA" "$HEAD_SHA" -- "$f" | cut -f1) || exit 3
                  # Новый контент поста (сам .mdx и его обложка) соврать о свежести не
                  # может: его дата — pubDate во фронтматтере, она же уходит в sitemap.
                  # Бампать нечего. ЗАМЕНА существующего файла ниже ловится как раньше.
                  if [ "$ST" = "A" ]; then continue; fi
                  case "$f" in
                    (*.md|*.mdx)
                      FDIFF=$(git -c core.quotePath=false diff -U0 "$BASE_SHA" "$HEAD_SHA" -- "$f") || exit 3
                      # aff-only exemption: если в теле поста тронут ТОЛЬКО партнёрский URL
                      # (tpk.mx/pxf.io) — проза и фактура те же (напр. sub_id переставлен на
                      # шортлинк ради атрибуции), свежесть не требуется, как и для title/desc.
                      # Хелпер маскирует aff-URL и сверяет мультимножества +/- строк.
                      if printf '%s\n' "$FDIFF" | python3 .github/scripts/aff_only.py; then
                        : # только партнёрский URL — фактура/проза не менялись, exempt
                      else
                        # title/description — работа над сниппетом выдачи, фактура не тронута.
                        OTHER=$(printf '%s\n' "$FDIFF" \
                          | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
                          | grep -vE '^[+-](title|description|updatedDate):' || true)
                        if [ -n "$OTHER" ] && ! printf '%s\n' "$FDIFF" | grep -qE '^\+updatedDate:'; then
                          printf 'POST %s\n' "$f"
                        fi
                      fi
                      ;;
                    (*)
                      # Замена картинки существующего поста. Если это hero-обложка
                      # (файл указан в coverImage какого-то поста) — перекадрирование
                      # или пережатие ради веса/LCP НЕ трогает фактуру: цены и визы в
                      # тексте те же. Требовать за это бамп DATA_UPDATED = врать о
                      # проверке данных. Инфографику с цифрами (не coverImage) гейт
                      # по-прежнему считает фактурой. Признак — путь в coverImage
                      # фронтматтера, а не имя файла (обложки называются по-разному).
                      # Имя файла — fixed-string (grep -F), не регексп: точка в
                      # расширении не должна стать шаблоном, а сам путь — из git diff
                      # репозитория, не из метаданных PR (инъекции нет).
                      base="${f##*/}"
                      if grep -rhE '^coverImage:' src/content/blog --include='*.md' --include='*.mdx' \
                           | grep -qF "$base"; then
                        : # hero-обложка — свежесть несёт pubDate/updatedDate поста, не DATA_UPDATED
                      else
                        # Не обложка. Растровое фото в теле поста (jpg/webp/png/…) —
                        # такая же косметика, как обложка: поворот/перекадрирование/
                        # пережатие не трогает цены и визы, свежесть несёт дата поста.
                        # Датированные инфографики репо — .svg (season-matrix/ees-flow/
                        # choice-matrix …); они падают в DATA и остаются строгими.
                        case "$base" in
                          (*.jpg|*.jpeg|*.png|*.webp|*.avif|*.gif)
                            : # inline-фото поста — свежесть несёт дата поста, exempt
                            ;;
                          (*) printf 'DATA %s\n' "$f" ;;
                        esac
                      fi
                      ;;
                  esac
                  ;;
                (src/data/directions.js)
                  # В directions.js лежит и фактура (цены/визы/сезоны), и перелинковка
                  # «хаб → блог-гайд». Добавление ссылки на статью фактуру не трогает,
                  # и бампать за него DATA_UPDATED = врать о проверке цен. Хелпер
                  # сравнивает файл БЕЗ блока RELATED_POSTS: одинаково → это перелинковка.
                  git -c core.quotePath=false show "$BASE_SHA:$f" > /tmp/_d_base.js 2>/dev/null || : > /tmp/_d_base.js
                  git -c core.quotePath=false show "$HEAD_SHA:$f" > /tmp/_d_head.js 2>/dev/null || : > /tmp/_d_head.js
                  if python3 .github/scripts/links_only.py /tmp/_d_base.js /tmp/_d_head.js; then
                    : # тронута только перелинковка — фактура та же, свежесть не требуется
                  else
                    printf 'DATA %s\n' "$f"
                  fi
                  ;;
                (*) printf 'DATA %s\n' "$f" ;;
              esac
            done <<< "$CONTENT"
          ) || { echo "✖ не удалось прочитать git diff — гейт не может судить о свежести"; exit 1; }
          STALE_POSTS=$(printf '%s\n' "$VERDICT" | sed -n 's/^POST //p')
          DATA_TOUCHED=$(printf '%s\n' "$VERDICT" | sed -n 's/^DATA //p')
          FAIL=0
          if [ -n "$STALE_POSTS" ]; then
            echo "✖ правлено тело поста, но updatedDate не бампнут:"
            printf '%s\n' "$STALE_POSTS" | sed 's/^/    /'
            echo "  Бампни updatedDate этих постов — из неё sitemap берёт lastmod."
            FAIL=1
          fi
          if [ -n "$DATA_TOUCHED" ]; then
            # Гейт защищает ОДНО: чтобы byline «данные проверены на дату X» не соврал.
            # Бамп meta.js — обычный способ это обеспечить, но не единственный: если
            # фактуру правят вторым PR за тот же день, DATA_UPDATED уже стоит датой
            # коммита, byline верен, а новой даты просто не существует. Требовать бамп
            # здесь — толкать либо на завтрашнюю дату (враньё о проверке, которой ещё
            # не было), либо на косметическую правку meta.js ради зелёного. Поэтому
            # сверяем ЗНАЧЕНИЕ с датой коммита, а не факт присутствия файла в диффе.
            DU=$(git -c core.quotePath=false show "$HEAD_SHA:src/data/meta.js" 2>/dev/null \
                  | sed -n "s/^export const DATA_UPDATED = '\([0-9][0-9-]*\)'.*/\1/p" | head -1)
            CDATE=$(git show -s --format=%cd --date=format:%Y-%m-%d "$HEAD_SHA")
            if echo "$CHANGED" | grep -qx 'src/data/meta.js'; then
              : # дата актуальности бампнута в этом же PR — обычный путь
            elif [ -n "$DU" ] && [ "$DU" = "$CDATE" ]; then
              echo "ℹ DATA_UPDATED уже равен дате коммита ($DU) — byline актуален, второй бамп за день не нужен"
            else
              echo "✖ изменена фактура данных, но src/data/meta.js (DATA_UPDATED) не тронут:"
              printf '%s\n' "$DATA_TOUCHED" | sed 's/^/    /'
              echo "  DATA_UPDATED=${DU:-?}, дата коммита=$CDATE."
              echo "  Бампни дату актуальности — иначе byline «данные проверены …» соврёт."
              FAIL=1
            fi
          fi
          if [ "$FAIL" = 1 ]; then exit 1; fi
          echo "✔ свежесть в порядке: у правленых постов бампнут updatedDate, у фактуры данных — DATA_UPDATED"
