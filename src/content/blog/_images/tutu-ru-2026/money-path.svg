<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui,-apple-system,sans-serif">
<title>Что остаётся у сервиса, если вернуть ж/д билет, купленный на Туту.ру</title>
<desc>Схема движения денег на примере плацкартного места за 3911 рублей. Из них 3568 рублей 90 копеек — цена перевозчика, 342 рубля 10 копеек — надбавка сервиса. При возврате надбавка остаётся у сервиса по пункту 2.4 приложения об оформлении ж/д билетов, сверху удерживается отдельный сбор за оформление возврата по пункту 4.4 и сборы перевозчика, а остаток идёт на карту в срок до тридцати календарных дней.</desc>
<rect width="640" height="640" fill="#131009"/>

<text x="24" y="44" fill="#c9973a" font-size="21" font-weight="600">Что вернётся, если сдать билет</text>
<text x="24" y="72" fill="#a8a090" font-size="15">Плацкарт Москва — Киров, замер 26 августа 2026</text>

<rect x="24" y="96" width="592" height="86" rx="4" fill="#1c1710" stroke="#3a3429"/>
<text x="44" y="128" fill="#e8e0d0" font-size="18">Заплатили на Туту</text>
<text x="596" y="128" text-anchor="end" fill="#e8e0d0" font-size="22" font-weight="700">3 911 ₽</text>
<text x="44" y="160" fill="#a8a090" font-size="15">цена перевозчика 3 568,90 ₽ плюс надбавка 342,10 ₽</text>

<line x1="320" y1="182" x2="320" y2="214" stroke="#3a3429" stroke-width="2"/>
<path d="M314 208 L320 218 L326 208 Z" fill="#3a3429"/>

<rect x="24" y="220" width="592" height="76" rx="4" fill="#1c1710" stroke="#d44545" stroke-width="1.5"/>
<text x="44" y="252" fill="#d44545" font-size="18" font-weight="600">Надбавка не возвращается</text>
<text x="596" y="252" text-anchor="end" fill="#d44545" font-size="20" font-weight="700">− 342,10 ₽</text>
<text x="44" y="280" fill="#a8a090" font-size="15">пункт 2.4: сбор не возвращают ни при каких обстоятельствах</text>

<line x1="320" y1="296" x2="320" y2="328" stroke="#3a3429" stroke-width="2"/>
<path d="M314 322 L320 332 L326 322 Z" fill="#3a3429"/>

<rect x="24" y="334" width="592" height="76" rx="4" fill="#1c1710" stroke="#d44545" stroke-width="1.5"/>
<text x="44" y="366" fill="#d44545" font-size="18" font-weight="600">Сбор за оформление возврата</text>
<text x="596" y="366" text-anchor="end" fill="#d44545" font-size="20" font-weight="700">− ?</text>
<text x="44" y="394" fill="#a8a090" font-size="15">пункт 4.4: берётся сверх сборов РЖД, размер в оферте не назван</text>

<line x1="320" y1="410" x2="320" y2="442" stroke="#3a3429" stroke-width="2"/>
<path d="M314 436 L320 446 L326 436 Z" fill="#3a3429"/>

<rect x="24" y="448" width="592" height="76" rx="4" fill="#1c1710" stroke="#d44545" stroke-width="1.5"/>
<text x="44" y="480" fill="#d44545" font-size="18" font-weight="600">Сборы перевозчика</text>
<text x="596" y="480" text-anchor="end" fill="#d44545" font-size="20" font-weight="700">− ?</text>
<text x="44" y="508" fill="#a8a090" font-size="15">по правилам тарифа и срокам до отправления</text>

<line x1="320" y1="524" x2="320" y2="556" stroke="#3a3429" stroke-width="2"/>
<path d="M314 550 L320 560 L326 550 Z" fill="#3a3429"/>

<rect x="24" y="562" width="592" height="62" rx="4" fill="#1c1710" stroke="#5cc97a" stroke-width="1.5"/>
<text x="44" y="592" fill="#5cc97a" font-size="18" font-weight="600">Остаток — на карту</text>
<text x="596" y="592" text-anchor="end" fill="#5cc97a" font-size="17" font-weight="700">до 30 дней</text>
<text x="44" y="614" fill="#a8a090" font-size="15">пункт 4.5: срок календарный, а не рабочий</text>
</svg>
