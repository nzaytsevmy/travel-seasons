<circle cx="307" cy="250" r="8" fill="#c9973a"/>

<circle cx="568" cy="250" r="11" fill="#e8c062"/>
<line x1="568" y1="239" x2="568" y2="196" stroke="#e8c062" stroke-width="1.5"/>
<text x="596" y="182" text-anchor="end" fill="#e8c062" font-size="17" font-weight="700">28,2%</text>

<text x="24" y="386" fill="#e8e0d0" font-size="17">Восемь мест: от 9,6% до 13,7% сверху.</text>
<text x="24" y="412" fill="#e8e0d0" font-size="17">Девятое — сидячее место за 1 717 ₽</text>
<text x="24" y="438" fill="#e8e0d0" font-size="17">у перевозчика: 2 201 ₽, это плюс 28,2%.</text>
