<line x1="420" y1="294" x2="420" y2="312" stroke="#3a3429" stroke-width="2"/>
<line x1="600" y1="294" x2="600" y2="312" stroke="#3a3429" stroke-width="2"/>
<text x="60" y="336" text-anchor="middle" fill="#a8a090" font-size="15">0%</text>
<text x="240" y="336" text-anchor="middle" fill="#a8a090" font-size="15">10%</text>
<text x="420" y="336" text-anchor="middle" fill="#a8a090" font-size="15">20%</text>
<text x="600" y="336" text-anchor="middle" fill="#a8a090" font-size="15">30%</text>

<rect x="233" y="196" width="76" height="104" fill="#c9973a" fill-opacity="0.10"/>
<text x="271" y="182" text-anchor="middle" fill="#a8a090" font-size="15">восемь мест из девяти</text>

<circle cx="233" cy="272" r="8" fill="#c9973a"/>
<circle cx="233" cy="250" r="8" fill="#c9973a"/>
