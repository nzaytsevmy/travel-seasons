<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="system-ui,-apple-system,sans-serif">
<title>Разброс надбавки Туту.ру над ценой перевозчика на девяти замеренных местах</title>
<desc>Горизонтальная шкала надбавки в процентах от нуля до тридцати. Восемь отметок собраны в узкой полосе от девяти с половиной до тринадцати с половиной процентов, девятая отметка стоит отдельно на двадцати восьми процентах — это самое дешёвое место замера, сидячий вагон за 1717 рублей.</desc>
<rect width="640" height="470" fill="#131009"/>

<text x="24" y="44" fill="#c9973a" font-size="21" font-weight="600">Надбавка к цене перевозчика</text>
<text x="24" y="72" fill="#a8a090" font-size="15">Девять мест, два маршрута, 26 августа 2026</text>

<line x1="60" y1="300" x2="600" y2="300" stroke="#3a3429" stroke-width="2"/>
<line x1="60" y1="294" x2="60" y2="312" stroke="#3a3429" stroke-width="2"/>
