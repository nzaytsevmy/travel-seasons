<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui,-apple-system,sans-serif">
<title>Кто на самом деле продаёт ж/д билет, купленный на Туту.ру</title>
<desc>Цепочка из четырёх звеньев: пассажир платит по оферте обществу с ограниченной ответственностью Новые Туристические Технологии, оно оформляет билет через веб-системы УФС, РЖД-Цифровые пассажирские решения, Гетинтех и Гранд Сервис Экспресс, а перевозят пассажира ФПК, ДОСС, Тверской экспресс или Гранд Сервис Экспресс. Договор перевозки при этом возникает у пассажира напрямую с перевозчиком, минуя два средних звена.</desc>
<rect width="640" height="600" fill="#131009"/>

<text x="24" y="44" fill="#c9973a" font-size="21" font-weight="600">Через кого проходит билет</text>
<text x="24" y="72" fill="#a8a090" font-size="15">По оферте сервиса и подписи под страницей поиска</text>

<rect x="24" y="96" width="470" height="74" rx="4" fill="#1c1710" stroke="#3a3429"/>
<text x="44" y="128" fill="#e8e0d0" font-size="19" font-weight="600">Пассажир</text>
<text x="44" y="156" fill="#a8a090" font-size="15">платит одной суммой на сайте</text>

<line x1="120" y1="170" x2="120" y2="204" stroke="#3a3429" stroke-width="2"/>
<path d="M114 198 L120 208 L126 198 Z" fill="#3a3429"/>

<rect x="24" y="210" width="470" height="98" rx="4" fill="#1c1710" stroke="#c9973a" stroke-width="1.5"/>
<text x="44" y="242" fill="#c9973a" font-size="19" font-weight="600">ООО «НТТ»</text>
<text x="44" y="268" fill="#e8e0d0" font-size="16">«Новые Туристические Технологии»</text>
<text x="44" y="294" fill="#a8a090" font-size="15">сторона оферты, берёт свой сбор</text>

<line x1="120" y1="308" x2="120" y2="342" stroke="#3a3429" stroke-width="2"/>
<path d="M114 336 L120 346 L126 336 Z" fill="#3a3429"/>

<rect x="24" y="348" width="470" height="98" rx="4" fill="#1c1710" stroke="#3a3429"/>
<text x="44" y="380" fill="#e8e0d0" font-size="19" font-weight="600">Веб-система продажи</text>
<text x="44" y="406" fill="#a8a090" font-size="15">УФС, РЖД-Цифровые пассажирские</text>
<text x="44" y="430" fill="#a8a090" font-size="15">решения, Гетинтех, Гранд Сервис Экспресс</text>

<line x1="120" y1="446" x2="120" y2="480" stroke="#3a3429" stroke-width="2"/>
<path d="M114 474 L120 484 L126 474 Z" fill="#3a3429"/>

<rect x="24" y="486" width="470" height="90" rx="4" fill="#1c1710" stroke="#5cc97a" stroke-width="1.5"/>
<text x="44" y="518" fill="#5cc97a" font-size="19" font-weight="600">Перевозчик</text>
<text x="44" y="544" fill="#a8a090" font-size="15">ФПК, ДОСС, Тверской экспресс,</text>
<text x="44" y="568" fill="#a8a090" font-size="15">Гранд Сервис Экспресс</text>

<path d="M510 133 L560 133 L560 531 L510 531" fill="none" stroke="#5cc97a" stroke-width="2"/>
<path d="M520 525 L508 531 L520 537 Z" fill="#5cc97a"/>
<text x="584" y="310" fill="#5cc97a" font-size="16" font-weight="600" transform="rotate(90 584 310)" text-anchor="middle">договор перевозки</text>
</svg>
