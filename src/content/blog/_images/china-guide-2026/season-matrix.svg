<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Когда ехать в регионы Китая</title>
  <desc id="desc">Матрица двенадцати месяцев для севера, востока, юга и Юньнани: зелёный — удобное окно, жёлтый — поездка с оговорками, красный — погодный риск.</desc>
  <rect width="1200" height="650" rx="28" fill="#f7f4ed"/>
  <text x="64" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18332d">Китай: сезон зависит от региона</text>
  <text x="64" y="108" font-family="Arial, sans-serif" font-size="19" fill="#52635f">Календарь для городской поездки; праздники и прогноз на свои даты проверяются отдельно</text>

  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#344843">
    <text x="300" y="160">янв</text><text x="372" y="160">фев</text><text x="444" y="160">мар</text>
    <text x="516" y="160">апр</text><text x="588" y="160">май</text><text x="660" y="160">июн</text>
    <text x="732" y="160">июл</text><text x="804" y="160">авг</text><text x="876" y="160">сен</text>
    <text x="948" y="160">окт</text><text x="1020" y="160">ноя</text><text x="1092" y="160">дек</text>
  </g>

  <g font-family="Arial, sans-serif" fill="#18332d">
    <text x="64" y="224" font-size="22" font-weight="700">Север</text>
    <text x="64" y="249" font-size="16">Пекин, Сиань</text>
    <text x="64" y="320" font-size="22" font-weight="700">Восток</text>
    <text x="64" y="345" font-size="16">Шанхай, Ханчжоу</text>
    <text x="64" y="416" font-size="22" font-weight="700">Юг</text>
    <text x="64" y="441" font-size="16">Гуанчжоу, Гуйлинь</text>
    <text x="64" y="512" font-size="22" font-weight="700">Юньнань</text>
    <text x="64" y="537" font-size="16">Куньмин, Дали</text>
  </g>

  <g stroke="#f7f4ed" stroke-width="8">
    <!-- Север: холодная зима, короткие весна и осень, дождливое лето -->
    <rect x="264" y="188" width="72" height="72" rx="12" fill="#d96b55"/><rect x="336" y="188" width="72" height="72" rx="12" fill="#d96b55"/>
    <rect x="408" y="188" width="72" height="72" rx="12" fill="#e6bd62"/><rect x="480" y="188" width="72" height="72" rx="12" fill="#4f9d78"/>
    <rect x="552" y="188" width="72" height="72" rx="12" fill="#4f9d78"/><rect x="624" y="188" width="72" height="72" rx="12" fill="#e6bd62"/>
    <rect x="696" y="188" width="72" height="72" rx="12" fill="#d96b55"/><rect x="768" y="188" width="72" height="72" rx="12" fill="#d96b55"/>
    <rect x="840" y="188" width="72" height="72" rx="12" fill="#4f9d78"/><rect x="912" y="188" width="72" height="72" rx="12" fill="#4f9d78"/>
    <rect x="984" y="188" width="72" height="72" rx="12" fill="#e6bd62"/><rect x="1056" y="188" width="72" height="72" rx="12" fill="#d96b55"/>

    <!-- Восток: удачные весна и осень, мэйюй и тайфуны летом -->
    <rect x="264" y="284" width="72" height="72" rx="12" fill="#e6bd62"/><rect x="336" y="284" width="72" height="72" rx="12" fill="#e6bd62"/>
    <rect x="408" y="284" width="72" height="72" rx="12" fill="#4f9d78"/><rect x="480" y="284" width="72" height="72" rx="12" fill="#4f9d78"/>
    <rect x="552" y="284" width="72" height="72" rx="12" fill="#4f9d78"/><rect x="624" y="284" width="72" height="72" rx="12" fill="#d96b55"/>
    <rect x="696" y="284" width="72" height="72" rx="12" fill="#d96b55"/><rect x="768" y="284" width="72" height="72" rx="12" fill="#d96b55"/>
    <rect x="840" y="284" width="72" height="72" rx="12" fill="#e6bd62"/><rect x="912" y="284" width="72" height="72" rx="12" fill="#4f9d78"/>
    <rect x="984" y="284" width="72" height="72" rx="12" fill="#4f9d78"/><rect x="1056" y="284" width="72" height="72" rx="12" fill="#e6bd62"/>

    <!-- Юг: мягкая зима, длинное влажное лето -->
    <rect x="264" y="380" width="72" height="72" rx="12" fill="#4f9d78"/><rect x="336" y="380" width="72" height="72" rx="12" fill="#4f9d78"/>
    <rect x="408" y="380" width="72" height="72" rx="12" fill="#4f9d78"/><rect x="480" y="380" width="72" height="72" rx="12" fill="#e6bd62"/>
    <rect x="552" y="380" width="72" height="72" rx="12" fill="#e6bd62"/><rect x="624" y="380" width="72" height="72" rx="12" fill="#d96b55"/>
    <rect x="696" y="380" width="72" height="72" rx="12" fill="#d96b55"/><rect x="768" y="380" width="72" height="72" rx="12" fill="#d96b55"/>
    <rect x="840" y="380" width="72" height="72" rx="12" fill="#e6bd62"/><rect x="912" y="380" width="72" height="72" rx="12" fill="#4f9d78"/>
    <rect x="984" y="380" width="72" height="72" rx="12" fill="#4f9d78"/><rect x="1056" y="380" width="72" height="72" rx="12" fill="#4f9d78"/>

    <!-- Юньнань: сухая зима, мокрый сезон май-октябрь, высотные различия -->
    <rect x="264" y="476" width="72" height="72" rx="12" fill="#4f9d78"/><rect x="336" y="476" width="72" height="72" rx="12" fill="#4f9d78"/>
    <rect x="408" y="476" width="72" height="72" rx="12" fill="#4f9d78"/><rect x="480" y="476" width="72" height="72" rx="12" fill="#4f9d78"/>
    <rect x="552" y="476" width="72" height="72" rx="12" fill="#e6bd62"/><rect x="624" y="476" width="72" height="72" rx="12" fill="#e6bd62"/>
    <rect x="696" y="476" width="72" height="72" rx="12" fill="#d96b55"/><rect x="768" y="476" width="72" height="72" rx="12" fill="#d96b55"/>
    <rect x="840" y="476" width="72" height="72" rx="12" fill="#e6bd62"/><rect x="912" y="476" width="72" height="72" rx="12" fill="#e6bd62"/>
    <rect x="984" y="476" width="72" height="72" rx="12" fill="#4f9d78"/><rect x="1056" y="476" width="72" height="72" rx="12" fill="#4f9d78"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="16" fill="#344843">
    <circle cx="310" cy="601" r="10" fill="#4f9d78"/><text x="330" y="607">удобное окно</text>
    <circle cx="510" cy="601" r="10" fill="#e6bd62"/><text x="530" y="607">можно, но есть оговорка</text>
    <circle cx="800" cy="601" r="10" fill="#d96b55"/><text x="820" y="607">холод, жара или ливни</text>
  </g>
</svg>
