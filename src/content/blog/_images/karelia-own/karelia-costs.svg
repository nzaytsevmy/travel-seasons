<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 544" width="640" height="544" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько стоит неделя в Карелии</title>
<desc>Неделя на двоих 50–90 тысяч рублей без дороги. Домик от 2500 за ночь, метеор на Кижи 5200, на Валаам от 7700, вход в Рускеалу 750 рублей.</desc>
<rect width="640" height="544" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">СКОЛЬКО СТОИТ КАРЕЛИЯ</text>
<text x="320" y="84" text-anchor="middle" fill="#5cc97a" font-size="20" font-weight="700">50 000–90 000 ₽ на двоих за неделю</text>
<text x="320" y="108" text-anchor="middle" fill="#a8a090" font-size="16">без дороги до Карелии</text>
<line x1="24" y1="128" x2="616" y2="128" stroke="#3a3429"/>
<text x="24" y="166" fill="#e8e0d0" font-size="18" font-weight="600">Домик на берегу</text>
<text x="616" y="166" text-anchor="end" fill="#5cc97a" font-size="18" font-weight="700">от 2500 ₽</text>
<text x="24" y="184" fill="#6b6455" font-size="14.5">за ночь</text>
<text x="24" y="220" fill="#e8e0d0" font-size="18" font-weight="600">Коттедж в Приладожье</text>
<text x="616" y="220" text-anchor="end" fill="#e8c062" font-size="18" font-weight="700">14–25 тыс. ₽</text>
<text x="24" y="238" fill="#6b6455" font-size="14.5">за ночь</text>
<text x="24" y="274" fill="#e8e0d0" font-size="18" font-weight="600">Метеор на Кижи</text>
<text x="616" y="274" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">5200 ₽</text>
<text x="24" y="292" fill="#6b6455" font-size="14.5">туда-обратно, взрослый</text>
<text x="24" y="328" fill="#e8e0d0" font-size="18" font-weight="600">Метеор на Валаам</text>
<text x="616" y="328" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">от 7700 ₽</text>
<text x="24" y="346" fill="#6b6455" font-size="14.5">с экскурсией</text>
<text x="24" y="382" fill="#e8e0d0" font-size="18" font-weight="600">Вход в Рускеалу</text>
<text x="616" y="382" text-anchor="end" fill="#5cc97a" font-size="18" font-weight="700">750 ₽</text>
<text x="24" y="436" fill="#e8e0d0" font-size="18" font-weight="600">Поезд из Москвы</text>
<text x="616" y="436" text-anchor="end" fill="#7fb5c9" font-size="18" font-weight="700">от 7000 ₽</text>
<text x="24" y="454" fill="#6b6455" font-size="14.5">купе</text>
<text x="320" y="500" text-anchor="middle" fill="#a8a090" font-size="16">Самое дорогое — метеоры на острова</text>
<text x="320" y="522" text-anchor="middle" fill="#a8a090" font-size="16">и организованные туры</text>
</svg>