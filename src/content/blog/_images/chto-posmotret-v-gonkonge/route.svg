<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 610" role="img" aria-labelledby="title desc">
<title id="title">Гонконг за три дня: три зоны вместо лишних переездов</title>
<desc id="desc">Север сверху. Коулун расположен севернее острова Гонконг, между Tsim Sha Tsui и Central ходит Star Ferry. Лантау западнее: до Tung Chung едут на метро, далее канаткой Ngong Ping 360.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#236c78" stroke-width="2"/></marker></defs>
<rect width="420" height="610" rx="18" fill="#eef7f7"/>
<g font-family="Arial, sans-serif" fill="#172e35">
<text x="22" y="34" font-size="22" font-weight="700">Три дня — три части города</text>
<text x="22" y="58" font-size="14" fill="#46646c">Берега соединяет паром. До Лантау — метро.</text>
<path d="M28 127V93m-7 10 7-10 7 10" fill="none" stroke="#46646c" stroke-width="2"/>
<text x="44" y="107" font-size="14">Север</text>
<rect x="230" y="84" width="168" height="162" rx="14" fill="#fff" stroke="#94bdb7"/>
<rect x="244" y="98" width="68" height="25" rx="12" fill="#1d7467"/>
<text x="278" y="116" font-size="14" text-anchor="middle" fill="#fff">ДЕНЬ 2</text>
<text x="244" y="149" font-size="23" font-weight="700">Коулун</text>
<text x="244" y="177" font-size="15">Mong Kok · Jordan</text>
<text x="244" y="201" font-size="15">Tsim Sha Tsui</text>
<text x="244" y="228" font-size="14" fill="#46646c">Набережная вечером</text>
<rect x="230" y="372" width="168" height="158" rx="14" fill="#fff" stroke="#d8b08c"/>
<rect x="244" y="386" width="68" height="25" rx="12" fill="#92502b"/>
<text x="278" y="404" font-size="14" text-anchor="middle" fill="#fff">ДЕНЬ 1</text>
<text x="244" y="438" font-size="22" font-weight="700">Остров</text>
<text x="244" y="463" font-size="22" font-weight="700">Гонконг</text>
<text x="244" y="490" font-size="15">Central · Sheung Wan</text>
<text x="244" y="515" font-size="15">Пик — по видимости</text>
<path d="M313 257V359" stroke="#236c78" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="245" y="285" width="137" height="40" rx="8" fill="#eef7f7"/>
<text x="314" y="301" text-anchor="middle" font-size="15" font-weight="700">Star Ferry</text>
<text x="314" y="320" text-anchor="middle" font-size="13">через бухту Виктория</text>
<rect x="22" y="222" width="165" height="246" rx="14" fill="#fff" stroke="#b2bc99"/>
<rect x="36" y="236" width="68" height="25" rx="12" fill="#5e702f"/>
<text x="70" y="254" font-size="14" text-anchor="middle" fill="#fff">ДЕНЬ 3</text>
<text x="36" y="288" font-size="23" font-weight="700">Лантау</text>
<text x="36" y="317" font-size="16">Tung Chung</text>
<path d="M49 332V357" stroke="#5e702f" stroke-width="2"/>
<text x="65" y="342" font-size="13" fill="#46646c">Ngong Ping 360</text>
<text x="65" y="359" font-size="13" fill="#46646c">канатка · 25 мин</text>
<text x="36" y="390" font-size="16">Ngong Ping</text>
<text x="36" y="415" font-size="15">Будда · Po Lin</text>
<text x="36" y="447" font-size="14" fill="#46646c">На весь день</text>
<path d="M132 211Q144 147 218 165" fill="none" stroke="#236c78" stroke-width="2" stroke-dasharray="5 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="111" y="150" font-size="14" fill="#236c78">метро</text>
<text x="22" y="566" font-size="15" font-weight="700">Макао или Диснейленд — отдельный день.</text>
<text x="22" y="590" font-size="13" fill="#46646c">Схема без масштаба. Для пути используйте карту.</text>
</g></svg>
