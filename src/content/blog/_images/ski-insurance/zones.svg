<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="t d"><title id="t">Граница трассы меняет условия катания</title><desc id="d">Условная карта склона: маркированный спуск, отдельный внетрассовый маршрут и закрытый участок. Это не карта реального курорта.</desc><rect width="640" height="660" fill="#fbfbfa"/><g fill="none" stroke="#d9dbde" stroke-width="2"><path d="M30 260Q220 10 600 180M20 310Q240 60 620 230M25 380Q250 110 620 290M20 450Q220 200 620 350M25 520Q280 270 610 430M25 590Q300 350 620 510"/></g><path d="M300 125C175 225 395 290 260 390S180 480 310 565" fill="none" stroke="#eef0f2" stroke-width="65"/><path d="M300 125C175 225 395 290 260 390S180 480 310 565" fill="none" stroke="#1d40ae" stroke-width="5"/><path d="M310 140C480 190 370 280 470 350S470 480 330 565" fill="none" stroke="#15171a" stroke-width="3" stroke-dasharray="10 9"/><path d="M70 130L185 130L145 230L45 210Z" fill="#eef0f2" stroke="#5c626b" stroke-width="2"/><path d="M80 150L145 205M145 150L80 205" stroke="#5c626b" stroke-width="3"/><g font-family="sans-serif" font-size="22" fill="#15171a"><text x="32" y="48">Три разных условия на одном склоне</text><text x="38" y="108">Закрытый участок</text><text x="445" y="275">Вне трассы</text><text x="35" y="365">Маркированный</text><text x="35" y="395">спуск</text><text x="35" y="625" fill="#5c626b">Условная схема, не навигационная карта</text></g></svg>
