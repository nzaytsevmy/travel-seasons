<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="t d"><title id="t">Даты поездки длиннее дней катания</title><desc id="d">Условная семидневная поездка: дорога в первый и седьмой день, катание со второго по шестой. Медицинская защита нужна и в дороге; порядок включения спортивной опции проверяется по договору.</desc><rect width="640" height="640" fill="#fbfbfa"/><g font-family="sans-serif" font-size="22" fill="#15171a"><text x="35" y="48">Поездка — не только дни на склоне</text><text x="35" y="84" fill="#5c626b">Условный пример семидневного маршрута</text><text x="35" y="170">Дни</text></g><path d="M95 190H565" stroke="#15171a" stroke-width="2"/><g font-family="monospace" font-size="23" fill="#15171a" text-anchor="middle"><text x="115" y="168">1</text><text x="185" y="168">2</text><text x="255" y="168">3</text><text x="325" y="168">4</text><text x="395" y="168">5</text><text x="465" y="168">6</text><text x="535" y="168">7</text></g><g stroke="#d9dbde" stroke-width="1"><path d="M115 180V460M185 180V460M255 180V460M325 180V460M395 180V460M465 180V460M535 180V460"/></g><path d="M115 260H535" stroke="#1d40ae" stroke-width="15"/><path d="M185 390H465" stroke="#15171a" stroke-width="15"/><g font-family="sans-serif" font-size="22" fill="#15171a"><text x="35" y="225">Медицинская защита на поездку</text><text x="35" y="350">Пять запланированных дней катания</text><text x="73" y="505">Дорога</text><text x="493" y="505">Дорога</text><text x="35" y="565">Как включается спортивная опция,</text><text x="35" y="596">уточните в выбранном договоре.</text></g></svg>
