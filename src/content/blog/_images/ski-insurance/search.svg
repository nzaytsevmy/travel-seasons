<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" role="img" aria-labelledby="t d"><title id="t">Поиск и медицинская эвакуация — разные задачи</title><desc id="d">На условном рельефе показаны область поиска человека, найденная точка и путь до клиники. Оплата каждого этапа проверяется отдельно.</desc><rect width="640" height="690" fill="#fbfbfa"/><g fill="none" stroke="#d9dbde" stroke-width="2"><path d="M35 160Q280 35 600 180M30 240Q275 110 610 260M25 330Q290 180 615 340M25 420Q285 270 610 435M25 505Q285 360 610 515"/></g><circle cx="220" cy="235" r="115" fill="#eef0f2" stroke="#15171a" stroke-width="2" stroke-dasharray="9 8"/><g stroke="#5c626b" fill="none" stroke-width="2"><path d="M125 190L280 190L145 220L300 220L145 255L285 255L170 290"/></g><circle cx="238" cy="240" r="7" fill="#1d40ae"/><path d="M238 240Q390 320 310 390T445 545" fill="none" stroke="#1d40ae" stroke-width="5"/><path d="M405 555V615H490V555L447 525Z" fill="#fbfbfa" stroke="#15171a" stroke-width="3"/><path d="M447 563V594M431 579H463" stroke="#1d40ae" stroke-width="4"/><g font-family="sans-serif" font-size="22" fill="#15171a"><text x="32" y="47">Найти человека и доставить к врачу</text><text x="32" y="82">не означает оплатить один и тот же риск</text><text x="60" y="390">Область поиска</text><text x="345" y="275">Человек найден</text><text x="350" y="430">Перевозка</text><text x="345" y="460">по медпоказаниям</text><text x="405" y="647">Клиника</text></g></svg>
