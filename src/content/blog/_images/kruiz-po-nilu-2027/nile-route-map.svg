<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1010" width="640" height="1010" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Круиз по Нилу: Луксор — Асуан и дорога из Хургады</title>
<desc id="d">Схема по координатам. Нил течёт с юга на север: Асуан, Ком-Омбо, Эдфу, Эсна со шлюзом, Луксор, дальше излучина у Кены. По дороге от Луксора до Асуана 213 км. Хургада на берегу Красного моря, от неё до Луксора 295 км по дороге через Сафагу и Кену, около четырёх часов.</desc>
<rect width="640" height="1010" fill="#fbfbfa"/>
<text x="16" y="40" font-size="23" font-weight="700" fill="#15171a">Классический круиз по Нилу</text>
<text x="16" y="68" font-size="17" fill="#5c626b">Точки стоят по координатам. Синяя линия — Нил,</text>
<text x="16" y="90" font-size="17" fill="#5c626b">пунктир — дорога. Нил течёт с юга на север.</text>
<rect x="16" y="112" width="608" height="880" fill="#fbfbfa" stroke="#d9dbde"/>
<path d="M391,112 L403,182 L429,303 L500,446 L560,560 L624,660 L624,112 Z" fill="#eef0f2"/>
<path d="M391,112 L403,182 L429,303 L500,446 L560,560 L624,660" fill="none" stroke="#8a9099" stroke-width="1.2"/>
<text x="500" y="420" font-size="19" fill="#2b6f8a" font-style="italic">Красное</text>
<text x="514" y="444" font-size="19" fill="#2b6f8a" font-style="italic">море</text>
<path d="M214,980 C216,950 214,925 214,905 C216,870 222,850 220,822 C218,790 210,740 208,702 C200,670 150,650 142,630 C140,600 152,565 160,541 C166,505 180,470 177,433 C160,420 110,440 78,458 C60,440 36,418 16,400" fill="none" stroke="#2b6f8a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M403,182 L429,303 L177,433 L160,541" fill="none" stroke="#5c626b" stroke-width="2.4" stroke-dasharray="7 6" stroke-linejoin="round"/>
<circle cx="403" cy="182" r="8" fill="#1d40ae"/>
<text x="300" y="176" font-size="21" font-weight="700" fill="#15171a">Хургада</text>
<text x="436" y="238" font-size="17" fill="#5c626b">прямые рейсы</text>
<text x="436" y="260" font-size="17" fill="#5c626b">из Москвы</text>
<text x="150" y="316" font-size="17" fill="#15171a">до Луксора 295 км,</text>
<text x="150" y="338" font-size="17" fill="#15171a">около 4 ч по дороге</text>
<circle cx="177" cy="433" r="4.5" fill="#8a9099"/>
<text x="126" y="424" font-size="16" fill="#8a9099">Кена</text>
<circle cx="160" cy="541" r="9" fill="#1d40ae"/>
<text x="182" y="536" font-size="21" font-weight="700" fill="#15171a">Луксор</text>
<text x="182" y="560" font-size="17" fill="#5c626b">Карнак, Долина царей; здесь</text>
<text x="182" y="582" font-size="17" fill="#5c626b">теплоход стоит у причала сутки</text>
<circle cx="142" cy="630" r="7" fill="#15171a"/>
<text x="162" y="628" font-size="20" font-weight="700" fill="#15171a">Эсна</text>
<text x="162" y="650" font-size="17" fill="#5c626b">шлюз, очередь теплоходов</text>
<circle cx="208" cy="702" r="7" fill="#15171a"/>
<text x="228" y="700" font-size="20" font-weight="700" fill="#15171a">Эдфу</text>
<text x="228" y="722" font-size="17" fill="#5c626b">храм Гора</text>
<circle cx="220" cy="822" r="7" fill="#15171a"/>
<text x="240" y="820" font-size="20" font-weight="700" fill="#15171a">Ком-Омбо</text>
<text x="240" y="842" font-size="17" fill="#5c626b">храм Собека и Гора</text>
<circle cx="214" cy="905" r="9" fill="#1d40ae"/>
<text x="236" y="902" font-size="21" font-weight="700" fill="#15171a">Асуан</text>
<text x="236" y="926" font-size="17" fill="#5c626b">Филе; до Абу-Симбела 283 км</text>
<text x="236" y="948" font-size="17" fill="#5c626b">на юг по дороге</text>
<text x="236" y="976" font-size="17" fill="#2b6f8a">Луксор — Асуан: 213 км по дороге</text>
</svg>
