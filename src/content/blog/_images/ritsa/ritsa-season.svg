<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="system-ui,-apple-system,sans-serif">
<title>Когда ехать на озеро Рица по месяцам</title>
<desc>С мая по октябрь дорога открыта: май-июнь и сентябрь-октябрь — самые спокойные, июль-август людно, зимой дорогу выше озера переметает снегом.</desc>
<rect width="640" height="380" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">КОГДА ЕХАТЬ НА РИЦУ</text>
<rect x="27" y="90" width="92" height="58" rx="4" fill="#4a7fb5" opacity="0.94"/>
<text x="73" y="126" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">ЯНВ</text>
<rect x="125" y="90" width="92" height="58" rx="4" fill="#4a7fb5" opacity="0.94"/>
<text x="171" y="126" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">ФЕВ</text>
<rect x="223" y="90" width="92" height="58" rx="4" fill="#4a7fb5" opacity="0.94"/>
<text x="269" y="126" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">МАР</text>
<rect x="321" y="90" width="92" height="58" rx="4" fill="#e8c062" opacity="0.94"/>
<text x="367" y="126" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">АПР</text>
<rect x="419" y="90" width="92" height="58" rx="4" fill="#5cc97a" opacity="0.94"/>
<text x="465" y="126" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">МАЙ</text>
<rect x="517" y="90" width="92" height="58" rx="4" fill="#5cc97a" opacity="0.94"/>
<text x="563" y="126" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">ИЮН</text>
<rect x="27" y="162" width="92" height="58" rx="4" fill="#e8c062" opacity="0.94"/>
<text x="73" y="198" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">ИЮЛ</text>
<rect x="125" y="162" width="92" height="58" rx="4" fill="#e8c062" opacity="0.94"/>
<text x="171" y="198" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">АВГ</text>
<rect x="223" y="162" width="92" height="58" rx="4" fill="#5cc97a" opacity="0.94"/>
<text x="269" y="198" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">СЕН</text>
<rect x="321" y="162" width="92" height="58" rx="4" fill="#5cc97a" opacity="0.94"/>
<text x="367" y="198" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">ОКТ</text>
<rect x="419" y="162" width="92" height="58" rx="4" fill="#e8c062" opacity="0.94"/>
<text x="465" y="198" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">НОЯ</text>
<rect x="517" y="162" width="92" height="58" rx="4" fill="#4a7fb5" opacity="0.94"/>
<text x="563" y="198" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">ДЕК</text>
<rect x="24" y="236" width="16" height="16" rx="3" fill="#5cc97a"/>
<text x="50" y="250" fill="#a8a090" font-size="17">лучшее время: ясно и без толп</text>
<rect x="24" y="266" width="16" height="16" rx="3" fill="#e8c062"/>
<text x="50" y="280" fill="#a8a090" font-size="17">ехать можно, но людно или сыро</text>
<rect x="24" y="296" width="16" height="16" rx="3" fill="#4a7fb5"/>
<text x="50" y="310" fill="#a8a090" font-size="17">дорогу выше озера переметает</text>
<text x="320" y="366" text-anchor="middle" fill="#6b6455" font-size="15">На высоте 950 метров прохладно даже в жару: вечером бывает +10</text>
</svg>