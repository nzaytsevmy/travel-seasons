<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 628" width="640" height="628" font-family="system-ui,-apple-system,sans-serif">
<title>План дня на озере Рица от Гагры и обратно</title>
<desc>Выезд в восемь-девять утра, Голубое озеро, Юпшарский каньон, четыре часа у самого озера, затем Малая Рица или водопады и возвращение к шести вечера.</desc>
<rect width="640" height="628" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ПЛАН ДНЯ: ГАГРА И ОБРАТНО</text>
<circle cx="46" cy="116" r="9" fill="#5cc97a"/>
<line x1="46" y1="127" x2="46" y2="162" stroke="#3a3429" stroke-width="2"/>
<text x="74" y="108" fill="#5cc97a" font-size="17" font-weight="700">8:00–9:00</text>
<text x="74" y="132" fill="#e8e0d0" font-size="20" font-weight="600">Выезд из Гагры</text>
<text x="74" y="154" fill="#a8a090" font-size="16">серпантин ещё пустой</text>
<circle cx="46" cy="192" r="9" fill="#7fb5c9"/>
<line x1="46" y1="203" x2="46" y2="238" stroke="#3a3429" stroke-width="2"/>
<text x="74" y="184" fill="#7fb5c9" font-size="17" font-weight="700">~9:30</text>
<text x="74" y="208" fill="#e8e0d0" font-size="20" font-weight="600">Голубое озеро</text>
<text x="74" y="230" fill="#a8a090" font-size="16">остановка 10–15 минут</text>
<circle cx="46" cy="268" r="9" fill="#7fb5c9"/>
<line x1="46" y1="279" x2="46" y2="314" stroke="#3a3429" stroke-width="2"/>
<text x="74" y="260" fill="#7fb5c9" font-size="17" font-weight="700">~10:00</text>
<text x="74" y="284" fill="#e8e0d0" font-size="20" font-weight="600">Юпшарский каньон</text>
<text x="74" y="306" fill="#a8a090" font-size="16">стены сходятся, небо полоской</text>
<circle cx="46" cy="344" r="9" fill="#c9973a"/>
<line x1="46" y1="355" x2="46" y2="390" stroke="#3a3429" stroke-width="2"/>
<text x="74" y="336" fill="#c9973a" font-size="17" font-weight="700">10:30–14:00</text>
<text x="74" y="360" fill="#e8e0d0" font-size="20" font-weight="600">Озеро Рица</text>
<text x="74" y="382" fill="#a8a090" font-size="16">берег, обед, дача Сталина</text>
<circle cx="46" cy="420" r="9" fill="#e8c062"/>
<line x1="46" y1="431" x2="46" y2="466" stroke="#3a3429" stroke-width="2"/>
<text x="74" y="412" fill="#e8c062" font-size="17" font-weight="700">14:00–16:00</text>
<text x="74" y="436" fill="#e8e0d0" font-size="20" font-weight="600">Малая Рица или водопады</text>
<text x="74" y="458" fill="#a8a090" font-size="16">подъём пешком, Гегский — на джипе</text>
<circle cx="46" cy="496" r="9" fill="#5cc97a"/>
<text x="74" y="488" fill="#5cc97a" font-size="17" font-weight="700">к 18:00</text>
<text x="74" y="512" fill="#e8e0d0" font-size="20" font-weight="600">Возвращение</text>
<text x="74" y="534" fill="#a8a090" font-size="16">до темноты на серпантине</text>
<text x="320" y="572" text-anchor="middle" fill="#6b6455" font-size="16">Только дорога занимает 2,5–3 часа в обе стороны</text>
<text x="320" y="594" text-anchor="middle" fill="#6b6455" font-size="16">Рицу и Новый Афон в один день не совмещают</text>
</svg>