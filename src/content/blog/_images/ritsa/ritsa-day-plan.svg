<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 628" width="640" height="628" font-family="system-ui,-apple-system,sans-serif">
<title>План дня на озере Рица от Гагры и обратно</title>
<desc>Выезд в семь-восемь утра, короткая остановка у Голубого озера до автобусов, три часа у самого озера до полудня или тропа к Малой Рице, обед, обратная дорога с остановками в Юпшарском каньоне и у Голубого озера при дневном свете, возвращение к шести вечера.</desc>
<rect width="640" height="628" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">ПЛАН ДНЯ: ГАГРА И ОБРАТНО</text>
<circle cx="46" cy="116" r="9" fill="#1a7f4b"/>
<line x1="46" y1="127" x2="46" y2="162" stroke="#d9dbde" stroke-width="2"/>
<text x="74" y="108" fill="#1a7f4b" font-size="17" font-weight="700">7:00–8:00</text>
<text x="74" y="132" fill="#15171a" font-size="20" font-weight="600">Выезд из Гагры</text>
<text x="74" y="154" fill="#5c626b" font-size="16">серпантин ещё пустой</text>
<circle cx="46" cy="192" r="9" fill="#2b6f8a"/>
<line x1="46" y1="203" x2="46" y2="238" stroke="#d9dbde" stroke-width="2"/>
<text x="74" y="184" fill="#2b6f8a" font-size="17" font-weight="700">~8:30</text>
<text x="74" y="208" fill="#15171a" font-size="20" font-weight="600">Голубое озеро</text>
<text x="74" y="230" fill="#5c626b" font-size="16">10 минут, до автобусов</text>
<circle cx="46" cy="268" r="9" fill="#1d40ae"/>
<line x1="46" y1="279" x2="46" y2="314" stroke="#d9dbde" stroke-width="2"/>
<text x="74" y="260" fill="#1d40ae" font-size="17" font-weight="700">9:00–12:00</text>
<text x="74" y="284" fill="#15171a" font-size="20" font-weight="600">Озеро Рица</text>
<text x="74" y="306" fill="#5c626b" font-size="16">берег и катамаран; тропа к Малой Рице 3–5 ч — обед позже</text>
<circle cx="46" cy="344" r="9" fill="#8a6a10"/>
<line x1="46" y1="355" x2="46" y2="390" stroke="#d9dbde" stroke-width="2"/>
<text x="74" y="336" fill="#8a6a10" font-size="17" font-weight="700">12:00–13:00</text>
<text x="74" y="360" fill="#15171a" font-size="20" font-weight="600">Обед</text>
<text x="74" y="382" fill="#5c626b" font-size="16">кафе на берегу или свои бутерброды</text>
<circle cx="46" cy="420" r="9" fill="#2b6f8a"/>
<line x1="46" y1="431" x2="46" y2="466" stroke="#d9dbde" stroke-width="2"/>
<text x="74" y="412" fill="#2b6f8a" font-size="17" font-weight="700">13:00–16:00</text>
<text x="74" y="436" fill="#15171a" font-size="20" font-weight="600">Обратно с остановками</text>
<text x="74" y="458" fill="#5c626b" font-size="16">Юпшарский каньон и Голубое озеро при свете</text>
<circle cx="46" cy="496" r="9" fill="#1a7f4b"/>
<text x="74" y="488" fill="#1a7f4b" font-size="17" font-weight="700">к 18:00</text>
<text x="74" y="512" fill="#15171a" font-size="20" font-weight="600">Возвращение в Гагру</text>
<text x="74" y="534" fill="#5c626b" font-size="16">до темноты на серпантине</text>
<text x="320" y="572" text-anchor="middle" fill="#8a9099" font-size="16">Только дорога занимает 2,5–3 часа в обе стороны</text>
<text x="320" y="594" text-anchor="middle" fill="#8a9099" font-size="16">Гегский водопад — отдельный выезд на джипе</text>
</svg>
