<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 644" width="640" height="644" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько стоит день на озере Рица в 2026 году</title>
<desc>Экологический сбор тысяча рублей с взрослого, экскурсия из Гагры от девятисот рублей с человека, такси шесть тысяч за машину, своя машина — сбор плюс бензин. Всё оплачивается наличными рублями.</desc>
<rect width="640" height="644" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">СКОЛЬКО СТОИТ ДЕНЬ НА РИЦЕ</text>
<rect x="24" y="86" width="592" height="96" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="86" width="6" height="96" fill="#1d40ae"/>
<text x="52" y="120" fill="#15171a" font-size="20" font-weight="600">Сбор в нацпарк</text>
<text x="52" y="152" fill="#1d40ae" font-size="26" font-weight="700">1000 ₽</text>
<text x="52" y="174" fill="#5c626b" font-size="16">с взрослого, дети 8–12 — 500 ₽</text>
<rect x="24" y="198" width="592" height="96" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="198" width="6" height="96" fill="#1a7f4b"/>
<text x="52" y="232" fill="#15171a" font-size="20" font-weight="600">Экскурсия из Гагры</text>
<text x="52" y="264" fill="#1a7f4b" font-size="26" font-weight="700">от 900 ₽</text>
<text x="52" y="286" fill="#5c626b" font-size="16">с человека, сбор обычно внутри</text>
<rect x="24" y="310" width="592" height="96" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="310" width="6" height="96" fill="#8a6a10"/>
<text x="52" y="344" fill="#15171a" font-size="20" font-weight="600">Такси туда-обратно</text>
<text x="52" y="376" fill="#8a6a10" font-size="26" font-weight="700">6000–6500 ₽</text>
<text x="52" y="398" fill="#5c626b" font-size="16">за машину, сбор отдельно</text>
<rect x="24" y="422" width="592" height="96" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="422" width="6" height="96" fill="#2b6f8a"/>
<text x="52" y="456" fill="#15171a" font-size="20" font-weight="600">Своя машина</text>
<text x="52" y="488" fill="#2b6f8a" font-size="26" font-weight="700">1000 ₽ + бензин</text>
<text x="52" y="510" fill="#5c626b" font-size="16">серпантин не для новичков</text>
<text x="320" y="564" text-anchor="middle" fill="#b3261e" font-size="19" font-weight="700">Всё только наличными рублями</text>
<text x="320" y="590" text-anchor="middle" fill="#5c626b" font-size="16">Карты в горах не работают: сбор, кафе,</text>
<text x="320" y="612" text-anchor="middle" fill="#5c626b" font-size="16">парковка, дача Сталина — наличные</text>
</svg>