<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 644" width="640" height="644" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько стоит день на озере Рица в 2026 году</title>
<desc>Экологический сбор тысяча рублей с взрослого, экскурсия из Гагры от девятисот рублей с человека, такси шесть тысяч за машину, своя машина — сбор плюс бензин. Всё оплачивается наличными рублями.</desc>
<rect width="640" height="644" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">СКОЛЬКО СТОИТ ДЕНЬ НА РИЦЕ</text>
<rect x="24" y="86" width="592" height="96" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="86" width="6" height="96" fill="#c9973a"/>
<text x="52" y="120" fill="#e8e0d0" font-size="20" font-weight="600">Сбор в нацпарк</text>
<text x="52" y="152" fill="#c9973a" font-size="26" font-weight="700">1000 ₽</text>
<text x="52" y="174" fill="#a8a090" font-size="16">с взрослого, дети 8–12 — 500 ₽</text>
<rect x="24" y="198" width="592" height="96" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="198" width="6" height="96" fill="#5cc97a"/>
<text x="52" y="232" fill="#e8e0d0" font-size="20" font-weight="600">Экскурсия из Гагры</text>
<text x="52" y="264" fill="#5cc97a" font-size="26" font-weight="700">от 900 ₽</text>
<text x="52" y="286" fill="#a8a090" font-size="16">с человека, сбор обычно внутри</text>
<rect x="24" y="310" width="592" height="96" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="310" width="6" height="96" fill="#e8c062"/>
<text x="52" y="344" fill="#e8e0d0" font-size="20" font-weight="600">Такси туда-обратно</text>
<text x="52" y="376" fill="#e8c062" font-size="26" font-weight="700">6000–6500 ₽</text>
<text x="52" y="398" fill="#a8a090" font-size="16">за машину, сбор отдельно</text>
<rect x="24" y="422" width="592" height="96" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="422" width="6" height="96" fill="#7fb5c9"/>
<text x="52" y="456" fill="#e8e0d0" font-size="20" font-weight="600">Своя машина</text>
<text x="52" y="488" fill="#7fb5c9" font-size="26" font-weight="700">1000 ₽ + бензин</text>
<text x="52" y="510" fill="#a8a090" font-size="16">серпантин не для новичков</text>
<text x="320" y="564" text-anchor="middle" fill="#d44545" font-size="19" font-weight="700">Всё только наличными рублями</text>
<text x="320" y="590" text-anchor="middle" fill="#a8a090" font-size="16">Карты в горах не работают: сбор, кафе,</text>
<text x="320" y="612" text-anchor="middle" fill="#a8a090" font-size="16">парковка, дача Сталина — наличные</text>
</svg>