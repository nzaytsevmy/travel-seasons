<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1040" width="640" height="1040" role="img" aria-labelledby="t d">
  <title id="t">Дорога на Рицу: остановки по порядку от трассы до Ауадхары</title>
  <desc id="d">Вертикальная схема дороги Бзыбь — Рица — Ауадхара: поворот с трассы, КПП нацпарка, Голубое озеро, съезд к Гегскому водопаду, Юпшарский каньон, озеро Рица на 40-м километре, дача Сталина и Молочный водопад, тропа к Малой Рице, временный мост на 54-м километре, Ауадхара.</desc>
  <rect width="640" height="1040" fill="#131009"/>
  <text x="40" y="58" fill="#e8e0d0" font-family="Golos Text, Arial, sans-serif" font-size="26" font-weight="700">Дорога на Рицу: что и в каком порядке</text>
  <text x="40" y="88" fill="#a8a090" font-family="Golos Text, Arial, sans-serif" font-size="18">Одна дорога вдоль реки Бзыбь, съездов почти нет</text>

  <!-- ось дороги -->
  <line x1="120" y1="130" x2="120" y2="980" stroke="#3a3429" stroke-width="6"/>
  <line x1="120" y1="130" x2="120" y2="760" stroke="#c9973a" stroke-width="6"/>
  <!-- съезд к Гегскому -->
  <line x1="120" y1="380" x2="52" y2="380" stroke="#3a3429" stroke-width="4" stroke-dasharray="8 8"/>
  <!-- тропа к Малой Рице -->
  <line x1="120" y1="790" x2="52" y2="790" stroke="#3a3429" stroke-width="4" stroke-dasharray="4 8"/>

  <!-- остановки -->
  <g font-family="Golos Text, Arial, sans-serif">
    <circle cx="120" cy="150" r="11" fill="#131009" stroke="#c9973a" stroke-width="4"/>
    <text x="160" y="146" fill="#e8e0d0" font-size="22" font-weight="700">Поворот с трассы</text>
    <text x="160" y="172" fill="#a8a090" font-size="18">сразу за мостом через Бзыбь · 0 км</text>

    <circle cx="120" cy="240" r="11" fill="#131009" stroke="#c9973a" stroke-width="4"/>
    <text x="160" y="236" fill="#e8e0d0" font-size="22" font-weight="700">КПП нацпарка</text>
    <text x="160" y="262" fill="#a8a090" font-size="18">сбор 1000 ₽ взрослый, 500 ₽ дети 8–12</text>

    <circle cx="120" cy="330" r="11" fill="#131009" stroke="#c9973a" stroke-width="4"/>
    <text x="160" y="326" fill="#e8e0d0" font-size="22" font-weight="700">Голубое озеро</text>
    <text x="160" y="352" fill="#a8a090" font-size="18">у самой дороги, стоянка 10–15 минут</text>

    <circle cx="52" cy="380" r="8" fill="#131009" stroke="#a8a090" stroke-width="3"/>
    <text x="160" y="396" fill="#e8e0d0" font-size="22" font-weight="700">Съезд к Гегскому водопаду</text>
    <text x="160" y="422" fill="#a8a090" font-size="18">грунтовка в сторону, только внедорожник</text>

    <circle cx="120" cy="500" r="11" fill="#131009" stroke="#c9973a" stroke-width="4"/>
    <text x="160" y="496" fill="#e8e0d0" font-size="22" font-weight="700">Юпшарский каньон</text>
    <text x="160" y="522" fill="#a8a090" font-size="18">«Каменный мешок» и Юпшарские ворота</text>

    <circle cx="120" cy="610" r="16" fill="#c9973a" stroke="#e8e0d0" stroke-width="4"/>
    <text x="160" y="604" fill="#e8e0d0" font-size="23" font-weight="700">Озеро Рица · около 40 км от трассы</text>
    <text x="160" y="630" fill="#a8a090" font-size="18">высота 950 м, кафе, катамараны, парковка платная</text>

    <circle cx="120" cy="700" r="11" fill="#131009" stroke="#c9973a" stroke-width="4"/>
    <text x="160" y="696" fill="#e8e0d0" font-size="22" font-weight="700">Дача Сталина и Молочный водопад</text>
    <text x="160" y="722" fill="#a8a090" font-size="18">дорога вдоль озера, лучшие виды отсюда</text>

    <circle cx="52" cy="790" r="8" fill="#131009" stroke="#a8a090" stroke-width="3"/>
    <text x="160" y="786" fill="#e8e0d0" font-size="22" font-weight="700">Тропа к Малой Рице — пешком</text>
    <text x="160" y="812" fill="#a8a090" font-size="18">2,7 км в одну сторону, +300 м, ~1,5 ч наверх</text>

    <circle cx="120" cy="880" r="11" fill="#131009" stroke="#a8a090" stroke-width="4"/>
    <text x="160" y="876" fill="#e8e0d0" font-size="22" font-weight="700">Мост на 54-м км</text>
    <text x="160" y="902" fill="#a8a090" font-size="18">с 24.06.2026 — временный обходной мост</text>

    <circle cx="120" cy="960" r="11" fill="#131009" stroke="#a8a090" stroke-width="4"/>
    <text x="160" y="956" fill="#e8e0d0" font-size="22" font-weight="700">Ауадхара</text>
    <text x="160" y="982" fill="#a8a090" font-size="18">пансионат, минеральные источники, конец дороги</text>
  </g>

  <text x="40" y="1020" fill="#a8a090" font-family="Golos Text, Arial, sans-serif" font-size="16">По данным парка и путеводителей, сентябрь 2026</text>
</svg>
