<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="system-ui,-apple-system,sans-serif">
<title>Отключения света на Кубе в вечерний пик, 2026 год</title>
<desc>Прогноз энергосистемы Кубы на вечерний пик: в феврале 2026 года отключали 1763–1943 мегаватта, в апреле 1165–1455, в июне 1975–1990, а 1 сентября 2310 мегаватт. Для сравнения показан вечерний спрос страны — около 3050 мегаватт по сводке 5 июня.</desc>
<rect width="640" height="430" fill="#fbfbfa"/>
<text x="26" y="40" fill="#1d40ae" font-size="22" font-weight="700">СКОЛЬКО ОТКЛЮЧАЮТ ВЕЧЕРОМ</text>
<text x="26" y="64" fill="#5c626b" font-size="15.5">прогноз энергосистемы Кубы на пик потребления, мегаватты</text>

<line x1="150" y1="86" x2="150" y2="330" stroke="#d9dbde" stroke-width="1"/>
<line x1="593" y1="86" x2="593" y2="330" stroke="#8a9099" stroke-width="1" stroke-dasharray="4 4"/>
<text x="587" y="80" text-anchor="end" fill="#8a9099" font-size="14">вечерний спрос страны ≈ 3050</text>

<text x="26" y="112" fill="#15171a" font-size="18" font-weight="600">Февраль</text>
<rect x="150" y="96" width="282" height="28" fill="#1d40ae"/>
<text x="442" y="115" fill="#5c626b" font-size="15.5">1763 – 1943</text>

<text x="26" y="177" fill="#15171a" font-size="18" font-weight="600">Апрель</text>
<rect x="150" y="161" width="211" height="28" fill="#1d40ae"/>
<text x="371" y="180" fill="#5c626b" font-size="15.5">1165 – 1455</text>

<text x="26" y="242" fill="#15171a" font-size="18" font-weight="600">Июнь</text>
<rect x="150" y="226" width="289" height="28" fill="#1d40ae"/>
<text x="449" y="245" fill="#5c626b" font-size="15.5">1975 – 1990</text>

<text x="26" y="307" fill="#15171a" font-size="18" font-weight="600">1 сентября</text>
<rect x="150" y="291" width="335" height="28" fill="#b3261e"/>
<text x="495" y="310" fill="#b3261e" font-size="15.5" font-weight="600">2310</text>

<text x="26" y="360" fill="#5c626b" font-size="15">Длина полосы — наибольшее значение месяца.</text>
<text x="26" y="382" fill="#5c626b" font-size="15">Февраль, апрель и июнь — по нескольким суточным сводкам,</text>
<text x="26" y="404" fill="#5c626b" font-size="15">сентябрь — по одной. Сплошного ряда за год у нас нет.</text>
</svg>
