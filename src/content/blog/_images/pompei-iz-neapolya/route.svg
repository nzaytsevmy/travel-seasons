<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" role="img" aria-labelledby="title desc">
  <title id="title">Два продолжения прогулки от форума в Помпеях</title>
  <desc id="desc">От Porta Marina к форуму. Левая ветка через Porta Ercolano ведёт к Вилле Мистерий. Правая ветка по улице Изобилия ведёт к амфитеатру и выходу Piazza Anfiteatro. Схема без масштаба.</desc>
  <rect width="720" height="690" fill="#fbfbfa"/>
  <g font-family="Golos Text, Arial, sans-serif" font-size="29" fill="#15171a" text-anchor="middle">
    <text x="360" y="59" font-size="34" font-weight="700" fill="#1d40ae">Две прогулки от форума</text>
    <g fill="none" stroke="#1d40ae" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M360 153v42"/>
      <path d="M360 255v46H175v41m185-41h185v41"/>
      <path d="M175 408v49m370-49v49m0 66v49"/>
    </g>
    <g fill="#1d40ae">
      <path d="M351 183l9 12 9-12zm-185 147l9 12 9-12zm370 0l9 12 9-12zm-370 115l9 12 9-12zm370 0l9 12 9-12zm0 115l9 12 9-12z"/>
    </g>
    <g fill="#fff" stroke="#1d40ae" stroke-width="2">
      <rect x="222" y="93" width="276" height="60"/>
      <rect x="253" y="195" width="214" height="60"/>
      <rect x="34" y="342" width="282" height="66"/>
      <rect x="404" y="342" width="282" height="66"/>
      <rect x="34" y="457" width="282" height="66"/>
      <rect x="404" y="457" width="282" height="66"/>
      <rect x="404" y="572" width="282" height="66"/>
    </g>
    <text x="360" y="132">Porta Marina</text>
    <text x="360" y="235">Форум</text>
    <text x="175" y="385">Porta Ercolano</text>
    <text x="545" y="385">Улица Изобилия</text>
    <text x="175" y="499">Вилла Мистерий</text>
    <text x="545" y="499">Амфитеатр</text>
    <text x="545" y="614">Piazza Anfiteatro</text>
    <text x="175" y="616" font-size="24" fill="#5c626b">Схема без масштаба</text>
  </g>
</svg>
