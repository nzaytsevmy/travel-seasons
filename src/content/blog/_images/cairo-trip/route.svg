<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720">
<title>Каир из Хургады: дорога и разные точки прибытия</title>
<desc>Географическая схема без масштаба. Хургада юго-восточнее Каира. В увеличенной схеме Каира Большой Египетский музей расположен западнее центра, Тахрир у Нила, аэропорт CAI на северо-востоке. Автобус до Тахрира и самолёт до CAI не доставляют к входу GEM.</desc>
<rect width="640" height="720" fill="#fbfbfa"/>
<g font-family="Golos Text,Arial,sans-serif" fill="#15171a">
<text x="26" y="44" font-family="Old Standard TT,Georgia,serif" font-size="33">Билет — ещё не весь маршрут</text>
<path d="M578 136V83l-9 15m9-15 9 15" stroke="#1d40ae" stroke-width="2" fill="none"/><text x="569" y="162" font-size="21">С</text>
<path d="M145 126Q140 180 162 215L157 300" fill="none" stroke="#abbadc" stroke-width="12"/>
<path d="M368 232 401 279 431 300 448 350" fill="none" stroke="#abbadc" stroke-width="20"/>
<path d="M180 165Q307 184 427 322" fill="none" stroke="#1d40ae" stroke-width="3"/>
<path d="M183 177 410 323" fill="none" stroke="#1d40ae" stroke-width="2" stroke-dasharray="6 7"/>
<circle cx="178" cy="165" r="7" fill="#1d40ae"/><circle cx="427" cy="322" r="7" fill="#1d40ae"/>
<g font-size="25"><text x="191" y="154">Каир</text><text x="444" y="325">Хургада</text></g>
<g font-size="20" fill="#52565c"><text x="217" y="202">автобус / автомобиль</text><text x="202" y="278">самолёт до CAI</text><text x="432" y="379">Красное море</text></g>
<path d="M26 411H614" stroke="#d9dbde"/>
<text x="26" y="450" font-family="Old Standard TT,Georgia,serif" font-size="29">Внутри Каира — ещё один переезд</text>
<path d="M340 480Q330 550 344 641" stroke="#abbadc" stroke-width="13" fill="none"/>
<path d="M130 570 340 570 523 520" stroke="#1d40ae" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
<g fill="#1d40ae"><circle cx="130" cy="570" r="7"/><circle cx="340" cy="570" r="7"/><circle cx="523" cy="520" r="7"/></g>
<g text-anchor="middle" font-size="24"><text x="130" y="608">GEM / Гиза</text><text x="340" y="608">Тахрир</text><text x="523" y="558">CAI</text></g>
<g text-anchor="middle" font-size="19" fill="#52565c"><text x="130" y="637">запад города</text><text x="340" y="637">центр у Нила</text><text x="523" y="587">аэропорт</text></g>
<text x="26" y="693" font-size="19" fill="#52565c">Схема без масштаба. Между точками нужен городской транспорт.</text>
</g></svg>
