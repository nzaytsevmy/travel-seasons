<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" width="640" height="474" font-family="system-ui,-apple-system,sans-serif">
<title>Цены в Гагре в 2026 году</title>
<desc>Шезлонг 200-300 рублей, ужин на двоих около трёх тысяч, аквапарк 1800, экскурсия на Рицу от 1300 плюс сбор.</desc>
<rect width="640" height="474" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">ЦЕНЫ В ГАГРЕ</text>
<text x="24" y="102" fill="#15171a" font-size="17.5">Шезлонг с зонтом</text>
<text x="616" y="102" text-anchor="end" fill="#1d40ae" font-size="17.5" font-weight="700">200–300 ₽</text>
<text x="24" y="119" fill="#8a9099" font-size="14">за день</text>
<text x="24" y="154" fill="#15171a" font-size="17.5">Ужин на двоих в «Гагрипше»</text>
<text x="616" y="154" text-anchor="end" fill="#1d40ae" font-size="17.5" font-weight="700">≈3000 ₽</text>
<text x="24" y="206" fill="#15171a" font-size="17.5">Аквапарк</text>
<text x="616" y="206" text-anchor="end" fill="#1d40ae" font-size="17.5" font-weight="700">1800 / 1300 ₽</text>
<text x="24" y="223" fill="#8a9099" font-size="14">взрослый / детский</text>
<text x="24" y="258" fill="#15171a" font-size="17.5">Дельфинарий</text>
<text x="616" y="258" text-anchor="end" fill="#1d40ae" font-size="17.5" font-weight="700">от 1200 ₽</text>
<text x="24" y="310" fill="#15171a" font-size="17.5">Экскурсия на Рицу</text>
<text x="616" y="310" text-anchor="end" fill="#1d40ae" font-size="17.5" font-weight="700">от 1300 ₽</text>
<text x="24" y="327" fill="#8a9099" font-size="14">плюс сбор в нацпарк</text>
<text x="24" y="362" fill="#15171a" font-size="17.5">Новоафонская пещера</text>
<text x="616" y="362" text-anchor="end" fill="#1d40ae" font-size="17.5" font-weight="700">700 ₽</text>
<text x="24" y="379" fill="#8a9099" font-size="14">вход</text>
<text x="320" y="450" text-anchor="middle" fill="#b3261e" font-size="17" font-weight="700">Карты в Абхазии почти не принимают</text>
<text x="320" y="470" text-anchor="middle" fill="#5c626b" font-size="15">наличные рубли везите с запасом</text>
</svg>