<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="system-ui,-apple-system,sans-serif">
<title>Погода и вода в Гагре по месяцам</title>
<desc>В июне воздух плюс двадцать два и море прохладное, в августе теплее всего, сентябрь бархатный сезон.</desc>
<rect width="640" height="280" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ВОЗДУХ И ВОДА В ГАГРЕ</text>
<text x="24" y="86" fill="#a8a090" font-size="14">воздух / вода, °C</text>
<rect x="28" y="100" width="140" height="96" rx="5" fill="none" stroke="#3a3429"/>
<text x="98" y="126" text-anchor="middle" fill="#7fb5c9" font-size="16" font-weight="700">ИЮНЬ</text>
<text x="98" y="158" text-anchor="middle" fill="#e8e0d0" font-size="22" font-weight="700">+22</text>
<text x="98" y="184" text-anchor="middle" fill="#7fb5c9" font-size="18">~22</text>
<rect x="176" y="100" width="140" height="96" rx="5" fill="none" stroke="#3a3429"/>
<text x="246" y="126" text-anchor="middle" fill="#5cc97a" font-size="16" font-weight="700">ИЮЛЬ</text>
<text x="246" y="158" text-anchor="middle" fill="#e8e0d0" font-size="22" font-weight="700">+26</text>
<text x="246" y="184" text-anchor="middle" fill="#7fb5c9" font-size="18">~25</text>
<rect x="324" y="100" width="140" height="96" rx="5" fill="none" stroke="#3a3429"/>
<text x="394" y="126" text-anchor="middle" fill="#e8c062" font-size="16" font-weight="700">АВГУСТ</text>
<text x="394" y="158" text-anchor="middle" fill="#e8e0d0" font-size="22" font-weight="700">+27</text>
<text x="394" y="184" text-anchor="middle" fill="#7fb5c9" font-size="18">~28</text>
<rect x="472" y="100" width="140" height="96" rx="5" fill="none" stroke="#3a3429"/>
<text x="542" y="126" text-anchor="middle" fill="#5cc97a" font-size="16" font-weight="700">СЕНТЯБРЬ</text>
<text x="542" y="158" text-anchor="middle" fill="#e8e0d0" font-size="22" font-weight="700">+25</text>
<text x="542" y="184" text-anchor="middle" fill="#7fb5c9" font-size="18">~26</text>
<text x="320" y="232" text-anchor="middle" fill="#a8a090" font-size="16">Купаться комфортно с июня по октябрь</text>
<text x="320" y="256" text-anchor="middle" fill="#6b6455" font-size="15">В июне народу меньше, но море ещё прохладное</text>
</svg>