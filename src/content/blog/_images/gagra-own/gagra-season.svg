<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="system-ui,-apple-system,sans-serif">
<title>Погода и вода в Гагре по месяцам</title>
<desc>В июне воздух плюс двадцать два и море прохладное, в августе теплее всего, сентябрь бархатный сезон.</desc>
<rect width="640" height="280" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">ВОЗДУХ И ВОДА В ГАГРЕ</text>
<text x="24" y="86" fill="#5c626b" font-size="14">воздух / вода, °C</text>
<rect x="28" y="100" width="140" height="96" rx="5" fill="none" stroke="#d9dbde"/>
<text x="98" y="126" text-anchor="middle" fill="#2b6f8a" font-size="16" font-weight="700">ИЮНЬ</text>
<text x="98" y="158" text-anchor="middle" fill="#15171a" font-size="22" font-weight="700">+22</text>
<text x="98" y="184" text-anchor="middle" fill="#2b6f8a" font-size="18">~22</text>
<rect x="176" y="100" width="140" height="96" rx="5" fill="none" stroke="#d9dbde"/>
<text x="246" y="126" text-anchor="middle" fill="#1a7f4b" font-size="16" font-weight="700">ИЮЛЬ</text>
<text x="246" y="158" text-anchor="middle" fill="#15171a" font-size="22" font-weight="700">+26</text>
<text x="246" y="184" text-anchor="middle" fill="#2b6f8a" font-size="18">~25</text>
<rect x="324" y="100" width="140" height="96" rx="5" fill="none" stroke="#d9dbde"/>
<text x="394" y="126" text-anchor="middle" fill="#8a6a10" font-size="16" font-weight="700">АВГУСТ</text>
<text x="394" y="158" text-anchor="middle" fill="#15171a" font-size="22" font-weight="700">+27</text>
<text x="394" y="184" text-anchor="middle" fill="#2b6f8a" font-size="18">~28</text>
<rect x="472" y="100" width="140" height="96" rx="5" fill="none" stroke="#d9dbde"/>
<text x="542" y="126" text-anchor="middle" fill="#1a7f4b" font-size="16" font-weight="700">СЕНТЯБРЬ</text>
<text x="542" y="158" text-anchor="middle" fill="#15171a" font-size="22" font-weight="700">+25</text>
<text x="542" y="184" text-anchor="middle" fill="#2b6f8a" font-size="18">~26</text>
<text x="320" y="232" text-anchor="middle" fill="#5c626b" font-size="16">Купаться комфортно с июня по октябрь</text>
<text x="320" y="256" text-anchor="middle" fill="#8a9099" font-size="15">В июне народу меньше, но море ещё прохладное</text>
</svg>