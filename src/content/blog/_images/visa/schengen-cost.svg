<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 566" width="640" height="566" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько стоит шенгенская виза россиянам в 2026 году</title>
<desc>Под ключ без посредников выходит 140–175 евро с человека: консульский сбор девяносто, сервисный сбор визового центра, страховка и при необходимости перевод.</desc>
<rect width="640" height="566" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">СКОЛЬКО СТОИТ ШЕНГЕН</text>
<text x="320" y="84" text-anchor="middle" fill="#5cc97a" font-size="20" font-weight="700">140–175 € с человека</text>
<text x="320" y="108" text-anchor="middle" fill="#a8a090" font-size="16">под ключ без посредников, июль 2026</text>
<line x1="24" y1="128" x2="616" y2="128" stroke="#3a3429"/>
<text x="24" y="166" fill="#e8e0d0" font-size="18" font-weight="600">Консульский сбор</text>
<text x="616" y="166" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">90 €</text>
<text x="24" y="186" fill="#6b6455" font-size="14.5">фиксированный для всех стран</text>
<text x="24" y="222" fill="#e8e0d0" font-size="18" font-weight="600">Дети 6–12 лет</text>
<text x="616" y="222" text-anchor="end" fill="#5cc97a" font-size="18" font-weight="700">45 €</text>
<text x="24" y="242" fill="#6b6455" font-size="14.5">до 6 лет бесплатно</text>
<text x="24" y="278" fill="#e8e0d0" font-size="18" font-weight="600">Сервисный сбор центра</text>
<text x="616" y="278" text-anchor="end" fill="#e8c062" font-size="18" font-weight="700">25–55 €</text>
<text x="24" y="298" fill="#6b6455" font-size="14.5">в Москве дороже, чем в регионах</text>
<text x="24" y="334" fill="#e8e0d0" font-size="18" font-weight="600">Страховка</text>
<text x="616" y="334" text-anchor="end" fill="#7fb5c9" font-size="18" font-weight="700">20–30 €</text>
<text x="24" y="354" fill="#6b6455" font-size="14.5">покрытие 30 000 € на 7 дней</text>
<text x="24" y="390" fill="#e8e0d0" font-size="18" font-weight="600">Перевод документов</text>
<text x="616" y="390" text-anchor="end" fill="#a8a090" font-size="18" font-weight="700">0–50 €</text>
<text x="24" y="410" fill="#6b6455" font-size="14.5">если справка только на русском</text>
<text x="24" y="446" fill="#e8e0d0" font-size="18" font-weight="600">Посредник (по желанию)</text>
<text x="616" y="446" text-anchor="end" fill="#6b6455" font-size="18" font-weight="700">100–500 €</text>
<text x="24" y="466" fill="#6b6455" font-size="14.5">нужен не всем</text>
<text x="320" y="514" text-anchor="middle" fill="#6b6455" font-size="15.5">Консульский сбор един для всех стран Шенгена</text>
<text x="320" y="536" text-anchor="middle" fill="#6b6455" font-size="15.5">и не возвращается при отказе</text>
</svg>