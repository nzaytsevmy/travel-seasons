<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 712" width="640" height="712" font-family="system-ui,-apple-system,sans-serif">
<title>В какую страну Шенгена подавать на визу</title>
<desc>Едете в одну страну — подавайте в неё; в несколько — туда, где больше ночей. Новичкам лояльны Италия, Венгрия и Словения. Нельзя лгать в анкете, подавать в две страны сразу и показывать поддельные брони.</desc>
<rect width="640" height="712" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">КУДА ПОДАВАТЬ НА ВИЗУ</text>
<rect x="24" y="76" width="592" height="80" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="76" width="6" height="80" fill="#1a7f4b"/>
<text x="52" y="104" fill="#1a7f4b" font-size="17" font-weight="700">Едете в одну страну</text>
<text x="52" y="130" fill="#15171a" font-size="18">подавайте именно в неё</text>
<text x="52" y="150" fill="#5c626b" font-size="15">подача «через лояльную» — нарушение</text>
<rect x="24" y="170" width="592" height="80" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="170" width="6" height="80" fill="#1d40ae"/>
<text x="52" y="198" fill="#1d40ae" font-size="17" font-weight="700">Несколько стран</text>
<text x="52" y="224" fill="#15171a" font-size="18">где больше всего ночей</text>
<text x="52" y="244" fill="#5c626b" font-size="15">при равенстве — страна первого въезда</text>
<rect x="24" y="264" width="592" height="80" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="264" width="6" height="80" fill="#2b6f8a"/>
<text x="52" y="292" fill="#2b6f8a" font-size="17" font-weight="700">Без истории Шенгена</text>
<text x="52" y="318" fill="#15171a" font-size="18">Италия, Венгрия, Словения</text>
<text x="52" y="338" fill="#5c626b" font-size="15">лояльны к новичкам</text>
<rect x="24" y="358" width="592" height="80" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="358" width="6" height="80" fill="#8a6a10"/>
<text x="52" y="386" fill="#8a6a10" font-size="17" font-weight="700">Был отказ</text>
<text x="52" y="412" fill="#15171a" font-size="18">подавайте в другую страну</text>
<text x="52" y="432" fill="#5c626b" font-size="15">там, где отказали, это помнят</text>
<text x="24" y="470" fill="#b3261e" font-size="18" font-weight="700">ЧЕГО НЕ ДЕЛАТЬ</text>
<text x="24" y="500" fill="#b3261e" font-size="17" font-weight="700">×</text>
<text x="44" y="500" fill="#5c626b" font-size="16">лгать в анкете: данные хранятся пять лет</text>
<text x="24" y="530" fill="#b3261e" font-size="17" font-weight="700">×</text>
<text x="44" y="530" fill="#5c626b" font-size="16">подавать сразу в две страны — откажут обеим</text>
<text x="24" y="560" fill="#b3261e" font-size="17" font-weight="700">×</text>
<text x="44" y="560" fill="#5c626b" font-size="16">показывать поддельную бронь: центры их проверяют</text>
<text x="24" y="590" fill="#b3261e" font-size="17" font-weight="700">×</text>
<text x="44" y="590" fill="#5c626b" font-size="16">покупать мультивизу у посредника — их не выдают</text>
</svg>