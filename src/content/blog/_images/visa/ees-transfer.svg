<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 514" width="640" height="514" font-family="system-ui,-apple-system,sans-serif">
<title>Где проходить новый контроль при пересадке</title>
<desc>Биометрию сдают в первой стране Шенгена на маршруте, а не в стране назначения. На пересадку закладывайте два с половиной — три часа.</desc>
<rect width="640" height="514" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ПЕРЕСАДКА: ГДЕ СДАВАТЬ</text>
<rect x="24" y="84" width="592" height="92" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="92" fill="#c9973a"/>
<text x="52" y="114" fill="#a8a090" font-size="16.5">Москва · Стамбул · Барселона</text>
<text x="52" y="144" fill="#5cc97a" font-size="21" font-weight="700">БАРСЕЛОНА</text>
<text x="52" y="166" fill="#6b6455" font-size="15">Стамбул не входит в Шенген</text>
<rect x="24" y="190" width="592" height="92" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="190" width="6" height="92" fill="#c9973a"/>
<text x="52" y="220" fill="#a8a090" font-size="16.5">Москва · Дубай · Мюнхен · Барселона</text>
<text x="52" y="250" fill="#5cc97a" font-size="21" font-weight="700">МЮНХЕН</text>
<text x="52" y="272" fill="#6b6455" font-size="15">дальше уже внутренний рейс ЕС</text>
<rect x="24" y="296" width="592" height="92" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="296" width="6" height="92" fill="#c9973a"/>
<text x="52" y="326" fill="#a8a090" font-size="16.5">Москва · Стамбул · Афины · Кипр</text>
<text x="52" y="356" fill="#5cc97a" font-size="21" font-weight="700">АФИНЫ</text>
<text x="52" y="378" fill="#6b6455" font-size="15">у Кипра свой контроль</text>
<text x="320" y="432" text-anchor="middle" fill="#d44545" font-size="18" font-weight="700">Закладывайте 2,5–3 часа на пересадку</text>
<text x="320" y="458" text-anchor="middle" fill="#a8a090" font-size="15.5">стыковка в час-полтора — реальный риск</text>
<text x="320" y="478" text-anchor="middle" fill="#a8a090" font-size="15.5">опоздать на следующий рейс</text>
</svg>