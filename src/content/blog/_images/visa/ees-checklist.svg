<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" font-family="system-ui,-apple-system,sans-serif">
<title>Что проверить перед вылетом в Шенген</title>
<desc>Биометрический паспорт со сроком действия три месяца после возвращения, лишний час времени, снятые очки перед фотографированием и обязательная отметка на выезде.</desc>
<rect width="640" height="580" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ЧТО ПРОВЕРИТЬ ДО ВЫЛЕТА</text>
<circle cx="44" cy="114" r="9" fill="#5cc97a"/>
<line x1="44" y1="125" x2="44" y2="172" stroke="#3a3429" stroke-width="2"/>
<text x="70" y="108" fill="#c9973a" font-size="17" font-weight="700">Паспорт</text>
<text x="70" y="134" fill="#e8e0d0" font-size="18">биометрический, с чипом</text>
<text x="70" y="156" fill="#a8a090" font-size="15.5">в части аэропортов пускает к автоматическим воротам</text>
<circle cx="44" cy="202" r="9" fill="#5cc97a"/>
<line x1="44" y1="213" x2="44" y2="260" stroke="#3a3429" stroke-width="2"/>
<text x="70" y="196" fill="#c9973a" font-size="17" font-weight="700">Срок действия</text>
<text x="70" y="222" fill="#e8e0d0" font-size="18">3 месяца после возвращения</text>
<text x="70" y="244" fill="#a8a090" font-size="15.5">и минимум две чистые страницы</text>
<circle cx="44" cy="290" r="9" fill="#5cc97a"/>
<line x1="44" y1="301" x2="44" y2="348" stroke="#3a3429" stroke-width="2"/>
<text x="70" y="284" fill="#c9973a" font-size="17" font-weight="700">Запас времени</text>
<text x="70" y="310" fill="#e8e0d0" font-size="18">+60 минут к привычному</text>
<text x="70" y="332" fill="#a8a090" font-size="15.5">по практике первых недель апреля 2026</text>
<circle cx="44" cy="378" r="9" fill="#5cc97a"/>
<line x1="44" y1="389" x2="44" y2="436" stroke="#3a3429" stroke-width="2"/>
<text x="70" y="372" fill="#c9973a" font-size="17" font-weight="700">Перед фотографированием</text>
<text x="70" y="398" fill="#e8e0d0" font-size="18">снять очки и линзы</text>
<text x="70" y="420" fill="#a8a090" font-size="15.5">не улыбаться и не вертеть головой</text>
<circle cx="44" cy="466" r="9" fill="#5cc97a"/>
<text x="70" y="460" fill="#c9973a" font-size="17" font-weight="700">На выезде</text>
<text x="70" y="486" fill="#e8e0d0" font-size="18">та же процедура</text>
<text x="70" y="508" fill="#a8a090" font-size="15.5">без отметки о выезде засчитают просрочку</text>
</svg>