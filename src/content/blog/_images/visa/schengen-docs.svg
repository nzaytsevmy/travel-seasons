<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui,-apple-system,sans-serif">
<title>Какие документы нужны для шенгенской визы</title>
<desc>Паспорт со сроком три месяца после возвращения, анкета, два фото, билеты, отель на каждую ночь, страховка на тридцать тысяч евро и подтверждение денег.</desc>
<rect width="640" height="600" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ПАКЕТ ДОКУМЕНТОВ</text>
<rect x="26" y="92" width="18" height="18" rx="3" fill="none" stroke="#5cc97a" stroke-width="2"/>
<path d="M30 101 l4 5 l8 -10" fill="none" stroke="#5cc97a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="108" fill="#e8e0d0" font-size="19" font-weight="600">Загранпаспорт</text>
<text x="58" y="130" fill="#a8a090" font-size="15.5">3 месяца после возвращения, 2 чистые страницы</text>
<rect x="26" y="154" width="18" height="18" rx="3" fill="none" stroke="#5cc97a" stroke-width="2"/>
<path d="M30 163 l4 5 l8 -10" fill="none" stroke="#5cc97a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="170" fill="#e8e0d0" font-size="19" font-weight="600">Анкета</text>
<text x="58" y="192" fill="#a8a090" font-size="15.5">латиницей, на сайте консульства</text>
<rect x="26" y="216" width="18" height="18" rx="3" fill="none" stroke="#5cc97a" stroke-width="2"/>
<path d="M30 225 l4 5 l8 -10" fill="none" stroke="#5cc97a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="232" fill="#e8e0d0" font-size="19" font-weight="600">Фото 3,5 × 4,5 см</text>
<text x="58" y="254" fill="#a8a090" font-size="15.5">две штуки, белый фон, не старше полугода</text>
<rect x="26" y="278" width="18" height="18" rx="3" fill="none" stroke="#5cc97a" stroke-width="2"/>
<path d="M30 287 l4 5 l8 -10" fill="none" stroke="#5cc97a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="294" fill="#e8e0d0" font-size="19" font-weight="600">Билеты туда-обратно</text>
<text x="58" y="316" fill="#a8a090" font-size="15.5">подойдёт неоплаченная бронь</text>
<rect x="26" y="340" width="18" height="18" rx="3" fill="none" stroke="#5cc97a" stroke-width="2"/>
<path d="M30 349 l4 5 l8 -10" fill="none" stroke="#5cc97a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="356" fill="#e8e0d0" font-size="19" font-weight="600">Отель на каждую ночь</text>
<text x="58" y="378" fill="#a8a090" font-size="15.5">бронь с подтверждением на почту</text>
<rect x="26" y="402" width="18" height="18" rx="3" fill="none" stroke="#5cc97a" stroke-width="2"/>
<path d="M30 411 l4 5 l8 -10" fill="none" stroke="#5cc97a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="418" fill="#e8e0d0" font-size="19" font-weight="600">Страховка на 30 000 €</text>
<text x="58" y="440" fill="#a8a090" font-size="15.5">на весь срок поездки</text>
<rect x="26" y="464" width="18" height="18" rx="3" fill="none" stroke="#5cc97a" stroke-width="2"/>
<path d="M30 473 l4 5 l8 -10" fill="none" stroke="#5cc97a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="480" fill="#e8e0d0" font-size="19" font-weight="600">Подтверждение денег</text>
<text x="58" y="502" fill="#a8a090" font-size="15.5">выписка плюс справка с работы</text>
<text x="320" y="546" text-anchor="middle" fill="#6b6455" font-size="15.5">Костяк одинаков для всех стран Шенгена,</text>
<text x="320" y="568" text-anchor="middle" fill="#6b6455" font-size="15.5">но требования консульств отличаются в мелочах</text>
</svg>