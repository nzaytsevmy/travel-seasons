<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 532" width="640" height="532" font-family="system-ui,-apple-system,sans-serif">
<title>Что делают на границе Шенгена при новом контроле</title>
<desc>При первом въезде снимают отпечатки десяти пальцев и фотографируют, следующие три года — только скан лица. Детям до двенадцати отпечатки не делают, штампы в паспорт больше не ставят.</desc>
<rect width="640" height="532" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ЧТО ДЕЛАЮТ НА ГРАНИЦЕ</text>
<rect x="24" y="84" width="592" height="80" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="80" fill="#e8c062"/>
<text x="52" y="114" fill="#e8c062" font-size="17" font-weight="700">ПЕРВЫЙ ВЪЕЗД</text>
<text x="52" y="140" fill="#e8e0d0" font-size="18">отпечатки всех десяти пальцев</text>
<text x="52" y="160" fill="#a8a090" font-size="15.5">и фотография лица</text>
<rect x="24" y="178" width="592" height="80" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="178" width="6" height="80" fill="#5cc97a"/>
<text x="52" y="208" fill="#5cc97a" font-size="17" font-weight="700">ПОВТОРНЫЕ ВЪЕЗДЫ 3 ГОДА</text>
<text x="52" y="234" fill="#e8e0d0" font-size="18">только сканирование лица</text>
<text x="52" y="254" fill="#a8a090" font-size="15.5">проходит заметно быстрее</text>
<rect x="24" y="272" width="592" height="80" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="272" width="6" height="80" fill="#7fb5c9"/>
<text x="52" y="302" fill="#7fb5c9" font-size="17" font-weight="700">ДЕТИ ДО 12 ЛЕТ</text>
<text x="52" y="328" fill="#e8e0d0" font-size="18">отпечатки не берут</text>
<text x="52" y="348" fill="#a8a090" font-size="15.5">только фотография</text>
<rect x="24" y="366" width="592" height="80" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="366" width="6" height="80" fill="#d44545"/>
<text x="52" y="396" fill="#d44545" font-size="17" font-weight="700">ШТАМП В ПАСПОРТЕ</text>
<text x="52" y="422" fill="#e8e0d0" font-size="18">больше не ставят</text>
<text x="52" y="442" fill="#a8a090" font-size="15.5">данные хранит электронная база</text>
<text x="320" y="506" text-anchor="middle" fill="#6b6455" font-size="15">Работает в 29 странах Шенгена;</text>
<text x="320" y="526" text-anchor="middle" fill="#6b6455" font-size="15">Ирландия и Кипр — со своим контролем</text>
</svg>