<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 532" width="640" height="532" font-family="system-ui,-apple-system,sans-serif">
<title>Что делают на границе Шенгена при новом контроле</title>
<desc>При первом въезде снимают отпечатки десяти пальцев и фотографируют, следующие три года — только скан лица. Детям до двенадцати отпечатки не делают, штампы в паспорт больше не ставят.</desc>
<rect width="640" height="532" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">ЧТО ДЕЛАЮТ НА ГРАНИЦЕ</text>
<rect x="24" y="84" width="592" height="80" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="84" width="6" height="80" fill="#8a6a10"/>
<text x="52" y="114" fill="#8a6a10" font-size="17" font-weight="700">ПЕРВЫЙ ВЪЕЗД</text>
<text x="52" y="140" fill="#15171a" font-size="18">отпечатки всех десяти пальцев</text>
<text x="52" y="160" fill="#5c626b" font-size="15.5">и фотография лица</text>
<rect x="24" y="178" width="592" height="80" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="178" width="6" height="80" fill="#1a7f4b"/>
<text x="52" y="208" fill="#1a7f4b" font-size="17" font-weight="700">ПОВТОРНЫЕ ВЪЕЗДЫ 3 ГОДА</text>
<text x="52" y="234" fill="#15171a" font-size="18">только сканирование лица</text>
<text x="52" y="254" fill="#5c626b" font-size="15.5">проходит заметно быстрее</text>
<rect x="24" y="272" width="592" height="80" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="272" width="6" height="80" fill="#2b6f8a"/>
<text x="52" y="302" fill="#2b6f8a" font-size="17" font-weight="700">ДЕТИ ДО 12 ЛЕТ</text>
<text x="52" y="328" fill="#15171a" font-size="18">отпечатки не берут</text>
<text x="52" y="348" fill="#5c626b" font-size="15.5">только фотография</text>
<rect x="24" y="366" width="592" height="80" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="366" width="6" height="80" fill="#b3261e"/>
<text x="52" y="396" fill="#b3261e" font-size="17" font-weight="700">ШТАМП В ПАСПОРТЕ</text>
<text x="52" y="422" fill="#15171a" font-size="18">больше не ставят</text>
<text x="52" y="442" fill="#5c626b" font-size="15.5">данные хранит электронная база</text>
<text x="320" y="506" text-anchor="middle" fill="#8a9099" font-size="15">Работает в 29 странах Шенгена;</text>
<text x="320" y="526" text-anchor="middle" fill="#8a9099" font-size="15">Ирландия и Кипр — со своим контролем</text>
</svg>