<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 596" width="640" height="596" font-family="system-ui,-apple-system,sans-serif">
<title>Когда лучше ехать в Дагестан</title>
<desc>Май, июнь и сентябрь дают лучший баланс погоды, цен и людности. В июле и августе жарко и людно, зимой часть горных перевалов закрыта снегом.</desc>
<rect width="640" height="596" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">КОГДА ЕХАТЬ В ДАГЕСТАН</text>
<rect x="24" y="84" width="592" height="74" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="74" fill="#5cc97a"/>
<text x="52" y="112" fill="#5cc97a" font-size="18" font-weight="700">МАЙ–ИЮНЬ</text>
<text x="52" y="136" fill="#e8e0d0" font-size="17">зелёные горы, полные водопады</text>
<text x="52" y="154" fill="#a8a090" font-size="15">море ещё прохладное</text>
<rect x="24" y="172" width="592" height="74" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="172" width="6" height="74" fill="#e8c062"/>
<text x="52" y="200" fill="#e8c062" font-size="18" font-weight="700">ИЮЛЬ–АВГУСТ</text>
<text x="52" y="224" fill="#e8e0d0" font-size="17">+30 днём, Каспий +24…+26</text>
<text x="52" y="242" fill="#a8a090" font-size="15">максимум людей и цен</text>
<rect x="24" y="260" width="592" height="74" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="260" width="6" height="74" fill="#5cc97a"/>
<text x="52" y="288" fill="#5cc97a" font-size="18" font-weight="700">СЕНТЯБРЬ</text>
<text x="52" y="312" fill="#e8e0d0" font-size="17">море тёплое, жара спала</text>
<text x="52" y="330" fill="#a8a090" font-size="15">лучший месяц: море и горы</text>
<rect x="24" y="348" width="592" height="74" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="348" width="6" height="74" fill="#e8c062"/>
<text x="52" y="376" fill="#e8c062" font-size="18" font-weight="700">ОКТЯБРЬ</text>
<text x="52" y="400" fill="#e8e0d0" font-size="17">золотая осень, +20 у моря</text>
<text x="52" y="418" fill="#a8a090" font-size="15">купаться уже свежо</text>
<rect x="24" y="436" width="592" height="74" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="436" width="6" height="74" fill="#7fb5c9"/>
<text x="52" y="464" fill="#7fb5c9" font-size="18" font-weight="700">ЗИМА</text>
<text x="52" y="488" fill="#e8e0d0" font-size="17">+5…+8 у моря, без туристов</text>
<text x="52" y="506" fill="#a8a090" font-size="15">часть перевалов закрыта</text>
<text x="320" y="572" text-anchor="middle" fill="#6b6455" font-size="15">В Рамадан (18 февраля — 19 марта 2026) часть</text>
<text x="320" y="590" text-anchor="middle" fill="#6b6455" font-size="15">кафе в сёлах днём закрыта</text>
</svg>