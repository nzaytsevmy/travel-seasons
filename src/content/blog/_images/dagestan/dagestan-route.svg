<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" width="640" height="530" font-family="system-ui,-apple-system,sans-serif">
<title>Маршрут по Дагестану на пять дней</title>
<desc>Первый день в Махачкале, второй на Сулакском каньоне, третий в Дербенте, четвёртый в горных сёлах и пятый на Каспии.</desc>
<rect width="640" height="530" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">МАРШРУТ НА ПЯТЬ ДНЕЙ</text>
<circle cx="46" cy="112" r="10" fill="#c9973a"/>
<line x1="46" y1="124" x2="46" y2="160" stroke="#3a3429" stroke-width="2"/>
<text x="74" y="106" fill="#c9973a" font-size="17" font-weight="700">День 1</text>
<text x="74" y="130" fill="#e8e0d0" font-size="20" font-weight="600">Махачкала</text>
<text x="74" y="152" fill="#a8a090" font-size="16">набережная, рынок, первая чуду</text>
<circle cx="46" cy="188" r="10" fill="#7fb5c9"/>
<line x1="46" y1="200" x2="46" y2="236" stroke="#3a3429" stroke-width="2"/>
<text x="74" y="182" fill="#7fb5c9" font-size="17" font-weight="700">День 2</text>
<text x="74" y="206" fill="#e8e0d0" font-size="20" font-weight="600">Сулакский каньон</text>
<text x="74" y="228" fill="#a8a090" font-size="16">смотровые Дубков, катер, бархан</text>
<circle cx="46" cy="264" r="10" fill="#e8c062"/>
<line x1="46" y1="276" x2="46" y2="312" stroke="#3a3429" stroke-width="2"/>
<text x="74" y="258" fill="#e8c062" font-size="17" font-weight="700">День 3</text>
<text x="74" y="282" fill="#e8e0d0" font-size="20" font-weight="600">Дербент</text>
<text x="74" y="304" fill="#a8a090" font-size="16">Нарын-Кала, магалы, экраноплан на закате</text>
<circle cx="46" cy="340" r="10" fill="#5cc97a"/>
<line x1="46" y1="352" x2="46" y2="388" stroke="#3a3429" stroke-width="2"/>
<text x="74" y="334" fill="#5cc97a" font-size="17" font-weight="700">День 4</text>
<text x="74" y="358" fill="#e8e0d0" font-size="20" font-weight="600">Горные сёла</text>
<text x="74" y="380" fill="#a8a090" font-size="16">Гамсутль, Гуниб, Салтинский водопад</text>
<circle cx="46" cy="416" r="10" fill="#7fb5c9"/>
<text x="74" y="410" fill="#7fb5c9" font-size="17" font-weight="700">День 5</text>
<text x="74" y="434" fill="#e8e0d0" font-size="20" font-weight="600">Каспий</text>
<text x="74" y="456" fill="#a8a090" font-size="16">Каспийск или Избербаш, вылет</text>
<text x="320" y="514" text-anchor="middle" fill="#6b6455" font-size="16">Горы смотрят до 11 утра: потом жара и дымка</text>
</svg>