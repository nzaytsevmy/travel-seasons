<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" width="640" height="530" font-family="system-ui,-apple-system,sans-serif">
<title>Маршрут по Дагестану на пять дней</title>
<desc>Первый день в Махачкале, второй на Сулакском каньоне, третий в Дербенте, четвёртый в горных сёлах и пятый на Каспии.</desc>
<rect width="640" height="530" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">МАРШРУТ НА ПЯТЬ ДНЕЙ</text>
<circle cx="46" cy="112" r="10" fill="#1d40ae"/>
<line x1="46" y1="124" x2="46" y2="160" stroke="#d9dbde" stroke-width="2"/>
<text x="74" y="106" fill="#1d40ae" font-size="17" font-weight="700">День 1</text>
<text x="74" y="130" fill="#15171a" font-size="20" font-weight="600">Махачкала</text>
<text x="74" y="152" fill="#5c626b" font-size="16">набережная, рынок, первая чуду</text>
<circle cx="46" cy="188" r="10" fill="#2b6f8a"/>
<line x1="46" y1="200" x2="46" y2="236" stroke="#d9dbde" stroke-width="2"/>
<text x="74" y="182" fill="#2b6f8a" font-size="17" font-weight="700">День 2</text>
<text x="74" y="206" fill="#15171a" font-size="20" font-weight="600">Сулакский каньон</text>
<text x="74" y="228" fill="#5c626b" font-size="16">смотровые Дубков, катер, бархан</text>
<circle cx="46" cy="264" r="10" fill="#8a6a10"/>
<line x1="46" y1="276" x2="46" y2="312" stroke="#d9dbde" stroke-width="2"/>
<text x="74" y="258" fill="#8a6a10" font-size="17" font-weight="700">День 3</text>
<text x="74" y="282" fill="#15171a" font-size="20" font-weight="600">Дербент</text>
<text x="74" y="304" fill="#5c626b" font-size="16">Нарын-Кала, магалы, экраноплан на закате</text>
<circle cx="46" cy="340" r="10" fill="#1a7f4b"/>
<line x1="46" y1="352" x2="46" y2="388" stroke="#d9dbde" stroke-width="2"/>
<text x="74" y="334" fill="#1a7f4b" font-size="17" font-weight="700">День 4</text>
<text x="74" y="358" fill="#15171a" font-size="20" font-weight="600">Горные сёла</text>
<text x="74" y="380" fill="#5c626b" font-size="16">Гамсутль, Гуниб, Салтинский водопад</text>
<circle cx="46" cy="416" r="10" fill="#2b6f8a"/>
<text x="74" y="410" fill="#2b6f8a" font-size="17" font-weight="700">День 5</text>
<text x="74" y="434" fill="#15171a" font-size="20" font-weight="600">Каспий</text>
<text x="74" y="456" fill="#5c626b" font-size="16">Каспийск или Избербаш, вылет</text>
<text x="320" y="514" text-anchor="middle" fill="#8a9099" font-size="16">Горы смотрят до 11 утра: потом жара и дымка</text>
</svg>