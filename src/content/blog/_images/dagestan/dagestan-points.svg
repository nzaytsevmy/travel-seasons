<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 558" width="640" height="558" font-family="system-ui,-apple-system,sans-serif">
<title>Главные точки Дагестана и сколько стоит вход</title>
<desc>Смотровые Сулакского каньона, Гамсутль и бархан Сарыкум бесплатны. Катер по водохранилищу от четырёх тысяч, пещера пятьсот рублей, зиплайн полторы тысячи, цитадель Нарын-Кала 150–300 рублей.</desc>
<rect width="640" height="558" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">ГЛАВНЫЕ ТОЧКИ И ЦЕНЫ</text>
<line x1="24" y1="72" x2="616" y2="72" stroke="#d9dbde"/>
<text x="24" y="110" fill="#15171a" font-size="18" font-weight="600">Сулакский каньон</text>
<text x="616" y="110" text-anchor="end" fill="#1a7f4b" font-size="18" font-weight="700">бесплатно</text>
<text x="24" y="130" fill="#8a9099" font-size="14.5">смотровые в Дубках</text>
<text x="24" y="166" fill="#15171a" font-size="18" font-weight="600">Катер по водохранилищу</text>
<text x="616" y="166" text-anchor="end" fill="#8a6a10" font-size="18" font-weight="700">от 4000 ₽</text>
<text x="24" y="186" fill="#8a9099" font-size="14.5">за лодку</text>
<text x="24" y="222" fill="#15171a" font-size="18" font-weight="600">Пещера Нохъо</text>
<text x="616" y="222" text-anchor="end" fill="#8a6a10" font-size="18" font-weight="700">≈500 ₽</text>
<text x="24" y="242" fill="#8a9099" font-size="14.5">вход</text>
<text x="24" y="278" fill="#15171a" font-size="18" font-weight="600">Зиплайн над каньоном</text>
<text x="616" y="278" text-anchor="end" fill="#8a6a10" font-size="18" font-weight="700">≈1500 ₽</text>
<text x="24" y="334" fill="#15171a" font-size="18" font-weight="600">Цитадель Нарын-Кала</text>
<text x="616" y="334" text-anchor="end" fill="#1d40ae" font-size="18" font-weight="700">150–300 ₽</text>
<text x="24" y="354" fill="#8a9099" font-size="14.5">экскурсия ещё 500</text>
<text x="24" y="390" fill="#15171a" font-size="18" font-weight="600">Гамсутль</text>
<text x="616" y="390" text-anchor="end" fill="#1a7f4b" font-size="18" font-weight="700">бесплатно</text>
<text x="24" y="410" fill="#8a9099" font-size="14.5">подъём пешком 1–1,5 часа</text>
<text x="24" y="446" fill="#15171a" font-size="18" font-weight="600">Бархан Сарыкум</text>
<text x="616" y="446" text-anchor="end" fill="#1a7f4b" font-size="18" font-weight="700">бесплатно</text>
<text x="24" y="466" fill="#8a9099" font-size="14.5">30 км от Махачкалы</text>
<text x="320" y="508" text-anchor="middle" fill="#b3261e" font-size="18" font-weight="700">В горах только наличные</text>
<text x="320" y="532" text-anchor="middle" fill="#5c626b" font-size="16">банкоматов нет, на рынках и смотровых карты не берут</text>
</svg>