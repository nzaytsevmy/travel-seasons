<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько стоит неделя в Дубае</title>
<desc>Эконом от пятидесяти долларов в день, комфорт 150-300, премиум от четырёх тысяч за неделю на двоих без перелёта.</desc>
<rect width="640" height="450" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">СКОЛЬКО СТОИТ ДУБАЙ</text>
<rect x="24" y="84" width="592" height="86" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="84" width="6" height="86" fill="#1a7f4b"/>
<text x="52" y="112" fill="#1a7f4b" font-size="19" font-weight="700">Эконом</text>
<text x="600" y="112" text-anchor="end" fill="#15171a" font-size="18" font-weight="700">от 50 $/день</text>
<text x="52" y="138" fill="#15171a" font-size="16">3 звезды в Дейре, метро, фудкорты</text>
<text x="52" y="158" fill="#5c626b" font-size="15">неделя на двоих 600–900 $</text>
<rect x="24" y="184" width="592" height="86" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="184" width="6" height="86" fill="#1d40ae"/>
<text x="52" y="212" fill="#1d40ae" font-size="19" font-weight="700">Комфорт</text>
<text x="600" y="212" text-anchor="end" fill="#15171a" font-size="18" font-weight="700">150–300 $/день</text>
<text x="52" y="238" fill="#15171a" font-size="16">4–5 звёзд, рестораны, такси</text>
<text x="52" y="258" fill="#5c626b" font-size="15">самый ходовой вариант</text>
<rect x="24" y="284" width="592" height="86" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="284" width="6" height="86" fill="#8a6a10"/>
<text x="52" y="312" fill="#8a6a10" font-size="19" font-weight="700">Премиум</text>
<text x="600" y="312" text-anchor="end" fill="#15171a" font-size="18" font-weight="700">от 4000 $</text>
<text x="52" y="338" fill="#15171a" font-size="16">за неделю на двоих</text>
<text x="52" y="358" fill="#5c626b" font-size="15">отели у моря и рестораны с видом</text>
<text x="320" y="434" text-anchor="middle" fill="#8a9099" font-size="15.5">Шаурма за 15 дирхамов и ужин за 1500 — в одном городе</text>
</svg>