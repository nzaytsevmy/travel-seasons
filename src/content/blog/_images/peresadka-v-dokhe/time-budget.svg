<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1140" viewBox="0 0 640 1140" role="img" aria-labelledby="title desc">
<title id="title">Пример бюджета восьми часов в Дохе</title><desc id="desc">Один час на выход и границу, 45 минут туда, два с половиной часа на город, 45 минут обратно, три часа запаса до вылета. Длины отрезков пропорциональны времени. Оценка для планирования, не измерение очередей.</desc>
<rect width="640" height="1140" fill="#fbfbfa"/>
<g font-family="Golos Text, sans-serif" fill="#15171a">
<text x="32" y="60" font-size="42" font-weight="600">8 часов между рейсами</text><text x="32" y="109" font-size="30" fill="#5c626b">Пример для планирования</text>
<g fill="#d9dbde"><rect x="32" y="160" width="16" height="100"/><rect x="32" y="260" width="16" height="75"/><rect x="32" y="585" width="16" height="75"/><rect x="32" y="660" width="16" height="300"/></g>
<rect x="32" y="335" width="16" height="250" fill="#1d40ae"/>
<g stroke="#d9dbde" stroke-width="2"><path d="M32 160H608M32 260H608M32 335H608M32 585H608M32 660H608M32 960H608"/></g>
<g font-size="32"><text x="80" y="221">Выход и граница</text><text x="608" y="221" text-anchor="end">1 ч</text><text x="80" y="310">Дорога туда</text><text x="608" y="310" text-anchor="end">45 мин</text><g fill="#1d40ae" font-weight="600"><text x="80" y="465">Время в городе</text><text x="608" y="465" text-anchor="end">2,5 ч</text></g><text x="80" y="635">Дорога назад</text><text x="608" y="635" text-anchor="end">45 мин</text><text x="80" y="805">Запас до вылета</text><text x="608" y="805" text-anchor="end">3 ч</text></g>
<g font-size="30" fill="#5c626b"><text x="32" y="1023">Задержка сокращает прогулку.</text><text x="32" y="1065">Сроки вашего билета важнее</text><text x="32" y="1107">этого примера.</text></g>
</g></svg>
