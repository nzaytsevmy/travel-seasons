<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 400 475" role="img" aria-labelledby="title desc">
 <title id="title">Мачу-Пикчу: терраса, город и отдельные горы</title>
 <desc id="desc">Схематический профиль местности: гора Мачу-Пикчу относится к 1A, верхняя терраса к 1B, городской проход и обзор к 2A или 2B, нижний сектор к кругу 3, Уайна-Пикчу к 3A. Это схема целей посещения, а не точная карта троп.</desc>
 <rect width="400" height="475" fill="#fbfbfa"/>
 <text x="20" y="32" font-family="Old Standard TT,Georgia,serif" font-size="23" fill="#15171a">Один памятник — разные цели</text>
