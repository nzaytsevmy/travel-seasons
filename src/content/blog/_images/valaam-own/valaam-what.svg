<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" width="640" height="404" font-family="system-ui,-apple-system,sans-serif">
<title>Что смотреть на Валааме</title>
<desc>Спасо-Преображенский собор, скиты, смотровая на горе Елеон и концерт монастырского хора.</desc>
<rect width="640" height="404" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ЧТО СМОТРЕТЬ НА ВАЛААМЕ</text>
<circle cx="36" cy="98" r="4" fill="#c9973a"/>
<text x="54" y="104" fill="#e8e0d0" font-size="18" font-weight="600">Спасо-Преображенский собор</text>
<text x="54" y="126" fill="#a8a090" font-size="15">главный храм монастыря</text>
<circle cx="36" cy="160" r="4" fill="#c9973a"/>
<text x="54" y="166" fill="#e8e0d0" font-size="18" font-weight="600">Скиты</text>
<text x="54" y="188" fill="#a8a090" font-size="15">Никольский, Воскресенский, Гефсиманский, Смоленский</text>
<circle cx="36" cy="222" r="4" fill="#c9973a"/>
<text x="54" y="228" fill="#e8e0d0" font-size="18" font-weight="600">Гора Елеон</text>
<text x="54" y="250" fill="#a8a090" font-size="15">смотровая с видом на Ладогу</text>
<circle cx="36" cy="284" r="4" fill="#c9973a"/>
<text x="54" y="290" fill="#e8e0d0" font-size="18" font-weight="600">Концерт песнопений</text>
<text x="54" y="312" fill="#a8a090" font-size="15">монастырский хор, часто сильнейшее впечатление</text>
<text x="320" y="380" text-anchor="middle" fill="#6b6455" font-size="15.5">За одну поездку успевают усадьбу и пару скитов</text>
</svg>