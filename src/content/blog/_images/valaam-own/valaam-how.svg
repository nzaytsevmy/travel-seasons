<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" font-family="system-ui,-apple-system,sans-serif">
  <title>Схема маршрутов на Валаам из пяти городов</title>
  <desc>Москва и Петрозаводск связаны поездом с Сортавалой, Петербург — автобусом с Приозерском; от двух причалов водные линии сходятся на Валааме.</desc>
  <rect width="640" height="820" fill="#131009"/>

  <text x="32" y="48" fill="#c9973a" font-size="24" font-weight="750">ПЯТЬ ТОЧЕК СТАРТА — ДВА ПРИЧАЛА</text>
  <text x="32" y="76" fill="#a8a090" font-size="16">схема маршрута, не географический масштаб</text>

  <path d="M390 104 C535 142 602 238 574 354 C552 441 605 520 566 628 C538 704 466 759 366 782 L640 820 L640 82 Z" fill="#14262d" stroke="#274754" stroke-width="2"/>
  <text x="517" y="122" fill="#7fb5c9" font-size="18" font-weight="650" letter-spacing="2">ЛАДОГА</text>

  <path d="M138 136 C180 188 210 229 239 274" fill="none" stroke="#d9d0bd" stroke-width="4"/>
  <path d="M104 696 C100 606 119 509 161 428 C188 376 214 326 239 274" fill="none" stroke="#d9d0bd" stroke-width="4"/>
  <path d="M103 554 C150 548 204 512 258 476" fill="none" stroke="#c9973a" stroke-width="4"/>
  <path d="M103 554 C132 463 178 355 239 274" fill="none" stroke="#d9d0bd" stroke-width="3" stroke-dasharray="8 9"/>

  <path d="M255 275 C328 247 395 250 461 307" fill="none" stroke="#7fb5c9" stroke-width="5" stroke-dasharray="12 9"/>
  <path d="M274 475 C347 435 414 382 461 307" fill="none" stroke="#7fb5c9" stroke-width="5" stroke-dasharray="12 9"/>

  <g fill="#131009" stroke="#e8e0d0" stroke-width="4">
    <circle cx="138" cy="136" r="12"/>
    <circle cx="104" cy="696" r="12"/>
  </g>
  <g fill="#131009" stroke="#c9973a" stroke-width="4">
    <circle cx="103" cy="554" r="12"/>
    <circle cx="239" cy="274" r="12"/>
    <circle cx="258" cy="476" r="12"/>
  </g>

  <path d="M462 278 L490 294 L484 329 L449 340 L430 316 L440 290 Z" fill="#c9973a" stroke="#f1d18d" stroke-width="3"/>
  <path d="M454 309 h14 v-22 h8 v22 h14 v8 h-36 z" fill="#131009"/>

  <text x="174" y="132" fill="#e8e0d0" font-size="21" font-weight="700">Петрозаводск</text>
  <text x="174" y="160" fill="#a8a090" font-size="17">поезд ≈5,5 ч + ночь</text>

  <text x="126" y="603" fill="#e8e0d0" font-size="21" font-weight="700">Санкт-Петербург</text>
  <text x="126" y="631" fill="#a8a090" font-size="17">пакет автобус + метеор</text>

  <text x="42" y="744" fill="#e8e0d0" font-size="21" font-weight="700">Москва</text>
  <text x="42" y="772" fill="#a8a090" font-size="17">ночной поезд</text>

  <text x="250" y="221" fill="#e8e0d0" font-size="21" font-weight="700">Сортавала</text>
  <text x="250" y="247" fill="#a8a090" font-size="17">северный причал</text>

  <text x="188" y="522" fill="#e8e0d0" font-size="21" font-weight="700">Приозерск</text>
  <text x="188" y="548" fill="#a8a090" font-size="17">западный причал</text>

  <text x="430" y="373" fill="#f1d18d" font-size="23" font-weight="750">Валаам</text>
  <text x="420" y="397" fill="#a8a090" font-size="16">только по воде</text>

  <g transform="translate(32 102)">
    <line x1="350" y1="507" x2="410" y2="507" stroke="#d9d0bd" stroke-width="4"/>
    <text x="420" y="513" fill="#a8a090" font-size="16">поезд</text>
    <line x1="350" y1="542" x2="410" y2="542" stroke="#c9973a" stroke-width="4"/>
    <text x="420" y="548" fill="#a8a090" font-size="16">автобус</text>
    <line x1="350" y1="577" x2="410" y2="577" stroke="#7fb5c9" stroke-width="5" stroke-dasharray="12 9"/>
    <text x="420" y="583" fill="#a8a090" font-size="16">метеор</text>
  </g>

  <line x1="32" y1="795" x2="608" y2="795" stroke="#3a3429"/>
  <text x="320" y="807" text-anchor="middle" fill="#6b6455" font-size="14">Сначала выбирайте водную программу, затем сухопутный билет</text>
</svg>
