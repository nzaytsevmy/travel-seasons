<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="system-ui,-apple-system,sans-serif">
<title>Как добраться на Валаам и сколько это стоит</title>
<desc>Метеор из Сортавалы от 7700 рублей с экскурсией и обедом, паломническая поездка от 5800, круиз из Петербурга от 23500 за три дня.</desc>
<rect width="640" height="470" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">КАК ПОПАСТЬ НА ВАЛААМ</text>
<rect x="24" y="76" width="592" height="86" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="76" width="6" height="86" fill="#c9973a"/>
<text x="52" y="104" fill="#e8e0d0" font-size="18" font-weight="600">Метеор из Сортавалы</text>
<text x="600" y="104" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">от 7700 ₽</text>
<text x="52" y="130" fill="#a8a090" font-size="16">1 ч 15 мин, июнь–сентябрь</text>
<text x="52" y="150" fill="#6b6455" font-size="15">с экскурсией, концертом и обедом</text>
<rect x="24" y="176" width="592" height="86" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="176" width="6" height="86" fill="#5cc97a"/>
<text x="52" y="204" fill="#e8e0d0" font-size="18" font-weight="600">Паломническая поездка</text>
<text x="600" y="204" text-anchor="end" fill="#5cc97a" font-size="18" font-weight="700">от 5800 ₽</text>
<text x="52" y="230" fill="#a8a090" font-size="16">однодневная, через монастырь</text>
<rect x="24" y="276" width="592" height="86" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="276" width="6" height="86" fill="#7fb5c9"/>
<text x="52" y="304" fill="#e8e0d0" font-size="18" font-weight="600">Круиз из Петербурга</text>
<text x="600" y="304" text-anchor="end" fill="#7fb5c9" font-size="18" font-weight="700">от 23 500 ₽</text>
<text x="52" y="330" fill="#a8a090" font-size="16">3 дня и дольше</text>
<text x="52" y="350" fill="#6b6455" font-size="15">неспешный вариант</text>
<text x="320" y="402" text-anchor="middle" fill="#d44545" font-size="17" font-weight="700">Всё работает только в навигацию</text>
<text x="320" y="426" text-anchor="middle" fill="#a8a090" font-size="15.5">на острове отдельно платят сбор природного парка 200 ₽</text>
</svg>