<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" role="img" aria-labelledby="title desc">
  <title id="title">Этапы возврата заказа</title>
  <desc id="desc">Условия конкретного заказа, запрос через Trip.com, решение по заявке и зачисление денег. Подача запроса не означает, что деньги уже поступили.</desc>
  <rect width="640" height="610" fill="#fbfbfa"/>
  <text x="32" y="54" fill="#15171a" font-family="Old Standard TT, Georgia, serif" font-size="31">От запроса до денег</text>
  <path d="M64 101V528" stroke="#1d40ae" stroke-width="4" fill="none"/>
  <g font-family="Golos Text, Arial, sans-serif" font-size="21" fill="#15171a">
    <circle cx="64" cy="138" r="27" fill="#1d40ae"/><text x="64" y="146" text-anchor="middle" fill="#fff" font-size="23">1</text>
    <text x="112" y="128" font-weight="700">Условия заказа</text><text x="112" y="158">Есть ли возврат и удержание?</text>
    <circle cx="64" cy="261" r="27" fill="#1d40ae"/><text x="64" y="269" text-anchor="middle" fill="#fff" font-size="23">2</text>
    <text x="112" y="251" font-weight="700">Запрос через Trip.com</text><text x="112" y="281">Сохраните номер обращения.</text>
    <circle cx="64" cy="384" r="27" fill="#1d40ae"/><text x="64" y="392" text-anchor="middle" fill="#fff" font-size="23">3</text>
    <text x="112" y="374" font-weight="700">Решение по заявке</text><text x="112" y="404">Проверка права и суммы.</text>
    <circle cx="64" cy="507" r="27" fill="#1d40ae"/><text x="64" y="515" text-anchor="middle" fill="#fff" font-size="23">4</text>
    <text x="112" y="497" font-weight="700">Зачисление денег</text><text x="112" y="527">Срок зависит от платёжного метода.</text>
  </g>
  <path d="M32 564H608" stroke="#d9dbde" stroke-width="2"/>
  <text x="32" y="592" fill="#5c626b" font-family="Golos Text, Arial, sans-serif" font-size="18">Статус заявки и поступление денег — разные этапы.</text>
</svg>
