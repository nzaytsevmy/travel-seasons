<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 508" width="640" height="508" font-family="system-ui,-apple-system,sans-serif">
<title>Главное о поездке в Таиланд одним взглядом</title>
<desc>Виза не нужна до шестидесяти дней, Пхукет сухой с ноября по апрель, Самуи наоборот заливает в октябре-декабре, внутренний перелёт стоит 30-50 долларов.</desc>
<rect width="640" height="508" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ТАИЛАНД: ГЛАВНОЕ</text>
<rect x="24" y="76" width="592" height="74" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="76" width="6" height="74" fill="#5cc97a"/>
<text x="52" y="104" fill="#e8e0d0" font-size="18" font-weight="600">Виза не нужна</text>
<text x="600" y="104" text-anchor="end" fill="#5cc97a" font-size="18" font-weight="700">до 60 дней</text>
<text x="52" y="132" fill="#a8a090" font-size="15.5">можно продлить на месте</text>
<rect x="24" y="164" width="592" height="74" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="164" width="6" height="74" fill="#c9973a"/>
<text x="52" y="192" fill="#e8e0d0" font-size="18" font-weight="600">Пхукет и Краби</text>
<text x="600" y="192" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">ноябрь–апрель</text>
<text x="52" y="220" fill="#a8a090" font-size="15.5">летом бьёт юго-западный муссон</text>
<rect x="24" y="252" width="592" height="74" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="252" width="6" height="74" fill="#7fb5c9"/>
<text x="52" y="280" fill="#e8e0d0" font-size="18" font-weight="600">Самуи и Панган</text>
<text x="600" y="280" text-anchor="end" fill="#7fb5c9" font-size="18" font-weight="700">январь–сентябрь</text>
<text x="52" y="308" fill="#a8a090" font-size="15.5">дожди сдвинуты на октябрь–декабрь</text>
<rect x="24" y="340" width="592" height="74" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="340" width="6" height="74" fill="#e8c062"/>
<text x="52" y="368" fill="#e8e0d0" font-size="18" font-weight="600">Внутренний перелёт</text>
<text x="600" y="368" text-anchor="end" fill="#e8c062" font-size="18" font-weight="700">30–50 $</text>
<text x="52" y="396" fill="#a8a090" font-size="15.5">дешевле и быстрее автобуса</text>
<text x="320" y="484" text-anchor="middle" fill="#6b6455" font-size="15.5">Летом выбирают залив, а не Андаманское море:</text>
<text x="320" y="502" text-anchor="middle" fill="#6b6455" font-size="15.5">на Самуи в это время суше, чем на Пхукете</text>
</svg>