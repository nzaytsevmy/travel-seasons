<svg xmlns="http://www.w3.org/2000/svg" width="620" height="990" viewBox="0 0 620 990" role="img" aria-labelledby="title desc">
  <title id="title">Маршрут по двум сторонам Патагонии</title>
  <desc id="desc">Буэнос-Айрес, Эль-Калафате, Эль-Чальтен, возвращение в Эль-Калафате к леднику Перито-Морено, затем Пуэрто-Наталес и Торрес-дель-Пайне. Схема остановок, без масштаба.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#1d40ae" stroke-width="1.5"/></marker></defs>
  <rect width="620" height="990" fill="#fbfbfa"/>
  <g font-family="Golos Text,Arial,sans-serif" fill="#15171a" text-anchor="middle">
    <text x="310" y="54" font-size="30" font-weight="700">Две стороны Патагонии</text>
    <text x="310" y="95" font-size="24" fill="#1d40ae">АРГЕНТИНА</text>
    <g fill="#ffffff" stroke="#1d40ae" stroke-width="2">
      <rect x="60" y="119" width="500" height="75"/>
      <rect x="60" y="239" width="500" height="75"/>
      <rect x="60" y="359" width="500" height="96"/>
      <rect x="60" y="500" width="500" height="96"/>
      <rect x="60" y="699" width="500" height="75"/>
      <rect x="60" y="819" width="500" height="96"/>
    </g>
    <g font-size="28" font-weight="600">
      <text x="310" y="165">Буэнос-Айрес</text>
      <text x="310" y="285">Эль-Калафате</text>
      <text x="310" y="398">Эль-Чальтен</text>
      <text x="310" y="539">Эль-Калафате</text>
      <text x="310" y="746">Пуэрто-Наталес</text>
      <text x="310" y="858">Торрес-дель-Пайне</text>
    </g>
    <g font-size="24">
      <text x="310" y="433">треки к Фицрою</text>
      <text x="310" y="574">ледник Перито-Морено</text>
      <text x="310" y="893">трек или поездка на день</text>
      <text x="310" y="671" fill="#1d40ae">ЧИЛИ · ПЕРЕСЕЧЕНИЕ ГРАНИЦЫ</text>
      <text x="310" y="962" fill="#5c626b">Схема остановок · без масштаба</text>
    </g>
  </g>
  <g stroke="#1d40ae" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M310 201V228"/><path d="M310 321V348"/>
    <path d="M310 462V489"/><path d="M310 603V631"/>
    <path d="M310 781V808"/>
  </g>
</svg>
