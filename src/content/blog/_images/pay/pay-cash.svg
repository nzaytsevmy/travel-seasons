<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько наличных брать с собой</title>
<desc>Бюджетная поездка 30-50 долларов в день, стандарт 80-150, премиум от двухсот. На неделю в стандарте — 500-800 долларов.</desc>
<rect width="640" height="410" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">СКОЛЬКО НАЛИЧНЫХ БРАТЬ</text>
<rect x="24" y="84" width="592" height="66" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="66" fill="#5cc97a"/>
<text x="52" y="112" fill="#e8e0d0" font-size="18" font-weight="600">Бюджетная поездка</text>
<text x="600" y="112" text-anchor="end" fill="#5cc97a" font-size="18" font-weight="700">30–50 $/день</text>
<text x="52" y="136" fill="#a8a090" font-size="15.5">хостелы и локальная еда</text>
<rect x="24" y="164" width="592" height="66" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="164" width="6" height="66" fill="#e8c062"/>
<text x="52" y="192" fill="#e8e0d0" font-size="18" font-weight="600">Стандарт</text>
<text x="600" y="192" text-anchor="end" fill="#e8c062" font-size="18" font-weight="700">80–150 $/день</text>
<text x="52" y="216" fill="#a8a090" font-size="15.5">отели три звезды, рестораны</text>
<rect x="24" y="244" width="592" height="66" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="244" width="6" height="66" fill="#c9973a"/>
<text x="52" y="272" fill="#e8e0d0" font-size="18" font-weight="600">Премиум</text>
<text x="600" y="272" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">от 200 $/день</text>
<text x="52" y="296" fill="#a8a090" font-size="15.5">отели четыре-пять звёзд</text>
<text x="320" y="352" text-anchor="middle" fill="#5cc97a" font-size="17.5" font-weight="700">Неделя в стандартном бюджете — 500–800 $</text>
<text x="320" y="376" text-anchor="middle" fill="#a8a090" font-size="15.5">наличные остаются страховкой на случай, когда карта не прошла</text>
</svg>