<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 492" width="640" height="492" font-family="system-ui,-apple-system,sans-serif">
<title>Чем платить за границей в 2026 году</title>
<desc>Виртуальная карта выпускается за две минуты, UnionPay требует поездки, МИР работает в узком списке стран, наличные остаются страховкой.</desc>
<rect width="640" height="492" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ЧЕМ ПЛАТИТЬ ЗА ГРАНИЦЕЙ</text>
<rect x="24" y="84" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="70" fill="#5cc97a"/>
<text x="52" y="112" fill="#e8e0d0" font-size="18" font-weight="600">Виртуальная карта</text>
<text x="600" y="112" text-anchor="end" fill="#5cc97a" font-size="16.5" font-weight="700">2 минуты на выпуск</text>
<text x="52" y="136" fill="#a8a090" font-size="15.5">160+ стран, пополнение через СБП</text>
<rect x="24" y="168" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="168" width="6" height="70" fill="#e8c062"/>
<text x="52" y="196" fill="#e8e0d0" font-size="18" font-weight="600">UnionPay из СНГ</text>
<text x="600" y="196" text-anchor="end" fill="#e8c062" font-size="16.5" font-weight="700">поездка за картой</text>
<text x="52" y="220" fill="#a8a090" font-size="15.5">работает не везде, где обещают</text>
<rect x="24" y="252" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="252" width="6" height="70" fill="#7fb5c9"/>
<text x="52" y="280" fill="#e8e0d0" font-size="18" font-weight="600">Карта МИР</text>
<text x="600" y="280" text-anchor="end" fill="#7fb5c9" font-size="16.5" font-weight="700">узкий список стран</text>
<text x="52" y="304" fill="#a8a090" font-size="15.5">проверять по каждой отдельно</text>
<rect x="24" y="336" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="336" width="6" height="70" fill="#c9973a"/>
<text x="52" y="364" fill="#e8e0d0" font-size="18" font-weight="600">Наличные доллары и евро</text>
<text x="600" y="364" text-anchor="end" fill="#c9973a" font-size="16.5" font-weight="700">страховка на всё</text>
<text x="52" y="388" fill="#a8a090" font-size="15.5">берут везде, но носить рискованно</text>
<text x="320" y="468" text-anchor="middle" fill="#d44545" font-size="17" font-weight="700">Российские Visa и Mastercard за границей не работают</text>
<text x="320" y="488" text-anchor="middle" fill="#a8a090" font-size="15">с марта 2022 года, и это не изменилось</text>
</svg>