<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="system-ui,-apple-system,sans-serif">
<title>Как деньги превращаются в лари</title>
<desc>Три рабочих пути: наличные меняют в городском обменнике без комиссии, картой иностранного банка снимают лари в банкомате, перевод Золотой Короной выдают только в лари. Согласиться на оплату в рублях — минус 3-5 процентов.</desc>
<rect width="640" height="470" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">КАК ДЕНЬГИ СТАНОВЯТСЯ ЛАРИ</text>

<rect x="24" y="80" width="592" height="86" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="80" width="6" height="86" fill="#5cc97a"/>
<text x="52" y="110" fill="#e8e0d0" font-size="19" font-weight="600">Наличные рубли, доллары, евро</text>
<text x="52" y="136" fill="#5cc97a" font-size="18" font-weight="700">городской обменник — без комиссии</text>
<text x="52" y="158" fill="#a8a090" font-size="15.5">в аэропорту и в банке курс заведомо хуже</text>

<rect x="24" y="182" width="592" height="86" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="182" width="6" height="86" fill="#e8c062"/>
<text x="52" y="212" fill="#e8e0d0" font-size="19" font-weight="600">Карта иностранного, неРФ банка</text>
<text x="52" y="238" fill="#e8c062" font-size="18" font-weight="700">банкомат — плюс сбор за снятие</text>
<text x="52" y="260" fill="#a8a090" font-size="15.5">банкомат спросит валюту: выбирать лари, не рубли</text>

<rect x="24" y="284" width="592" height="86" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="284" width="6" height="86" fill="#e8c062"/>
<text x="52" y="314" fill="#e8e0d0" font-size="19" font-weight="600">Перевод «Золотой Короной»</text>
<text x="52" y="340" fill="#e8c062" font-size="18" font-weight="700">касса — выдают только в лари</text>
<text x="52" y="362" fill="#a8a090" font-size="15.5">Тбилиси, Батуми, Кутаиси · 15–60 минут</text>

<rect x="24" y="392" width="592" height="58" rx="5" fill="none" stroke="#d44545"/>
<rect x="24" y="392" width="6" height="58" fill="#d44545"/>
<text x="52" y="418" fill="#d44545" font-size="18" font-weight="700">Где теряют мгновенно</text>
<text x="52" y="440" fill="#a8a090" font-size="15.5">согласиться на оплату «в рублях» — минус 3–5% на конвертации</text>
</svg>
