<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="system-ui,-apple-system,sans-serif">
<title>Как деньги превращаются в лари</title>
<desc>Три рабочих пути: наличные меняют в городском обменнике без комиссии, картой иностранного банка снимают лари в банкомате, перевод Золотой Короной выдают только в лари. Согласиться на оплату в рублях — минус 3-5 процентов.</desc>
<rect width="640" height="470" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">КАК ДЕНЬГИ СТАНОВЯТСЯ ЛАРИ</text>

<rect x="24" y="80" width="592" height="86" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="80" width="6" height="86" fill="#1a7f4b"/>
<text x="52" y="110" fill="#15171a" font-size="19" font-weight="600">Наличные рубли, доллары, евро</text>
<text x="52" y="136" fill="#1a7f4b" font-size="18" font-weight="700">городской обменник — без комиссии</text>
<text x="52" y="158" fill="#5c626b" font-size="15.5">в аэропорту и в банке курс заведомо хуже</text>

<rect x="24" y="182" width="592" height="86" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="182" width="6" height="86" fill="#8a6a10"/>
<text x="52" y="212" fill="#15171a" font-size="19" font-weight="600">Карта иностранного, неРФ банка</text>
<text x="52" y="238" fill="#8a6a10" font-size="18" font-weight="700">банкомат — плюс сбор за снятие</text>
<text x="52" y="260" fill="#5c626b" font-size="15.5">банкомат спросит валюту: выбирать лари, не рубли</text>

<rect x="24" y="284" width="592" height="86" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="284" width="6" height="86" fill="#8a6a10"/>
<text x="52" y="314" fill="#15171a" font-size="19" font-weight="600">Перевод «Золотой Короной»</text>
<text x="52" y="340" fill="#8a6a10" font-size="18" font-weight="700">касса — выдают только в лари</text>
<text x="52" y="362" fill="#5c626b" font-size="15.5">Тбилиси, Батуми, Кутаиси · 15–60 минут</text>

<rect x="24" y="392" width="592" height="58" rx="5" fill="none" stroke="#b3261e"/>
<rect x="24" y="392" width="6" height="58" fill="#b3261e"/>
<text x="52" y="418" fill="#b3261e" font-size="18" font-weight="700">Где теряют мгновенно</text>
<text x="52" y="440" fill="#5c626b" font-size="15.5">согласиться на оплату «в рублях» — минус 3–5% на конвертации</text>
</svg>
