<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="system-ui,-apple-system,sans-serif">
<title>Какие карты не работают за границей</title>
<desc>Российские Visa и Mastercard не работают нигде, Apple Pay через них отключён, PayPal заблокирован. МИР надёжен только в трёх странах.</desc>
<rect width="640" height="520" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ЧТО НЕ РАБОТАЕТ</text>
<text x="26" y="102" fill="#d44545" font-size="19" font-weight="700">×</text>
<text x="50" y="102" fill="#e8e0d0" font-size="17">Visa и Mastercard российских банков</text>
<text x="50" y="120" fill="#6b6455" font-size="14.5">не работают ни в одной стране</text>
<text x="26" y="152" fill="#d44545" font-size="19" font-weight="700">×</text>
<text x="50" y="152" fill="#e8e0d0" font-size="17">Apple Pay и Google Pay через них</text>
<text x="50" y="170" fill="#6b6455" font-size="14.5">отключены с мая 2022</text>
<text x="26" y="202" fill="#d44545" font-size="19" font-weight="700">×</text>
<text x="50" y="202" fill="#e8e0d0" font-size="17">PayPal российских счетов</text>
<text x="50" y="220" fill="#6b6455" font-size="14.5">заблокирован</text>
<text x="26" y="252" fill="#d44545" font-size="19" font-weight="700">×</text>
<text x="50" y="252" fill="#e8e0d0" font-size="17">JCB российских банков</text>
<text x="50" y="270" fill="#6b6455" font-size="14.5">за границей не принимают</text>
<text x="24" y="300" fill="#e8c062" font-size="18" font-weight="700">РАБОТАЮТ ЧАСТИЧНО</text>
<text x="26" y="346" fill="#e8c062" font-size="19" font-weight="700">~</text>
<text x="50" y="346" fill="#e8e0d0" font-size="17">МИР</text>
<text x="50" y="364" fill="#6b6455" font-size="14.5">надёжно: Беларусь, Абхазия, Южная Осетия</text>
<text x="26" y="396" fill="#e8c062" font-size="19" font-weight="700">~</text>
<text x="50" y="396" fill="#e8e0d0" font-size="17">UnionPay российских банков</text>
<text x="50" y="414" fill="#6b6455" font-size="14.5">принимают нестабильно, в ЕС и США — нет</text>
<text x="320" y="506" text-anchor="middle" fill="#a8a090" font-size="15.5">Рабочий UnionPay в 2026 — карта банка СНГ, не российского</text>
</svg>