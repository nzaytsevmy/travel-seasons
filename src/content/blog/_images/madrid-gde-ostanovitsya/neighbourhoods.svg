<svg xmlns="http://www.w3.org/2000/svg" width="560" height="820" viewBox="0 0 560 820" role="img" aria-labelledby="title desc">
  <title id="title">Расположение шести мест для проживания в Мадриде</title>
  <desc id="desc">Чамбери и Маласанья к северу от Соль, Ла-Латина к юго-западу, Летрас к юго-востоку, Ретиро к востоку. Схема условная, без расстояний и границ районов.</desc>
  <rect width="560" height="820" fill="#fbfbfa"/>
  <g font-family="Golos Text, Arial, sans-serif" fill="#15171a">
    <text x="28" y="48" font-size="28" font-weight="700">Где жить в Мадриде</text>
    <text x="28" y="80" font-size="19" fill="#5c626b">Расположение относительно центра</text>
    <path d="M493 153V105m-8 12 8-12 8 12" fill="none" stroke="#15171a" stroke-width="2"/>
    <text x="493" y="177" text-anchor="middle" font-size="18">Север</text>
    <path d="M210 215V293M210 370V433M210 481L110 593M239 487L340 560M240 460H430" stroke="#d9dbde" stroke-width="3" fill="none"/>
    <path d="M40 403H377" stroke="#1d40ae" stroke-width="3"/>
    <text x="42" y="393" font-size="19" fill="#1d40ae">Гран-Виа</text>
    <rect x="136" y="137" width="164" height="85" fill="#fbfbfa" stroke="#15171a"/>
    <text x="218" y="171" text-anchor="middle" font-size="23" font-weight="700">Чамбери</text>
    <text x="218" y="199" text-anchor="middle" font-size="18" fill="#5c626b">жить дольше</text>
    <rect x="125" y="290" width="185" height="85" fill="#fbfbfa" stroke="#15171a"/>
    <text x="218" y="324" text-anchor="middle" font-size="23" font-weight="700">Маласанья</text>
    <text x="218" y="352" text-anchor="middle" font-size="18" fill="#5c626b">вечерние выходы</text>
    <circle cx="210" cy="462" r="38" fill="#1d40ae"/>
    <text x="210" y="470" text-anchor="middle" font-size="23" font-weight="700" fill="#fbfbfa">Соль</text>
    <rect x="28" y="593" width="173" height="85" fill="#fbfbfa" stroke="#15171a"/>
    <text x="114" y="627" text-anchor="middle" font-size="23" font-weight="700">Ла-Латина</text>
    <text x="114" y="655" text-anchor="middle" font-size="18" fill="#5c626b">тапас и ужин</text>
    <rect x="269" y="550" width="170" height="112" fill="#fbfbfa" stroke="#15171a"/>
    <text x="354" y="583" text-anchor="middle" font-size="21" font-weight="700">Баррио де лас</text>
    <text x="354" y="610" text-anchor="middle" font-size="23" font-weight="700">Летрас</text>
    <text x="354" y="639" text-anchor="middle" font-size="18" fill="#5c626b">музеи и прогулки</text>
    <rect x="429" y="388" width="106" height="142" fill="#eef1f8" stroke="#1d40ae"/>
    <text x="482" y="443" text-anchor="middle" font-size="22" font-weight="700">Ретиро</text>
    <text x="482" y="473" text-anchor="middle" font-size="18" fill="#5c626b">парк</text>
    <text x="28" y="741" font-size="19">Это схема взаимного расположения.</text>
    <text x="28" y="770" font-size="19" fill="#5c626b">Улицы, границы и расстояния не показаны.</text>
  </g>
</svg>
