<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" font-family="system-ui,-apple-system,sans-serif">
<title>Путь денег при бронировании на Суточно.ру</title>
<desc>Схема: цена 17 325 рублей делится на предоплату картой 4 332 рубля и остаток наличными 12 993 рубля, сверху залог 5 000 рублей мимо площадки.</desc>
<rect width="640" height="720" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="19" font-weight="600" letter-spacing="1.5">КУДА УХОДЯТ ДЕНЬГИ ЗА БРОНЬ</text>
<text x="320" y="70" text-anchor="middle" fill="#a8a090" font-size="15">Сочи, 5 ночей на двоих, 15–20 сентября 2026</text>

<rect x="50" y="96" width="540" height="60" rx="6" fill="#1c1710" stroke="#3a3429"/>
<text x="70" y="124" fill="#e8e0d0" font-size="18">Цена в объявлении</text>
<text x="570" y="126" text-anchor="end" fill="#c9973a" font-size="23" font-weight="700">17 325 ₽</text>
<text x="70" y="146" fill="#a8a090" font-size="14">3 465 ₽ за ночь</text>

<line x1="320" y1="156" x2="320" y2="186" stroke="#3a3429" stroke-width="2"/>
<path d="M314 180 L320 190 L326 180 Z" fill="#3a3429"/>

<rect x="50" y="192" width="135" height="42" rx="4" fill="#5cc97a" opacity="0.9"/>
<rect x="185" y="192" width="405" height="42" rx="4" fill="#e8c062" opacity="0.85"/>
<text x="117" y="219" text-anchor="middle" fill="#0d0b07" font-size="16" font-weight="700">25%</text>
<text x="387" y="219" text-anchor="middle" fill="#0d0b07" font-size="16" font-weight="700">75%</text>

<rect x="50" y="254" width="255" height="150" rx="6" fill="#1c1710" stroke="#5cc97a" stroke-width="1.5"/>
<text x="70" y="284" fill="#5cc97a" font-size="15" font-weight="600">КАРТОЙ СЕЙЧАС</text>
<text x="70" y="316" fill="#e8e0d0" font-size="23" font-weight="700">4 332 ₽</text>
<text x="70" y="344" fill="#a8a090" font-size="14">СБП или карта,</text>
<text x="70" y="364" fill="#a8a090" font-size="14">в течение часа после</text>
<text x="70" y="384" fill="#a8a090" font-size="14">запроса на бронь</text>

<rect x="335" y="254" width="255" height="150" rx="6" fill="#1c1710" stroke="#e8c062" stroke-width="1.5"/>
<text x="355" y="284" fill="#e8c062" font-size="15" font-weight="600">ПРИ ЗАСЕЛЕНИИ</text>
<text x="355" y="316" fill="#e8e0d0" font-size="23" font-weight="700">12 993 ₽</text>
<text x="355" y="344" fill="#a8a090" font-size="14">способ оплаты задаёт</text>
<text x="355" y="364" fill="#a8a090" font-size="14">хозяин — у этого</text>
<text x="355" y="384" fill="#a8a090" font-size="14">объекта наличные</text>

<line x1="177" y1="404" x2="177" y2="436" stroke="#3a3429" stroke-width="2"/>
<path d="M171 430 L177 440 L183 430 Z" fill="#3a3429"/>

<rect x="50" y="442" width="540" height="118" rx="6" fill="#1c1710" stroke="#3a3429"/>
<text x="70" y="472" fill="#c9973a" font-size="15" font-weight="600">ВНУТРИ ПРЕДОПЛАТЫ СИДИТ ПЛАТА ПЛОЩАДКЕ</text>
<text x="70" y="500" fill="#e8e0d0" font-size="16">15–25% от стоимости проживания остаётся Суточно.ру.</text>
<text x="70" y="524" fill="#e8e0d0" font-size="16">Остаток предоплаты хозяин получает на следующий</text>
<text x="70" y="548" fill="#e8e0d0" font-size="16">день после того, как вы заселились.</text>

<rect x="50" y="584" width="540" height="100" rx="6" fill="#1c1710" stroke="#d44545" stroke-width="1.5"/>
<text x="70" y="614" fill="#d44545" font-size="15" font-weight="600">СВЕРХ ЦЕНЫ: ЗАЛОГ 5 000 ₽</text>
<text x="70" y="642" fill="#e8e0d0" font-size="16">Мимо площадки, из рук в руки хозяину.</text>
<text x="70" y="666" fill="#e8e0d0" font-size="16">Споры по нему поддержка не разбирает.</text>

<text x="320" y="706" text-anchor="middle" fill="#a8a090" font-size="13">Цены сняты на sutochno.ru 24 августа 2026, объявление 650257</text>
</svg>
