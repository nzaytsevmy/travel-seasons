<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="system-ui,-apple-system,sans-serif">
<title>Сроки брони на Суточно.ру: когда деньги ещё можно вернуть</title>
<desc>Временная шкала от запроса на бронь до дня после заезда с отметками, у кого в этот момент находятся деньги гостя.</desc>
<rect width="640" height="760" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="19" font-weight="600" letter-spacing="1.5">СРОКИ, КОТОРЫЕ РЕШАЮТ СУДЬБУ ДЕНЕГ</text>
<text x="320" y="70" text-anchor="middle" fill="#5c626b" font-size="15">По правилам бронирования Суточно.ру на 24 августа 2026</text>

<line x1="60" y1="106" x2="60" y2="670" stroke="#d9dbde" stroke-width="2"/>

<circle cx="60" cy="126" r="9" fill="#1d40ae"/>
<text x="92" y="120" fill="#15171a" font-size="18" font-weight="600">Запрос на бронь отправлен</text>
<text x="92" y="146" fill="#5c626b" font-size="15">Денег ещё никто не взял</text>

<circle cx="60" cy="212" r="9" fill="#1a7f4b"/>
<text x="92" y="206" fill="#15171a" font-size="18" font-weight="600">Час на предоплату</text>
<text x="92" y="232" fill="#5c626b" font-size="15">Не заплатили за час — бронь отменяется</text>
<text x="92" y="254" fill="#5c626b" font-size="15">сама, даты снова свободны</text>

<circle cx="60" cy="320" r="9" fill="#1a7f4b"/>
<text x="92" y="314" fill="#15171a" font-size="18" font-weight="600">Предоплата внесена</text>
<text x="92" y="340" fill="#5c626b" font-size="15">Деньги лежат на счёте площадки.</text>
<text x="92" y="362" fill="#5c626b" font-size="15">Открылся телефон хозяина. Спор по</text>
<text x="92" y="384" fill="#5c626b" font-size="15">быстрой брони — звонить за 24 часа</text>

<circle cx="60" cy="450" r="9" fill="#8a6a10"/>
<text x="92" y="444" fill="#15171a" font-size="18" font-weight="600">Окно отмены до заезда</text>
<text x="92" y="470" fill="#5c626b" font-size="15">Вернут предоплату за вычетом штрафа.</text>
<text x="92" y="492" fill="#5c626b" font-size="15">Размер штрафа назначает хозяин</text>
<text x="92" y="514" fill="#5c626b" font-size="15">в правилах своего объекта</text>

<circle cx="60" cy="580" r="9" fill="#b3261e"/>
<text x="92" y="574" fill="#15171a" font-size="18" font-weight="600">День заезда</text>
<text x="92" y="600" fill="#5c626b" font-size="15">Жильё не такое, как в объявлении —</text>
<text x="92" y="622" fill="#5c626b" font-size="15">звонить в поддержку в тот же день,</text>
<text x="92" y="644" fill="#5c626b" font-size="15">позже право на возврат не работает</text>

<circle cx="60" cy="700" r="9" fill="#b3261e"/>
<text x="92" y="694" fill="#15171a" font-size="18" font-weight="600">Следующий день после заезда</text>
<text x="92" y="720" fill="#5c626b" font-size="15">Предоплата уходит хозяину,</text>
<text x="92" y="742" fill="#5c626b" font-size="15">плата площадке считается полученной</text>
</svg>
