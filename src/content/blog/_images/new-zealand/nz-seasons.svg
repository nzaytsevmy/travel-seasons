<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" font-family="system-ui,-apple-system,sans-serif">
<title>Календарь сезонов Новой Зеландии: треккинг, лыжи и толпа не совпадают</title>
<desc>Шкала по месяцам с тремя колонками. Сезон хижин на Great Walks — с ноября по апрель, причём март и апрель идут светлой заливкой как более тихие. Горные лыжи в Квинстауне и Ванаке — с июня по сентябрь. Пик цен и толпы — с декабря по февраль, это местные летние каникулы.</desc>
<rect width="640" height="900" fill="#0e1214"/>

<text x="32" y="56" fill="#4fb3bf" font-size="23" font-weight="700">КОГДА ЕХАТЬ В НОВУЮ ЗЕЛАНДИЮ</text>
<text x="32" y="88" fill="#93a1a6" font-size="18">Времена года перевёрнуты: январь — лето, июль — зима</text>

<text x="300" y="140" fill="#e6edef" font-size="18" font-weight="600" text-anchor="middle">Хижины</text>
<text x="300" y="162" fill="#93a1a6" font-size="16" text-anchor="middle">на Great Walks</text>
<text x="424" y="140" fill="#e6edef" font-size="18" font-weight="600" text-anchor="middle">Горные</text>
<text x="424" y="162" fill="#93a1a6" font-size="16" text-anchor="middle">лыжи</text>
<text x="548" y="140" fill="#e6edef" font-size="18" font-weight="600" text-anchor="middle">Цены</text>
<text x="548" y="162" fill="#93a1a6" font-size="16" text-anchor="middle">и толпа</text>

<line x1="32" y1="180" x2="608" y2="180" stroke="#26333a" stroke-width="1.5"/>

<rect x="252" y="188" width="96" height="600" fill="#151d21"/>
<rect x="376" y="188" width="96" height="600" fill="#151d21"/>
<rect x="500" y="188" width="96" height="600" fill="#151d21"/>

<!-- 12 месяцев по 50px, старт y=188 -->
<!-- Хижины: янв-фев и ноя-дек — плотный сезон, мар-апр — тот же сезон, но тише -->
<rect x="252" y="188" width="96" height="100" rx="6" fill="#2f7d8f"/>
<rect x="252" y="288" width="96" height="100" rx="6" fill="#8fd3dd"/>
<text x="300" y="345" fill="#0e1214" font-size="17" font-weight="700" text-anchor="middle">тише</text>
<rect x="252" y="688" width="96" height="100" rx="6" fill="#2f7d8f"/>
<!-- Лыжи: июн-сен -->
<rect x="376" y="438" width="96" height="200" rx="6" fill="#7c93c9"/>
<!-- Цены и толпа: дек-фев -->
<rect x="500" y="188" width="96" height="100" rx="6" fill="#c9663a"/>
<rect x="500" y="738" width="96" height="50" rx="6" fill="#c9663a"/>
<text x="548" y="245" fill="#0e1214" font-size="17" font-weight="700" text-anchor="middle">пик</text>

<g font-size="19" fill="#93a1a6">
<text x="32" y="220">январь</text>
<text x="32" y="270">февраль</text>
<text x="32" y="320" fill="#e6edef" font-weight="600">март</text>
<text x="32" y="370" fill="#e6edef" font-weight="600">апрель</text>
<text x="32" y="420">май</text>
<text x="32" y="470">июнь</text>
<text x="32" y="520">июль</text>
<text x="32" y="570">август</text>
<text x="32" y="620">сентябрь</text>
<text x="32" y="670">октябрь</text>
<text x="32" y="720">ноябрь</text>
<text x="32" y="770">декабрь</text>
</g>
<g stroke="#26333a" stroke-width="1">
<line x1="32" y1="238" x2="608" y2="238"/>
<line x1="32" y1="288" x2="608" y2="288"/>
<line x1="32" y1="338" x2="608" y2="338"/>
<line x1="32" y1="388" x2="608" y2="388"/>
<line x1="32" y1="438" x2="608" y2="438"/>
<line x1="32" y1="488" x2="608" y2="488"/>
<line x1="32" y1="538" x2="608" y2="538"/>
<line x1="32" y1="588" x2="608" y2="588"/>
<line x1="32" y1="638" x2="608" y2="638"/>
<line x1="32" y1="688" x2="608" y2="688"/>
<line x1="32" y1="738" x2="608" y2="738"/>
</g>
<line x1="228" y1="288" x2="228" y2="388" stroke="#8fd3dd" stroke-width="4"/>

<line x1="32" y1="812" x2="608" y2="812" stroke="#26333a" stroke-width="1.5"/>
<text x="32" y="842" fill="#c3ced2" font-size="17">Март и апрель: хижины открыты, пиковых цен нет.</text>
<text x="32" y="872" fill="#93a1a6" font-size="16">Сезон хижин — Департамент охраны природы, 1 ноября — 30 апреля.</text>
</svg>
