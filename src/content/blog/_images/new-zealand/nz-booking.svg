<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 880" width="640" height="880" font-family="system-ui,-apple-system,sans-serif">
<title>Хижины на Great Walks бронируют за полгода до сезона</title>
<desc>Вертикальная шкала времени от мая 2026 до апреля 2027. Продажи мест на сезон 2026/27 открыли 12–21 мая 2026 года. Сам сезон идёт с 1 ноября 2026 по 30 апреля 2027. Тот, кто планирует поездку в августе 2026, приходит через три месяца после открытия продаж и за два месяца до начала сезона.</desc>
<rect width="640" height="880" fill="#0e1214"/>

<text x="32" y="52" fill="#4fb3bf" font-size="22" font-weight="700">ХИЖИНЫ РАЗБИРАЮТ ЗА ПОЛГОДА</text>
<text x="32" y="82" fill="#4fb3bf" font-size="22" font-weight="700">ДО СЕЗОНА</text>
<text x="32" y="114" fill="#93a1a6" font-size="18">Сезон 2026/27: когда открыли продажи и когда ходят</text>

<line x1="32" y1="140" x2="608" y2="140" stroke="#26333a" stroke-width="1.5"/>

<!-- ось: 12 месяцев по 52px, старт y=176 -->
<line x1="196" y1="176" x2="196" y2="800" stroke="#26333a" stroke-width="2"/>

<g font-size="19" fill="#93a1a6">
<text x="32" y="206">май 2026</text>
<text x="32" y="258">июнь</text>
<text x="32" y="310">июль</text>
<text x="32" y="362" fill="#e6edef" font-weight="700">август</text>
<text x="32" y="414">сентябрь</text>
<text x="32" y="466">октябрь</text>
<text x="32" y="518">ноябрь</text>
<text x="32" y="570">декабрь</text>
<text x="32" y="622">январь 2027</text>
<text x="32" y="674">февраль</text>
<text x="32" y="726">март</text>
<text x="32" y="778">апрель</text>
</g>

<!-- полоса сезона: ноябрь–апрель -->
<rect x="228" y="500" width="76" height="300" rx="8" fill="#2f7d8f"/>
<text x="266" y="662" fill="#0e1214" font-size="19" font-weight="700" text-anchor="middle" transform="rotate(-90 266 662)">сезон хижин</text>
<text x="320" y="518" fill="#c3ced2" font-size="17">с 1 ноября 2026</text>
<text x="320" y="794" fill="#c3ced2" font-size="17">по 30 апреля 2027</text>

<!-- продажи -->
<circle cx="196" cy="200" r="9" fill="#c9663a"/>
<rect x="228" y="176" width="76" height="30" rx="8" fill="#c9663a"/>
<text x="320" y="198" fill="#c9663a" font-size="19" font-weight="700">12–21 мая: продажи</text>
<text x="320" y="224" fill="#93a1a6" font-size="16">Милфорд 13-го, Абель-Тасман 14-го,</text>
<text x="320" y="246" fill="#93a1a6" font-size="16">Рутберн 15-го, Кеплер 19-го,</text>
<text x="320" y="268" fill="#93a1a6" font-size="16">Тонгариро и Ракиура 21-го</text>

<!-- вы здесь -->
<circle cx="196" cy="356" r="9" fill="#e6edef"/>
<text x="320" y="350" fill="#e6edef" font-size="19" font-weight="700">август 2026 — вы здесь</text>
<text x="320" y="376" fill="#93a1a6" font-size="16">три месяца после старта продаж,</text>
<text x="320" y="398" fill="#93a1a6" font-size="16">два месяца до начала сезона</text>

<line x1="32" y1="826" x2="608" y2="826" stroke="#26333a" stroke-width="1.5"/>
<text x="32" y="856" fill="#c3ced2" font-size="17">Кто собирается на декабрь и январь, выбирает из остатков.</text>
</svg>
