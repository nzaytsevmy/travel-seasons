<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui,-apple-system,sans-serif">
<title>Правило жидкостей в ручной клади</title>
<desc>Каждая ёмкость до ста миллилитров, все вместе в одном прозрачном пакете до литра, один пакет на пассажира. Лекарства и детское питание — сверх нормы.</desc>
<rect width="640" height="640" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ЖИДКОСТИ В РУЧНОЙ КЛАДИ:</text>
<text x="320" y="74" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ТРИ ЦИФРЫ, КОТОРЫЕ ПРОВЕРЯЮТ</text>
<rect x="24" y="130" width="592" height="120" rx="5" fill="none" stroke="#3a3429"/>
<text x="52" y="182" fill="#c9973a" font-size="38" font-weight="700">100 мл</text>
<text x="52" y="210" fill="#e8e0d0" font-size="19" font-weight="600">максимум в одной ёмкости</text>
<text x="52" y="234" fill="#a8a090" font-size="16">считают маркировку упаковки, а не остаток на донышке</text>
<rect x="24" y="270" width="592" height="120" rx="5" fill="none" stroke="#3a3429"/>
<text x="52" y="322" fill="#c9973a" font-size="38" font-weight="700">1 литр</text>
<text x="52" y="350" fill="#e8e0d0" font-size="19" font-weight="600">общий объём пакета</text>
<text x="52" y="374" fill="#a8a090" font-size="16">прозрачный, с застёжкой, у части перевозчиков 18×20 см</text>
<rect x="24" y="410" width="592" height="120" rx="5" fill="none" stroke="#3a3429"/>
<text x="52" y="462" fill="#c9973a" font-size="38" font-weight="700">1 пакет</text>
<text x="52" y="490" fill="#e8e0d0" font-size="19" font-weight="600">на одного пассажира</text>
<text x="52" y="514" fill="#a8a090" font-size="16">второй не пропустят, даже если он полупустой</text>
<text x="320" y="576" text-anchor="middle" fill="#5cc97a" font-size="18" font-weight="600">Сверх нормы можно: лекарства,</text>
<text x="320" y="600" text-anchor="middle" fill="#5cc97a" font-size="18" font-weight="600">детское питание, диетические продукты</text>
<text x="320" y="630" text-anchor="middle" fill="#6b6455" font-size="15">На психотропные препараты нужны документы</text>
</svg>