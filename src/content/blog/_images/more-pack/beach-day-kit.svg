<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 670" width="640" height="670" font-family="system-ui,-apple-system,sans-serif">
<title>Что берут на пляж на день, а что оставляют в сейфе</title>
<desc>В рюкзак на день: два купальника, полотенце из микрофибры, маска, крем, головной убор, вода и деньги на день. В сейфе остаются паспорт, все деньги и дорогая техника.</desc>
<rect width="640" height="670" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">НА ПЛЯЖ НА ОДИН ДЕНЬ</text>
<rect x="24" y="90" width="592" height="250" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="90" width="6" height="250" fill="#5cc97a"/>
<text x="52" y="124" fill="#5cc97a" font-size="21" font-weight="700">В РЮКЗАК</text>
<circle cx="58" cy="152" r="4" fill="#5cc97a"/>
<text x="76" y="159" fill="#e8e0d0" font-size="19">купальник и запасной</text>
<circle cx="58" cy="186" r="4" fill="#5cc97a"/>
<text x="76" y="193" fill="#e8e0d0" font-size="19">полотенце из микрофибры</text>
<circle cx="58" cy="220" r="4" fill="#5cc97a"/>
<text x="76" y="227" fill="#e8e0d0" font-size="19">маска и трубка</text>
<circle cx="58" cy="254" r="4" fill="#5cc97a"/>
<text x="76" y="261" fill="#e8e0d0" font-size="19">крем SPF50</text>
<circle cx="58" cy="288" r="4" fill="#5cc97a"/>
<text x="76" y="295" fill="#e8e0d0" font-size="19">головной убор и очки</text>
<circle cx="58" cy="322" r="4" fill="#5cc97a"/>
<text x="76" y="329" fill="#e8e0d0" font-size="19">вода и деньги на день</text>
<rect x="24" y="374" width="592" height="182" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="374" width="6" height="182" fill="#d44545"/>
<text x="52" y="408" fill="#d44545" font-size="21" font-weight="700">ОСТАВИТЬ В СЕЙФЕ</text>
<circle cx="58" cy="436" r="4" fill="#d44545"/>
<text x="76" y="443" fill="#e8e0d0" font-size="19">загранпаспорт</text>
<circle cx="58" cy="470" r="4" fill="#d44545"/>
<text x="76" y="477" fill="#e8e0d0" font-size="19">все деньги и карты</text>
<circle cx="58" cy="504" r="4" fill="#d44545"/>
<text x="76" y="511" fill="#e8e0d0" font-size="19">ноутбук и дорогая камера</text>
<circle cx="58" cy="538" r="4" fill="#d44545"/>
<text x="76" y="545" fill="#e8e0d0" font-size="19">украшения и часы</text>
<text x="320" y="636" text-anchor="middle" fill="#6b6455" font-size="16">Кражи случаются не там, где опасно,</text>
<text x="320" y="658" text-anchor="middle" fill="#6b6455" font-size="16">а там, где вещи лежат без присмотра</text>
</svg>