<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 630" width="640" height="630" font-family="system-ui,-apple-system,sans-serif">
<title>Личная вещь, ручная кладь и багаж — в чём разница</title>
<desc>Три вида поклажи: личная вещь под сиденьем входит почти в любой тариф, ручная кладь на полке и багаж в отсеке зависят от тарифа, а не от авиакомпании.</desc>
<rect width="640" height="630" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ЧТО ВХОДИТ В ВАШ ТАРИФ</text>
<rect x="24" y="100" width="592" height="130" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="100" width="6" height="130" fill="#5cc97a"/>
<text x="52" y="138" fill="#5cc97a" font-size="22" font-weight="700">ЛИЧНАЯ ВЕЩЬ</text>
<text x="52" y="166" fill="#a8a090" font-size="18">под сиденьем впереди</text>
<text x="52" y="196" fill="#e8e0d0" font-size="19" font-weight="600">входит почти в любой тариф,</text>
<text x="52" y="218" fill="#e8e0d0" font-size="19" font-weight="600">включая самый дешёвый</text>
<rect x="24" y="250" width="592" height="130" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="250" width="6" height="130" fill="#e8c062"/>
<text x="52" y="288" fill="#e8c062" font-size="22" font-weight="700">РУЧНАЯ КЛАДЬ</text>
<text x="52" y="316" fill="#a8a090" font-size="18">на полке над головой</text>
<text x="52" y="346" fill="#e8e0d0" font-size="19" font-weight="600">на базовых тарифах</text>
<text x="52" y="368" fill="#e8e0d0" font-size="19" font-weight="600">чаще всего НЕ входит</text>
<rect x="24" y="400" width="592" height="130" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="400" width="6" height="130" fill="#d44545"/>
<text x="52" y="438" fill="#d44545" font-size="22" font-weight="700">БАГАЖ</text>
<text x="52" y="466" fill="#a8a090" font-size="18">сдаётся на стойке</text>
<text x="52" y="496" fill="#e8e0d0" font-size="19" font-weight="600">зависит от тарифа,</text>
<text x="52" y="518" fill="#e8e0d0" font-size="19" font-weight="600">а не от авиакомпании</text>
<text x="320" y="606" text-anchor="middle" fill="#6b6455" font-size="16">Норму задаёт ваш тариф в билете,</text>
<text x="320" y="626" text-anchor="middle" fill="#6b6455" font-size="16">а не страница авиакомпании</text>
</svg>