<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 526" width="640" height="526" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько стоит день в Рускеале из Петербурга</title>
<desc>Поездка на человека обходится в шесть-девять тысяч рублей: дорога, входной билет за 750 рублей, экскурсия и еда.</desc>
<rect width="640" height="526" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ДЕНЬ В РУСКЕАЛЕ: ИЗ ЧЕГО ЦЕНА</text>
<text x="320" y="84" text-anchor="middle" fill="#5cc97a" font-size="20" font-weight="700">6000–9000 ₽ на человека</text>
<text x="320" y="108" text-anchor="middle" fill="#a8a090" font-size="16">однодневная поездка из Петербурга</text>
<line x1="24" y1="128" x2="616" y2="128" stroke="#3a3429"/>
<text x="24" y="166" fill="#e8e0d0" font-size="18" font-weight="600">«Ласточка» из Петербурга</text>
<text x="616" y="166" text-anchor="end" fill="#7fb5c9" font-size="18" font-weight="700">2500–3500 ₽</text>
<text x="24" y="186" fill="#6b6455" font-size="14.5">туда-обратно</text>
<text x="24" y="224" fill="#e8e0d0" font-size="18" font-weight="600">«Рускеальский экспресс»</text>
<text x="616" y="224" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">от 3000 ₽</text>
<text x="24" y="244" fill="#6b6455" font-size="14.5">туда-обратно, ретропоезд</text>
<text x="24" y="282" fill="#e8e0d0" font-size="18" font-weight="600">Входной билет</text>
<text x="616" y="282" text-anchor="end" fill="#5cc97a" font-size="18" font-weight="700">750 ₽</text>
<text x="24" y="302" fill="#6b6455" font-size="14.5">студентам и 60+ — 650</text>
<text x="24" y="340" fill="#e8e0d0" font-size="18" font-weight="600">Экскурсия по выбору</text>
<text x="616" y="340" text-anchor="end" fill="#e8c062" font-size="18" font-weight="700">950–2500 ₽</text>
<text x="24" y="360" fill="#6b6455" font-size="14.5">каньон или затопленные штольни</text>
<text x="24" y="398" fill="#e8e0d0" font-size="18" font-weight="600">Еда на месте</text>
<text x="616" y="398" text-anchor="end" fill="#a8a090" font-size="18" font-weight="700">500–800 ₽</text>
<text x="320" y="466" text-anchor="middle" fill="#5cc97a" font-size="17" font-weight="600">Компанией на машине выходит дешевле:</text>
<text x="320" y="490" text-anchor="middle" fill="#a8a090" font-size="16">дорога делится на всех, парковка бесплатная,</text>
<text x="320" y="512" text-anchor="middle" fill="#a8a090" font-size="16">дети до 7 лет проходят без билета</text>
</svg>