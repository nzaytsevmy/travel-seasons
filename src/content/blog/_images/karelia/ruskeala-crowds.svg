<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 508" width="640" height="508" font-family="system-ui,-apple-system,sans-serif">
<title>Когда ехать в Рускеалу, чтобы не попасть в толпу</title>
<desc>Приезжать к открытию в будний день: автобусные экскурсии из Петербурга привозят к середине дня. Поздней осенью и ранней весной посетителей меньше всего.</desc>
<rect width="640" height="508" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">КАК НЕ ПОПАСТЬ В ТОЛПУ</text>
<rect x="24" y="84" width="592" height="78" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="84" width="6" height="78" fill="#1a7f4b"/>
<text x="52" y="114" fill="#1a7f4b" font-size="18" font-weight="700">До 11 утра</text>
<text x="52" y="138" fill="#15171a" font-size="17">парк почти пустой</text>
<text x="52" y="156" fill="#5c626b" font-size="15">автобусы приходят к середине дня</text>
<rect x="24" y="176" width="592" height="78" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="176" width="6" height="78" fill="#1a7f4b"/>
<text x="52" y="206" fill="#1a7f4b" font-size="18" font-weight="700">Будний день</text>
<text x="52" y="230" fill="#15171a" font-size="17">местные советуют избегать выходных</text>
<rect x="24" y="268" width="592" height="78" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="268" width="6" height="78" fill="#2b6f8a"/>
<text x="52" y="298" fill="#2b6f8a" font-size="18" font-weight="700">Поздняя осень и ранняя весна</text>
<text x="52" y="322" fill="#15171a" font-size="17">самые пустые кадры</text>
<text x="52" y="340" fill="#5c626b" font-size="15">но без летней зелени</text>
<rect x="24" y="360" width="592" height="78" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="360" width="6" height="78" fill="#8a6a10"/>
<text x="52" y="390" fill="#8a6a10" font-size="18" font-weight="700">Зимой с 1 ноября по 8 марта</text>
<text x="52" y="414" fill="#15171a" font-size="17">художественная подсветка</text>
<text x="52" y="432" fill="#5c626b" font-size="15">и ледовые скульптуры в темноте</text>
<text x="320" y="494" text-anchor="middle" fill="#8a9099" font-size="15.5">Парк открывается в 10:00</text>
</svg>