<svg xmlns="http://www.w3.org/2000/svg" width="400" height="860" viewBox="0 0 400 860" role="img" aria-labelledby="title desc">
<title id="title">Точки прогулки по Ретиро с севера на юг</title><desc id="desc">Вход от площади Независимости северо-западнее большого пруда. Южнее пруда — павильон Веласкеса, затем Хрустальный дворец; розарий дальше к юго-востоку. Партер западнее павильонов. Линии обозначают порядок осмотра, а не доступные дорожки.</desc>
<rect width="400" height="860" fill="#fbfbfa"/>
<g font-family="Golos Text, Arial, sans-serif" fill="#15171a">
<text x="20" y="40" font-size="25" font-weight="700">Ретиро: порядок остановок</text>
<text x="20" y="72" font-size="20" fill="#5c626b">Короткий заход и путь на юг</text>
<path d="M365 154V110m-8 12 8-12 8 12" fill="none" stroke="#15171a" stroke-width="2"/><text x="365" y="181" text-anchor="middle" font-size="20">С</text>
<path d="M55 205L160 287" stroke="#1d40ae" stroke-width="4" fill="none"/>
<path d="M215 345L230 410L215 520L275 660" stroke="#1d40ae" stroke-width="3" stroke-dasharray="8 7" fill="none"/>
<circle cx="55" cy="205" r="7" fill="#1d40ae"/><text x="20" y="125" font-size="22" font-weight="700">Площадь</text><text x="20" y="153" font-size="22" font-weight="700">Независимости</text><text x="20" y="181" font-size="20">вход у северо-западного угла</text>
<rect x="160" y="249" width="112" height="96" fill="#eef1f8" stroke="#1d40ae" stroke-width="2"/>
<text x="216" y="285" text-anchor="middle" font-size="22" font-weight="700">Большой</text><text x="216" y="314" text-anchor="middle" font-size="22" font-weight="700">пруд</text>
<circle cx="230" cy="410" r="7" fill="#1d40ae"/><text x="247" y="399" font-size="22">Павильон</text><text x="247" y="428" font-size="22">Веласкеса</text>
<circle cx="215" cy="520" r="7" fill="#1d40ae"/><text x="232" y="508" font-size="22">Хрустальный</text><text x="232" y="537" font-size="22">дворец</text><text x="232" y="566" font-size="20" fill="#5c626b">внутрь закрыт</text>
<rect x="20" y="445" width="110" height="62" fill="#fbfbfa" stroke="#5c626b"/><text x="75" y="484" text-anchor="middle" font-size="22">Партер</text><text x="20" y="540" font-size="20" fill="#5c626b">отдельная</text><text x="20" y="567" font-size="20" fill="#5c626b">петля</text>
<circle cx="275" cy="660" r="7" fill="#1d40ae"/><text x="220" y="701" font-size="22" font-weight="700">Розарий</text>
<text x="20" y="756" font-size="20">Схема без масштаба.</text><text x="20" y="784" font-size="20">Линии — порядок точек, не навигация.</text><text x="20" y="812" font-size="20">Выбирайте открытые аллеи на месте.</text>
</g></svg>