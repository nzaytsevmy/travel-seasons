<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Шкала сроков: десять минут на оплату, сутки на подтверждение брони, срок второго платежа при оплате по частям">
  <rect width="640" height="640" fill="#131009"/>
  <text x="32" y="50" fill="#e8e0d0" font-family="Georgia, serif" font-size="25">Три срока, на которых</text>
  <text x="32" y="82" fill="#e8e0d0" font-family="Georgia, serif" font-size="25">теряют деньги</text>
  <line x1="32" y1="102" x2="608" y2="102" stroke="#3a3429"/>

  <line x1="72" y1="140" x2="72" y2="540" stroke="#3a3429" stroke-width="2"/>

  <circle cx="72" cy="170" r="9" fill="#c9973a"/>
  <text x="106" y="164" fill="#e8e0d0" font-family="Georgia, serif" font-size="20">10 минут на оплату</text>
  <text x="106" y="192" fill="#a8a090" font-family="Georgia, serif" font-size="15">Не успели — бронирование</text>
  <text x="106" y="214" fill="#a8a090" font-family="Georgia, serif" font-size="15">оформляют заново, цена может</text>
  <text x="106" y="236" fill="#a8a090" font-family="Georgia, serif" font-size="15">оказаться другой</text>

  <circle cx="72" cy="310" r="9" fill="#c9973a"/>
  <text x="106" y="304" fill="#e8e0d0" font-family="Georgia, serif" font-size="20">24 часа на подтверждение</text>
  <text x="106" y="332" fill="#a8a090" font-family="Georgia, serif" font-size="15">Отель не подтвердил за сутки —</text>
  <text x="106" y="354" fill="#a8a090" font-family="Georgia, serif" font-size="15">бронь считается аннулированной,</text>
  <text x="106" y="376" fill="#a8a090" font-family="Georgia, serif" font-size="15">деньги возвращают</text>

  <circle cx="72" cy="450" r="9" fill="#c9973a"/>
  <text x="106" y="444" fill="#e8e0d0" font-family="Georgia, serif" font-size="20">Второй платёж по частям</text>
  <text x="106" y="472" fill="#a8a090" font-family="Georgia, serif" font-size="15">Просрочили — бронь отменят,</text>
  <text x="106" y="494" fill="#c9973a" font-family="Georgia, serif" font-size="15">и удержат штраф за отмену</text>

  <line x1="32" y1="576" x2="608" y2="576" stroke="#3a3429"/>
  <text x="32" y="612" fill="#a8a090" font-family="Georgia, serif" font-size="14">По условиям бронирования, редакция 20 июля 2026 года</text>
</svg>
