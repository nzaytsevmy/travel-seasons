<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" role="img" aria-label="Развилка после запроса на возврат: отель может вернуть всё, предложить часть или отказать, а молчание гостя считается отказом от предложения">
  <rect width="640" height="700" fill="#131009"/>
  <text x="32" y="50" fill="#e8e0d0" font-family="Georgia, serif" font-size="25">Что будет после запроса</text>
  <text x="32" y="82" fill="#e8e0d0" font-family="Georgia, serif" font-size="25">на возврат</text>
  <line x1="32" y1="102" x2="608" y2="102" stroke="#3a3429"/>

  <rect x="180" y="132" width="280" height="66" fill="none" stroke="#c9973a" stroke-width="1.5"/>
  <text x="204" y="172" fill="#e8e0d0" font-family="Georgia, serif" font-size="19">Вы просите вернуть деньги</text>

  <line x1="320" y1="198" x2="320" y2="238" stroke="#3a3429" stroke-width="2"/>
  <line x1="110" y1="238" x2="530" y2="238" stroke="#3a3429" stroke-width="2"/>
  <line x1="110" y1="238" x2="110" y2="278" stroke="#3a3429" stroke-width="2"/>
  <line x1="320" y1="238" x2="320" y2="278" stroke="#3a3429" stroke-width="2"/>
  <line x1="530" y1="238" x2="530" y2="278" stroke="#3a3429" stroke-width="2"/>

  <rect x="40" y="278" width="140" height="96" fill="none" stroke="#3a3429" stroke-width="1.5"/>
  <text x="58" y="312" fill="#e8e0d0" font-family="Georgia, serif" font-size="17">Вернут</text>
  <text x="58" y="336" fill="#e8e0d0" font-family="Georgia, serif" font-size="17">полностью</text>
  <text x="58" y="360" fill="#a8a090" font-family="Georgia, serif" font-size="14">бронь отменят</text>

  <rect x="250" y="278" width="140" height="96" fill="none" stroke="#c9973a" stroke-width="2"/>
  <text x="268" y="312" fill="#e8e0d0" font-family="Georgia, serif" font-size="17">Предложат</text>
  <text x="268" y="336" fill="#e8e0d0" font-family="Georgia, serif" font-size="17">часть</text>
  <text x="268" y="360" fill="#c9973a" font-family="Georgia, serif" font-size="14">нужен ваш ответ</text>

  <rect x="460" y="278" width="140" height="96" fill="none" stroke="#3a3429" stroke-width="1.5"/>
  <text x="478" y="312" fill="#e8e0d0" font-family="Georgia, serif" font-size="17">Откажут</text>
  <text x="478" y="336" fill="#a8a090" font-family="Georgia, serif" font-size="14">сервис своих</text>
  <text x="478" y="358" fill="#a8a090" font-family="Georgia, serif" font-size="14">денег не добавит</text>

  <line x1="320" y1="374" x2="320" y2="424" stroke="#c9973a" stroke-width="2"/>
  <polygon points="320,432 314,420 326,420" fill="#c9973a"/>
  <rect x="120" y="432" width="400" height="96" fill="none" stroke="#c9973a" stroke-width="2"/>
  <text x="144" y="468" fill="#e8e0d0" font-family="Georgia, serif" font-size="18">Промолчали в срок —</text>
  <text x="144" y="496" fill="#c9973a" font-family="Georgia, serif" font-size="18">это считается отказом</text>
  <text x="144" y="518" fill="#a8a090" font-family="Georgia, serif" font-size="14">от предложенной части</text>

  <line x1="32" y1="586" x2="608" y2="586" stroke="#3a3429"/>
  <text x="32" y="624" fill="#e8e0d0" font-family="Georgia, serif" font-size="17">Решение принимает отель.</text>
  <text x="32" y="650" fill="#e8e0d0" font-family="Georgia, serif" font-size="17">Сервис только передаёт просьбу.</text>
  <text x="32" y="678" fill="#a8a090" font-family="Georgia, serif" font-size="14">По условиям бронирования, редакция 20 июля 2026 года</text>
</svg>
