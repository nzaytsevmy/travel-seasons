<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" role="img" aria-label="Схема: деньги идут через сервис, но договор у гостя с отелем, и решение о возврате принимает отель">
  <rect width="640" height="620" fill="#131009"/>
  <text x="32" y="50" fill="#e8e0d0" font-family="Georgia, serif" font-size="25">Кто с кем в договоре</text>
  <text x="32" y="80" fill="#a8a090" font-family="Georgia, serif" font-size="16">и кто решает вопрос о возврате</text>
  <line x1="32" y1="100" x2="608" y2="100" stroke="#3a3429"/>

  <rect x="48" y="130" width="230" height="86" fill="none" stroke="#c9973a" stroke-width="1.5"/>
  <text x="72" y="168" fill="#e8e0d0" font-family="Georgia, serif" font-size="21">Вы</text>
  <text x="72" y="196" fill="#a8a090" font-family="Georgia, serif" font-size="15">платите картой</text>

  <rect x="362" y="130" width="230" height="86" fill="none" stroke="#3a3429" stroke-width="1.5"/>
  <text x="386" y="168" fill="#e8e0d0" font-family="Georgia, serif" font-size="21">Сервис</text>
  <text x="386" y="196" fill="#a8a090" font-family="Georgia, serif" font-size="15">принимает деньги</text>

  <line x1="278" y1="173" x2="352" y2="173" stroke="#c9973a" stroke-width="2"/>
  <polygon points="362,173 348,167 348,179" fill="#c9973a"/>

  <rect x="362" y="300" width="230" height="110" fill="none" stroke="#c9973a" stroke-width="2"/>
  <text x="386" y="340" fill="#e8e0d0" font-family="Georgia, serif" font-size="21">Отель</text>
  <text x="386" y="368" fill="#a8a090" font-family="Georgia, serif" font-size="15">или хозяин квартиры</text>
  <text x="386" y="392" fill="#c9973a" font-family="Georgia, serif" font-size="15">решает про возврат</text>

  <line x1="477" y1="216" x2="477" y2="292" stroke="#3a3429" stroke-width="2"/>
  <polygon points="477,300 471,288 483,288" fill="#3a3429"/>

  <line x1="163" y1="216" x2="163" y2="355" stroke="#c9973a" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="163" y1="355" x2="352" y2="355" stroke="#c9973a" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="362,355 348,349 348,361" fill="#c9973a"/>
  <text x="60" y="270" fill="#c9973a" font-family="Georgia, serif" font-size="16">договор</text>
  <text x="60" y="292" fill="#c9973a" font-family="Georgia, serif" font-size="16">напрямую</text>

  <line x1="32" y1="470" x2="608" y2="470" stroke="#3a3429"/>
  <text x="32" y="508" fill="#e8e0d0" font-family="Georgia, serif" font-size="17">Деньги идут через сервис,</text>
  <text x="32" y="534" fill="#e8e0d0" font-family="Georgia, serif" font-size="17">а обязательства — у отеля перед вами.</text>
  <text x="32" y="566" fill="#a8a090" font-family="Georgia, serif" font-size="14">По условиям бронирования, редакция 20 июля 2026 года</text>
</svg>
