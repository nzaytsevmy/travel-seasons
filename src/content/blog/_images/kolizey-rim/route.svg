<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 650" role="img" aria-labelledby="title desc">
<title id="title">Колизей и соседние археологические зоны</title>
<desc id="desc">Условный план: Форум северо-западнее Колизея, Палатин юго-западнее. Колизей и Форум–Палатин имеют отдельные входы. Арка Константина находится между Колизеем и Палатином. Это не навигационная карта.</desc>
<rect width="420" height="650" fill="#fbfbfa"/>
<g font-family="'Golos Text',Arial,sans-serif" fill="#15171a">
<text x="24" y="38" font-size="25" font-weight="700">Один билет — два входа</text>
<text x="24" y="68" font-size="18" fill="#555c66">Условный план, без масштаба</text>
<path d="M44 118 L174 105 L222 173 L174 243 L46 213 Z" fill="#eceef3" stroke="#858d9a" stroke-width="2"/>
<text x="67" y="166" font-size="23" font-weight="700">Форум</text>
<text x="58" y="194" font-size="18">руины и улицы</text>
<path d="M47 256 Q88 228 168 263 L191 380 L109 405 L39 357 Z" fill="#edf0e9" stroke="#858d9a" stroke-width="2"/>
<text x="60" y="319" font-size="23" font-weight="700">Палатин</text>
<text x="60" y="346" font-size="18">подъём на холм</text>
<ellipse cx="302" cy="279" rx="86" ry="67" fill="#e5eafb" stroke="#1d40ae" stroke-width="3"/>
<ellipse cx="302" cy="279" rx="49" ry="35" fill="#fbfbfa" stroke="#1d40ae" stroke-width="2"/>
<text x="245" y="176" font-size="22" font-weight="700">Колизей</text>
<text x="257" y="285" font-size="18">арена</text>
<path d="M234 341 v38 h16 v-19 q10-17 20 0 v19 h16 v-38 Z" fill="none" stroke="#15171a" stroke-width="3"/>
<text x="214" y="411" font-size="18">Арка Константина</text>
<path d="M202 217 L218 240 M258 337 L247 349" stroke="#1d40ae" stroke-width="5"/>
<circle cx="201" cy="215" r="13" fill="#1d40ae"/><text x="196" y="222" font-size="18" fill="#fff">2</text>
<circle cx="249" cy="341" r="13" fill="#1d40ae"/><text x="244" y="348" font-size="18" fill="#fff">1</text>
<path d="M210 223 C201 260 215 310 241 331" fill="none" stroke="#858d9a" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M24 448 H396" stroke="#bec4ce"/>
<text x="24" y="481" font-size="21" font-weight="700">1 · Колизей: свой слот</text>
<text x="24" y="511" font-size="18">Вход зависит от типа билета.</text>
<text x="24" y="548" font-size="21" font-weight="700">2 · Форум и Палатин</text>
<text x="24" y="578" font-size="18">Отдельная проверка билета.</text>
<text x="24" y="616" font-size="18" fill="#555c66">Точный турникет — в вашем билете.</text>
</g></svg>
