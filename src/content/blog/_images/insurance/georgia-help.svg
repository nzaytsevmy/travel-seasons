<svg xmlns="http://www.w3.org/2000/svg" width="480" height="780" viewBox="0 0 480 780">
<title>Как получить помощь в Грузии</title>
<desc>При непосредственной угрозе жизни: экстренная помощь 112 без ожидания страховщика, затем связь с ассистансом, когда возможно. Если состояние позволяет согласование: ассистанс, клиника и гарантия оплаты, сохранение документов.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d40ae"/></marker></defs>
<rect width="480" height="780" fill="#fbfbfa"/>
<g fill="#15171a" font-family="Golos Text,Arial,sans-serif" font-size="24">
<text x="24" y="45" font-family="Old Standard TT,Georgia,serif" font-size="31">Кому звонить первым</text>
<path d="M240 80L325 160L240 240L155 160Z" fill="none" stroke="#1d40ae" stroke-width="1.5"/>
<text x="240" y="154" text-anchor="middle">Угроза</text><text x="240" y="184" text-anchor="middle">жизни?</text>
<g fill="none" stroke="#1d40ae" stroke-width="1.5" marker-end="url(#arrow)">
<path d="M155 160H120V280"/><path d="M325 160H360V280"/>
<path d="M120 370V410"/><path d="M360 370V410"/>
<path d="M120 500V540"/><path d="M360 500V540"/>
<path d="M120 630V668H240V699"/><path d="M360 630V668H240"/>
</g>
<text x="83" y="215" fill="#1d40ae">Да</text><text x="379" y="215" fill="#1d40ae">Нет</text>
<g fill="none" stroke="#d9dbde"><rect x="24" y="283" width="192" height="87"/><rect x="264" y="283" width="192" height="87"/><rect x="24" y="413" width="192" height="87"/><rect x="264" y="413" width="192" height="87"/><rect x="24" y="543" width="192" height="87"/><rect x="264" y="543" width="192" height="87"/><rect x="80" y="702" width="320" height="56"/></g>
<text x="120" y="339" text-anchor="middle" font-family="PT Mono,monospace" font-size="38" fill="#1d40ae">112</text>
<text x="360" y="335" text-anchor="middle">Ассистанс</text>
<text x="120" y="448" text-anchor="middle">Помощь</text><text x="120" y="478" text-anchor="middle">сразу</text>
<text x="360" y="448" text-anchor="middle">Согласовать</text><text x="360" y="478" text-anchor="middle">помощь</text>
<text x="120" y="578" text-anchor="middle" font-size="22">Уведомить</text><text x="120" y="608" text-anchor="middle" font-size="22">ассистанс*</text>
<text x="360" y="578" text-anchor="middle">Клиника</text><text x="360" y="608" text-anchor="middle">и оплата</text>
<text x="240" y="738" text-anchor="middle">Документы и счета</text>
</g></svg>
