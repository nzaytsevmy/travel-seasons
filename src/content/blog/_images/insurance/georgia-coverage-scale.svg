<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько требует Грузия и сколько продают на самом деле</title>
<desc>Закон Грузии требует покрытие 30 000 лари — это около 11 000 долларов. Самый маленький полис, который вообще продают, — 30 000 долларов. Разумный выбор — 50 000 долларов, и он дороже минимального на 78 рублей за всю неделю.</desc>
<rect width="640" height="400" fill="#131009"/>
<text x="320" y="42" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ТРЕБОВАНИЕ ГРУЗИИ И ТО, ЧТО ПРОДАЮТ</text>

<text x="24" y="92" fill="#a8a090" font-size="16">Требует закон Грузии</text>
<text x="616" y="92" text-anchor="end" fill="#e8e0d0" font-size="17" font-weight="600">30 000 лари ≈ 11 000 $</text>
<rect x="24" y="102" width="592" height="34" rx="4" fill="none" stroke="#3a3429"/>
<rect x="24" y="102" width="130" height="34" rx="4" fill="#6b6455"/>

<text x="24" y="176" fill="#a8a090" font-size="16">Самый маленький полис на подборе</text>
<text x="616" y="176" text-anchor="end" fill="#e8e0d0" font-size="17" font-weight="600">30 000 $</text>
<rect x="24" y="186" width="592" height="34" rx="4" fill="none" stroke="#3a3429"/>
<rect x="24" y="186" width="355" height="34" rx="4" fill="#e8c062"/>

<text x="24" y="260" fill="#a8a090" font-size="16">Разумный выбор</text>
<text x="616" y="260" text-anchor="end" fill="#5cc97a" font-size="17" font-weight="700">50 000 $</text>
<rect x="24" y="270" width="592" height="34" rx="4" fill="#5cc97a"/>

<text x="320" y="348" text-anchor="middle" fill="#5cc97a" font-size="18" font-weight="700">Любой продающийся полис перекрывает требование почти втрое</text>
<text x="320" y="374" text-anchor="middle" fill="#a8a090" font-size="15.5">а шаг с 30 до 50 тысяч стоит 78 ₽ за всю неделю — экономить не на чем</text>
</svg>
