<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 402" width="640" height="402" font-family="system-ui,-apple-system,sans-serif">
<title>Какое покрытие брать</title>
<desc>Тридцать пять тысяч — минимум для Шенгена, пятьдесят — рабочий стандарт, сто тысяч для активного отдыха и дорогой медицины.</desc>
<rect width="640" height="402" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">КАКОЕ ПОКРЫТИЕ БРАТЬ</text>
<rect x="24" y="84" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="70" fill="#e8c062"/>
<text x="52" y="112" fill="#e8c062" font-size="19" font-weight="700">35 000 $</text>
<text x="600" y="112" text-anchor="end" fill="#e8e0d0" font-size="17">минимум для Шенгена</text>
<text x="52" y="138" fill="#a8a090" font-size="15.5">хватает на простые случаи</text>
<rect x="24" y="168" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="168" width="6" height="70" fill="#5cc97a"/>
<text x="52" y="196" fill="#5cc97a" font-size="19" font-weight="700">50 000 $</text>
<text x="600" y="196" text-anchor="end" fill="#e8e0d0" font-size="17">рабочий стандарт</text>
<text x="52" y="222" fill="#a8a090" font-size="15.5">травма, госпитализация, стоматология</text>
<rect x="24" y="252" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="252" width="6" height="70" fill="#c9973a"/>
<text x="52" y="280" fill="#c9973a" font-size="19" font-weight="700">100 000 $</text>
<text x="600" y="280" text-anchor="end" fill="#e8e0d0" font-size="17">активный отдых и США</text>
<text x="52" y="306" fill="#a8a090" font-size="15.5">горы, дайвинг, дорогая медицина</text>
<text x="320" y="386" text-anchor="middle" fill="#6b6455" font-size="15.5">Активный отдых почти нигде не входит в базовый полис</text>
</svg>