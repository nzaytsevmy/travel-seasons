<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 402" width="640" height="402" font-family="system-ui,-apple-system,sans-serif">
<title>Какое покрытие брать</title>
<desc>Тридцать пять тысяч — минимум для Шенгена, пятьдесят — рабочий стандарт, сто тысяч для активного отдыха и дорогой медицины.</desc>
<rect width="640" height="402" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">КАКОЕ ПОКРЫТИЕ БРАТЬ</text>
<rect x="24" y="84" width="592" height="70" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="84" width="6" height="70" fill="#8a6a10"/>
<text x="52" y="112" fill="#8a6a10" font-size="19" font-weight="700">35 000 $</text>
<text x="600" y="112" text-anchor="end" fill="#15171a" font-size="17">минимум для Шенгена</text>
<text x="52" y="138" fill="#5c626b" font-size="15.5">хватает на простые случаи</text>
<rect x="24" y="168" width="592" height="70" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="168" width="6" height="70" fill="#1a7f4b"/>
<text x="52" y="196" fill="#1a7f4b" font-size="19" font-weight="700">50 000 $</text>
<text x="600" y="196" text-anchor="end" fill="#15171a" font-size="17">рабочий стандарт</text>
<text x="52" y="222" fill="#5c626b" font-size="15.5">травма, госпитализация, стоматология</text>
<rect x="24" y="252" width="592" height="70" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="252" width="6" height="70" fill="#1d40ae"/>
<text x="52" y="280" fill="#1d40ae" font-size="19" font-weight="700">100 000 $</text>
<text x="600" y="280" text-anchor="end" fill="#15171a" font-size="17">активный отдых и США</text>
<text x="52" y="306" fill="#5c626b" font-size="15.5">горы, дайвинг, дорогая медицина</text>
<text x="320" y="386" text-anchor="middle" fill="#8a9099" font-size="15.5">Активный отдых почти нигде не входит в базовый полис</text>
</svg>