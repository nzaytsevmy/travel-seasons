<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440">
<title>Почему при нулевой франшизе остаётся доплата</title>
<desc>Условный пример в рублях: счёт 18000, применимый подлимит 10000, франшиза ноль. Непокрытый остаток 8000. Синий участок составляет 10000 из 18000, штрихованный — 8000 из 18000. Это не тариф и не обещание выплаты конкретного страховщика.</desc>
<defs><pattern id="own" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#fbfbfa"/><path d="M0 12L12 0" stroke="#1d40ae" stroke-width="1"/></pattern></defs>
<rect width="480" height="440" fill="#fbfbfa"/>
<g fill="#15171a" font-family="Golos Text,Arial,sans-serif" font-size="24">
<text x="24" y="45" font-family="Old Standard TT,Georgia,serif" font-size="31">Кто оплатит счёт</text>
<text x="24" y="86" fill="#52565c">Условный пример · франшиза 0 ₽</text>
<text x="240" y="132" text-anchor="middle">Весь счёт: 18 000 ₽</text>
<path d="M24 159V147H456V159" fill="none" stroke="#15171a"/>
<rect x="24" y="176" width="240" height="88" fill="#1d40ae"/>
<rect x="264" y="176" width="192" height="88" fill="url(#own)" stroke="#1d40ae"/>
<rect x="280" y="196" width="160" height="48" fill="#fbfbfa"/>
<text x="144" y="232" text-anchor="middle" fill="#fff" font-family="PT Mono,monospace" font-size="29">10 000 ₽</text>
<text x="360" y="229" text-anchor="middle" fill="#1d40ae" font-family="PT Mono,monospace" font-size="29">8 000 ₽</text>
<rect x="24" y="299" width="24" height="24" fill="#1d40ae"/>
<text x="64" y="320">Покрываемый расход</text>
<rect x="24" y="350" width="24" height="24" fill="url(#own)" stroke="#1d40ae"/>
<text x="64" y="371">Непокрытый остаток</text>
<text x="24" y="420" fill="#52565c" font-size="21">Если случай признан страховым.</text>
</g></svg>
