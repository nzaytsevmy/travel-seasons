<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="system-ui,-apple-system,sans-serif">
<title>Какие условия проверить в полисе</title>
<desc>Проверьте условия для занятий спортом, хронических болезней, опьянения, беременности и стоматологии: они различаются у страховщиков.</desc>
<rect width="640" height="420" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">ЧТО ПРОВЕРИТЬ В ПОЛИСЕ</text>
<text x="26" y="102" fill="#b3261e" font-size="19" font-weight="700">?</text>
<text x="50" y="102" fill="#15171a" font-size="17.5" font-weight="600">Активный отдых</text>
<text x="50" y="122" fill="#5c626b" font-size="15">найдите своё занятие в перечне</text>
<text x="26" y="156" fill="#b3261e" font-size="19" font-weight="700">?</text>
<text x="50" y="156" fill="#15171a" font-size="17.5" font-weight="600">Хронические болезни</text>
<text x="50" y="176" fill="#5c626b" font-size="15">обострение и плановое лечение — разное</text>
<text x="26" y="210" fill="#b3261e" font-size="19" font-weight="700">?</text>
<text x="50" y="210" fill="#15171a" font-size="17.5" font-weight="600">Алкоголь</text>
<text x="50" y="230" fill="#5c626b" font-size="15">сверьте исключения и условия опции</text>
<text x="26" y="264" fill="#b3261e" font-size="19" font-weight="700">?</text>
<text x="50" y="264" fill="#15171a" font-size="17.5" font-weight="600">Беременность</text>
<text x="50" y="284" fill="#5c626b" font-size="15">проверьте срок и покрываемые ситуации</text>
<text x="26" y="318" fill="#b3261e" font-size="19" font-weight="700">?</text>
<text x="50" y="318" fill="#15171a" font-size="17.5" font-weight="600">Стоматология</text>
<text x="50" y="338" fill="#5c626b" font-size="15">сверьте вид помощи и подлимит</text>
<text x="320" y="404" text-anchor="middle" fill="#8a9099" font-size="15.5">Условия зависят от выбранного договора</text>
</svg>