<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="system-ui,-apple-system,sans-serif">
<title>Что базовый полис не покрывает</title>
<desc>Активный отдых, обострение хронических болезней, травмы в опьянении, беременность и обычную стоматологию базовый полис не покрывает.</desc>
<rect width="640" height="420" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ЧЕГО НЕТ В БАЗОВОМ ПОЛИСЕ</text>
<text x="26" y="102" fill="#d44545" font-size="19" font-weight="700">×</text>
<text x="50" y="102" fill="#e8e0d0" font-size="17.5" font-weight="600">Активный отдых</text>
<text x="50" y="122" fill="#a8a090" font-size="15">горы, дайвинг, мотоцикл — отдельной галочкой</text>
<text x="26" y="156" fill="#d44545" font-size="19" font-weight="700">×</text>
<text x="50" y="156" fill="#e8e0d0" font-size="17.5" font-weight="600">Хронические болезни</text>
<text x="50" y="176" fill="#a8a090" font-size="15">обострение своего покрывают не все</text>
<text x="26" y="210" fill="#d44545" font-size="19" font-weight="700">×</text>
<text x="50" y="210" fill="#e8e0d0" font-size="17.5" font-weight="600">Алкоголь</text>
<text x="50" y="230" fill="#a8a090" font-size="15">травма в состоянии опьянения — отказ</text>
<text x="26" y="264" fill="#d44545" font-size="19" font-weight="700">×</text>
<text x="50" y="264" fill="#e8e0d0" font-size="17.5" font-weight="600">Беременность</text>
<text x="50" y="284" fill="#a8a090" font-size="15">обычно после определённого срока не покрывают</text>
<text x="26" y="318" fill="#d44545" font-size="19" font-weight="700">×</text>
<text x="50" y="318" fill="#e8e0d0" font-size="17.5" font-weight="600">Стоматология</text>
<text x="50" y="338" fill="#a8a090" font-size="15">только экстренная и с лимитом</text>
<text x="320" y="404" text-anchor="middle" fill="#6b6455" font-size="15.5">Читать надо не рекламу, а раздел исключений</text>
</svg>