<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="system-ui,-apple-system,sans-serif">
<title>Почему не стоит брать самый дешёвый полис в Грузию</title>
<desc>Самый дешёвый полис — Абсолют за 233 рубля, но ассистанс у него он сам, 13-е место в народном рейтинге Банки.ру с баллом 28,6. Зетта при том же покрытии 30 000 долларов стоит 287 рублей, при 50 000 долларов — 350; разница с самым дешёвым 39–54 рубля за неделю, зато за полисом стоит AP Companies.</desc>
<rect width="640" height="380" fill="#fbfbfa"/>
<text x="320" y="42" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">ПОЧЕМУ НЕ САМЫЙ ДЕШЁВЫЙ</text>

<rect x="24" y="78" width="592" height="98" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="78" width="6" height="98" fill="#b3261e"/>
<text x="52" y="108" fill="#15171a" font-size="19" font-weight="600">Первая строчка по цене</text>
<text x="600" y="108" text-anchor="end" fill="#15171a" font-size="19" font-weight="700">233 ₽ за 30 000 $</text>
<text x="52" y="134" fill="#b3261e" font-size="17" font-weight="700">помогать будет сама страховая</text>
<text x="52" y="160" fill="#5c626b" font-size="15.5">13-е место в народном рейтинге, балл 28,6</text>

<rect x="24" y="192" width="592" height="98" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="192" width="6" height="98" fill="#1a7f4b"/>
<text x="52" y="222" fill="#15171a" font-size="19" font-weight="600">Строчкой ниже</text>
<text x="600" y="222" text-anchor="end" fill="#1a7f4b" font-size="19" font-weight="700">287 ₽ за 30 000 $, 350 ₽ за 50 000 $</text>
<text x="52" y="248" fill="#1a7f4b" font-size="17" font-weight="700">помогать будет AP Companies</text>
<text x="52" y="274" fill="#5c626b" font-size="15.5">сервисная компания из категории «хорошо»</text>

<text x="320" y="326" text-anchor="middle" fill="#8a6a10" font-size="18" font-weight="700">Вся разница — 39–54 ₽ за неделю при равном покрытии</text>
<text x="320" y="352" text-anchor="middle" fill="#5c626b" font-size="15.5">искать вам врача будет ассистанс, а не логотип на полисе</text>
</svg>
