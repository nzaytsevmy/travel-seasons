<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="system-ui,-apple-system,sans-serif">
<title>Почему не стоит брать самый дешёвый полис в Грузию</title>
<desc>Самый дешёвый полис — Абсолют за 233 рубля, но ассистанс у него он сам, 13-е место в народном рейтинге Банки.ру с баллом 28,6. Зетта дороже на 54 рубля за неделю, зато за полисом стоит AP Companies.</desc>
<rect width="640" height="380" fill="#131009"/>
<text x="320" y="42" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ПОЧЕМУ НЕ САМЫЙ ДЕШЁВЫЙ</text>

<rect x="24" y="78" width="592" height="98" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="78" width="6" height="98" fill="#d44545"/>
<text x="52" y="108" fill="#e8e0d0" font-size="19" font-weight="600">Первая строчка по цене</text>
<text x="600" y="108" text-anchor="end" fill="#e8e0d0" font-size="19" font-weight="700">233 ₽</text>
<text x="52" y="134" fill="#d44545" font-size="17" font-weight="700">помогать будет сама страховая</text>
<text x="52" y="160" fill="#a8a090" font-size="15.5">13-е место в народном рейтинге, балл 28,6</text>

<rect x="24" y="192" width="592" height="98" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="192" width="6" height="98" fill="#5cc97a"/>
<text x="52" y="222" fill="#e8e0d0" font-size="19" font-weight="600">Строчкой ниже</text>
<text x="600" y="222" text-anchor="end" fill="#5cc97a" font-size="19" font-weight="700">287 ₽</text>
<text x="52" y="248" fill="#5cc97a" font-size="17" font-weight="700">помогать будет AP Companies</text>
<text x="52" y="274" fill="#a8a090" font-size="15.5">сервисная компания из категории «хорошо»</text>

<text x="320" y="326" text-anchor="middle" fill="#e8c062" font-size="18" font-weight="700">Вся разница — 54 ₽ за неделю</text>
<text x="320" y="352" text-anchor="middle" fill="#a8a090" font-size="15.5">искать вам врача будет ассистанс, а не логотип на полисе</text>
</svg>
