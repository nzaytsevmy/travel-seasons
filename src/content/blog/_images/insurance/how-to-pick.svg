<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" width="640" height="404" font-family="system-ui,-apple-system,sans-serif">
<title>Как выбрать полис за пять минут</title>
<desc>Определить покрытие по стране, проверить ассистанс, прочитать исключения и оформить онлайн.</desc>
<rect width="640" height="404" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ПОЛИС ЗА ПЯТЬ МИНУТ</text>
<circle cx="40" cy="106" r="14" fill="none" stroke="#c9973a" stroke-width="2"/>
<text x="40" y="112" text-anchor="middle" fill="#c9973a" font-size="16" font-weight="700">1</text>
<text x="68" y="104" fill="#e8e0d0" font-size="18" font-weight="600">Определить покрытие</text>
<text x="68" y="126" fill="#a8a090" font-size="15.5">по стране и типу отдыха</text>
<circle cx="40" cy="172" r="14" fill="none" stroke="#c9973a" stroke-width="2"/>
<text x="40" y="178" text-anchor="middle" fill="#c9973a" font-size="16" font-weight="700">2</text>
<text x="68" y="170" fill="#e8e0d0" font-size="18" font-weight="600">Проверить ассистанс</text>
<text x="68" y="192" fill="#a8a090" font-size="15.5">кто реально приедет и говорит ли по-русски</text>
<circle cx="40" cy="238" r="14" fill="none" stroke="#c9973a" stroke-width="2"/>
<text x="40" y="244" text-anchor="middle" fill="#c9973a" font-size="16" font-weight="700">3</text>
<text x="68" y="236" fill="#e8e0d0" font-size="18" font-weight="600">Посмотреть исключения</text>
<text x="68" y="258" fill="#a8a090" font-size="15.5">активный отдых, хроника, алкоголь</text>
<circle cx="40" cy="304" r="14" fill="none" stroke="#c9973a" stroke-width="2"/>
<text x="40" y="310" text-anchor="middle" fill="#c9973a" font-size="16" font-weight="700">4</text>
<text x="68" y="302" fill="#e8e0d0" font-size="18" font-weight="600">Оформить онлайн</text>
<text x="68" y="324" fill="#a8a090" font-size="15.5">полис приходит на почту за минуты</text>
</svg>