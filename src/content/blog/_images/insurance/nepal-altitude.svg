<text x="24" y="80" fill="#52565c">Общая шкала высоты · метры</text>
<g fill="none" stroke="#d9dbde"><path d="M94 130H456M94 498H456M94 620H456"/><path d="M94 130V620"/></g>
<path d="M94 334H456M94 212H456" fill="none" stroke="#1d40ae" stroke-dasharray="5 6"/>
