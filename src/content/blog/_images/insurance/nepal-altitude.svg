<rect x="216" y="181.94" width="72" height="438.06" fill="#1d40ae"/>
<rect x="352" y="182.51" width="72" height="437.49" fill="#1d40ae"/>
<g text-anchor="middle" font-family="PT Mono,monospace" font-size="25"><text x="252" y="165">5364</text><text x="388" y="165">5357</text></g>
<g text-anchor="middle"><text x="252" y="657">Лагерь</text><text x="252" y="686">Эвереста</text><text x="388" y="657">Гокио-Ри</text></g>
<text x="24" y="733" fill="#52565c" font-size="21">Предел 5000 м ниже обеих точек.</text>
