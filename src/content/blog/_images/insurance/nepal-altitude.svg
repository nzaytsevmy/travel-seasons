<svg xmlns="http://www.w3.org/2000/svg" width="480" height="760" viewBox="0 0 480 760">
<title>Высота Эвереста и Гокио-Ри относительно страховых ограничений</title>
<desc>Южный базовый лагерь Эвереста5364метра и Гокио-Ри5357метров показаны двумя столбцами на общей линейной шкале от0до6000метров. Горизонтальные линии1500,3500и5000метров лежат ниже обеих точек. Это высоты отдельных точек, не максимумы любой программы.</desc>
