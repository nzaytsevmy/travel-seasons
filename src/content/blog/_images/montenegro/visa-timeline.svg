<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" width="640" height="780" font-family="system-ui,-apple-system,sans-serif">
<title>Календарь: когда Черногория закрывает безвиз и когда подавать на визу</title>
<desc>Шкала времени с 26 августа по 15 ноября 2026 года. До 31 октября включительно россиянин въезжает по загранпаспорту на 30 дней. С 1 ноября нужна виза категории C. Отметка 1 октября: если поездка запланирована на начало ноября, документы стоит подать к этому дню, потому что закон отводит на решение до 30 дней.</desc>
<rect width="640" height="780" fill="#131009"/>

<text x="32" y="54" fill="#c9973a" font-size="23" font-weight="700">БЕЗВИЗ КОНЧАЕТСЯ 31 ОКТЯБРЯ</text>
<text x="32" y="86" fill="#a8a090" font-size="18">Закон отводит на решение по визе до 30 дней —</text>
<text x="32" y="110" fill="#a8a090" font-size="18">поездку в ноябре готовят в начале октября</text>

<line x1="32" y1="140" x2="608" y2="140" stroke="#3a3429" stroke-width="1.5"/>

<!-- шкала: 26.08 (y=200) .. 15.11 (y=700), 81 день, 6.17 px/день -->
<!-- полоса «без визы»: 26.08 -> 31.10 -->
<rect x="238" y="200" width="86" height="407" rx="6" fill="#2f7d8f"/>
<!-- полоса «нужна виза»: 1.11 -> 15.11 -->
<rect x="238" y="613" width="86" height="87" rx="6" fill="#c9973a"/>

<!-- подписи внутри полос -->
<text x="281" y="380" fill="#e8e0d0" font-size="19" font-weight="700" text-anchor="middle">без</text>
<text x="281" y="404" fill="#e8e0d0" font-size="19" font-weight="700" text-anchor="middle">визы</text>
<text x="281" y="650" fill="#131009" font-size="19" font-weight="700" text-anchor="middle">виза</text>
<text x="281" y="674" fill="#131009" font-size="19" font-weight="700" text-anchor="middle">C</text>

<!-- отметка: сегодня 26 августа -->
<circle cx="281" cy="200" r="7" fill="#e8e0d0"/>
<line x1="32" y1="200" x2="230" y2="200" stroke="#3a3429" stroke-width="1.5"/>
<text x="32" y="194" fill="#e8e0d0" font-size="19" font-weight="600">26 августа</text>
<text x="32" y="220" fill="#a8a090" font-size="17">въезд по паспорту</text>

<!-- отметка: 1 октября -->
<circle cx="281" cy="422" r="7" fill="#e8e0d0"/>
<line x1="32" y1="422" x2="230" y2="422" stroke="#3a3429" stroke-width="1.5"/>
<text x="32" y="416" fill="#e8e0d0" font-size="19" font-weight="600">1 октября</text>
<text x="32" y="442" fill="#a8a090" font-size="17">подать документы,</text>
<text x="32" y="464" fill="#a8a090" font-size="17">если едете в ноябре</text>

<!-- граница 31.10 / 1.11 -->
<line x1="32" y1="610" x2="608" y2="610" stroke="#c9973a" stroke-width="2.5"/>
<text x="32" y="588" fill="#e8e0d0" font-size="19" font-weight="600">31 октября</text>
<text x="32" y="566" fill="#a8a090" font-size="17">последний день</text>
<text x="32" y="636" fill="#c9973a" font-size="19" font-weight="700">1 ноября</text>
<text x="32" y="660" fill="#a8a090" font-size="17">виза обязательна,</text>
<text x="32" y="682" fill="#a8a090" font-size="17">включая транзит</text>

<!-- нижняя сноска -->
<line x1="32" y1="722" x2="608" y2="722" stroke="#3a3429" stroke-width="1.5"/>
<text x="32" y="750" fill="#a8a090" font-size="16">Постановление правительства Черногории от 23 июля 2026</text>
</svg>
