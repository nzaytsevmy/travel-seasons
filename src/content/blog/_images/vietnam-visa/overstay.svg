<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="system-ui,-apple-system,sans-serif">
<title>Чем кончается просрочка во Вьетнаме</title>
<desc>Штраф выписывают при вылете, платить наличными в донгах. С 15 декабря 2025 штрафы удвоены. При просрочке больше двух недель идти в миграционную службу до вылета. Возможен запрет на будущий въезд.</desc>
<rect width="640" height="400" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ПРОСРОЧИЛ ДНИ — ЧТО ДАЛЬШЕ</text>

<rect x="24" y="80" width="592" height="82" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="80" width="6" height="82" fill="#d44545"/>
<text x="52" y="110" fill="#e8e0d0" font-size="18" font-weight="600">Штраф выпишут при вылете, в аэропорту</text>
<text x="52" y="136" fill="#d44545" font-size="16.5" font-weight="700">платить наличными в донгах — карты не принимают</text>

<rect x="24" y="176" width="592" height="82" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="176" width="6" height="82" fill="#e8c062"/>
<text x="52" y="206" fill="#e8e0d0" font-size="18" font-weight="600">С 15 декабря 2025 штрафы удвоены</text>
<text x="52" y="232" fill="#a8a090" font-size="15.5">указ 282/2025/NĐ-CP · миллионы донгов даже за несколько дней</text>

<rect x="24" y="272" width="592" height="82" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="272" width="6" height="82" fill="#e8c062"/>
<text x="52" y="302" fill="#e8e0d0" font-size="18" font-weight="600">Просрочка больше пары недель</text>
<text x="52" y="328" fill="#a8a090" font-size="15.5">в миграционную службу ДО аэропорта — иначе рискуете опоздать на рейс</text>

<text x="320" y="382" text-anchor="middle" fill="#a8a090" font-size="15.5">длинная просрочка — ещё и риск запрета на будущий въезд</text>
</svg>
