<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="system-ui,-apple-system,sans-serif">
<title>Электронная карта прибытия за четыре шага</title>
<desc>Шаг один: не ранее чем за 72 часа до прилёта открыть официальный портал. Шаг два: заполнить форму за 3-5 минут. Шаг три: сохранить QR-код. Шаг четыре: показать на паспортном контроле.</desc>
<rect width="640" height="440" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">КАРТА ПРИБЫТИЯ: 4 ШАГА</text>

<rect x="24" y="78" width="592" height="72" rx="5" fill="none" stroke="#3a3429"/>
<text x="52" y="108" fill="#e8c062" font-size="18" font-weight="700">1 · За 72 часа до прилёта</text>
<text x="52" y="132" fill="#a8a090" font-size="15.5">раньше нельзя — форма привязана к рейсу; позже — рискуете очередью</text>

<rect x="24" y="162" width="592" height="72" rx="5" fill="none" stroke="#3a3429"/>
<text x="52" y="192" fill="#e8c062" font-size="18" font-weight="700">2 · prearrival.immigration.gov.vn</text>
<text x="52" y="216" fill="#a8a090" font-size="15.5">бесплатно, 3–5 минут · нужны паспорт, рейс и адрес жилья</text>

<rect x="24" y="246" width="592" height="72" rx="5" fill="none" stroke="#3a3429"/>
<text x="52" y="276" fill="#e8c062" font-size="18" font-weight="700">3 · Сохранить QR-код</text>
<text x="52" y="300" fill="#a8a090" font-size="15.5">в телефон или распечатать — интернет в аэропорту может подвести</text>

<rect x="24" y="330" width="592" height="72" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="330" width="6" height="72" fill="#5cc97a"/>
<text x="52" y="360" fill="#5cc97a" font-size="18" font-weight="700">4 · Показать на паспортном контроле</text>
<text x="52" y="384" fill="#a8a090" font-size="15.5">вместе с паспортом; безвизовым тут же поставят штамп с датой выезда</text>
</svg>
