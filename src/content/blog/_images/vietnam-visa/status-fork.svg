<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" font-family="system-ui,-apple-system,sans-serif">
<title>Какой статус нужен для въезда во Вьетнам</title>
<desc>До 45 дней — безвиз, ничего оформлять не нужно. Дольше 45 дней — электронная виза на срок до 90 дней за 25 или 50 долларов. Электронная карта прибытия обязательна всем.</desc>
<rect width="640" height="460" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">КАК ВЪЕХАТЬ ВО ВЬЕТНАМ</text>

<rect x="24" y="80" width="592" height="96" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="80" width="6" height="96" fill="#5cc97a"/>
<text x="52" y="112" fill="#e8e0d0" font-size="19" font-weight="600">Поездка до 45 дней</text>
<text x="600" y="112" text-anchor="end" fill="#5cc97a" font-size="19" font-weight="700">безвиз, 0 ₽</text>
<text x="52" y="138" fill="#a8a090" font-size="15.5">ничего не оформляете — штамп поставят на границе</text>
<text x="52" y="160" fill="#a8a090" font-size="15.5">действует до 14 марта 2028 года</text>

<rect x="24" y="192" width="592" height="96" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="192" width="6" height="96" fill="#e8c062"/>
<text x="52" y="224" fill="#e8e0d0" font-size="19" font-weight="600">Поездка 46–90 дней</text>
<text x="600" y="224" text-anchor="end" fill="#e8c062" font-size="19" font-weight="700">e-Visa, $25–50</text>
<text x="52" y="250" fill="#a8a090" font-size="15.5">онлайн за 3–5 рабочих дней, оплата картой не-РФ банка</text>
<text x="52" y="272" fill="#a8a090" font-size="15.5">однократная $25, многократная $50</text>

<rect x="24" y="304" width="592" height="78" rx="5" fill="none" stroke="#c9973a"/>
<rect x="24" y="304" width="6" height="78" fill="#c9973a"/>
<text x="52" y="336" fill="#c9973a" font-size="19" font-weight="700">Карта прибытия — всем без исключения</text>
<text x="52" y="362" fill="#a8a090" font-size="15.5">бесплатная форма за 72 часа до прилёта, QR-код на контроле</text>

<text x="320" y="424" text-anchor="middle" fill="#a8a090" font-size="15.5">паспорт должен действовать ещё минимум 6 месяцев на дату въезда</text>
</svg>
