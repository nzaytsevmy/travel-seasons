<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760">
<title>Четыре зоны для короткой поездки в Ереван</title>
<desc>Схема взаимного расположения: Арабкир севернее центра, Конд западнее площади Республики, Опера и нижний Каскад севернее площади. Улица Пароняна проходит у западной стороны Конда; Баграмяна связывает центр с Арабкиром. Схема без масштаба, не границы административных районов.</desc>
<rect width="640" height="760" fill="#fbfbfa"/>
<g font-family="Golos Text,Arial,sans-serif" fill="#15171a">
<text x="28" y="46" font-family="Old Standard TT,Georgia,serif" font-size="34">Где жить на два–три дня</text>
<path d="M580 134V80l-9 16m9-16 9 16" fill="none" stroke="#1d40ae" stroke-width="2"/><text x="570" y="159" font-size="22">С</text>
<path d="M64 125Q35 260 66 405T55 650" fill="none" stroke="#aab9dc" stroke-width="13"/><text x="23" y="698" font-size="20" fill="#52565c">Раздан</text>
<g fill="none" stroke="#d9dbde" stroke-width="7"><path d="M150 170 360 350 435 580"/><path d="M115 460 438 460"/><path d="M295 260 295 650"/><path d="M180 260 180 610"/></g>
<path d="M150 170 360 350" fill="none" stroke="#1d40ae" stroke-width="2"/>
<g font-size="21" fill="#52565c"><text x="162" y="258" transform="rotate(40 162 258)">Баграмяна</text><text x="129" y="581" transform="rotate(-90 129 581)">Пароняна</text><text x="335" y="446">Амиряна</text></g>
<g stroke="#1d40ae" stroke-width="2" fill="#eef0f7"><ellipse cx="250" cy="155" rx="160" ry="67"/><ellipse cx="402" cy="340" rx="157" ry="72"/><ellipse cx="213" cy="485" rx="75" ry="69"/><ellipse cx="437" cy="558" rx="151" ry="71"/></g>
<g text-anchor="middle" font-size="25"><text x="250" y="147">Арабкир</text><text x="250" y="177" font-size="20">Комитас · Айгедзор</text><text x="402" y="333">Опера — Каскад</text><text x="402" y="365" font-size="20">нижняя часть лестницы</text><text x="213" y="495">Конд</text><text x="437" y="550">Площадь</text><text x="437" y="581">Республики</text></g>
<path d="M444 267v-47m-8 8 8-8 8 8" fill="none" stroke="#1d40ae" stroke-width="2"/><text x="465" y="245" font-size="20">подъём</text>
<text x="28" y="732" font-size="19" fill="#52565c">Схема без масштаба. Зоны выбора, не границы округов.</text>
</g></svg>
