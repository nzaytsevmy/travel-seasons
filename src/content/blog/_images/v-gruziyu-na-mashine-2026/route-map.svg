<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1320" viewBox="0 0 640 1320" role="img" aria-labelledby="title desc">
  <title id="title">Схема маршрута из Москвы в Грузию на машине</title>
  <desc id="desc">Вертикальная схема дороги через Владикавказ, Верхний Ларс и Степанцминду в Тбилиси с ответвлениями в Кахетию, Боржоми, Кутаиси и Батуми.</desc>
  <rect width="640" height="1320" fill="#f7f3ea"/>
  <path d="M318 130 C280 240 356 330 318 440 C280 550 356 640 318 750" fill="none" stroke="#334d3c" stroke-width="12" stroke-linecap="round"/>
  <path d="M318 750 C250 825 178 910 142 1010" fill="none" stroke="#b86b3c" stroke-width="9" stroke-linecap="round"/>
  <path d="M318 750 C388 840 472 920 505 1035" fill="none" stroke="#2f7180" stroke-width="9" stroke-linecap="round"/>
  <path d="M505 1035 C440 1110 368 1165 318 1210" fill="none" stroke="#2f7180" stroke-width="9" stroke-linecap="round"/>
  <g fill="#fff" stroke="#334d3c" stroke-width="7">
    <circle cx="318" cy="130" r="22"/><circle cx="318" cy="355" r="22"/><circle cx="318" cy="510" r="22"/><circle cx="318" cy="635" r="22"/><circle cx="318" cy="750" r="25"/>
  </g>
  <g fill="#fff" stroke-width="7">
    <circle cx="142" cy="1010" r="22" stroke="#b86b3c"/><circle cx="505" cy="1035" r="22" stroke="#2f7180"/><circle cx="318" cy="1210" r="22" stroke="#2f7180"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#1d2922">
    <text x="318" y="68" text-anchor="middle" font-size="42" font-weight="700">Москва — Грузия</text>
    <text x="318" y="105" text-anchor="middle" font-size="22">одна сухопутная граница, три маршрутных ветки</text>
    <text x="352" y="139" font-size="31" font-weight="700">Москва</text>
    <text x="352" y="174" font-size="21">до Владикавказа ≈ 1 764 км</text>
    <text x="352" y="364" font-size="31" font-weight="700">Владикавказ</text>
    <text x="352" y="399" font-size="21">ночёвка перед границей</text>
    <text x="352" y="519" font-size="31" font-weight="700">Верхний Ларс</text>
    <text x="352" y="554" font-size="21">сверить режим дороги</text>
    <text x="352" y="644" font-size="31" font-weight="700">Степанцминда</text>
    <text x="352" y="679" font-size="21">ночёвка после границы</text>
    <text x="352" y="759" font-size="31" font-weight="700">Тбилиси</text>
    <text x="352" y="794" font-size="21">≈ 198 км от Владикавказа</text>
    <text x="84" y="1060" text-anchor="middle" font-size="29" font-weight="700">Кахетия</text>
    <text x="84" y="1094" text-anchor="middle" font-size="20">≈ 112 км</text>
    <text x="525" y="1088" text-anchor="middle" font-size="29" font-weight="700">Боржоми</text>
    <text x="525" y="1122" text-anchor="middle" font-size="20">≈ 156 км</text>
    <text x="318" y="1262" text-anchor="middle" font-size="29" font-weight="700">Кутаиси → Батуми</text>
    <text x="318" y="1297" text-anchor="middle" font-size="20">≈ 373 км от Тбилиси через Кутаиси</text>
  </g>
</svg>
