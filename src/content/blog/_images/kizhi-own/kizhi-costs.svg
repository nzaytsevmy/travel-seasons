<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436" width="640" height="436" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько стоит съездить в Кижи</title>
<desc>Метеор из Петрозаводска 5200 рублей туда-обратно, входной билет 1200, экскурсия ещё 300. Дети до трёх лет едут бесплатно.</desc>
<rect width="640" height="436" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">СКОЛЬКО СТОЯТ КИЖИ</text>
<text x="320" y="84" text-anchor="middle" fill="#5cc97a" font-size="19" font-weight="700">6400 ₽ на взрослого — дорога и вход</text>
<text x="320" y="106" text-anchor="middle" fill="#a8a090" font-size="16">метеор и билет платят отдельно</text>
<line x1="24" y1="126" x2="616" y2="126" stroke="#3a3429"/>
<text x="24" y="164" fill="#e8e0d0" font-size="18" font-weight="600">Метеор туда-обратно</text>
<text x="616" y="164" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">5200 ₽</text>
<text x="24" y="182" fill="#6b6455" font-size="14.5">дети 4–17 лет — 3150</text>
<text x="24" y="218" fill="#e8e0d0" font-size="18" font-weight="600">Входной билет</text>
<text x="616" y="218" text-anchor="end" fill="#e8c062" font-size="18" font-weight="700">1200 ₽</text>
<text x="24" y="236" fill="#6b6455" font-size="14.5">льготный — 600</text>
<text x="24" y="272" fill="#e8e0d0" font-size="18" font-weight="600">Обзорная экскурсия</text>
<text x="616" y="272" text-anchor="end" fill="#5cc97a" font-size="18" font-weight="700">+300 ₽</text>
<text x="24" y="326" fill="#e8e0d0" font-size="18" font-weight="600">Дети до 3 лет на метеоре</text>
<text x="616" y="326" text-anchor="end" fill="#5cc97a" font-size="18" font-weight="700">бесплатно</text>
<text x="24" y="344" fill="#6b6455" font-size="14.5">до 5 лет — бесплатный вход</text>
<text x="320" y="388" text-anchor="middle" fill="#a8a090" font-size="16">Метеор ходит только в навигацию,</text>
<text x="320" y="410" text-anchor="middle" fill="#a8a090" font-size="16">зимой на остров добираются иначе</text>
</svg>