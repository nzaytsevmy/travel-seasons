<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" width="640" height="466" font-family="system-ui,-apple-system,sans-serif">
<title>Что смотреть на острове Кижи</title>
<desc>Преображенская церковь 1714 года, Покровская, колокольня, дом Ошевнева и церковь Лазаря — один из древнейших деревянных храмов России.</desc>
<rect width="640" height="466" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ЧТО СМОТРЕТЬ В КИЖАХ</text>
<circle cx="36" cy="98" r="4" fill="#c9973a"/>
<text x="54" y="104" fill="#e8e0d0" font-size="18" font-weight="600">Преображенская церковь</text>
<text x="616" y="104" text-anchor="end" fill="#c9973a" font-size="16">1714</text>
<text x="54" y="126" fill="#a8a090" font-size="15">22 главы, осиновый лемех</text>
<circle cx="36" cy="160" r="4" fill="#c9973a"/>
<text x="54" y="166" fill="#e8e0d0" font-size="18" font-weight="600">Покровская церковь</text>
<text x="616" y="166" text-anchor="end" fill="#c9973a" font-size="16">XVIII век</text>
<text x="54" y="188" fill="#a8a090" font-size="15">зимняя, с резным иконостасом</text>
<circle cx="36" cy="222" r="4" fill="#c9973a"/>
<text x="54" y="228" fill="#e8e0d0" font-size="18" font-weight="600">Колокольня погоста</text>
<text x="616" y="228" text-anchor="end" fill="#c9973a" font-size="16">1862</text>
<text x="54" y="250" fill="#a8a090" font-size="15">завершает ансамбль</text>
<circle cx="36" cy="284" r="4" fill="#c9973a"/>
<text x="54" y="290" fill="#e8e0d0" font-size="18" font-weight="600">Дом Ошевнева</text>
<text x="616" y="290" text-anchor="end" fill="#c9973a" font-size="16">1876</text>
<text x="54" y="312" fill="#a8a090" font-size="15">крестьянский дом с обстановкой</text>
<circle cx="36" cy="346" r="4" fill="#c9973a"/>
<text x="54" y="352" fill="#e8e0d0" font-size="18" font-weight="600">Церковь Лазаря</text>
<text x="616" y="352" text-anchor="end" fill="#c9973a" font-size="16">один из древнейших</text>
<text x="54" y="374" fill="#a8a090" font-size="15">деревянных храмов России</text>
<text x="320" y="442" text-anchor="middle" fill="#6b6455" font-size="15.5">Остров большой: у причала есть прокат велосипедов</text>
</svg>