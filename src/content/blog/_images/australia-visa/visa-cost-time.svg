<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="Golos Text,Arial,sans-serif">
<title>Визовый сбор и дополнительные расходы</title>
<desc>Базовый визовый сбор AUD 250. Отдельно могут понадобиться переводы, биометрия и медицинское обследование по запросу. Полная стоимость зависит от этих расходов, курса конвертации и комиссии банка.</desc>
<rect width="640" height="440" fill="#fbfbfa"/>
<text x="320" y="42" text-anchor="middle" fill="#1d40ae" font-size="28">Сбор и дополнительные расходы</text>
<rect x="68" y="70" width="504" height="84" rx="4" fill="none" stroke="#1d40ae"/>
<text x="320" y="102" text-anchor="middle" fill="#15171a" font-size="26">Визовый сбор</text>
<text x="320" y="139" text-anchor="middle" fill="#1d40ae" font-size="30" font-weight="700">AUD 250</text>
<path d="M320 154V202M116 232V202H524V232M320 202V232" fill="none" stroke="#d9dbde" stroke-width="2"/>
<text x="116" y="264" text-anchor="middle" fill="#15171a" font-size="24">Переводы</text>
<text x="320" y="264" text-anchor="middle" fill="#15171a" font-size="24">Биометрия</text>
<text x="524" y="264" text-anchor="middle" fill="#15171a" font-size="24">Обследование</text>
<text x="320" y="313" text-anchor="middle" fill="#5c626b" font-size="24">Биометрия и обследование — по запросу</text>
<text x="320" y="362" text-anchor="middle" fill="#15171a" font-size="24">Полная стоимость зависит от допрасходов.</text>
<text x="320" y="397" text-anchor="middle" fill="#5c626b" font-size="24">Конвертация и комиссия зависят от банка.</text>
</svg>
