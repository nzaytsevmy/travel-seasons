<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="system-ui,-apple-system,sans-serif">
<title>Из чего складывается австралийская виза</title>
<desc>Визовый сбор 250 австралийских долларов, около 14 700 рублей, поднят с 1 июля 2026. Плюс сервисный сбор визового центра за биометрию. При отказе сбор не возвращается.</desc>
<rect width="640" height="400" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ЦЕНА АВСТРАЛИЙСКОЙ ВИЗЫ</text>

<rect x="24" y="80" width="592" height="92" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="80" width="6" height="92" fill="#e8c062"/>
<text x="52" y="112" fill="#e8e0d0" font-size="19" font-weight="600">Визовый сбор</text>
<text x="600" y="112" text-anchor="end" fill="#e8c062" font-size="19" font-weight="700">AUD 250 ≈ 14 700 ₽</text>
<text x="52" y="138" fill="#a8a090" font-size="15.5">с 1 июля 2026 — подняли с прежних AUD 200</text>
<text x="52" y="160" fill="#a8a090" font-size="15.5">индексация каждый год первого июля</text>

<rect x="24" y="188" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="188" width="6" height="70" fill="#e8c062"/>
<text x="52" y="218" fill="#e8e0d0" font-size="19" font-weight="600">Биометрия в визовом центре</text>
<text x="52" y="244" fill="#a8a090" font-size="15.5">сервисный сбор центра — сумму сверяйте при записи</text>

<rect x="24" y="274" width="592" height="60" rx="5" fill="none" stroke="#d44545"/>
<rect x="24" y="274" width="6" height="60" fill="#d44545"/>
<text x="52" y="300" fill="#d44545" font-size="18" font-weight="700">При отказе сбор не возвращают</text>
<text x="52" y="322" fill="#a8a090" font-size="15.5">поэтому невозвратные билеты — только после визы</text>

<text x="320" y="374" text-anchor="middle" fill="#a8a090" font-size="15.5">закладывайте на всё около 15 000 ₽ + карта не российского банка</text>
</svg>
