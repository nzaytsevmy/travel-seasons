<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="Golos Text,Arial,sans-serif">
<title>Путь заявления на австралийскую визу</title>
<desc>Анкета и документы в ImmiAccount, оплата AUD 250 доступным способом, биометрия только по запросу и по инструкции департамента. Решение и индивидуальные условия визы приходят электронным письмом; срок заранее неизвестен.</desc>
<rect width="640" height="520" fill="#fbfbfa"/>
<text x="320" y="42" text-anchor="middle" fill="#1d40ae" font-size="28">Заявление на subclass 600</text>
<circle cx="48" cy="92" r="19" fill="#1d40ae"/><text x="48" y="100" text-anchor="middle" fill="#fff" font-size="24">1</text>
<text x="86" y="99" fill="#15171a" font-size="26">Анкета в ImmiAccount</text>
<text x="86" y="130" fill="#5c626b" font-size="24">Tourist stream · subclass 600</text>
<path d="M48 116V153m-6-7 6 7 6-7" fill="none" stroke="#1d40ae" stroke-width="2"/>
<circle cx="48" cy="177" r="19" fill="#1d40ae"/><text x="48" y="185" text-anchor="middle" fill="#fff" font-size="24">2</text>
<text x="86" y="184" fill="#15171a" font-size="26">Документы</text>
<text x="86" y="215" fill="#5c626b" font-size="24">Паспорт, финансы и переводы</text>
<path d="M48 201V238m-6-7 6 7 6-7" fill="none" stroke="#1d40ae" stroke-width="2"/>
<circle cx="48" cy="262" r="19" fill="#1d40ae"/><text x="48" y="270" text-anchor="middle" fill="#fff" font-size="24">3</text>
<text x="86" y="269" fill="#15171a" font-size="26">Оплата AUD 250</text>
<text x="86" y="300" fill="#5c626b" font-size="24">Способы оплаты — в ImmiAccount</text>
<path d="M48 286V323m-6-7 6 7 6-7" fill="none" stroke="#1d40ae" stroke-width="2"/>
<circle cx="48" cy="347" r="19" fill="#1d40ae"/><text x="48" y="355" text-anchor="middle" fill="#fff" font-size="24">4</text>
<text x="86" y="354" fill="#15171a" font-size="26">Биометрия, если запросят</text>
<text x="86" y="385" fill="#5c626b" font-size="24">Центр и срок — в письме департамента</text>
