<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="system-ui,-apple-system,sans-serif">
<title>Путь заявителя на австралийскую визу</title>
<desc>Анкета онлайн в ImmiAccount, оплата сбора картой не российского банка, биометрия в визовом центре по запросу, ожидание один-три месяца, электронная виза письмом.</desc>
<rect width="640" height="470" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ПУТЬ ЗАЯВКИ: 5 ШАГОВ</text>

<rect x="24" y="78" width="592" height="64" rx="5" fill="none" stroke="#3a3429"/>
<text x="52" y="104" fill="#e8c062" font-size="18" font-weight="700">1 · Анкета в ImmiAccount</text>
<text x="52" y="128" fill="#a8a090" font-size="15.5">онлайн, на английском · виза subclass 600, поток Tourist</text>

<rect x="24" y="152" width="592" height="64" rx="5" fill="none" stroke="#3a3429"/>
<text x="52" y="178" fill="#e8c062" font-size="18" font-weight="700">2 · Документы</text>
<text x="52" y="202" fill="#a8a090" font-size="15.5">паспорт, финансы, план поездки, связи с домом · переводы на английский</text>

<rect x="24" y="226" width="592" height="64" rx="5" fill="none" stroke="#3a3429"/>
<text x="52" y="252" fill="#e8c062" font-size="18" font-weight="700">3 · Оплата AUD 250</text>
<text x="52" y="276" fill="#a8a090" font-size="15.5">онлайн · карты банков РФ не проходят — нужна иностранная</text>

<rect x="24" y="300" width="592" height="64" rx="5" fill="none" stroke="#3a3429"/>
<text x="52" y="326" fill="#e8c062" font-size="18" font-weight="700">4 · Биометрия по запросу</text>
<text x="52" y="350" fill="#a8a090" font-size="15.5">лично в визовом центре в России · запись заранее</text>

<rect x="24" y="374" width="592" height="64" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="374" width="6" height="64" fill="#5cc97a"/>
<text x="52" y="400" fill="#5cc97a" font-size="18" font-weight="700">5 · Решение письмом на почту</text>
<text x="52" y="424" fill="#a8a090" font-size="15.5">виза электронная, в паспорт ничего не вклеивают · быть вне Австралии</text>
</svg>
