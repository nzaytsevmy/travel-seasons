<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="system-ui,-apple-system,sans-serif">
<title>Сроки австралийской визы по калькулятору департамента</title>
<desc>По калькулятору департамента на 5 сентября 2026 года половина решений выходит за 18 дней, девяносто процентов — за 38. Числа по всей категории, а не по России: наши заявки проходят дополнительные проверки, поэтому 38 дней — нижняя граница планирования.</desc>
<rect width="640" height="380" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">СКОЛЬКО ЖДАТЬ РЕШЕНИЯ</text>
<text x="320" y="70" text-anchor="middle" fill="#a8a090" font-size="15">калькулятор департамента, виза 600, поток Tourist, 05.09.2026</text>

<text x="24" y="118" fill="#a8a090" font-size="16">Половина решений</text>
<rect x="24" y="128" width="592" height="30" rx="4" fill="none" stroke="#3a3429"/>
<rect x="24" y="128" width="180" height="30" rx="4" fill="#e8c062"/>
<text x="600" y="149" text-anchor="end" fill="#e8e0d0" font-size="16" font-weight="600">18 дней</text>

<text x="24" y="198" fill="#a8a090" font-size="16">Девять решений из десяти</text>
<rect x="24" y="208" width="592" height="30" rx="4" fill="none" stroke="#3a3429"/>
<rect x="24" y="208" width="380" height="30" rx="4" fill="#8a6a2c"/>
<text x="600" y="229" text-anchor="end" fill="#e8e0d0" font-size="16" font-weight="600">38 дней</text>

<line x1="24" y1="266" x2="616" y2="266" stroke="#3a3429"/>
<text x="24" y="296" fill="#e8e0d0" font-size="16" font-weight="700">Это числа по всей категории, не по России.</text>
<text x="24" y="322" fill="#a8a090" font-size="15">Наши заявки проходят дополнительные проверки,</text>
<text x="24" y="344" fill="#a8a090" font-size="15">ускоренного варианта нет — 38 дней это нижняя граница.</text>
<text x="24" y="368" fill="#a8a090" font-size="15">Невозвратное не выкупать до письма с визой.</text>
</svg>
