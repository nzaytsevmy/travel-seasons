<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="system-ui,-apple-system,sans-serif">
<title>Сроки австралийской визы: обещание и реальность</title>
<desc>Официальный ориентир от двух недель. Реальность для заявителей из России — один-три месяца из-за дополнительных проверок. Подаваться минимум за три месяца до вылета.</desc>
<rect width="640" height="380" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">СКОЛЬКО ЖДАТЬ РЕШЕНИЯ</text>

<text x="24" y="96" fill="#a8a090" font-size="16">Официальный ориентир</text>
<rect x="24" y="106" width="592" height="30" rx="4" fill="none" stroke="#3a3429"/>
<rect x="24" y="106" width="99" height="30" rx="4" fill="#e8c062"/>
<text x="600" y="127" text-anchor="end" fill="#e8e0d0" font-size="16" font-weight="600">от 2 недель</text>

<text x="24" y="186" fill="#a8a090" font-size="16">Реальность у заявителей из России</text>
<rect x="24" y="196" width="592" height="30" rx="4" fill="none" stroke="#3a3429"/>
<rect x="24" y="196" width="592" height="30" rx="4" fill="#d44545" opacity="0.85"/>
<text x="600" y="217" text-anchor="end" fill="#131009" font-size="16" font-weight="700">1–3 месяца</text>
<text x="24" y="250" fill="#a8a090" font-size="15.5">дополнительные проверки · ускоренного варианта не существует</text>

<rect x="24" y="282" width="592" height="62" rx="5" fill="none" stroke="#5cc97a"/>
<rect x="24" y="282" width="6" height="62" fill="#5cc97a"/>
<text x="52" y="308" fill="#5cc97a" font-size="18" font-weight="700">Подавайтесь за 3 месяца до вылета</text>
<text x="52" y="332" fill="#a8a090" font-size="15.5">и не выкупайте невозвратное до письма с визой</text>
</svg>
