<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="system-ui,-apple-system,sans-serif">
<title>Планирование поездки до и после выдачи австралийской визы</title>
<desc>До решения — заявление, документы и запас времени на запросы. После выдачи — проверить условия визы, затем покупать невозвратные билеты. Длительность рассмотрения заранее неизвестна.</desc>
<rect width="640" height="380" fill="#fbfbfa"/>
<text x="24" y="46" fill="#1d40ae" font-size="28" font-weight="700">Когда покупать билеты</text>
<line x1="60" y1="90" x2="60" y2="314" stroke="#d9dbde" stroke-width="3"/>
<circle cx="60" cy="112" r="15" fill="#1d40ae"/>
<text x="96" y="119" fill="#15171a" font-size="26" font-weight="700">Подать заявление</text>
<text x="96" y="150" fill="#5c626b" font-size="24">Оставить время на запросы и биометрию</text>
<circle cx="60" cy="210" r="15" fill="#1d40ae"/>
<text x="96" y="217" fill="#15171a" font-size="26" font-weight="700">Получить решение</text>
<text x="96" y="248" fill="#5c626b" font-size="24">Проверить даты и условия пребывания</text>
<circle cx="60" cy="310" r="15" fill="#1a7f4b"/>
<text x="96" y="317" fill="#15171a" font-size="26" font-weight="700">Купить невозвратные билеты</text>
<line x1="24" y1="344" x2="616" y2="344" stroke="#d9dbde"/>
<text x="24" y="370" fill="#5c626b" font-size="24">Дата решения заранее неизвестна.</text>
</svg>
