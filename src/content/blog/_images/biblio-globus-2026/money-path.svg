<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1180" viewBox="0 0 640 1180" role="img" aria-labelledby="title desc">
  <title id="title">Кому писать при отмене тура Библио-Глобуса</title>
  <desc id="desc">Вертикальная схема: сначала турист находит продавца в договоре. При прямой покупке заявление получает Библио-Глобус. При покупке через агентство турист пишет турагенту, который передаёт заявление оператору и возвращает ответ.</desc>

  <rect width="640" height="1180" fill="#f4f2eb"/>

  <g font-family="'Golos Text Variable','Golos Text',Helvetica,Arial,sans-serif" fill="#1b1914">
    <text x="32" y="62" font-size="46" font-weight="800" letter-spacing="-1.5">Кому писать при</text>
    <text x="32" y="112" font-size="46" font-weight="800" letter-spacing="-1.5">отмене тура</text>
    <text x="32" y="154" font-size="21" fill="#6b685e">Маршрут определяет продавец в вашем договоре</text>

    <line x1="32" y1="184" x2="608" y2="184" stroke="#23211a" stroke-width="2"/>

    <g aria-label="Договор">
      <path d="M32 218h98l28 28v104H32z" fill="none" stroke="#23211a" stroke-width="2"/>
      <path d="M130 218v28h28" fill="none" stroke="#23211a" stroke-width="2"/>
      <line x1="54" y1="263" x2="127" y2="263" stroke="#cdc9bd" stroke-width="2"/>
      <line x1="54" y1="286" x2="137" y2="286" stroke="#cdc9bd" stroke-width="2"/>
      <line x1="54" y1="309" x2="119" y2="309" stroke="#8e6618" stroke-width="5"/>
      <line x1="54" y1="332" x2="132" y2="332" stroke="#cdc9bd" stroke-width="2"/>
    </g>

    <text x="190" y="245" font-size="29" font-weight="750">Сначала договор</text>
    <text x="190" y="282" font-size="21">Найдите юрлицо, которое</text>
    <text x="190" y="310" font-size="21">названо исполнителем.</text>
    <text x="190" y="342" font-size="19" fill="#8e6618" font-weight="650">Не ориентируйтесь только на логотип.</text>

    <line x1="32" y1="386" x2="608" y2="386" stroke="#23211a" stroke-width="2"/>

    <text x="32" y="429" font-size="29" font-weight="800" letter-spacing="-.5">Если продавец — Библио-Глобус</text>
    <text x="32" y="461" font-size="19" fill="#6b685e">Тур куплен напрямую на сайте оператора</text>

    <g aria-label="Путь при прямой покупке">
      <circle cx="54" cy="514" r="9" fill="#8e6618"/>
      <line x1="54" y1="525" x2="54" y2="581" stroke="#8e6618" stroke-width="3"/>
      <path d="m54 592-9-14h18z" fill="#8e6618"/>
      <circle cx="54" cy="608" r="9" fill="#8e6618"/>

      <text x="84" y="522" font-size="24" font-weight="750">Пишите оператору</text>
      <text x="84" y="552" font-size="19" fill="#6b685e">Он указан исполнителем в договоре</text>
      <text x="84" y="616" font-size="24" font-weight="750">Ответ и расчёт — напрямую</text>
      <text x="84" y="646" font-size="19" fill="#6b685e">По условиям договора с оператором</text>
    </g>

    <line x1="32" y1="686" x2="608" y2="686" stroke="#cdc9bd" stroke-width="1"/>

    <text x="32" y="730" font-size="29" font-weight="800" letter-spacing="-.5">Если продавец — турагент</text>
    <text x="32" y="762" font-size="19" fill="#6b685e">Тур оформлен через агентство</text>

    <g aria-label="Путь при покупке через турагента">
      <circle cx="54" cy="814" r="9" fill="#8e6618"/>
      <line x1="54" y1="825" x2="54" y2="875" stroke="#8e6618" stroke-width="3"/>
      <path d="m54 886-9-14h18z" fill="#8e6618"/>
      <circle cx="54" cy="902" r="9" fill="#8e6618"/>
      <line x1="54" y1="913" x2="54" y2="963" stroke="#8e6618" stroke-width="3"/>
      <path d="m54 974-9-14h18z" fill="#8e6618"/>
      <circle cx="54" cy="990" r="9" fill="#8e6618"/>

      <text x="84" y="822" font-size="24" font-weight="750">Пишите турагенту</text>
      <text x="84" y="852" font-size="19" fill="#6b685e">Именно с ним заключён договор</text>
      <text x="84" y="910" font-size="24" font-weight="750">Агент передаёт заявление</text>
      <text x="84" y="940" font-size="19" fill="#6b685e">Оператору по своему договору</text>
      <text x="84" y="998" font-size="24" font-weight="750">Ответ приходит через агента</text>
      <text x="84" y="1028" font-size="19" fill="#6b685e">Он остаётся вашим контактом по заявке</text>
    </g>

    <line x1="32" y1="1064" x2="608" y2="1064" stroke="#23211a" stroke-width="2"/>
    <text x="32" y="1107" font-size="19" fill="#8e6618" font-weight="700">Главное</text>
    <text x="32" y="1140" font-size="22" font-weight="650">Заявление сначала получает тот продавец,</text>
    <text x="32" y="1168" font-size="22" font-weight="650">который указан в вашем договоре.</text>
  </g>
</svg>
