<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Путь денег при покупке и отмене тура Библио-Глобуса</title>
  <desc id="desc">Схема показывает два пути: прямая покупка у оператора и покупка через турагента. При отмене заявление идет тому продавцу, который указан в договоре туриста.</desc>
  <rect width="1280" height="560" fill="#fbfbfa"/>
  <g fill="none" stroke="#15171a" stroke-width="2">
    <path d="M140 278H330"/>
    <path d="M530 170H750"/>
    <path d="M530 386H750"/>
    <path d="M950 170H1120"/>
    <path d="M950 386H1120"/>
  </g>
  <g fill="#15171a">
    <path d="m330 278-14-8v16z"/>
    <path d="m750 170-14-8v16z"/>
    <path d="m750 386-14-8v16z"/>
    <path d="m1120 170-14-8v16z"/>
    <path d="m1120 386-14-8v16z"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#15171a">
    <text x="70" y="260" font-size="34" font-weight="700">Турист</text>
    <text x="70" y="300" font-size="21" fill="#5c626b">смотрит свой договор</text>

    <rect x="330" y="92" width="200" height="156" fill="#fff" stroke="#1d40ae" stroke-width="3"/>
    <text x="365" y="150" font-size="27" font-weight="700">Оператор</text>
    <text x="365" y="188" font-size="20">прямая покупка</text>
    <text x="365" y="218" font-size="20" fill="#5c626b">на bgoperator.ru</text>

    <rect x="330" y="308" width="200" height="156" fill="#fff" stroke="#15171a" stroke-width="2"/>
    <text x="365" y="368" font-size="27" font-weight="700">Турагент</text>
    <text x="365" y="406" font-size="20">договор с туристом</text>
    <text x="365" y="436" font-size="20" fill="#5c626b">от своего имени</text>

    <rect x="750" y="92" width="200" height="156" fill="#fff" stroke="#15171a" stroke-width="2"/>
    <text x="792" y="150" font-size="27" font-weight="700">Заявка</text>
    <text x="792" y="188" font-size="20">оператору</text>
    <text x="792" y="218" font-size="20" fill="#5c626b">на отмену</text>

    <rect x="750" y="308" width="200" height="156" fill="#fff" stroke="#15171a" stroke-width="2"/>
    <text x="790" y="368" font-size="27" font-weight="700">Заявление</text>
    <text x="790" y="406" font-size="20">сначала агенту</text>
    <text x="790" y="436" font-size="20" fill="#5c626b">по его договору</text>

    <text x="1130" y="158" font-size="25" font-weight="700">Расчёт</text>
    <text x="1130" y="190" font-size="18" fill="#5c626b">по договору</text>
    <text x="1130" y="222" font-size="18" fill="#5c626b">продавца</text>
    <text x="1130" y="374" font-size="25" font-weight="700">Ответ</text>
    <text x="1130" y="406" font-size="18" fill="#5c626b">от агента</text>
    <text x="1130" y="438" font-size="18" fill="#5c626b">туристу</text>
  </g>
  <text x="70" y="520" font-family="Arial, sans-serif" font-size="20" fill="#1d40ae">Ключевой документ — тот, где турист указан заказчиком, а продавец — исполнителем.</text>
</svg>
