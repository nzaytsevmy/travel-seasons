<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Arial,Helvetica,sans-serif">
<title>Бюджет недели в Черногории после 1 ноября на двоих</title>
<desc>Фиксированный минимум: перелёт 71 318 рублей, апартаменты 21 100 рублей, две визы 6 980 рублей — всего около 99 400 рублей до еды, страховки и транспорта. С едой экономный бюджет 124–149 тысяч, с хорошим городским отелем 159–184 тысячи рублей.</desc>
<rect width="1200" height="820" fill="#fbfbfa"/>
<text x="70" y="82" fill="#15171a" font-size="42" font-weight="700">Неделя на двоих · 11–18 ноября</text>
<text x="70" y="126" fill="#5c626b" font-size="24">Срез цен 31 августа 2026 года</text>
<line x1="70" y1="164" x2="1130" y2="164" stroke="#15171a" stroke-width="2"/>

<text x="70" y="226" fill="#1d40ae" font-size="21" font-weight="700">ФИКСИРОВАННАЯ ЧАСТЬ</text>
<g transform="translate(70 258)">
  <rect width="320" height="150" fill="#fbfbfa" stroke="#15171a" stroke-width="2"/>
  <text x="24" y="46" fill="#5c626b" font-size="22">Два билета до Подгорицы</text>
  <text x="24" y="104" fill="#15171a" font-size="40" font-weight="700">71 318 ₽</text>
</g>
<g transform="translate(420 258)">
  <rect width="320" height="150" fill="#fbfbfa" stroke="#15171a" stroke-width="2"/>
  <text x="24" y="46" fill="#5c626b" font-size="22">Апартаменты, 7 ночей</text>
  <text x="24" y="104" fill="#15171a" font-size="40" font-weight="700">≈21 100 ₽</text>
</g>
<g transform="translate(770 258)">
  <rect width="360" height="150" fill="#fbfbfa" stroke="#15171a" stroke-width="2"/>
  <text x="24" y="46" fill="#5c626b" font-size="22">Две визы, без сервиса</text>
  <text x="24" y="104" fill="#15171a" font-size="40" font-weight="700">≈6 980 ₽</text>
</g>

<rect x="70" y="448" width="1060" height="104" fill="#1d40ae"/>
<text x="98" y="490" fill="#ffffff" font-size="22">Минимум до еды, страховки и местного транспорта</text>
<text x="1100" y="524" fill="#ffffff" font-size="44" font-weight="700" text-anchor="end">≈99 400 ₽</text>

<text x="70" y="620" fill="#1d40ae" font-size="21" font-weight="700">РЕАЛЬНЫЙ КОРИДОР С ЕДОЙ</text>
<text x="70" y="682" fill="#15171a" font-size="32" font-weight="700">Апартаменты</text>
<text x="1100" y="682" fill="#15171a" font-size="38" font-weight="700" text-anchor="end">124–149 тыс. ₽</text>
<line x1="70" y1="704" x2="1130" y2="704" stroke="#d9dbde" stroke-width="2"/>
<text x="70" y="754" fill="#15171a" font-size="32" font-weight="700">Хороший городской отель</text>
<text x="1100" y="754" fill="#15171a" font-size="38" font-weight="700" text-anchor="end">159–184 тыс. ₽</text>
<text x="70" y="798" fill="#5c626b" font-size="19">Без экскурсий, аренды машины и неизвестного пока сервисного сбора визового центра</text>
</svg>
