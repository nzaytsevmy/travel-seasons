<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Arial,Helvetica,sans-serif">
<title>Как выбрать Черногорию по сезону после 1 ноября</title>
<desc>Три сценария. В ноябре и весной — старые города побережья без расчёта на купание. Зимой — Колашин или Жабляк только после открытия трасс. С июня по сентябрь — пляжный сезон Будвы, Бечичей и Улциня.</desc>
<rect width="1200" height="780" fill="#fbfbfa"/>
<text x="70" y="82" fill="#15171a" font-size="42" font-weight="700">После 1 ноября: выбрать не курорт, а сезон</text>
<text x="70" y="126" fill="#5c626b" font-size="24">Одна страна — три разные поездки</text>
<line x1="70" y1="164" x2="1130" y2="164" stroke="#15171a" stroke-width="2"/>

<g transform="translate(70 216)">
  <rect width="330" height="430" fill="#fbfbfa" stroke="#15171a" stroke-width="2"/>
  <rect width="330" height="14" fill="#1d40ae"/>
  <text x="28" y="70" fill="#1d40ae" font-size="20" font-weight="700">НОЯБРЬ И ВЕСНА</text>
  <text x="28" y="125" fill="#15171a" font-size="34" font-weight="700">Побережье</text>
  <text x="28" y="166" fill="#5c626b" font-size="23">Котор · Пераст · Будва</text>
  <line x1="28" y1="198" x2="302" y2="198" stroke="#d9dbde" stroke-width="2"/>
  <text x="28" y="246" fill="#15171a" font-size="24">✓ старые города</text>
  <text x="28" y="286" fill="#15171a" font-size="24">✓ меньше летнего потока</text>
  <text x="28" y="326" fill="#15171a" font-size="24">✓ ниже цена жилья</text>
  <text x="28" y="382" fill="#5c626b" font-size="22">Не обещает: тёплое море</text>
</g>

<g transform="translate(435 216)">
  <rect width="330" height="430" fill="#fbfbfa" stroke="#15171a" stroke-width="2"/>
  <rect width="330" height="14" fill="#1d40ae"/>
  <text x="28" y="70" fill="#1d40ae" font-size="20" font-weight="700">ПОСЛЕ СНЕГОПАДОВ</text>
  <text x="28" y="125" fill="#15171a" font-size="34" font-weight="700">Горы</text>
  <text x="28" y="166" fill="#5c626b" font-size="23">Колашин · Жабляк</text>
  <line x1="28" y1="198" x2="302" y2="198" stroke="#d9dbde" stroke-width="2"/>
  <text x="28" y="246" fill="#15171a" font-size="24">✓ лыжи и снегоступы</text>
  <text x="28" y="286" fill="#15171a" font-size="24">✓ одна база на неделю</text>
  <text x="28" y="326" fill="#15171a" font-size="24">✓ зимние отели</text>
  <text x="28" y="382" fill="#5c626b" font-size="20">Только после открытия трасс</text>
</g>

<g transform="translate(800 216)">
  <rect width="330" height="430" fill="#fbfbfa" stroke="#15171a" stroke-width="2"/>
  <rect width="330" height="14" fill="#1d40ae"/>
  <text x="28" y="70" fill="#1d40ae" font-size="20" font-weight="700">ИЮНЬ — СЕНТЯБРЬ</text>
  <text x="28" y="125" fill="#15171a" font-size="34" font-weight="700">Пляжи</text>
  <text x="28" y="166" fill="#5c626b" font-size="23">Будва · Бечичи · Улцинь</text>
  <line x1="28" y1="198" x2="302" y2="198" stroke="#d9dbde" stroke-width="2"/>
  <text x="28" y="246" fill="#15171a" font-size="24">✓ купание</text>
  <text x="28" y="278" fill="#15171a" font-size="23">✓ лодки и пляжный</text>
  <text x="53" y="310" fill="#15171a" font-size="23">сервис</text>
  <text x="28" y="350" fill="#15171a" font-size="23">✓ полный выбор курортов</text>
  <text x="28" y="394" fill="#5c626b" font-size="20">Цена: толпы и высокий сезон</text>
</g>

<line x1="70" y1="700" x2="1130" y2="700" stroke="#d9dbde" stroke-width="2"/>
<text x="70" y="742" fill="#5c626b" font-size="20">Ноябрь на побережье: +9…+17 °C, около 165 мм осадков · нормы Улциня 1991–2020</text>
</svg>
