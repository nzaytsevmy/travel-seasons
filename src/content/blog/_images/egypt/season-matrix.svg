  <line x1="40" y1="278" x2="870" y2="278" stroke="#3a3429"/>
  <text x="48" y="304" fill="#e8e0d0" font-size="12" font-weight="600">Два правила важнее средней температуры:</text>
  <text x="48" y="324" fill="#a8a090" font-size="11.5">Зимой выбирайте конкретную бухту, летом сокращайте наземный маршрут и начинайте до жары.</text>
  <text x="48" y="342" fill="#6b6456" font-size="10">Климатический ориентир, не прогноз. CAPMAS + NOAA OISST; проверено 3 сентября 2026 года.</text>
