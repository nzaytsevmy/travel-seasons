    <text x="727" y="104">ОКТ</text><text x="785" y="104">НОЯ</text><text x="843" y="104">ДЕК</text>
  </g>
  <line x1="40" y1="114" x2="870" y2="114" stroke="#3a3429"/>

  <g fill="#e8e0d0" font-size="12.5" font-weight="600">
    <text x="48" y="150">Пляж</text>
    <text x="48" y="194">Дайвинг</text>
    <text x="48" y="238">Каир · Луксор</text>
