<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" width="900" height="352" font-family="system-ui,-apple-system,sans-serif">
  <title>Египет — когда ехать по месяцам</title>
  <desc>Матрица пляжного отдыха, дайвинга и поездок в Каир и Луксор по двенадцати месяцам. Зелёный — удобное окно, жёлтый — компромисс, красный — тяжело.</desc>
  <rect width="900" height="352" fill="#131009"/>
  <text x="450" y="34" text-anchor="middle" fill="#c9973a" font-size="14" font-weight="600" letter-spacing="2">ЕГИПЕТ — МЕСЯЦ × СЦЕНАРИЙ</text>
  <rect x="214" y="52" width="14" height="14" rx="2" fill="#5cc97a"/><text x="234" y="63" fill="#a8a090" font-size="11">удобно</text>
  <rect x="328" y="52" width="14" height="14" rx="2" fill="#e8c062"/><text x="348" y="63" fill="#a8a090" font-size="11">компромисс</text>
  <rect x="466" y="52" width="14" height="14" rx="2" fill="#d44545"/><text x="486" y="63" fill="#a8a090" font-size="11">тяжело</text>

  <g fill="#a8a090" font-size="10" font-weight="600" text-anchor="middle">
    <text x="205" y="104">ЯНВ</text><text x="263" y="104">ФЕВ</text><text x="321" y="104">МАР</text>
    <text x="379" y="104">АПР</text><text x="437" y="104">МАЙ</text><text x="495" y="104">ИЮН</text>
