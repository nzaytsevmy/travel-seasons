<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="system-ui,-apple-system,sans-serif">
<title>Когда ехать на сафари в Кению</title>
<desc>Июль-октябрь — Великая миграция в Масаи-Мара, январь-февраль — второй сухой сезон без толп, апрель-май — длинные дожди и худшее время.</desc>
<rect width="640" height="330" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">КОГДА ЕХАТЬ НА САФАРИ</text>
<rect x="27" y="76" width="92" height="58" rx="4" fill="#5cc97a" opacity="0.94"/>
<text x="73" y="112" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">ЯНВ</text>
<rect x="125" y="76" width="92" height="58" rx="4" fill="#5cc97a" opacity="0.94"/>
<text x="171" y="112" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">ФЕВ</text>
<rect x="223" y="76" width="92" height="58" rx="4" fill="#e8c062" opacity="0.94"/>
<text x="269" y="112" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">МАР</text>
<rect x="321" y="76" width="92" height="58" rx="4" fill="#d44545" opacity="0.94"/>
<text x="367" y="112" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">АПР</text>
<rect x="419" y="76" width="92" height="58" rx="4" fill="#d44545" opacity="0.94"/>
<text x="465" y="112" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">МАЙ</text>
<rect x="517" y="76" width="92" height="58" rx="4" fill="#e8c062" opacity="0.94"/>
<text x="563" y="112" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">ИЮН</text>
<rect x="27" y="148" width="92" height="58" rx="4" fill="#c9973a" opacity="0.94"/>
<text x="73" y="184" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">ИЮЛ</text>
<rect x="125" y="148" width="92" height="58" rx="4" fill="#c9973a" opacity="0.94"/>
<text x="171" y="184" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">АВГ</text>
<rect x="223" y="148" width="92" height="58" rx="4" fill="#c9973a" opacity="0.94"/>
<text x="269" y="184" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">СЕН</text>
<rect x="321" y="148" width="92" height="58" rx="4" fill="#c9973a" opacity="0.94"/>
<text x="367" y="184" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">ОКТ</text>
<rect x="419" y="148" width="92" height="58" rx="4" fill="#e8c062" opacity="0.94"/>
<text x="465" y="184" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">НОЯ</text>
<rect x="517" y="148" width="92" height="58" rx="4" fill="#e8c062" opacity="0.94"/>
<text x="563" y="184" text-anchor="middle" fill="#131009" font-size="19" font-weight="700">ДЕК</text>
<rect x="24" y="219" width="15" height="15" rx="3" fill="#c9973a"/>
<text x="46" y="232" fill="#a8a090" font-size="15">Великая миграция, пик — август и сентябрь</text>
<rect x="24" y="243" width="15" height="15" rx="3" fill="#5cc97a"/>
<text x="46" y="256" fill="#a8a090" font-size="15">сухо, зверей видно, толп меньше</text>
<rect x="24" y="267" width="15" height="15" rx="3" fill="#e8c062"/>
<text x="46" y="280" fill="#a8a090" font-size="15">межсезонье, ехать можно</text>
<rect x="24" y="291" width="15" height="15" rx="3" fill="#d44545"/>
<text x="46" y="304" fill="#a8a090" font-size="15">длинные дожди: часть лагерей закрыта</text>
</svg>