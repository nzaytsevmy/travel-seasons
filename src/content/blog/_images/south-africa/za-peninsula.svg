<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" font-family="system-ui,-apple-system,sans-serif">
<title>Капский полуостров: холодный берег и тёплый берег</title>
<desc>Схема полуострова к югу от Кейптауна. Западный, атлантический берег — Клифтон, Кэмпс-Бэй, Хаут-Бэй, Чапманс-Пик, Нордхук: вода около 14–18 градусов. Восточный берег бухты Фолс-Бэй — Мёйзенберг, Калк-Бэй, Саймонстаун с колонией пингвинов Болдерс: вода около 17–21 градуса. На южной оконечности мыс Доброй Надежды и Кейп-Пойнт.</desc>
<rect width="640" height="900" fill="#131009"/>

<text x="32" y="50" fill="#c9973a" font-size="23" font-weight="700">ДВА БЕРЕГА ОДНОГО ПОЛУОСТРОВА</text>
<text x="32" y="80" fill="#a8a090" font-size="18">Смотреть — на западном, купаться — на восточном</text>

<!-- шапка: две воды -->
<rect x="32" y="100" width="272" height="72" rx="6" fill="#16323b"/>
<text x="168" y="128" fill="#7fb5c9" font-size="19" font-weight="700" text-anchor="middle">Атлантика  14–18 °C</text>
<text x="168" y="154" fill="#a8a090" font-size="16" text-anchor="middle">холодное течение с юга</text>
<rect x="336" y="100" width="272" height="72" rx="6" fill="#1a3327"/>
<text x="472" y="128" fill="#7fc99a" font-size="19" font-weight="700" text-anchor="middle">Фолс-Бэй  17–21 °C</text>
<text x="472" y="154" fill="#a8a090" font-size="16" text-anchor="middle">залив прогревается</text>

<!-- вода по бокам -->
<rect x="0" y="192" width="248" height="620" fill="#16323b"/>
<rect x="392" y="192" width="248" height="620" fill="#1a3327"/>
<!-- суша -->
<path d="M248 192 L392 192 L386 560 L360 680 L320 740 L280 680 L254 560 Z" fill="#241f16" stroke="#3a3429" stroke-width="2"/>

<!-- Кейптаун -->
<rect x="242" y="196" width="156" height="40" rx="6" fill="#c9973a"/>
<text x="320" y="223" fill="#131009" font-size="19" font-weight="700" text-anchor="middle">Кейптаун</text>

<!-- маршрут -->
<path d="M300 240 C266 320 258 470 282 600 C296 668 308 706 318 726" fill="none" stroke="#7fb5c9" stroke-width="3" stroke-dasharray="9 7"/>
<path d="M322 726 C334 706 348 668 360 600 C384 470 374 320 340 240" fill="none" stroke="#7fc99a" stroke-width="3" stroke-dasharray="9 7"/>

<!-- западный берег: точки на x=262, подписи влево -->
<circle cx="262" cy="290" r="8" fill="#7fb5c9"/>
<text x="238" y="284" fill="#e8e0d0" font-size="19" text-anchor="end">Клифтон и</text>
<text x="238" y="306" fill="#e8e0d0" font-size="19" text-anchor="end">Кэмпс-Бэй</text>

<circle cx="260" cy="410" r="8" fill="#7fb5c9"/>
<text x="236" y="416" fill="#e8e0d0" font-size="19" text-anchor="end">Хаут-Бэй</text>

<circle cx="266" cy="530" r="8" fill="#7fb5c9"/>
<text x="242" y="524" fill="#e8e0d0" font-size="19" text-anchor="end">Чапманс-Пик</text>
<text x="242" y="546" fill="#a8a090" font-size="16" text-anchor="end">платная дорога</text>

<circle cx="280" cy="640" r="8" fill="#7fb5c9"/>
<text x="256" y="646" fill="#e8e0d0" font-size="19" text-anchor="end">Нордхук</text>

<!-- восточный берег: точки на x=378, подписи вправо -->
<circle cx="378" cy="350" r="8" fill="#7fc99a"/>
<text x="402" y="344" fill="#e8e0d0" font-size="19">Мёйзенберг</text>
<text x="402" y="366" fill="#a8a090" font-size="16">кабинки, серфинг</text>

<circle cx="380" cy="470" r="8" fill="#7fc99a"/>
<text x="404" y="476" fill="#e8e0d0" font-size="19">Калк-Бэй</text>

<circle cx="372" cy="590" r="9" fill="#c9973a"/>
<text x="396" y="584" fill="#e8e0d0" font-size="19" font-weight="700">Саймонстаун</text>
<text x="396" y="606" fill="#c9973a" font-size="17">пингвины Болдерс, 245 R</text>

<!-- юг -->
<circle cx="320" cy="736" r="10" fill="#c9973a"/>
<text x="320" y="790" fill="#e8e0d0" font-size="20" font-weight="700" text-anchor="middle">Мыс Доброй Надежды</text>
<text x="320" y="820" fill="#c9973a" font-size="18" text-anchor="middle">515 R с человека</text>
<text x="320" y="856" fill="#a8a090" font-size="17" text-anchor="middle">На воротах Болдерса и Кейп-Пойнта</text>
<text x="320" y="878" fill="#a8a090" font-size="17" text-anchor="middle">наличные не принимают — только карта</text>
</svg>
