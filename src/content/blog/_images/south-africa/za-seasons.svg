<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" font-family="system-ui,-apple-system,sans-serif">
<title>Календарь сезонов ЮАР: город, сафари и киты не совпадают</title>
<desc>Шкала по месяцам с тремя колонками. Кейптаун и побережье — с ноября по март. Сафари в Крюгере — с мая по сентябрь. Киты у Херманууса — с июня по ноябрь, пик в сентябре и октябре. Город и киты совпадают только в ноябре, сафари к этому времени на спаде.</desc>
<rect width="640" height="900" fill="#131009"/>

<text x="32" y="56" fill="#c9973a" font-size="23" font-weight="700">КОГДА ЕХАТЬ В ЮАР</text>
<text x="32" y="88" fill="#a8a090" font-size="18">Три сезона идут вразнобой — месяц выбирают под приоритет</text>

<!-- заголовки колонок -->
<text x="300" y="140" fill="#e8e0d0" font-size="18" font-weight="600" text-anchor="middle">Кейптаун</text>
<text x="300" y="162" fill="#a8a090" font-size="16" text-anchor="middle">и побережье</text>
<text x="424" y="140" fill="#e8e0d0" font-size="18" font-weight="600" text-anchor="middle">Сафари</text>
<text x="424" y="162" fill="#a8a090" font-size="16" text-anchor="middle">в Крюгере</text>
<text x="548" y="140" fill="#e8e0d0" font-size="18" font-weight="600" text-anchor="middle">Киты</text>
<text x="548" y="162" fill="#a8a090" font-size="16" text-anchor="middle">у Херманууса</text>

<line x1="32" y1="180" x2="608" y2="180" stroke="#3a3429" stroke-width="1.5"/>

<!-- фон колонок -->
<rect x="252" y="188" width="96" height="600" fill="#1c1810"/>
<rect x="376" y="188" width="96" height="600" fill="#1c1810"/>
<rect x="500" y="188" width="96" height="600" fill="#1c1810"/>

<!-- заливка сезонов: 12 месяцев по 50px, старт y=188 -->
<!-- Кейптаун: янв-мар (188-338) и ноя-дек (688-788) -->
<rect x="252" y="188" width="96" height="150" rx="6" fill="#2f7d8f"/>
<rect x="252" y="688" width="96" height="100" rx="6" fill="#2f7d8f"/>
<!-- Сафари: май-сен (388-638) -->
<rect x="376" y="388" width="96" height="250" rx="6" fill="#c9973a"/>
<!-- Киты: июн-ноя (438-738), пик сен-окт (588-688) -->
<rect x="500" y="438" width="96" height="300" rx="6" fill="#4a7c59"/>
<rect x="500" y="588" width="96" height="100" rx="6" fill="#7fc99a"/>
<text x="548" y="644" fill="#131009" font-size="17" font-weight="700" text-anchor="middle">пик</text>

<!-- месяцы -->
<g font-size="19" fill="#a8a090">
<text x="32" y="220">январь</text>
<text x="32" y="270">февраль</text>
<text x="32" y="320">март</text>
<text x="32" y="370">апрель</text>
<text x="32" y="420">май</text>
<text x="32" y="470">июнь</text>
<text x="32" y="520">июль</text>
<text x="32" y="570">август</text>
<text x="32" y="620">сентябрь</text>
<text x="32" y="670">октябрь</text>
<text x="32" y="720">ноябрь</text>
<text x="32" y="770">декабрь</text>
</g>
<g stroke="#3a3429" stroke-width="1">
<line x1="32" y1="238" x2="608" y2="238"/><line x1="32" y1="288" x2="608" y2="288"/>
<line x1="32" y1="338" x2="608" y2="338"/><line x1="32" y1="388" x2="608" y2="388"/>
<line x1="32" y1="438" x2="608" y2="438"/><line x1="32" y1="488" x2="608" y2="488"/>
<line x1="32" y1="538" x2="608" y2="538"/><line x1="32" y1="588" x2="608" y2="588"/>
<line x1="32" y1="638" x2="608" y2="638"/><line x1="32" y1="688" x2="608" y2="688"/>
<line x1="32" y1="738" x2="608" y2="738"/>
</g>
<line x1="32" y1="788" x2="608" y2="788" stroke="#3a3429" stroke-width="1.5"/>

<!-- метка ноября -->
<rect x="26" y="690" width="216" height="46" rx="6" fill="#2a1f12"/>
<text x="38" y="712" fill="#c9973a" font-size="17" font-weight="700">ноябрь</text>
<text x="38" y="730" fill="#c9973a" font-size="16">город и киты вместе</text>

<text x="32" y="828" fill="#e8e0d0" font-size="18">Декабрь и январь — пик цен и очередей.</text>
<text x="32" y="856" fill="#a8a090" font-size="17">К декабрю киты уходят, в Крюгере начинаются дожди.</text>
</svg>
