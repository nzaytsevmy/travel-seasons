<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 416" width="640" height="416" font-family="system-ui,-apple-system,sans-serif">
<title>Три бухты Саньи: чем отличаются</title>
<desc>Дадунхай дешевле и шумнее, Санья Бэй с длинной набережной, Ялонг Бэй самый дорогой и тихий.</desc>
<rect width="640" height="416" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ТРИ БУХТЫ САНЬИ</text>
<rect x="24" y="84" width="592" height="78" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="78" fill="#e8c062"/>
<text x="52" y="114" fill="#e8c062" font-size="19" font-weight="700">ДАДУНХАЙ</text>
<text x="52" y="138" fill="#e8e0d0" font-size="17.5">дешевле и живее</text>
<text x="52" y="156" fill="#a8a090" font-size="15">русскоязычная публика, шумно</text>
<rect x="24" y="176" width="592" height="78" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="176" width="6" height="78" fill="#5cc97a"/>
<text x="52" y="206" fill="#5cc97a" font-size="19" font-weight="700">САНЬЯ БЭЙ</text>
<text x="52" y="230" fill="#e8e0d0" font-size="17.5">длинная набережная</text>
<text x="52" y="248" fill="#a8a090" font-size="15">городской пляж, закаты</text>
<rect x="24" y="268" width="592" height="78" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="268" width="6" height="78" fill="#c9973a"/>
<text x="52" y="298" fill="#c9973a" font-size="19" font-weight="700">ЯЛОНГ БЭЙ</text>
<text x="52" y="322" fill="#e8e0d0" font-size="17.5">пятёрки и чистое море</text>
<text x="52" y="340" fill="#a8a090" font-size="15">дороже и тише всего</text>
</svg>