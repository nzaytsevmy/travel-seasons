<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 528" width="640" height="528" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько стоит неделя на Хайнане</title>
<desc>Неделя вдвоём от 350 долларов в экономе до 1750 в премиуме без перелёта. Лапша 3-5 долларов, ужин на двоих 30-50, отель у моря 40-70 за ночь.</desc>
<rect width="640" height="528" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">СКОЛЬКО СТОИТ ХАЙНАНЬ</text>
<text x="320" y="84" text-anchor="middle" fill="#5cc97a" font-size="19" font-weight="700">350–1750 $ на двоих за неделю</text>
<text x="320" y="106" text-anchor="middle" fill="#a8a090" font-size="16">без перелёта</text>
<line x1="24" y1="126" x2="616" y2="126" stroke="#3a3429"/>
<text x="24" y="164" fill="#e8e0d0" font-size="17.5" font-weight="600">Лапша в чифаньке</text>
<text x="616" y="164" text-anchor="end" fill="#5cc97a" font-size="17.5" font-weight="700">3–5 $</text>
<text x="24" y="181" fill="#6b6455" font-size="14">местная забегаловка</text>
<text x="24" y="216" fill="#e8e0d0" font-size="17.5" font-weight="600">Ужин на двоих</text>
<text x="616" y="216" text-anchor="end" fill="#e8c062" font-size="17.5" font-weight="700">30–50 $</text>
<text x="24" y="233" fill="#6b6455" font-size="14">ресторан морепродуктов</text>
<text x="24" y="268" fill="#e8e0d0" font-size="17.5" font-weight="600">Отель 4 звезды у моря</text>
<text x="616" y="268" text-anchor="end" fill="#c9973a" font-size="17.5" font-weight="700">40–70 $</text>
<text x="24" y="285" fill="#6b6455" font-size="14">за ночь</text>
<text x="24" y="320" fill="#e8e0d0" font-size="17.5" font-weight="600">Пятёрка в Ялонг Бэй</text>
<text x="616" y="320" text-anchor="end" fill="#e8c062" font-size="17.5" font-weight="700">120–250 $</text>
<text x="24" y="337" fill="#6b6455" font-size="14">за ночь</text>
<text x="24" y="372" fill="#e8e0d0" font-size="17.5" font-weight="600">Такси на 10 км</text>
<text x="616" y="372" text-anchor="end" fill="#7fb5c9" font-size="17.5" font-weight="700">3–4 $</text>
<text x="24" y="389" fill="#6b6455" font-size="14">вызов через Alipay</text>
<text x="24" y="424" fill="#e8e0d0" font-size="17.5" font-weight="600">Автобус</text>
<text x="616" y="424" text-anchor="end" fill="#5cc97a" font-size="17.5" font-weight="700">0,3 $</text>
<text x="24" y="441" fill="#6b6455" font-size="14">городской</text>
<text x="320" y="484" text-anchor="middle" fill="#a8a090" font-size="16">Дешевле Дубая, дороже Паттайи</text>
</svg>