<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" width="640" height="368" font-family="system-ui,-apple-system,sans-serif">
<title>Виза в Китай и на Хайнань для россиян</title>
<desc>Безвизовый въезд до тридцати дней, отдельный островной режим Хайнаня, паспорт от полугода.</desc>
<rect width="640" height="368" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ВИЗА: КОРОТКО</text>
<rect x="24" y="84" width="592" height="64" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="64" fill="#5cc97a"/>
<text x="52" y="110" fill="#e8e0d0" font-size="18" font-weight="600">Безвизовый въезд</text>
<text x="600" y="110" text-anchor="end" fill="#5cc97a" font-size="18" font-weight="700">до 30 дней</text>
<text x="52" y="134" fill="#a8a090" font-size="15">по соглашению с Китаем</text>
<rect x="24" y="160" width="592" height="64" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="160" width="6" height="64" fill="#5cc97a"/>
<text x="52" y="186" fill="#e8e0d0" font-size="18" font-weight="600">Хайнань отдельно</text>
<text x="600" y="186" text-anchor="end" fill="#5cc97a" font-size="18" font-weight="700">до 30 дней</text>
<text x="52" y="210" fill="#a8a090" font-size="15">островной безвизовый режим</text>
<rect x="24" y="236" width="592" height="64" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="236" width="6" height="64" fill="#e8c062"/>
<text x="52" y="262" fill="#e8e0d0" font-size="18" font-weight="600">Паспорт</text>
<text x="600" y="262" text-anchor="end" fill="#e8c062" font-size="18" font-weight="700">от 6 месяцев</text>
<text x="52" y="286" fill="#a8a090" font-size="15">на дату въезда</text>
<text x="320" y="354" text-anchor="middle" fill="#6b6455" font-size="15">Точные условия сверяйте перед вылетом: режим меняли не раз</text>
</svg>