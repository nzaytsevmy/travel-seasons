<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 626" width="640" height="626" font-family="system-ui,-apple-system,sans-serif">
<title>Маршрут по Абхазии на неделю</title>
<desc>База в Гагре или Новом Афоне и радиальные выезды: колоннада, Рица, пляж, Новый Афон, Сухум и Пицунда за семь дней.</desc>
<rect width="640" height="626" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">НЕДЕЛЯ ПО АБХАЗИИ</text>
<circle cx="46" cy="110" r="9" fill="#c9973a"/>
<line x1="46" y1="121" x2="46" y2="152" stroke="#3a3429" stroke-width="2"/>
<text x="72" y="104" fill="#c9973a" font-size="16" font-weight="700">День 1</text>
<text x="72" y="126" fill="#e8e0d0" font-size="19" font-weight="600">Гагра</text>
<text x="72" y="146" fill="#a8a090" font-size="15">заселение, колоннада, Приморский парк</text>
<circle cx="46" cy="178" r="9" fill="#c9973a"/>
<line x1="46" y1="189" x2="46" y2="220" stroke="#3a3429" stroke-width="2"/>
<text x="72" y="172" fill="#c9973a" font-size="16" font-weight="700">День 2</text>
<text x="72" y="194" fill="#e8e0d0" font-size="19" font-weight="600">Старая Гагра</text>
<text x="72" y="214" fill="#a8a090" font-size="15">парк Ольденбургского, рынок</text>
<circle cx="46" cy="246" r="9" fill="#7fb5c9"/>
<line x1="46" y1="257" x2="46" y2="288" stroke="#3a3429" stroke-width="2"/>
<text x="72" y="240" fill="#7fb5c9" font-size="16" font-weight="700">День 3</text>
<text x="72" y="262" fill="#e8e0d0" font-size="19" font-weight="600">Озеро Рица</text>
<text x="72" y="282" fill="#a8a090" font-size="15">Голубое озеро и водопады по пути</text>
<circle cx="46" cy="314" r="9" fill="#5cc97a"/>
<line x1="46" y1="325" x2="46" y2="356" stroke="#3a3429" stroke-width="2"/>
<text x="72" y="308" fill="#5cc97a" font-size="16" font-weight="700">День 4</text>
<text x="72" y="330" fill="#e8e0d0" font-size="19" font-weight="600">Пляж</text>
<text x="72" y="350" fill="#a8a090" font-size="15">передышка между выездами</text>
<circle cx="46" cy="382" r="9" fill="#e8c062"/>
<line x1="46" y1="393" x2="46" y2="424" stroke="#3a3429" stroke-width="2"/>
<text x="72" y="376" fill="#e8c062" font-size="16" font-weight="700">День 5</text>
<text x="72" y="398" fill="#e8e0d0" font-size="19" font-weight="600">Новый Афон</text>
<text x="72" y="418" fill="#a8a090" font-size="15">монастырь и пещера</text>
<circle cx="46" cy="450" r="9" fill="#e8c062"/>
<line x1="46" y1="461" x2="46" y2="492" stroke="#3a3429" stroke-width="2"/>
<text x="72" y="444" fill="#e8c062" font-size="16" font-weight="700">День 6</text>
<text x="72" y="466" fill="#e8e0d0" font-size="19" font-weight="600">Сухум</text>
<text x="72" y="486" fill="#a8a090" font-size="15">ботанический сад, набережная</text>
<circle cx="46" cy="518" r="9" fill="#5cc97a"/>
<text x="72" y="512" fill="#5cc97a" font-size="16" font-weight="700">День 7</text>
<text x="72" y="534" fill="#e8e0d0" font-size="19" font-weight="600">Пицунда</text>
<text x="72" y="554" fill="#a8a090" font-size="15">сосны, чистое море, отъезд</text>
<text x="320" y="610" text-anchor="middle" fill="#6b6455" font-size="15.5">База в одном месте плюс выезды: переезжать</text>
<text x="320" y="628" text-anchor="middle" fill="#6b6455" font-size="15.5"></text>
</svg>