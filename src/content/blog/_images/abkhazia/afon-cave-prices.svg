<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" width="640" height="510" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько стоит Новоафонская пещера в 2026 году</title>
<desc>Билет тысяча рублей, дети до восьми лет бесплатно. Съёмка пятьдесят рублей, парковка двести, плед сто. Оплата только наличными, онлайн-брони нет.</desc>
<rect width="640" height="510" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">НОВОАФОНСКАЯ ПЕЩЕРА: ЦЕНЫ</text>
<text x="320" y="84" text-anchor="middle" fill="#d44545" font-size="19" font-weight="700">Только наличные, брони онлайн нет</text>
<text x="320" y="108" text-anchor="middle" fill="#a8a090" font-size="16">билеты в кассе по живой очереди</text>
<line x1="24" y1="128" x2="616" y2="128" stroke="#3a3429"/>
<text x="24" y="166" fill="#e8e0d0" font-size="18" font-weight="600">Билет</text>
<text x="616" y="166" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">1000 ₽</text>
<text x="24" y="186" fill="#6b6455" font-size="14.5">дети до 8 лет бесплатно</text>
<text x="24" y="222" fill="#e8e0d0" font-size="18" font-weight="600">Фото- и видеосъёмка</text>
<text x="616" y="222" text-anchor="end" fill="#e8c062" font-size="18" font-weight="700">+50 ₽</text>
<text x="24" y="278" fill="#e8e0d0" font-size="18" font-weight="600">Парковка у входа</text>
<text x="616" y="278" text-anchor="end" fill="#e8c062" font-size="18" font-weight="700">≈200 ₽</text>
<text x="24" y="334" fill="#e8e0d0" font-size="18" font-weight="600">Прокат пледа</text>
<text x="616" y="334" text-anchor="end" fill="#7fb5c9" font-size="18" font-weight="700">≈100 ₽</text>
<text x="24" y="354" fill="#6b6455" font-size="14.5">внутри +11…+14 °C круглый год</text>
<text x="24" y="390" fill="#e8e0d0" font-size="18" font-weight="600">Туалет на входе</text>
<text x="616" y="390" text-anchor="end" fill="#a8a090" font-size="18" font-weight="700">≈10 ₽</text>
<text x="24" y="410" fill="#6b6455" font-size="14.5">внутри его нет</text>
<text x="320" y="456" text-anchor="middle" fill="#5cc97a" font-size="17" font-weight="600">Летом приходите к 9 утра</text>
<text x="320" y="480" text-anchor="middle" fill="#a8a090" font-size="15.5">в разгар сезона ждут от получаса до пары часов</text>
</svg>