<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 608" width="640" height="608" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько стоит отдых в Абхазии в 2026 году</title>
<desc>Неделя на двоих обходится в 35–70 тысяч рублей без дороги. Гостевой дом от тысячи за ночь, обед в столовой 350–500 рублей, экскурсия на Рицу 1600–2500 плюс сбор в нацпарк.</desc>
<rect width="640" height="608" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">СКОЛЬКО СТОИТ АБХАЗИЯ</text>
<text x="320" y="82" text-anchor="middle" fill="#5cc97a" font-size="19" font-weight="700">Неделя на двоих: 35 000–70 000 ₽</text>
<text x="320" y="106" text-anchor="middle" fill="#a8a090" font-size="16">без дороги до Адлера или Сухума</text>
<line x1="24" y1="126" x2="616" y2="126" stroke="#3a3429"/>
<text x="24" y="164" fill="#e8e0d0" font-size="18" font-weight="600">Гостевой дом</text>
<text x="616" y="164" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">от 1000 ₽</text>
<text x="24" y="184" fill="#6b6455" font-size="14.5">за ночь, в Гагре от 1700</text>
<text x="24" y="218" fill="#e8e0d0" font-size="18" font-weight="600">Отель 2–3 звезды</text>
<text x="616" y="218" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">2000–3000 ₽</text>
<text x="24" y="238" fill="#6b6455" font-size="14.5">за ночь</text>
<text x="24" y="272" fill="#e8e0d0" font-size="18" font-weight="600">Обед в столовой</text>
<text x="616" y="272" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">350–500 ₽</text>
<text x="24" y="292" fill="#6b6455" font-size="14.5">на человека</text>
<text x="24" y="326" fill="#e8e0d0" font-size="18" font-weight="600">Ужин с вином</text>
<text x="616" y="326" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">1200–2000 ₽</text>
<text x="24" y="346" fill="#6b6455" font-size="14.5">на двоих</text>
<text x="24" y="380" fill="#e8e0d0" font-size="18" font-weight="600">Хачапури-лодочка</text>
<text x="616" y="380" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">350–500 ₽</text>
<text x="24" y="400" fill="#6b6455" font-size="14.5">порция</text>
<text x="24" y="434" fill="#e8e0d0" font-size="18" font-weight="600">Экскурсия на Рицу</text>
<text x="616" y="434" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">1600–2500 ₽</text>
<text x="24" y="454" fill="#6b6455" font-size="14.5">плюс сбор 1000 ₽ в нацпарк</text>
<text x="24" y="488" fill="#e8e0d0" font-size="18" font-weight="600">Джип к Гегскому</text>
<text x="616" y="488" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">3000–5000 ₽</text>
<text x="24" y="508" fill="#6b6455" font-size="14.5">с человека</text>
<text x="320" y="552" text-anchor="middle" fill="#d44545" font-size="18" font-weight="700">Всё наличными: карты почти не принимают</text>
<text x="320" y="578" text-anchor="middle" fill="#6b6455" font-size="15">Расчёт АТОР на 2026 год</text>
</svg>