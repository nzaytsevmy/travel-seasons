<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 526" width="640" height="526" font-family="system-ui,-apple-system,sans-serif">
<title>Что взять в Новоафонскую пещеру и кому будет тяжело</title>
<desc>Внутри одиннадцать-четырнадцать градусов круглый год, дорожки мокрые, туалета нет, маршрут два километра по ступеням — с коляской и больными коленями тяжело.</desc>
<rect width="640" height="526" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">С ЧЕМ ИДТИ В ПЕЩЕРУ</text>
<rect x="24" y="76" width="592" height="78" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="76" width="6" height="78" fill="#7fb5c9"/>
<text x="52" y="106" fill="#7fb5c9" font-size="18" font-weight="700">Кофта или ветровка</text>
<text x="52" y="130" fill="#e8e0d0" font-size="17">внутри +11…+14 °C круглый год</text>
<text x="52" y="148" fill="#a8a090" font-size="15">после летней жары контраст резкий</text>
<rect x="24" y="168" width="592" height="78" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="168" width="6" height="78" fill="#5cc97a"/>
<text x="52" y="198" fill="#5cc97a" font-size="18" font-weight="700">Обувь с цепким протектором</text>
<text x="52" y="222" fill="#e8e0d0" font-size="17">дорожки мокрые</text>
<text x="52" y="240" fill="#a8a090" font-size="15">пляжные шлёпки не годятся</text>
<rect x="24" y="260" width="592" height="78" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="260" width="6" height="78" fill="#e8c062"/>
<text x="52" y="290" fill="#e8c062" font-size="18" font-weight="700">Сходить в туалет заранее</text>
<text x="52" y="314" fill="#e8e0d0" font-size="17">внутри его нет</text>
<text x="52" y="332" fill="#a8a090" font-size="15">на входе платный, около 10 ₽</text>
<rect x="24" y="352" width="592" height="78" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="352" width="6" height="78" fill="#d44545"/>
<text x="52" y="382" fill="#d44545" font-size="18" font-weight="700">Коляску придётся оставить</text>
<text x="52" y="406" fill="#e8e0d0" font-size="17">маршрут 2 км по ступеням</text>
<text x="52" y="424" fill="#a8a090" font-size="15">тяжело с больными коленями</text>
<text x="320" y="498" text-anchor="middle" fill="#5cc97a" font-size="16.5">Сам маршрут несложный: спокойная прогулка</text>
<text x="320" y="518" text-anchor="middle" fill="#5cc97a" font-size="16.5">с гидом, а не спелеология со снаряжением</text>
</svg>