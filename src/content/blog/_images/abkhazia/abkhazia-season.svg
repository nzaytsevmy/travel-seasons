<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" width="640" height="660" role="img" aria-labelledby="t d">
  <title id="t">Когда ехать в Абхазию: шкала месяцев</title>
  <desc id="d">Шкала двенадцати месяцев: купальный сезон с конца мая по октябрь, тёплое море с середины июня до начала октября, пик людей и цен в июле и августе, бархатный сезон с сентября до начала октября, лучшее сочетание — вторая половина июня, май — экскурсии без жары при холодном море.</desc>
  <rect width="640" height="660" fill="#131009"/>
  <text x="320" y="44" text-anchor="middle" fill="#c9973a" font-family="Golos Text, Arial, sans-serif" font-size="23" font-weight="700">КОГДА ЕХАТЬ В АБХАЗИЮ</text>

  <g font-family="Golos Text, Arial, sans-serif" font-size="16" fill="#a8a090" text-anchor="middle">
    <text x="67" y="98">янв</text><text x="113" y="98">фев</text><text x="159" y="98">мар</text><text x="205" y="98">апр</text>
    <text x="251" y="98">май</text><text x="297" y="98">июн</text><text x="343" y="98">июл</text><text x="389" y="98">авг</text>
    <text x="435" y="98">сен</text><text x="481" y="98">окт</text><text x="527" y="98">ноя</text><text x="573" y="98">дек</text>
  </g>
  <g stroke="#3a3429" stroke-width="1">
    <line x1="44" y1="102" x2="44" y2="562"/><line x1="90" y1="102" x2="90" y2="562"/><line x1="136" y1="102" x2="136" y2="562"/>
    <line x1="182" y1="102" x2="182" y2="562"/><line x1="228" y1="102" x2="228" y2="562"/><line x1="274" y1="102" x2="274" y2="562"/>
    <line x1="320" y1="102" x2="320" y2="562"/><line x1="366" y1="102" x2="366" y2="562"/><line x1="412" y1="102" x2="412" y2="562"/>
    <line x1="458" y1="102" x2="458" y2="562"/><line x1="504" y1="102" x2="504" y2="562"/><line x1="550" y1="102" x2="550" y2="562"/><line x1="596" y1="102" x2="596" y2="562"/>
  </g>

  <g font-family="Golos Text, Arial, sans-serif">
    <text x="44" y="124" fill="#e8e0d0" font-size="18" font-weight="600">Купальный сезон</text>
    <rect x="258" y="132" width="246" height="24" rx="3" fill="#7fb5c9" opacity="0.55"/>
    <text x="44" y="176" fill="#a8a090" font-size="16">конец мая — октябрь</text>

    <text x="44" y="200" fill="#e8e0d0" font-size="18" font-weight="600">Тёплое море</text>
    <rect x="297" y="208" width="173" height="24" rx="3" fill="#5cc97a" opacity="0.55"/>
    <text x="44" y="252" fill="#a8a090" font-size="16">середина июня — начало октября: +24 в июне, +21–27 летом</text>

    <text x="44" y="276" fill="#e8e0d0" font-size="18" font-weight="600">Пик людей и цен</text>
    <rect x="320" y="284" width="92" height="24" rx="3" fill="#d44545" opacity="0.6"/>
    <text x="44" y="328" fill="#a8a090" font-size="16">июль — август: людно и дорого</text>

    <text x="44" y="352" fill="#e8e0d0" font-size="18" font-weight="600">Бархатный сезон</text>
    <rect x="412" y="360" width="58" height="24" rx="3" fill="#c9973a" opacity="0.65"/>
    <text x="44" y="404" fill="#a8a090" font-size="16">сентябрь — начало октября: тёплое море, спокойно</text>

    <text x="44" y="428" fill="#e8e0d0" font-size="18" font-weight="600">Лучшее сочетание</text>
    <rect x="297" y="436" width="23" height="24" rx="3" fill="#c9973a"/>
    <text x="44" y="480" fill="#a8a090" font-size="16">вторая половина июня: море +24, людей меньше</text>

    <text x="44" y="504" fill="#e8e0d0" font-size="18" font-weight="600">Без жары, но море холодное</text>
    <rect x="228" y="512" width="46" height="24" rx="3" fill="#7fb5c9" opacity="0.3"/>
    <text x="44" y="556" fill="#a8a090" font-size="16">май: воздух +17–21, экскурсии</text>
  </g>

  <text x="44" y="598" fill="#a8a090" font-family="Golos Text, Arial, sans-serif" font-size="16">Голубой — купание, зелёный — тёплое море, красный — толпа,</text>
  <text x="44" y="620" fill="#a8a090" font-family="Golos Text, Arial, sans-serif" font-size="16">золото — лучшее время. По тексту статьи, сентябрь 2026.</text>
</svg>
