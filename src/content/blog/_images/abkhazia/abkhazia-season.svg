<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 556" width="640" height="556" font-family="system-ui,-apple-system,sans-serif">
<title>Когда лучше ехать в Абхазию</title>
<desc>Вторая половина июня и бархатный сезон с сентября по начало октября — лучшее время. В июле и августе жарко и людно, в мае море ещё холодное.</desc>
<rect width="640" height="556" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">КОГДА ЕХАТЬ В АБХАЗИЮ</text>
<rect x="24" y="84" width="592" height="88" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="88" fill="#7fb5c9"/>
<text x="52" y="114" fill="#7fb5c9" font-size="18" font-weight="700">МАЙ</text>
<text x="52" y="140" fill="#e8e0d0" font-size="17">воздух +17–21, море ещё холодное</text>
<text x="52" y="162" fill="#a8a090" font-size="16">экскурсии без жары</text>
<rect x="24" y="188" width="592" height="88" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="188" width="6" height="88" fill="#5cc97a"/>
<text x="52" y="218" fill="#5cc97a" font-size="18" font-weight="700">2-я половина ИЮНЯ</text>
<text x="52" y="244" fill="#e8e0d0" font-size="17">море +24, цены на треть ниже</text>
<text x="52" y="266" fill="#a8a090" font-size="16">лучшее сочетание</text>
<rect x="24" y="292" width="592" height="88" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="292" width="6" height="88" fill="#e8c062"/>
<text x="52" y="322" fill="#e8c062" font-size="18" font-weight="700">ИЮЛЬ–АВГУСТ</text>
<text x="52" y="348" fill="#e8e0d0" font-size="17">воздух +29–31, море +21–27</text>
<text x="52" y="370" fill="#a8a090" font-size="16">пик людей и цен</text>
<rect x="24" y="396" width="592" height="88" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="396" width="6" height="88" fill="#5cc97a"/>
<text x="52" y="426" fill="#5cc97a" font-size="18" font-weight="700">СЕНТЯБРЬ–НАЧАЛО ОКТЯБРЯ</text>
<text x="52" y="452" fill="#e8e0d0" font-size="17">тёплое море, спокойно</text>
<text x="52" y="474" fill="#a8a090" font-size="16">бархатный сезон</text>
<text x="320" y="542" text-anchor="middle" fill="#6b6455" font-size="15">Купальный сезон тянется с конца мая по октябрь</text>
</svg>