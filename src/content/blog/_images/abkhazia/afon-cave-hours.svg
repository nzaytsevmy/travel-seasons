<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 516" width="640" height="516" font-family="system-ui,-apple-system,sans-serif">
<title>Режим работы Новоафонской пещеры по сезонам</title>
<desc>Летом пещера открыта каждый день с девяти до семи, в межсезонье работает четыре дня в неделю, пятница — санитарный день.</desc>
<rect width="640" height="516" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">КОГДА ПЕЩЕРА ОТКРЫТА</text>
<rect x="24" y="84" width="592" height="76" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="76" fill="#5cc97a"/>
<text x="52" y="112" fill="#5cc97a" font-size="17" font-weight="700">1 ИЮЛЯ — 30 СЕНТЯБРЯ</text>
<text x="52" y="136" fill="#e8e0d0" font-size="18">ежедневно, 09:00–19:00</text>
<text x="52" y="154" fill="#a8a090" font-size="15">высокий сезон</text>
<rect x="24" y="174" width="592" height="76" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="174" width="6" height="76" fill="#5cc97a"/>
<text x="52" y="202" fill="#5cc97a" font-size="17" font-weight="700">ИЮНЬ</text>
<text x="52" y="226" fill="#e8e0d0" font-size="18">ежедневно 10:00–19:00</text>
<text x="52" y="244" fill="#a8a090" font-size="15">в начале месяца бывают выходные</text>
<rect x="24" y="264" width="592" height="76" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="264" width="6" height="76" fill="#e8c062"/>
<text x="52" y="292" fill="#e8c062" font-size="17" font-weight="700">МАЙ И НАЧАЛО ЯНВАРЯ</text>
<text x="52" y="316" fill="#e8e0d0" font-size="18">ежедневно 10:00–18:00</text>
<rect x="24" y="354" width="592" height="76" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="354" width="6" height="76" fill="#7fb5c9"/>
<text x="52" y="382" fill="#7fb5c9" font-size="17" font-weight="700">ОСЕНЬ И ВЕСНА</text>
<text x="52" y="406" fill="#e8e0d0" font-size="18">ср, чт, сб, вс 10:00–18:00</text>
<text x="52" y="424" fill="#a8a090" font-size="15">пятница — санитарный день</text>
<text x="320" y="492" text-anchor="middle" fill="#6b6455" font-size="15">Группы отправляют по мере набора: летом по 100</text>
<text x="320" y="510" text-anchor="middle" fill="#6b6455" font-size="15">человек, зимой от 70 — в будни можно подождать</text>
</svg>