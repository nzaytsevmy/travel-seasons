<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1040" width="640" height="1040" role="img" aria-labelledby="t d">
  <title id="t">Маршрут по Новоафонской пещере: поезд по тоннелю и шесть залов пешком</title>
  <desc id="d">Вертикальная схема: касса и павильон, станция «Входные ворота», тоннель 1,3 км на электропоезде до станции «Зал Анакопия», пешеходный маршрут 1,4 км через залы Анакопия, Махаджиров, Нартаа с Кораллитовой галереей, Аюхаа, Апхярца и Апсны, затем поезд от станции «Зал Апсны» обратно к выходу.</desc>
  <rect width="640" height="1040" fill="#131009"/>
  <text x="40" y="58" fill="#e8e0d0" font-family="Golos Text, Arial, sans-serif" font-size="26" font-weight="700">Под горой: поезд и шесть залов</text>
  <text x="40" y="88" fill="#a8a090" font-family="Golos Text, Arial, sans-serif" font-size="18">Тоннель 1,3 км на поезде, дальше 1,4 км пешком</text>

  <!-- ось: поезд — золото, пешком — приглушённое -->
  <line x1="120" y1="140" x2="120" y2="330" stroke="#c9973a" stroke-width="8"/>
  <line x1="120" y1="330" x2="120" y2="830" stroke="#3a3429" stroke-width="6"/>
  <line x1="120" y1="830" x2="120" y2="950" stroke="#c9973a" stroke-width="8"/>

  <g font-family="Golos Text, Arial, sans-serif">
    <rect x="106" y="136" width="28" height="18" rx="3" fill="#131009" stroke="#c9973a" stroke-width="4"/>
    <text x="160" y="146" fill="#e8e0d0" font-size="22" font-weight="700">Касса и павильон</text>
    <text x="160" y="172" fill="#a8a090" font-size="18">только наличные; плед и съёмка — отдельно</text>

    <rect x="106" y="224" width="28" height="18" rx="3" fill="#c9973a" stroke="#e8e0d0" stroke-width="3"/>
    <text x="160" y="236" fill="#e8e0d0" font-size="22" font-weight="700">Станция «Входные ворота»</text>
    <text x="160" y="262" fill="#a8a090" font-size="18">поезд, 3–5 минут по тоннелю 1,3 км</text>

    <rect x="106" y="322" width="28" height="18" rx="3" fill="#c9973a" stroke="#e8e0d0" stroke-width="3"/>
    <text x="160" y="334" fill="#e8e0d0" font-size="22" font-weight="700">Станция «Зал Анакопия»</text>
    <text x="160" y="360" fill="#a8a090" font-size="18">выход из поезда, дальше пешком</text>

    <circle cx="120" cy="420" r="11" fill="#131009" stroke="#a8a090" stroke-width="4"/>
    <text x="160" y="416" fill="#e8e0d0" font-size="22" font-weight="700">Зал Анакопия</text>
    <text x="160" y="442" fill="#a8a090" font-size="18">озеро Анатолия глубиной 26 м, вода +10 °C</text>

    <circle cx="120" cy="500" r="14" fill="#131009" stroke="#c9973a" stroke-width="4"/>
    <text x="160" y="496" fill="#e8e0d0" font-size="22" font-weight="700">Зал Махаджиров</text>
    <text x="160" y="522" fill="#a8a090" font-size="18">260 м в длину, своды до 50 м — самый большой</text>

    <circle cx="120" cy="580" r="11" fill="#131009" stroke="#a8a090" stroke-width="4"/>
    <text x="160" y="576" fill="#e8e0d0" font-size="22" font-weight="700">Зал Нартаа</text>
    <text x="160" y="602" fill="#a8a090" font-size="18">дальше Кораллитовая галерея</text>

    <circle cx="120" cy="660" r="11" fill="#131009" stroke="#a8a090" stroke-width="4"/>
    <text x="160" y="656" fill="#e8e0d0" font-size="22" font-weight="700">Зал Аюхаа</text>
    <text x="160" y="682" fill="#a8a090" font-size="18">натёчные колонны, сталактиты</text>

    <circle cx="120" cy="740" r="11" fill="#131009" stroke="#a8a090" stroke-width="4"/>
    <text x="160" y="736" fill="#e8e0d0" font-size="22" font-weight="700">Зал Апхярца</text>
    <text x="160" y="762" fill="#a8a090" font-size="18">хорошая акустика, гид показывает эхо</text>

    <circle cx="120" cy="820" r="11" fill="#131009" stroke="#a8a090" stroke-width="4"/>
    <text x="160" y="816" fill="#e8e0d0" font-size="22" font-weight="700">Зал Апсны</text>
    <text x="160" y="842" fill="#a8a090" font-size="18">каменный водопад, конец пешей части</text>

    <rect x="106" y="922" width="28" height="18" rx="3" fill="#c9973a" stroke="#e8e0d0" stroke-width="3"/>
    <text x="160" y="934" fill="#e8e0d0" font-size="22" font-weight="700">Станция «Зал Апсны»</text>
    <text x="160" y="960" fill="#a8a090" font-size="18">поезд обратно к выходу</text>
  </g>

  <text x="40" y="1006" fill="#a8a090" font-family="Golos Text, Arial, sans-serif" font-size="18">Внутри +11…+14 °C и влажность около 100 %; экскурсия 1 ч 15 мин — 1,5 ч</text>
  <text x="40" y="1026" fill="#a8a090" font-family="Golos Text, Arial, sans-serif" font-size="18">По данным сайта пещеры и справочников, сентябрь 2026</text>
</svg>
