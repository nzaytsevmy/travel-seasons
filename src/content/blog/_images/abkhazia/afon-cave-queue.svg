<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 524" width="640" height="524" font-family="system-ui,-apple-system,sans-serif">
<title>Как не простоять в очереди в Новоафонскую пещеру</title>
<desc>Билеты продают только в кассе живой очередью. Летом приходить к девяти утра, лучший день — понедельник, экскурсионные группы проходят первыми.</desc>
<rect width="640" height="524" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">КАК НЕ СТОЯТЬ В ОЧЕРЕДИ</text>
<rect x="24" y="84" width="592" height="78" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="78" fill="#5cc97a"/>
<text x="52" y="114" fill="#5cc97a" font-size="19" font-weight="700">Приходите к 9 утра</text>
<text x="52" y="138" fill="#e8e0d0" font-size="17">касса открывается около 8:30</text>
<text x="52" y="156" fill="#a8a090" font-size="15">очередь набегает за полчаса</text>
<rect x="24" y="176" width="592" height="78" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="176" width="6" height="78" fill="#5cc97a"/>
<text x="52" y="206" fill="#5cc97a" font-size="19" font-weight="700">Выбирайте понедельник</text>
<text x="52" y="230" fill="#e8e0d0" font-size="17">меньше всего автобусных групп</text>
<rect x="24" y="268" width="592" height="78" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="268" width="6" height="78" fill="#7fb5c9"/>
<text x="52" y="298" fill="#7fb5c9" font-size="19" font-weight="700">Едете с экскурсией</text>
<text x="52" y="322" fill="#e8e0d0" font-size="17">проходите без очереди в кассу</text>
<text x="52" y="340" fill="#a8a090" font-size="15">группы от турфирм идут первыми</text>
<rect x="24" y="360" width="592" height="78" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="360" width="6" height="78" fill="#d44545"/>
<text x="52" y="390" fill="#d44545" font-size="19" font-weight="700">Разгар сезона</text>
<text x="52" y="414" fill="#e8e0d0" font-size="17">ждут от получаса до пары часов</text>
<text x="52" y="432" fill="#a8a090" font-size="15">онлайн-брони для туристов нет</text>
<text x="320" y="498" text-anchor="middle" fill="#6b6455" font-size="15">Группы отправляют по мере набора:</text>
<text x="320" y="518" text-anchor="middle" fill="#6b6455" font-size="15">летом по 100 человек, зимой от 70</text>
</svg>