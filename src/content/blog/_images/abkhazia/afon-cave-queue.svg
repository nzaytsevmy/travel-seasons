<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t d">
  <title id="t">Очередь в кассу Новоафонской пещеры по часам летом 2026</title>
  <desc id="d">Шкала дня: к 8:30 очередь есть, в 9:00 открывается касса, с 10 до 14 часов пик из-за автобусных групп с ожиданием от получаса до двух часов, после 15:00 групп меньше и билеты продают на ближайший сеанс, в 19:00 закрытие.</desc>
  <rect width="640" height="640" fill="#131009"/>
  <text x="320" y="44" text-anchor="middle" fill="#c9973a" font-family="Golos Text, Arial, sans-serif" font-size="23" font-weight="700">ОЧЕРЕДЬ В КАССУ ПО ЧАСАМ, ЛЕТО 2026</text>

  <!-- шкала дня -->
  <line x1="46" y1="110" x2="46" y2="560" stroke="#3a3429" stroke-width="2"/>
  <!-- полоса нагрузки: ширина = сколько ждать -->
  <rect x="60" y="100" width="60" height="60" fill="#e8c062" opacity="0.35"/>
  <rect x="60" y="160" width="45" height="60" fill="#e8c062" opacity="0.45"/>
  <rect x="60" y="220" width="220" height="130" fill="#d44545" opacity="0.45"/>
  <rect x="60" y="350" width="22" height="110" fill="#5cc97a" opacity="0.4"/>
  <rect x="60" y="460" width="8" height="90" fill="#3a3429" opacity="0.8"/>

  <g font-family="Golos Text, Arial, sans-serif">
    <circle cx="46" cy="130" r="9" fill="#e8c062"/>
    <text x="300" y="124" fill="#e8c062" font-size="18" font-weight="700">8:30</text>
    <text x="300" y="148" fill="#e8e0d0" font-size="19" font-weight="600">Очередь стоит</text>
    <text x="300" y="170" fill="#a8a090" font-size="18">в июле — около десяти человек</text>

    <circle cx="46" cy="190" r="9" fill="#e8c062"/>
    <text x="300" y="196" fill="#e8c062" font-size="18" font-weight="700">9:00</text>
    <text x="300" y="220" fill="#e8e0d0" font-size="19" font-weight="600">Касса открывается</text>
    <text x="300" y="242" fill="#a8a090" font-size="18">первые сеансы около 9:40–10:20</text>

    <circle cx="46" cy="285" r="9" fill="#d44545"/>
    <text x="300" y="278" fill="#d44545" font-size="18" font-weight="700">10:00–14:00</text>
    <text x="300" y="302" fill="#e8e0d0" font-size="19" font-weight="600">Пик: автобусные группы первыми</text>
    <text x="300" y="324" fill="#a8a090" font-size="18">ждать 30 минут — 2 часа,</text>
    <text x="300" y="344" fill="#a8a090" font-size="18">билет дают на сеанс через 2–3 часа</text>

    <circle cx="46" cy="405" r="9" fill="#5cc97a"/>
    <text x="300" y="398" fill="#5cc97a" font-size="18" font-weight="700">после 15:00</text>
    <text x="300" y="422" fill="#e8e0d0" font-size="19" font-weight="600">Групп меньше</text>
    <text x="300" y="444" fill="#a8a090" font-size="18">в августе приехали в 16:30 —</text>
    <text x="300" y="464" fill="#a8a090" font-size="18">билет на 18:00 без очереди</text>

    <circle cx="46" cy="505" r="9" fill="#a8a090"/>
    <text x="300" y="499" fill="#a8a090" font-size="18" font-weight="700">19:00</text>
    <text x="300" y="523" fill="#e8e0d0" font-size="19" font-weight="600">Закрытие</text>
    <text x="300" y="545" fill="#a8a090" font-size="18">последний сеанс около 18:00</text>
  </g>
  <text x="70" y="590" fill="#6b6455" font-family="Golos Text, Arial, sans-serif" font-size="18">Ширина полосы — сколько ждать; после 15:00 короче всего.</text>
  <text x="70" y="612" fill="#6b6455" font-family="Golos Text, Arial, sans-serif" font-size="18">По 50 отзывам на Яндекс Картах, апрель 2025 — сентябрь 2026</text>
</svg>
