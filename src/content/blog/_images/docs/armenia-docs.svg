<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="system-ui,-apple-system,sans-serif">
<title>По какому паспорту ехать в Армению</title>
<desc>Самолётом пускают по внутреннему паспорту, по земле через Грузию нужен загранпаспорт. Находиться можно до ста восьмидесяти дней.</desc>
<rect width="640" height="470" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ПАСПОРТ ДЛЯ АРМЕНИИ</text>
<rect x="24" y="84" width="592" height="66" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="66" fill="#5cc97a"/>
<text x="52" y="110" fill="#a8a090" font-size="15.5">Самолётом</text>
<text x="52" y="132" fill="#e8e0d0" font-size="18" font-weight="600">внутренний паспорт подойдёт</text>
<text x="600" y="132" text-anchor="end" fill="#5cc97a" font-size="14.5">прямые рейсы из России</text>
<rect x="24" y="164" width="592" height="66" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="164" width="6" height="66" fill="#d44545"/>
<text x="52" y="190" fill="#a8a090" font-size="15.5">По земле через Грузию</text>
<text x="52" y="212" fill="#e8e0d0" font-size="18" font-weight="600">только загранпаспорт</text>
<text x="600" y="212" text-anchor="end" fill="#d44545" font-size="14.5">Грузия внутренний не принимает</text>
<rect x="24" y="244" width="592" height="66" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="244" width="6" height="66" fill="#5cc97a"/>
<text x="52" y="270" fill="#a8a090" font-size="15.5">Пребывание</text>
<text x="52" y="292" fill="#e8e0d0" font-size="18" font-weight="600">до 180 дней</text>
<text x="600" y="292" text-anchor="end" fill="#5cc97a" font-size="14.5">без регистрации и виз</text>
<rect x="24" y="324" width="592" height="66" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="324" width="6" height="66" fill="#e8c062"/>
<text x="52" y="350" fill="#a8a090" font-size="15.5">Срок действия паспорта</text>
<text x="52" y="372" fill="#e8e0d0" font-size="18" font-weight="600">на весь срок поездки</text>
<text x="600" y="372" text-anchor="end" fill="#e8c062" font-size="14.5">отдельного запаса не требуют</text>
<text x="320" y="454" text-anchor="middle" fill="#6b6455" font-size="15.5">Правила въезда сверяйте перед поездкой: они меняются</text>
</svg>