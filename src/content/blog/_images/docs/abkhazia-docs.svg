<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="system-ui,-apple-system,sans-serif">
<title>С какими документами едут в Абхазию</title>
<desc>Взрослому хватает внутреннего паспорта, ребёнку до четырнадцати — свидетельства о рождении со штампом о гражданстве. Загранпаспорт лучше оставить дома.</desc>
<rect width="640" height="470" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ДОКУМЕНТЫ В АБХАЗИЮ</text>
<rect x="24" y="84" width="592" height="66" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="66" fill="#5cc97a"/>
<text x="52" y="110" fill="#a8a090" font-size="15.5">Взрослому</text>
<text x="52" y="132" fill="#e8e0d0" font-size="18" font-weight="600">внутренний паспорт РФ</text>
<text x="600" y="132" text-anchor="end" fill="#5cc97a" font-size="14.5">загранпаспорт не нужен</text>
<rect x="24" y="164" width="592" height="66" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="164" width="6" height="66" fill="#5cc97a"/>
<text x="52" y="190" fill="#a8a090" font-size="15.5">Ребёнку до 14 лет</text>
<text x="52" y="212" fill="#e8e0d0" font-size="18" font-weight="600">свидетельство о рождении</text>
<text x="600" y="212" text-anchor="end" fill="#5cc97a" font-size="14.5">со штампом о гражданстве</text>
<rect x="24" y="244" width="592" height="66" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="244" width="6" height="66" fill="#d44545"/>
<text x="52" y="270" fill="#a8a090" font-size="15.5">Загранпаспорт</text>
<text x="52" y="292" fill="#e8e0d0" font-size="18" font-weight="600">лучше оставить дома</text>
<text x="600" y="292" text-anchor="end" fill="#d44545" font-size="14.5">абхазский штамп мешает грузинской визе</text>
<rect x="24" y="324" width="592" height="66" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="324" width="6" height="66" fill="#e8c062"/>
<text x="52" y="350" fill="#a8a090" font-size="15.5">Ребёнок без родителей</text>
<text x="52" y="372" fill="#e8e0d0" font-size="18" font-weight="600">согласие на выезд</text>
<text x="600" y="372" text-anchor="end" fill="#e8c062" font-size="14.5">от того, кто не едет</text>
<text x="320" y="454" text-anchor="middle" fill="#6b6455" font-size="15.5">Граница на Псоу — это въезд в Россию по российским правилам</text>
</svg>