<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько идут деньги при возврате билета через Авиасейлс</title>
<desc>Шкала времени: заявка в нулевой день, тридцать рабочих дней на возврат части по тарифу после подтверждения перевозчиком, ещё до десяти дней на доплату до девяноста процентов у купивших платную услугу, сверху этого от трёх до тридцати рабочих дней у банка.</desc>
<rect width="640" height="620" fill="#131009"/>

<text x="24" y="46" fill="#c9973a" font-size="21" font-weight="600">Сколько ждать деньги за возврат</text>
<text x="24" y="74" fill="#a8a090" font-size="15">Сроки из оферты Авиасейлс в редакции от 30 июля 2026</text>

<rect x="24" y="96" width="592" height="52" rx="4" fill="#1c1710" stroke="#d44545" stroke-width="1.5"/>
<text x="44" y="128" fill="#d44545" font-size="16" font-weight="600">За 48 часов до вылета порог закрывается</text>

<line x1="150" y1="180" x2="150" y2="500" stroke="#3a3429" stroke-width="2"/>

<circle cx="150" cy="180" r="8" fill="#5cc97a"/>
<text x="126" y="174" text-anchor="end" fill="#5cc97a" font-size="17" font-weight="700">День 0</text>
<text x="126" y="196" text-anchor="end" fill="#a8a090" font-size="14">заявка</text>
<text x="180" y="178" fill="#e8e0d0" font-size="17">Запрос в поддержку,</text>
<text x="180" y="200" fill="#e8e0d0" font-size="17">подтверждение возврата</text>

<circle cx="150" cy="405" r="8" fill="#e8c062"/>
<text x="126" y="399" text-anchor="end" fill="#e8c062" font-size="16" font-weight="700">30 рабочих</text>
<text x="126" y="419" text-anchor="end" fill="#e8c062" font-size="16" font-weight="700">дней</text>
<text x="180" y="396" fill="#e8e0d0" font-size="17">Перевозчик подтвердил —</text>
<text x="180" y="418" fill="#e8e0d0" font-size="17">возвращают часть по тарифу,</text>
<text x="180" y="440" fill="#e8e0d0" font-size="17">за вычетом штрафов и сборов</text>

<circle cx="150" cy="500" r="8" fill="#c9973a"/>
<text x="126" y="494" text-anchor="end" fill="#c9973a" font-size="17" font-weight="700">ещё 10 дней</text>
<text x="126" y="516" text-anchor="end" fill="#a8a090" font-size="14">по платной услуге</text>
<text x="180" y="491" fill="#e8e0d0" font-size="17">Доплата до 90% — только</text>
<text x="180" y="513" fill="#e8e0d0" font-size="17">у тех, кто купил эту услугу</text>

<rect x="24" y="546" width="592" height="48" rx="4" fill="#1c1710" stroke="#3a3429"/>
<text x="44" y="576" fill="#a8a090" font-size="16">Сверху — банк: от 3 до 30 рабочих дней на зачисление</text>
</svg>
