<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui,-apple-system,sans-serif">
<title>Порядок продавцов на экране Авиасейлса против порядка по цене</title>
<desc>Две колонки, соединённые линиями. Слева продавцы в том порядке, в каком их показывает сайт, справа — те же продавцы по возрастанию цены. Линия предложения самого Авиасейлса идёт со второй строки на восьмую: на экране оно вторым сверху, по цене самое дорогое.</desc>
