<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 416" width="640" height="416" font-family="system-ui,-apple-system,sans-serif">
<title>Где остановиться в Каппадокии</title>
<desc>Гёреме в центре всего и шумный, Ургюп спокойнее и дороже, Учхисар выше всех и тише, но без машины неудобно.</desc>
<rect width="640" height="416" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ГДЕ ОСТАНОВИТЬСЯ</text>
<rect x="24" y="84" width="592" height="78" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="78" fill="#c9973a"/>
<text x="52" y="114" fill="#c9973a" font-size="19" font-weight="700">ГЁРЕМЕ</text>
<text x="52" y="138" fill="#e8e0d0" font-size="18">в центре всего</text>
<text x="52" y="156" fill="#a8a090" font-size="15">шумно, но всё пешком</text>
<rect x="24" y="176" width="592" height="78" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="176" width="6" height="78" fill="#5cc97a"/>
<text x="52" y="206" fill="#5cc97a" font-size="19" font-weight="700">УРГЮП</text>
<text x="52" y="230" fill="#e8e0d0" font-size="18">спокойнее и дороже</text>
<text x="52" y="248" fill="#a8a090" font-size="15">хорошие отели в скале</text>
<rect x="24" y="268" width="592" height="78" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="268" width="6" height="78" fill="#7fb5c9"/>
<text x="52" y="298" fill="#7fb5c9" font-size="19" font-weight="700">УЧХИСАР</text>
<text x="52" y="322" fill="#e8e0d0" font-size="18">виды сверху</text>
<text x="52" y="340" fill="#a8a090" font-size="15">тише всего, нужен транспорт</text>
<text x="320" y="402" text-anchor="middle" fill="#6b6455" font-size="15.5">Шары стартуют отовсюду — селиться «ради вида» необязательно</text>
</svg>