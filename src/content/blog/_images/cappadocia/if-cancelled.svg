<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" font-family="system-ui,-apple-system,sans-serif">
<title>Что делать в Каппадокии, если полёт отменили</title>
<desc>Пешие долины, подземные города, пещерные храмы Гёреме, закат с крепости Учхисара и гончарные мастерские Аваноса.</desc>
<rect width="640" height="390" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">ЕСЛИ ПОЛЁТ ОТМЕНИЛИ</text>
<circle cx="36" cy="94" r="4" fill="#1a7f4b"/>
<text x="54" y="100" fill="#15171a" font-size="17">Долина Голубей и Розовая долина пешком</text>
<circle cx="36" cy="140" r="4" fill="#1a7f4b"/>
<text x="54" y="146" fill="#15171a" font-size="17">Подземный город Каймаклы или Деринкую</text>
<circle cx="36" cy="186" r="4" fill="#1a7f4b"/>
<text x="54" y="192" fill="#15171a" font-size="17">Гёреме под открытым небом: фрески в пещерных храмах</text>
<circle cx="36" cy="232" r="4" fill="#1a7f4b"/>
<text x="54" y="238" fill="#15171a" font-size="17">Закат с крепости Учхисара</text>
<circle cx="36" cy="278" r="4" fill="#1a7f4b"/>
<text x="54" y="284" fill="#15171a" font-size="17">Гончарная мастерская в Аваносе</text>
<text x="320" y="340" text-anchor="middle" fill="#5c626b" font-size="16">Ветер отменяет полёты часто — это норма,</text>
<text x="320" y="362" text-anchor="middle" fill="#5c626b" font-size="16">а не повод считать поездку испорченной</text>
</svg>