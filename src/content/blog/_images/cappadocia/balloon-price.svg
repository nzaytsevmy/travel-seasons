<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" width="640" height="424" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько стоит полёт на шаре в Каппадокии</title>
<desc>Групповой полёт от ста до трёхсот евро, индивидуальный от двух тысяч. В пакет входит трансфер, лёгкий завтрак и около часа в воздухе.</desc>
<rect width="640" height="424" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">ПОЛЁТ НА ШАРЕ: ЦЕНА</text>
<rect x="24" y="84" width="592" height="64" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="84" width="6" height="64" fill="#1d40ae"/>
<text x="52" y="110" fill="#15171a" font-size="18" font-weight="600">Групповой полёт</text>
<text x="600" y="110" text-anchor="end" fill="#1d40ae" font-size="18" font-weight="700">100–300 €</text>
<text x="52" y="134" fill="#5c626b" font-size="15">цена зависит от сезона и корзины</text>
<rect x="24" y="160" width="592" height="64" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="160" width="6" height="64" fill="#8a6a10"/>
<text x="52" y="186" fill="#15171a" font-size="18" font-weight="600">Индивидуальный</text>
<text x="600" y="186" text-anchor="end" fill="#8a6a10" font-size="18" font-weight="700">от 2000 €</text>
<text x="52" y="210" fill="#5c626b" font-size="15">маленькая корзина на двоих</text>
<rect x="24" y="236" width="592" height="64" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="236" width="6" height="64" fill="#1a7f4b"/>
<text x="52" y="262" fill="#15171a" font-size="18" font-weight="600">Что входит</text>
<text x="600" y="262" text-anchor="end" fill="#1a7f4b" font-size="18" font-weight="700">трансфер, завтрак</text>
<text x="52" y="286" fill="#5c626b" font-size="15">около часа в воздухе и сертификат</text>
<text x="320" y="342" text-anchor="middle" fill="#b3261e" font-size="18" font-weight="700">Закладывайте два утра под шар, а не одно</text>
<text x="320" y="368" text-anchor="middle" fill="#5c626b" font-size="16">при ветре рейс переносят на следующий день,</text>
<text x="320" y="388" text-anchor="middle" fill="#5c626b" font-size="16">и одно свободное утро спасает поездку</text>
</svg>