<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui,-apple-system,sans-serif">
<title>Когда ехать на Алтай</title>
<desc>Сентябрь лучший месяц, июнь прохладный, июль-август людные, в мае цветёт маральник, ноябрь худшее время.</desc>
<rect width="640" height="560" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">КОГДА ЕХАТЬ НА АЛТАЙ</text>
<rect x="24" y="84" width="592" height="70" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="84" width="6" height="70" fill="#1a7f4b"/>
<text x="52" y="110" fill="#1a7f4b" font-size="17" font-weight="700">СЕНТЯБРЬ</text>
<text x="52" y="132" fill="#15171a" font-size="16.5">золотые лиственницы, толпы разъехались</text>
<text x="52" y="150" fill="#5c626b" font-size="14.5">лучший месяц года</text>
<rect x="24" y="168" width="592" height="70" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="168" width="6" height="70" fill="#8a6a10"/>
<text x="52" y="194" fill="#8a6a10" font-size="17" font-weight="700">ИЮНЬ</text>
<text x="52" y="216" fill="#15171a" font-size="16.5">всё зелёное, навигация открыта</text>
<text x="52" y="234" fill="#5c626b" font-size="14.5">ночи ещё холодные</text>
<rect x="24" y="252" width="592" height="70" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="252" width="6" height="70" fill="#8a6a10"/>
<text x="52" y="278" fill="#8a6a10" font-size="17" font-weight="700">ИЮЛЬ–АВГУСТ</text>
<text x="52" y="300" fill="#15171a" font-size="16.5">тепло, всё работает</text>
<text x="52" y="318" fill="#5c626b" font-size="14.5">максимум людей и цен</text>
<rect x="24" y="336" width="592" height="70" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="336" width="6" height="70" fill="#2b6f8a"/>
<text x="52" y="362" fill="#2b6f8a" font-size="17" font-weight="700">КОНЕЦ АПРЕЛЯ – МАЙ</text>
<text x="52" y="384" fill="#15171a" font-size="16.5">цветение маральника, склоны розовые</text>
<text x="52" y="402" fill="#5c626b" font-size="14.5">высокогорье в снегу</text>
<rect x="24" y="420" width="592" height="70" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="420" width="6" height="70" fill="#b3261e"/>
<text x="52" y="446" fill="#b3261e" font-size="17" font-weight="700">НОЯБРЬ</text>
<text x="52" y="468" fill="#15171a" font-size="16.5">ни лета, ни зимы</text>
<text x="52" y="486" fill="#5c626b" font-size="14.5">худшее окно</text>
<text x="320" y="546" text-anchor="middle" fill="#8a9099" font-size="15">Зимой едут за снегоходами и бирюзовой Катунью у Чемала</text>
</svg>