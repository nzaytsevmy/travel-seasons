<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui,-apple-system,sans-serif">
<title>Когда ехать на Алтай</title>
<desc>Сентябрь лучший месяц, июнь прохладный, июль-август людные, в мае цветёт маральник, ноябрь худшее время.</desc>
<rect width="640" height="560" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">КОГДА ЕХАТЬ НА АЛТАЙ</text>
<rect x="24" y="84" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="70" fill="#5cc97a"/>
<text x="52" y="110" fill="#5cc97a" font-size="17" font-weight="700">СЕНТЯБРЬ</text>
<text x="52" y="132" fill="#e8e0d0" font-size="16.5">золотые лиственницы, толпы разъехались</text>
<text x="52" y="150" fill="#a8a090" font-size="14.5">лучший месяц года</text>
<rect x="24" y="168" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="168" width="6" height="70" fill="#e8c062"/>
<text x="52" y="194" fill="#e8c062" font-size="17" font-weight="700">ИЮНЬ</text>
<text x="52" y="216" fill="#e8e0d0" font-size="16.5">всё зелёное, навигация открыта</text>
<text x="52" y="234" fill="#a8a090" font-size="14.5">ночи ещё холодные</text>
<rect x="24" y="252" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="252" width="6" height="70" fill="#e8c062"/>
<text x="52" y="278" fill="#e8c062" font-size="17" font-weight="700">ИЮЛЬ–АВГУСТ</text>
<text x="52" y="300" fill="#e8e0d0" font-size="16.5">тепло, всё работает</text>
<text x="52" y="318" fill="#a8a090" font-size="14.5">максимум людей и цен</text>
<rect x="24" y="336" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="336" width="6" height="70" fill="#7fb5c9"/>
<text x="52" y="362" fill="#7fb5c9" font-size="17" font-weight="700">КОНЕЦ АПРЕЛЯ – МАЙ</text>
<text x="52" y="384" fill="#e8e0d0" font-size="16.5">цветение маральника, склоны розовые</text>
<text x="52" y="402" fill="#a8a090" font-size="14.5">высокогорье в снегу</text>
<rect x="24" y="420" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="420" width="6" height="70" fill="#d44545"/>
<text x="52" y="446" fill="#d44545" font-size="17" font-weight="700">НОЯБРЬ</text>
<text x="52" y="468" fill="#e8e0d0" font-size="16.5">ни лета, ни зимы</text>
<text x="52" y="486" fill="#a8a090" font-size="14.5">худшее окно</text>
<text x="320" y="546" text-anchor="middle" fill="#6b6455" font-size="15">Зимой едут за снегоходами и бирюзовой Катунью у Чемала</text>
</svg>