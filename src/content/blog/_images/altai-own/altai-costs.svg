<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько стоит Алтай</title>
<desc>Многодневные туры от 23 тысяч без перелёта, недельный автотур около ста тысяч на двоих, база с экскурсиями от семи тысяч в день.</desc>
<rect width="640" height="300" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">СКОЛЬКО СТОИТ АЛТАЙ</text>
<text x="24" y="102" fill="#e8e0d0" font-size="18" font-weight="600">База и экскурсии</text>
<text x="616" y="102" text-anchor="end" fill="#5cc97a" font-size="18" font-weight="700">от 7000 ₽/день</text>
<text x="24" y="124" fill="#6b6455" font-size="14.5">на двоих: жильё, еда, выезды</text>
<text x="24" y="170" fill="#e8e0d0" font-size="18" font-weight="600">Многодневный тур</text>
<text x="616" y="170" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">от 23 000 ₽</text>
<text x="24" y="192" fill="#6b6455" font-size="14.5">без перелёта</text>
<text x="24" y="238" fill="#e8e0d0" font-size="18" font-weight="600">Недельный автотур</text>
<text x="616" y="238" text-anchor="end" fill="#e8c062" font-size="18" font-weight="700">≈100 000 ₽</text>
<text x="24" y="260" fill="#6b6455" font-size="14.5">на двоих, всё собрано</text>
<text x="320" y="276" text-anchor="middle" fill="#a8a090" font-size="16">Перелёт считается отдельно и стоит заметно</text>
</svg>