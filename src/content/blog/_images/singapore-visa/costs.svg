<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Из чего складывается стоимость: консульский сбор, услуги агента, карта прибытия бесплатно">
<rect width="640" height="640" fill="#131009"/>
<text x="40" y="62" fill="#c9973a" font-family="Helvetica,Arial" font-size="23" font-weight="700">Из чего складывается сумма</text>
<line x1="40" y1="86" x2="600" y2="86" stroke="#3a3429" stroke-width="1"/>

<text x="40" y="140" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20">Визовый сбор</text>
<text x="600" y="140" fill="#c9973a" font-family="Helvetica,Arial" font-size="20" text-anchor="end">S$30</text>
<text x="40" y="168" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">около 1 944 ₽, при отказе не возвращается</text>
<line x1="40" y1="196" x2="600" y2="196" stroke="#3a3429" stroke-width="1"/>

<text x="40" y="244" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20">Сервисный сбор центра</text>
<text x="600" y="244" fill="#c9973a" font-family="Helvetica,Arial" font-size="20" text-anchor="end">свой сбор</text>
<text x="40" y="272" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">сумму называет визовый центр, единой цены нет</text>
<line x1="40" y1="300" x2="600" y2="300" stroke="#3a3429" stroke-width="1"/>

<text x="40" y="348" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20">Карта прибытия</text>
<text x="600" y="348" fill="#c9973a" font-family="Helvetica,Arial" font-size="20" text-anchor="end">0 ₽</text>
<text x="40" y="376" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">официально бесплатно, платить за неё не надо</text>
<line x1="40" y1="404" x2="600" y2="404" stroke="#3a3429" stroke-width="1"/>

<text x="40" y="452" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20">Срок решения</text>
<text x="600" y="452" fill="#c9973a" font-family="Helvetica,Arial" font-size="20" text-anchor="end">3 дня</text>
<text x="40" y="480" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">рабочих, без учёта дня подачи</text>
<line x1="40" y1="508" x2="600" y2="508" stroke="#3a3429" stroke-width="1"/>

<text x="40" y="566" fill="#a8a090" font-family="Helvetica,Arial" font-size="16">Сбор и срок — Управление иммиграции Сингапура,</text>
<text x="40" y="592" fill="#a8a090" font-family="Helvetica,Arial" font-size="16">рубли по курсу ЦБ на 13 августа 2026 (64,81 ₽ за S$1)</text>
</svg>
