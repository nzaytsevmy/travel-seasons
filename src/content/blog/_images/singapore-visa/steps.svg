<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" role="img" aria-label="Путь заявителя: агент, анкета, сбор 30 сингапурских долларов, решение за три дня, карта прибытия">
<rect width="640" height="720" fill="#131009"/>
<text x="40" y="62" fill="#c9973a" font-family="Helvetica,Arial" font-size="23" font-weight="700">Порядок действий</text>
<line x1="40" y1="86" x2="600" y2="86" stroke="#3a3429" stroke-width="1"/>
<line x1="66" y1="120" x2="66" y2="640" stroke="#3a3429" stroke-width="1"/>

<circle cx="66" cy="140" r="9" fill="#c9973a"/>
<text x="100" y="134" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20" font-weight="700">Найти, кто подаст</text>
<text x="100" y="164" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">Визовый центр в России или</text>
<text x="100" y="190" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">принимающая сторона в Сингапуре</text>

<circle cx="66" cy="252" r="9" fill="#c9973a"/>
<text x="100" y="246" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20" font-weight="700">Собрать документы</text>
<text x="100" y="276" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">Анкета, цветное фото за три месяца,</text>
<text x="100" y="302" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">паспорт со сроком от шести месяцев</text>

<circle cx="66" cy="364" r="9" fill="#c9973a"/>
<text x="100" y="358" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20" font-weight="700">Оплатить сбор</text>
<text x="100" y="388" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">30 сингапурских долларов, не возвращается</text>
<text x="100" y="414" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">Сервисный сбор центра считается отдельно</text>

<circle cx="66" cy="476" r="9" fill="#c9973a"/>
<text x="100" y="470" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20" font-weight="700">Дождаться решения</text>
<text x="100" y="500" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">Три рабочих дня, иногда дольше</text>
<text x="100" y="526" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">Визу распечатывает тот, кто подавал</text>

<circle cx="66" cy="588" r="9" fill="#c9973a"/>
<text x="100" y="582" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20" font-weight="700">Заполнить карту прибытия</text>
<text x="100" y="612" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">Бесплатно, в течение трёх дней до прилёта</text>
<text x="100" y="638" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">Нужна и с визой, и на транзите</text>

<text x="40" y="690" fill="#a8a090" font-family="Helvetica,Arial" font-size="16">Источник: Управление иммиграции Сингапура, сверка 13 августа 2026</text>
</svg>
