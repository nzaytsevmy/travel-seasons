<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" width="640" height="780" role="img" aria-label="Транзит до 96 часов против въезда: когда виза не нужна и когда нужна">
<rect width="640" height="780" fill="#131009"/>
<text x="40" y="62" fill="#c9973a" font-family="Helvetica,Arial" font-size="23" font-weight="700">Две разные ситуации</text>
<text x="40" y="94" fill="#a8a090" font-family="Helvetica,Arial" font-size="18">Сингапур, правила для российского паспорта</text>
<line x1="40" y1="118" x2="600" y2="118" stroke="#3a3429" stroke-width="1"/>

<rect x="40" y="146" width="560" height="270" fill="none" stroke="#3a3429" stroke-width="1"/>
<text x="64" y="188" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="21" font-weight="700">Транзит до 96 часов</text>
<text x="64" y="222" fill="#c9973a" font-family="Helvetica,Arial" font-size="19">Виза не нужна</text>
<text x="64" y="258" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="18">Летите в третью страну или обратно</text>
<text x="64" y="288" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="18">Билет на вылет в пределах 96 часов</text>
<text x="64" y="318" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="18">Выезд только самолётом</text>
<text x="64" y="348" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">Продлить пребывание нельзя, решает офицер</text>
<text x="64" y="382" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">Плюс общие требования для въезда</text>

<rect x="40" y="446" width="560" height="252" fill="none" stroke="#3a3429" stroke-width="1"/>
<text x="64" y="488" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="21" font-weight="700">Поездка в Сингапур</text>
<text x="64" y="522" fill="#c9973a" font-family="Helvetica,Arial" font-size="19">Виза нужна</text>
<text x="64" y="558" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="18">Электронная, в паспорт не вклеивают</text>
<text x="64" y="588" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="18">Сбор 30 сингапурских долларов</text>
<text x="64" y="618" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="18">Три рабочих дня на решение</text>
<text x="64" y="654" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">Подаёт визовый центр или принимающая сторона</text>

<text x="40" y="742" fill="#a8a090" font-family="Helvetica,Arial" font-size="16">Источники: посольство Сингапура (транзит) и Управление иммиграции (виза), 13.08.2026</text>
</svg>
