<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" role="img"
     aria-label="Шкала скидок от нуля до сорока процентов: обещание главной страницы стоит на отметке сорок, а все сорок пять замеренных карточек лежат между 6,5 и 11 процентами, причём сорок из них ровно на десяти">
  <rect width="640" height="470" fill="#fbfbfa"/>

  <text x="32" y="46" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#15171a">Обещано и измерено</text>
  <text x="32" y="74" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="16" fill="#5c626b">Скидка за вход в аккаунт, 45 карточек, 29 августа 2026</text>

  <!-- ось -->
  <line x1="32" y1="330" x2="608" y2="330" stroke="#d9dbde" stroke-width="2"/>
  <g font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="15" fill="#5c626b" text-anchor="middle">
    <line x1="32"  y1="330" x2="32"  y2="340" stroke="#d9dbde" stroke-width="2"/><text x="32"  y="362">0</text>
    <line x1="176" y1="330" x2="176" y2="340" stroke="#d9dbde" stroke-width="2"/><text x="176" y="362">10%</text>
    <line x1="320" y1="330" x2="320" y2="340" stroke="#d9dbde" stroke-width="2"/><text x="320" y="362">20%</text>
    <line x1="464" y1="330" x2="464" y2="340" stroke="#d9dbde" stroke-width="2"/><text x="464" y="362">30%</text>
    <line x1="608" y1="330" x2="608" y2="340" stroke="#d9dbde" stroke-width="2"/><text x="608" y="362">40%</text>
  </g>

  <!-- обещание: 40% -->
  <line x1="608" y1="120" x2="608" y2="330" stroke="#1d40ae" stroke-width="3" stroke-dasharray="7 5"/>
  <circle cx="608" cy="120" r="7" fill="#1d40ae"/>
  <text x="596" y="106" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d40ae" text-anchor="end">обещание: до 40%</text>

  <!-- измеренное: столбики частот -->
  <!-- 6,5% -> x=125,6 ; 8% -> x=147,2 ; 10% -> x=176 ; 11% -> x=190,4 -->
  <rect x="121" y="322" width="9" height="8"   fill="#8e6618"/>
  <rect x="143" y="322" width="9" height="8"   fill="#8e6618"/>
  <rect x="171" y="170" width="11" height="160" fill="#15171a"/>
  <rect x="186" y="298" width="9"  height="32" fill="#8e6618"/>

  <text x="200" y="188" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#15171a">40 карточек из 45 — ровно 10,0%</text>
  <text x="200" y="214" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="16" fill="#5c626b">три по 11,0%, по одной 8,0% и 6,5%</text>

  <!-- пояснение снизу -->
  <line x1="32" y1="398" x2="608" y2="398" stroke="#d9dbde" stroke-width="1"/>
  <text x="32" y="428" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="17" fill="#15171a">Между обещанным и найденным — расстояние в четыре раза.</text>
  <text x="32" y="452" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="15" fill="#5c626b">Замер снят для гостя без аккаунта — это нижняя ступень программы.</text>
</svg>
