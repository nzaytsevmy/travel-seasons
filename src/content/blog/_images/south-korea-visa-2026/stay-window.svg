<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" font-family="system-ui,-apple-system,sans-serif">
<title>Южная Корея: как считаются 60 и 90 дней</title>
<desc>Три шкалы длиной 180 дней. Первая: один заезд на 60 дней укладывается в правило. Вторая: заезд на 60 дней, перерыв и второй заезд на 30 дней дают ровно 90 дней внутри окна — это предел. Третья: два заезда по 60 дней дают 120 дней внутри того же окна, лишние 30 дней показаны как нарушение. Окно в 180 дней скользит: на границе смотрят назад от дня въезда и складывают все дни за этот период, выезд счётчик не обнуляет.</desc>
<rect width="640" height="900" fill="#131009"/>
<text x="320" y="46" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">60 ПОДРЯД, 90 ИЗ 180</text>
<text x="320" y="78" text-anchor="middle" fill="#a8a090" font-size="18">выезд не обнуляет счётчик — окно едет за вами</text>
<line x1="24" y1="100" x2="616" y2="100" stroke="#3a3429" stroke-width="1"/>
<text x="48" y="150" fill="#6fae7c" font-size="20" font-weight="700">МОЖНО</text>
<text x="592" y="150" text-anchor="end" fill="#a8a090" font-size="17">один заезд на 60 дней</text>
<rect x="48" y="168" width="544" height="46" rx="6" fill="#1c1710" stroke="#3a3429" stroke-width="1.5"/>
<rect x="48.0" y="172" width="181.3" height="38" rx="4" fill="#c9973a"/>
<text x="138.7" y="197" text-anchor="middle" fill="#131009" font-size="18" font-weight="700">60 дней</text>
<text x="48" y="232" fill="#6f675a" font-size="15">день 0</text>
<text x="592" y="232" text-anchor="end" fill="#6f675a" font-size="15">день 180</text>
<text x="48" y="330" fill="#c9973a" font-size="20" font-weight="700">ПРЕДЕЛ</text>
<text x="592" y="330" text-anchor="end" fill="#a8a090" font-size="17">60 + перерыв + 30 = 90</text>
<rect x="48" y="348" width="544" height="46" rx="6" fill="#1c1710" stroke="#3a3429" stroke-width="1.5"/>
<rect x="48.0" y="352" width="181.3" height="38" rx="4" fill="#c9973a"/>
<text x="138.7" y="377" text-anchor="middle" fill="#131009" font-size="18" font-weight="700">60</text>
<rect x="335.1" y="352" width="90.7" height="38" rx="4" fill="#c9973a"/>
<text x="380.4" y="377" text-anchor="middle" fill="#131009" font-size="18" font-weight="700">30</text>
<text x="48" y="412" fill="#6f675a" font-size="15">день 0</text>
<text x="592" y="412" text-anchor="end" fill="#6f675a" font-size="15">день 180</text>
<text x="48" y="510" fill="#d4695a" font-size="20" font-weight="700">ОТКАЖУТ</text>
<text x="592" y="510" text-anchor="end" fill="#a8a090" font-size="17">60 + перерыв + 60 = 120</text>
<rect x="48" y="528" width="544" height="46" rx="6" fill="#1c1710" stroke="#3a3429" stroke-width="1.5"/>
<rect x="48.0" y="532" width="181.3" height="38" rx="4" fill="#c9973a"/>
<text x="138.7" y="557" text-anchor="middle" fill="#131009" font-size="18" font-weight="700">60</text>
<rect x="335.1" y="532" width="181.3" height="38" rx="4" fill="#a8483c"/>
<text x="425.8" y="557" text-anchor="middle" fill="#f4e6e2" font-size="18" font-weight="700">60</text>
<rect x="425.8" y="522" width="90.7" height="58" rx="5" fill="none" stroke="#e07a6a" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="48" y="592" fill="#6f675a" font-size="15">день 0</text>
<text x="592" y="592" text-anchor="end" fill="#6f675a" font-size="15">день 180</text>
<text x="471.1" y="618" text-anchor="middle" fill="#e07a6a" font-size="17" font-weight="600">30 дней сверх нормы</text>
<line x1="24" y1="712" x2="616" y2="712" stroke="#3a3429" stroke-width="1"/>
<text x="320" y="750" text-anchor="middle" fill="#e8e0d0" font-size="19" font-weight="700">Как считает офицер на границе</text>
<text x="320" y="784" text-anchor="middle" fill="#a8a090" font-size="17">берёт день вашего въезда и отматывает 180 суток назад,</text>
<text x="320" y="812" text-anchor="middle" fill="#a8a090" font-size="17">складывает все дни, что вы провели в стране за этот срок,</text>
<text x="320" y="840" text-anchor="middle" fill="#a8a090" font-size="17">и сравнивает сумму с девяноста. Одна поездка подряд — не длиннее 60.</text>
<text x="320" y="882" text-anchor="middle" fill="#6f675a" font-size="15">формула K-ETA, Министерство юстиции Республики Корея, сверено 21.08.2026</text>
</svg>