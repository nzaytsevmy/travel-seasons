<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" font-family="system-ui,-apple-system,sans-serif">
<title>Южная Корея: четыре точки июльской поездки</title>
<desc>Схема Южной Кореи с четырьмя отмеченными местами: Сораксан на северо-восточном побережье, снят 19 июля; Пусан в юго-восточном углу, 21 июля; остров Чеджу южнее материка, 26 июля; Сеул на северо-западе, 28 июля. Пунктиром показана линия Сеул — Пусан, 330 километров по прямой. До Чеджу от Сеула 453 километра, туда добираются самолётом.</desc>
<rect width="640" height="900" fill="#131009"/>
<text x="320" y="46" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ЧЕТЫРЕ УГЛА ЗА ДЕСЯТЬ ДНЕЙ</text>
<text x="320" y="78" text-anchor="middle" fill="#a8a090" font-size="18">горы, второй город, остров и столица — июль 2023</text>
<line x1="24" y1="100" x2="616" y2="100" stroke="#3a3429" stroke-width="1"/>
<polygon points="177.0,257.6 211.6,229.3 254.8,203.0 306.6,200.9 333.4,170.4 390.4,292.2 419.7,360.5 425.8,439.3 430.1,484.4 414.5,526.4 399.0,541.1 364.5,554.7 332.5,565.2 280.7,575.7 246.1,607.2 207.3,617.7 168.4,620.9 138.2,596.8 151.1,539.0 146.8,486.5 168.4,434.0 151.1,397.2 138.2,365.7 159.8,329.0 146.8,297.5" fill="#20190f" stroke="#4a4133" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="177.9" cy="719.6" rx="37.1" ry="22.1" fill="#20190f" stroke="#4a4133" stroke-width="2"/>
<path d="M209.9 283.8 L400.7 533.8" fill="none" stroke="#c9973a" stroke-width="2.5" stroke-dasharray="7 6" opacity="0.8"/>
<text x="209.3" y="442.8" text-anchor="middle" fill="#c9973a" font-size="17" font-weight="600">330 км</text>
<text x="209.3" y="464.8" text-anchor="middle" fill="#8d7f66" font-size="15">по прямой</text>
<circle cx="342.9" cy="214.6" r="7.5" fill="#c9973a" stroke="#131009" stroke-width="2"/>
<text x="360.9" y="211.6" text-anchor="start" fill="#e8e0d0" font-size="20" font-weight="700">Сораксан</text>
<text x="360.9" y="233.6" text-anchor="start" fill="#a8a090" font-size="17">19 июля</text>
<circle cx="209.9" cy="283.8" r="7.5" fill="#c9973a" stroke="#131009" stroke-width="2"/>
<text x="191.9" y="280.8" text-anchor="end" fill="#e8e0d0" font-size="20" font-weight="700">Сеул</text>
<text x="191.9" y="302.8" text-anchor="end" fill="#a8a090" font-size="17">28 июля</text>
<circle cx="400.7" cy="533.8" r="7.5" fill="#c9973a" stroke="#131009" stroke-width="2"/>
<text x="418.7" y="530.8" text-anchor="start" fill="#e8e0d0" font-size="20" font-weight="700">Пусан</text>
<text x="418.7" y="552.8" text-anchor="start" fill="#a8a090" font-size="17">21 июля</text>
<circle cx="210.7" cy="711.2" r="7.5" fill="#c9973a" stroke="#131009" stroke-width="2"/>
<text x="228.7" y="708.2" text-anchor="start" fill="#e8e0d0" font-size="20" font-weight="700">Чеджу</text>
<text x="228.7" y="730.2" text-anchor="start" fill="#a8a090" font-size="17">26 июля</text>
<line x1="24" y1="800" x2="616" y2="800" stroke="#3a3429" stroke-width="1"/>
<text x="320" y="836" text-anchor="middle" fill="#a8a090" font-size="17">материк проходится с севера на юг за один день пути</text>
<text x="320" y="864" text-anchor="middle" fill="#a8a090" font-size="17">Чеджу — 453 км от Сеула, добираются самолётом</text>
</svg>