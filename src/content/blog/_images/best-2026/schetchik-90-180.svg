<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" role="img" aria-label="Как считается правило 90 дней в каждые 180: окно отсчитывается назад от даты въезда, дни всех поездок складываются">
<rect width="640" height="720" fill="#131009"/>
<text x="40" y="60" fill="#c9973a" font-family="Helvetica,Arial" font-size="23" font-weight="700">Счётчик 90 в каждые 180</text>
<text x="40" y="90" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">на чём горят те, кто ездит часто</text>
<line x1="40" y1="112" x2="600" y2="112" stroke="#3a3429"/>

<text x="40" y="152" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="19" font-weight="700">Окно из 180 дней перед въездом</text>

<rect x="40" y="176" width="560" height="34" fill="none" stroke="#3a3429"/>
<rect x="40" y="176" width="150" height="34" fill="#c9973a" opacity="0.55"/>
<rect x="300" y="176" width="112" height="34" fill="#c9973a" opacity="0.55"/>
<text x="44" y="199" fill="#131009" font-family="Helvetica,Arial" font-size="16" font-weight="700">48 дней</text>
<text x="304" y="199" fill="#131009" font-family="Helvetica,Arial" font-size="16" font-weight="700">36 дней</text>
<text x="430" y="199" fill="#a8a090" font-family="Helvetica,Arial" font-size="16">дома</text>

<text x="40" y="234" fill="#a8a090" font-family="Helvetica,Arial" font-size="16">февраль</text>
<text x="300" y="234" fill="#a8a090" font-family="Helvetica,Arial" font-size="16">май</text>
<text x="520" y="234" fill="#a8a090" font-family="Helvetica,Arial" font-size="16">сегодня</text>
<line x1="40" y1="262" x2="600" y2="262" stroke="#3a3429"/>

<text x="40" y="302" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="19" font-weight="700">Сколько осталось на эту поездку</text>
<text x="40" y="334" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">48 + 36 уже потрачено за прошлые полгода</text>
<text x="40" y="360" fill="#c9973a" font-family="Helvetica,Arial" font-size="19" font-weight="700">остаётся 6 дней, а не 90</text>
<line x1="40" y1="392" x2="600" y2="392" stroke="#3a3429"/>

<text x="40" y="432" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="19" font-weight="700">Что важно помнить</text>
<text x="40" y="464" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">Окно двигается вместе с датой въезда,</text>
<text x="40" y="490" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">а не начинается заново с 1 января.</text>
<text x="40" y="524" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">Выезд на неделю счётчик не обнуляет:</text>
<text x="40" y="550" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">дни всех поездок складываются.</text>
<text x="40" y="584" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">День въезда и день выезда считаются</text>
<text x="40" y="610" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">каждый как полный день.</text>
<line x1="40" y1="642" x2="600" y2="642" stroke="#3a3429"/>

<text x="40" y="678" fill="#a8a090" font-family="Helvetica,Arial" font-size="16">Так считают ОАЭ, Чили, Уругвай и Доминикана —</text>
<text x="40" y="700" fill="#a8a090" font-family="Helvetica,Arial" font-size="16">у них в правиле прямо стоит «в каждые 180 дней».</text>
</svg>
