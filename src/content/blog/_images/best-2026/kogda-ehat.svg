<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Когда ехать по открытым направлениям: лучшие месяцы и месяцы, которых стоит избегать">
<rect width="640" height="800" fill="#131009"/>
<text x="40" y="60" fill="#c9973a" font-family="Helvetica,Arial" font-size="23" font-weight="700">Когда ехать, а когда не стоит</text>
<text x="40" y="90" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">по данным метеослужб стран, а не по ощущению</text>
<line x1="40" y1="112" x2="600" y2="112" stroke="#3a3429"/>

<text x="40" y="152" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20" font-weight="700">ОАЭ</text>
<text x="40" y="180" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">с ноября по март</text>
<text x="40" y="206" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">не летом и не в сентябре: днём около сорока</text>
<line x1="40" y1="230" x2="600" y2="230" stroke="#3a3429"/>

<text x="40" y="266" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20" font-weight="700">Черногория</text>
<text x="40" y="294" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">сентябрь — бархатный сезон</text>
<text x="40" y="320" fill="#c9973a" font-family="Helvetica,Arial" font-size="17">после 31 октября 2026 нужна виза</text>
<line x1="40" y1="344" x2="600" y2="344" stroke="#3a3429"/>

<text x="40" y="380" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20" font-weight="700">Чили и Уругвай</text>
<text x="40" y="408" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">с октября — весна Южного полушария</text>
<line x1="40" y1="432" x2="600" y2="432" stroke="#3a3429"/>

<text x="40" y="468" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20" font-weight="700">Кения</text>
<text x="40" y="496" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">июль — сентябрь, ещё январь и февраль</text>
<text x="40" y="522" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">не с октября: начинаются короткие дожди</text>
<line x1="40" y1="546" x2="600" y2="546" stroke="#3a3429"/>

<text x="40" y="582" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20" font-weight="700">Камбоджа</text>
<text x="40" y="610" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">с декабря по март</text>
<text x="40" y="636" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">не в сентябре: самый мокрый месяц года</text>
<line x1="40" y1="660" x2="600" y2="660" stroke="#3a3429"/>

<text x="40" y="696" fill="#e8e0d0" font-family="Helvetica,Arial" font-size="20" font-weight="700">Комодо</text>
<text x="40" y="724" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">сентябрь — ноябрь, море спокойное</text>
<text x="40" y="750" fill="#a8a090" font-family="Helvetica,Arial" font-size="17">не с мая по август: ветер, лодки не выходят</text>
<line x1="40" y1="774" x2="600" y2="774" stroke="#3a3429"/>
</svg>
