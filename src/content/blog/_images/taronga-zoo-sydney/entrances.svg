<title id="title">Таронга: верхний вход и причал внизу</title>
<desc id="desc">Автобус подходит к верхнему входу. Нижний вход в трёх минутах пешком от причала. Канатная дорога закрыта. Схема выбора стороны прибытия без масштаба и точных дорожек.</desc>
