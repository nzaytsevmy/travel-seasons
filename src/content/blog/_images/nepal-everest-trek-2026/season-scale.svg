<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 980" width="640" height="980" role="img" aria-label="Шкала года в районе Эвереста: муссон с середины июня по начало октября, два трековых окна — весна и осень, зимой перевалы под снегом">
  <rect width="640" height="980" fill="#131009"/>

  <text x="32" y="52" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="23" font-weight="600">Год в Кхумбу по месяцам</text>
  <text x="32" y="82" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="17">Даты муссона — метеослужба Непала, норма</text>

  <line x1="32" y1="104" x2="608" y2="104" stroke="#3a3429" stroke-width="1"/>

  <!-- вертикальная ось месяцев -->
  <line x1="150" y1="130" x2="150" y2="900" stroke="#3a3429" stroke-width="1"/>

  <!-- ЗИМА янв-фев -->
  <rect x="151" y="130" width="200" height="118" fill="#a8a090" opacity="0.13"/>
  <text x="32" y="163" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19">январь</text>
  <text x="32" y="215" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19">февраль</text>
  <text x="368" y="184" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">ясно и морозно,</text>
  <text x="368" y="208" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">перевалы закрывает</text>
  <text x="368" y="232" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">снегом</text>

  <!-- ВЕСНА мар-май -->
  <rect x="151" y="248" width="200" height="177" fill="#c9973a" opacity="0.30"/>
  <text x="32" y="281" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19">март</text>
  <text x="32" y="333" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19">апрель</text>
  <text x="32" y="385" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19">май</text>
  <text x="368" y="318" fill="#c9973a" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19" font-weight="600">окно первое</text>
  <text x="368" y="344" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">рододендроны, в лагере</text>
  <text x="368" y="368" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">палатки экспедиций,</text>
  <text x="368" y="392" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">днём дымка</text>

  <!-- МУССОН июн-сен -->
  <rect x="151" y="425" width="200" height="236" fill="#a8a090" opacity="0.10"/>
  <text x="32" y="458" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19">июнь</text>
  <text x="32" y="510" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19">июль</text>
  <text x="32" y="562" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19">август</text>
  <text x="32" y="614" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19">сентябрь</text>

  <!-- границы муссона -->
  <line x1="151" y1="464" x2="351" y2="464" stroke="#c9973a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="368" y="470" fill="#c9973a" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">13 июня — приходит</text>
  <line x1="151" y1="648" x2="351" y2="648" stroke="#c9973a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="368" y="654" fill="#c9973a" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">2 октября — уходит</text>
  <text x="368" y="546" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">муссон: дожди,</text>
  <text x="368" y="570" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">гор не видно,</text>
  <text x="368" y="594" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">рейсы срываются</text>

  <!-- ОСЕНЬ окт-ноя -->
  <rect x="151" y="661" width="200" height="118" fill="#c9973a" opacity="0.42"/>
  <text x="32" y="694" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19">октябрь</text>
  <text x="32" y="746" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19">ноябрь</text>
  <text x="368" y="700" fill="#c9973a" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19" font-weight="600">окно второе, главное</text>
  <text x="368" y="726" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">воздух чище всего,</text>
  <text x="368" y="750" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">и людей больше всего</text>

  <!-- ДЕКАБРЬ -->
  <rect x="151" y="779" width="200" height="59" fill="#a8a090" opacity="0.13"/>
  <text x="32" y="812" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19">декабрь</text>
  <text x="368" y="818" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">холодает, народ уходит</text>

  <line x1="32" y1="874" x2="608" y2="874" stroke="#3a3429" stroke-width="1"/>
  <text x="32" y="906" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Окно не гарантия.</text>
  <text x="32" y="932" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">29 октября 2025 циклон закрыл район</text>
  <text x="32" y="956" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">целиком — в разгар лучшего месяца.</text>
</svg>
