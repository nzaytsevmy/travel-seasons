<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" width="640" height="1000" role="img" aria-label="Профиль высот трека: Лукла 2840, спуск в Пхакдинг, Намче 3440, Тенгбоче 3860, Дингбоче 4410, Лобуче 4940, Кала-Патхар 5644; отдельно Гокио 4790 и базовый лагерь 5364">
  <rect width="640" height="1000" fill="#131009"/>

  <text x="32" y="52" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="23" font-weight="600">Куда вы поднимаетесь</text>
  <text x="32" y="82" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="17">высоты округлены, у источников расходятся на десятки метров</text>
  <line x1="32" y1="104" x2="608" y2="104" stroke="#3a3429" stroke-width="1"/>

  <!-- зона выше 4000 м -->
  <rect x="118" y="150" width="490" height="366" fill="#c9973a" opacity="0.07"/>

  <!-- шкала -->
  <line x1="118" y1="150" x2="118" y2="830" stroke="#3a3429" stroke-width="1"/>
  <line x1="112" y1="830" x2="608" y2="830" stroke="#3a3429" stroke-width="1"/>
  <text x="32" y="836" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="17">2500 м</text>
  <line x1="112" y1="621" x2="608" y2="621" stroke="#3a3429" stroke-width="1" stroke-dasharray="3 7"/>
  <text x="32" y="627" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="17">3500 м</text>
  <line x1="112" y1="411" x2="608" y2="411" stroke="#3a3429" stroke-width="1" stroke-dasharray="3 7"/>
  <text x="32" y="417" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="17">4500 м</text>
  <line x1="112" y1="202" x2="608" y2="202" stroke="#3a3429" stroke-width="1" stroke-dasharray="3 7"/>
  <text x="32" y="208" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="17">5500 м</text>

  <!-- вторая ветка: Гокио -->
  <line x1="118" y1="350" x2="330" y2="350" stroke="#a8a090" stroke-width="2" stroke-dasharray="7 6" opacity="0.7"/>
  <text x="126" y="342" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">Гокио 4790 — вторая ветка</text>
  <line x1="118" y1="230" x2="330" y2="230" stroke="#a8a090" stroke-width="2" stroke-dasharray="7 6" opacity="0.7"/>
  <text x="126" y="222" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">Гокио-Ри 5357 · лагерь 5364</text>

  <!-- линия набора высоты -->
  <polyline points="150,759 195,807 250,633 310,545 375,430 450,319 500,281 560,172"
            fill="none" stroke="#c9973a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <circle cx="150" cy="759" r="6" fill="#c9973a"/>
  <circle cx="195" cy="807" r="5" fill="#c9973a"/>
  <circle cx="250" cy="633" r="6" fill="#c9973a"/>
  <circle cx="310" cy="545" r="6" fill="#c9973a"/>
  <circle cx="375" cy="430" r="6" fill="#c9973a"/>
  <circle cx="450" cy="319" r="6" fill="#c9973a"/>
  <circle cx="500" cy="281" r="5" fill="#c9973a"/>
  <circle cx="560" cy="172" r="7" fill="#e8e0d0"/>

  <text x="164" y="754" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">Лукла 2840</text>
  <text x="238" y="628" fill="#e8e0d0" text-anchor="end" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">Намче 3440</text>
  <text x="298" y="540" fill="#e8e0d0" text-anchor="end" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">Тенгбоче 3860</text>
  <text x="363" y="425" fill="#e8e0d0" text-anchor="end" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">Дингбоче 4410</text>
  <text x="438" y="314" fill="#e8e0d0" text-anchor="end" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">Лобуче 4940</text>
  <text x="548" y="167" fill="#e8e0d0" text-anchor="end" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">Кала-Патхар 5644</text>

  <!-- граница 4000 м: рисуется последней, поверх кривой, с подложкой под подписью -->
  <line x1="118" y1="516" x2="608" y2="516" stroke="#c9973a" stroke-width="2"/>
  <rect x="242" y="490" width="366" height="24" fill="#131009"/>
  <text x="604" y="508" fill="#c9973a" text-anchor="end" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">выше 4000 м обычный полис не действует</text>

  <line x1="32" y1="900" x2="608" y2="900" stroke="#3a3429" stroke-width="1"/>
  <text x="32" y="932" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">Провал сразу после Луклы — спуск в Пхакдинг. Он в плане</text>
  <text x="32" y="958" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">не случайно: первую ночь спят ниже, чем прилетели.</text>
</svg>
