<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" width="640" height="388" font-family="system-ui,-apple-system,sans-serif">
<title>Что проверить перед покупкой eSIM</title>
<desc>Телефон должен поддерживать eSIM, покупать до вылета, роуминг отключить заранее, свой номер продолжает работать.</desc>
<rect width="640" height="388" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ПЕРЕД ПОКУПКОЙ eSIM</text>
<rect x="26" y="90" width="18" height="18" rx="3" fill="none" stroke="#5cc97a" stroke-width="2"/>
<path d="M30 99 l4 5 l8 -10" fill="none" stroke="#5cc97a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="106" fill="#e8e0d0" font-size="17.5" font-weight="600">Нужен телефон с поддержкой eSIM</text>
<text x="58" y="128" fill="#a8a090" font-size="15">iPhone XS и новее, Android с 2020</text>
<rect x="26" y="152" width="18" height="18" rx="3" fill="none" stroke="#5cc97a" stroke-width="2"/>
<path d="M30 161 l4 5 l8 -10" fill="none" stroke="#5cc97a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="168" fill="#e8e0d0" font-size="17.5" font-weight="600">Покупать до вылета</text>
<text x="58" y="190" fill="#a8a090" font-size="15">активация занимает полминуты</text>
<rect x="26" y="214" width="18" height="18" rx="3" fill="none" stroke="#5cc97a" stroke-width="2"/>
<path d="M30 223 l4 5 l8 -10" fill="none" stroke="#5cc97a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="230" fill="#e8e0d0" font-size="17.5" font-weight="600">Роуминг отключить заранее</text>
<text x="58" y="252" fill="#a8a090" font-size="15">иначе спишут за фоновые обновления</text>
<rect x="26" y="276" width="18" height="18" rx="3" fill="none" stroke="#5cc97a" stroke-width="2"/>
<path d="M30 285 l4 5 l8 -10" fill="none" stroke="#5cc97a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="292" fill="#e8e0d0" font-size="17.5" font-weight="600">Свой номер остаётся</text>
<text x="58" y="314" fill="#a8a090" font-size="15">физическая симка работает параллельно</text>
</svg>