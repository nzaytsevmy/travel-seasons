<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448" width="640" height="448" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько стоит eSIM по популярным направлениям</title>
<desc>Пять гигабайт на неделю-две стоят 11-14 долларов: Турция 13, Бали 13, Грузия 11, ОАЭ 14.</desc>
<rect width="640" height="448" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">СКОЛЬКО СТОИТ eSIM</text>
<text x="320" y="84" text-anchor="middle" fill="#1a7f4b" font-size="19" font-weight="700">10–15 $ хватает большинству</text>
<text x="320" y="106" text-anchor="middle" fill="#5c626b" font-size="16">5–10 ГБ на одну-две недели</text>
<line x1="24" y1="126" x2="616" y2="126" stroke="#d9dbde"/>
<text x="24" y="166" fill="#15171a" font-size="18">Турция, 5 ГБ</text>
<text x="616" y="166" text-anchor="end" fill="#1d40ae" font-size="18" font-weight="700">13 $</text>
<text x="24" y="218" fill="#15171a" font-size="18">Бали, 5 ГБ</text>
<text x="616" y="218" text-anchor="end" fill="#1d40ae" font-size="18" font-weight="700">13 $</text>
<text x="24" y="270" fill="#15171a" font-size="18">Грузия, 5 ГБ</text>
<text x="616" y="270" text-anchor="end" fill="#1d40ae" font-size="18" font-weight="700">11 $</text>
<text x="24" y="322" fill="#15171a" font-size="18">ОАЭ, 5 ГБ</text>
<text x="616" y="322" text-anchor="end" fill="#1d40ae" font-size="18" font-weight="700">14 $</text>
<text x="320" y="382" text-anchor="middle" fill="#5c626b" font-size="16">Карта, мессенджеры и фотографии — это и есть</text>
<text x="320" y="404" text-anchor="middle" fill="#5c626b" font-size="16">весь трафик обычной поездки</text>
<text x="320" y="430" text-anchor="middle" fill="#b3261e" font-size="16.5" font-weight="700">Роуминг своего оператора — самый дорогой вариант</text>
</svg>