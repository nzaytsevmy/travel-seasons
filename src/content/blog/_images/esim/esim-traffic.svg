<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 458" width="640" height="458" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько трафика уходит за день</title>
<desc>Мессенджеры 30 мегабайт, карты 200, видеозвонки полгигабайта, YouTube в высоком качестве три гигабайта в день.</desc>
<rect width="640" height="458" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">СКОЛЬКО ТРАФИКА ЗА ДЕНЬ</text>
<text x="24" y="102" fill="#15171a" font-size="17.5">Мессенджеры текстом</text>
<text x="616" y="102" text-anchor="end" fill="#1d40ae" font-size="17.5" font-weight="700">30 МБ</text>
<text x="24" y="150" fill="#15171a" font-size="17.5">Карты и навигация</text>
<text x="616" y="150" text-anchor="end" fill="#1d40ae" font-size="17.5" font-weight="700">200 МБ</text>
<text x="24" y="198" fill="#15171a" font-size="17.5">Голосовые звонки</text>
<text x="616" y="198" text-anchor="end" fill="#1d40ae" font-size="17.5" font-weight="700">150 МБ</text>
<text x="24" y="246" fill="#15171a" font-size="17.5">Видеозвонки</text>
<text x="616" y="246" text-anchor="end" fill="#1d40ae" font-size="17.5" font-weight="700">500 МБ</text>
<text x="24" y="294" fill="#15171a" font-size="17.5">YouTube в обычном качестве</text>
<text x="616" y="294" text-anchor="end" fill="#1d40ae" font-size="17.5" font-weight="700">1 ГБ</text>
<text x="24" y="342" fill="#15171a" font-size="17.5">YouTube в высоком</text>
<text x="616" y="342" text-anchor="end" fill="#1d40ae" font-size="17.5" font-weight="700">3 ГБ</text>
<text x="320" y="398" text-anchor="middle" fill="#1a7f4b" font-size="17" font-weight="700">Без видео пяти гигабайт хватает на две недели</text>
<text x="320" y="422" text-anchor="middle" fill="#5c626b" font-size="15.5">считайте по своим привычкам, а не по «на всякий случай»</text>
</svg>