<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" width="640" height="456" font-family="system-ui,-apple-system,sans-serif">
<title>Три способа быть на связи за границей</title>
<desc>Роуминг оператора 200-500 рублей за гигабайт, местная симка дешевле всего но съедает час, eSIM активируется за полминуты до вылета.</desc>
<rect width="640" height="456" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ТРИ СПОСОБА СВЯЗИ</text>
<rect x="24" y="84" width="592" height="86" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="86" fill="#d44545"/>
<text x="52" y="112" fill="#e8e0d0" font-size="18" font-weight="600">Роуминг оператора</text>
<text x="600" y="112" text-anchor="end" fill="#d44545" font-size="17" font-weight="700">200–500 ₽/ГБ</text>
<text x="52" y="138" fill="#a8a090" font-size="16">включается сразу</text>
<text x="52" y="158" fill="#6b6455" font-size="15">в 5–10 раз дороже eSIM</text>
<rect x="24" y="184" width="592" height="86" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="184" width="6" height="86" fill="#e8c062"/>
<text x="52" y="212" fill="#e8e0d0" font-size="18" font-weight="600">Местная SIM</text>
<text x="600" y="212" text-anchor="end" fill="#e8c062" font-size="17" font-weight="700">30–100 ₽/ГБ</text>
<text x="52" y="238" fill="#a8a090" font-size="16">очередь и регистрация 30–60 минут</text>
<text x="52" y="258" fill="#6b6455" font-size="15">в аэропорту наценка втрое</text>
<rect x="24" y="284" width="592" height="86" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="284" width="6" height="86" fill="#5cc97a"/>
<text x="52" y="312" fill="#e8e0d0" font-size="18" font-weight="600">eSIM до вылета</text>
<text x="600" y="312" text-anchor="end" fill="#5cc97a" font-size="17" font-weight="700">100–300 ₽/ГБ</text>
<text x="52" y="338" fill="#a8a090" font-size="16">активация за полминуты</text>
<text x="52" y="358" fill="#6b6455" font-size="15">нужен совместимый телефон</text>
<text x="320" y="432" text-anchor="middle" fill="#6b6455" font-size="15.5">Месяц в Турции с расходом 20 ГБ: роуминг — 17 500 ₽</text>
</svg>