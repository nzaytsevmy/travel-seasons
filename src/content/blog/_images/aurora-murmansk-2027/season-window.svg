<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" role="img" aria-label="Шкала сезона северного сияния на Кольском: тёмные ночи с конца августа по середину апреля, полярная ночь с начала декабря по середину января">
  <rect width="640" height="900" fill="#131009"/>

  <text x="40" y="52" fill="#e8e0d0" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="27" font-weight="700">Когда на Кольском тёмно</text>
  <text x="40" y="84" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">Сияние видно только в тёмном небе</text>

  <line x1="40" y1="112" x2="600" y2="112" stroke="#3a3429" stroke-width="1"/>

  <!-- полоса года: 14 месяцев по 45 px, с мая по июнь следующего года -->
  <rect x="150" y="160" width="30" height="180" fill="#1c1710"/>
  <rect x="150" y="340" width="30" height="337" fill="#c9973a" opacity="0.32"/>
  <rect x="150" y="475" width="30" height="67" fill="#c9973a"/>
  <rect x="150" y="677" width="30" height="113" fill="#1c1710"/>
  <rect x="150" y="160" width="30" height="630" fill="none" stroke="#3a3429" stroke-width="1"/>

  <g font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="19">
    <text x="98" y="189" fill="#a8a090" text-anchor="end">май</text>
    <text x="98" y="234" fill="#a8a090" text-anchor="end">июнь</text>
    <text x="98" y="279" fill="#a8a090" text-anchor="end">июль</text>
    <text x="98" y="324" fill="#e8e0d0" text-anchor="end">август</text>
    <text x="98" y="369" fill="#e8e0d0" text-anchor="end">сентябрь</text>
    <text x="98" y="414" fill="#e8e0d0" text-anchor="end">октябрь</text>
    <text x="98" y="459" fill="#e8e0d0" text-anchor="end">ноябрь</text>
    <text x="98" y="504" fill="#e8e0d0" text-anchor="end">декабрь</text>
    <text x="98" y="549" fill="#e8e0d0" text-anchor="end">январь</text>
    <text x="98" y="594" fill="#e8e0d0" text-anchor="end">февраль</text>
    <text x="98" y="639" fill="#e8e0d0" text-anchor="end">март</text>
    <text x="98" y="684" fill="#e8e0d0" text-anchor="end">апрель</text>
    <text x="98" y="729" fill="#a8a090" text-anchor="end">май</text>
    <text x="98" y="774" fill="#a8a090" text-anchor="end">июнь</text>
  </g>

  <!-- отсечки месяцев -->
  <g stroke="#3a3429" stroke-width="1">
    <line x1="150" y1="205" x2="180" y2="205"/>
    <line x1="150" y1="250" x2="180" y2="250"/>
    <line x1="150" y1="295" x2="180" y2="295"/>
    <line x1="150" y1="385" x2="180" y2="385"/>
    <line x1="150" y1="430" x2="180" y2="430"/>
    <line x1="150" y1="520" x2="180" y2="520"/>
    <line x1="150" y1="565" x2="180" y2="565"/>
    <line x1="150" y1="610" x2="180" y2="610"/>
    <line x1="150" y1="655" x2="180" y2="655"/>
    <line x1="150" y1="722" x2="180" y2="722"/>
    <line x1="150" y1="767" x2="180" y2="767"/>
  </g>

  <g font-family="Golos Text, Helvetica, Arial, sans-serif">
    <line x1="180" y1="340" x2="300" y2="340" stroke="#c9973a" stroke-width="1.5"/>
    <text x="310" y="335" fill="#c9973a" font-size="20" font-weight="700">конец августа</text>
    <text x="310" y="360" fill="#a8a090" font-size="17">ночи снова тёмные</text>

    <line x1="180" y1="475" x2="300" y2="475" stroke="#c9973a" stroke-width="1.5"/>
    <text x="310" y="470" fill="#c9973a" font-size="20" font-weight="700">полярная ночь</text>
    <text x="310" y="495" fill="#a8a090" font-size="17">около сорока суток,</text>
    <text x="310" y="517" fill="#a8a090" font-size="17">солнце не встаёт вовсе</text>

    <line x1="180" y1="677" x2="300" y2="677" stroke="#c9973a" stroke-width="1.5"/>
    <text x="310" y="672" fill="#c9973a" font-size="20" font-weight="700">середина апреля</text>
    <text x="310" y="697" fill="#a8a090" font-size="17">небо больше не темнеет</text>
  </g>

  <line x1="40" y1="822" x2="600" y2="822" stroke="#3a3429" stroke-width="1"/>
  <text x="40" y="852" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="16">Расчёт по координатам Мурманска: тёмным считается небо,</text>
  <text x="40" y="874" fill="#a8a090" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="16">когда солнце опускается ниже 12 градусов под горизонт.</text>
</svg>
