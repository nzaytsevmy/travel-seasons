<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" role="img" aria-label="Сравнение числа ясных ночей в месяц: в Мурманске от двух в октябре до семи в марте, в Кандалакше от четырёх до девяти">
  <rect width="640" height="900" fill="#fbfbfa"/>

  <text x="40" y="58" fill="#15171a" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="27" font-weight="700">Сколько ясных ночей в месяц</text>
  <text x="40" y="90" fill="#5c626b" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">Многолетняя норма по нижней облачности</text>

  <!-- легенда -->
  <rect x="40" y="112" width="26" height="14" fill="#1d40ae"/>
  <text x="76" y="125" fill="#15171a" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">Мурманск, побережье</text>
  <rect x="40" y="140" width="26" height="14" fill="#6d5a3a"/>
  <text x="76" y="153" fill="#15171a" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">Кандалакша, юг области</text>

  <line x1="40" y1="176" x2="600" y2="176" stroke="#d9dbde" stroke-width="1"/>

  <g font-family="Golos Text, Helvetica, Arial, sans-serif">
    <!-- октябрь -->
    <text x="40" y="222" fill="#15171a" font-size="20">октябрь</text>
    <rect x="185" y="204" width="84" height="20" fill="#1d40ae"/><text x="279" y="221" fill="#15171a" font-size="18">2</text>
    <rect x="185" y="230" width="168" height="20" fill="#6d5a3a"/><text x="363" y="247" fill="#5c626b" font-size="18">4</text>

    <!-- ноябрь -->
    <text x="40" y="298" fill="#15171a" font-size="20">ноябрь</text>
    <rect x="185" y="280" width="126" height="20" fill="#1d40ae"/><text x="321" y="297" fill="#15171a" font-size="18">3</text>
    <rect x="185" y="306" width="210" height="20" fill="#6d5a3a"/><text x="405" y="323" fill="#5c626b" font-size="18">5</text>

    <!-- декабрь -->
    <text x="40" y="374" fill="#15171a" font-size="20">декабрь</text>
    <rect x="185" y="356" width="168" height="20" fill="#1d40ae"/><text x="363" y="373" fill="#15171a" font-size="18">4</text>
    <rect x="185" y="382" width="294" height="20" fill="#6d5a3a"/><text x="489" y="399" fill="#5c626b" font-size="18">7</text>

    <!-- январь -->
    <text x="40" y="450" fill="#15171a" font-size="20">январь</text>
    <rect x="185" y="432" width="210" height="20" fill="#1d40ae"/><text x="405" y="449" fill="#15171a" font-size="18">5</text>
    <rect x="185" y="458" width="336" height="20" fill="#6d5a3a"/><text x="531" y="475" fill="#5c626b" font-size="18">8</text>

    <!-- февраль -->
    <text x="40" y="526" fill="#15171a" font-size="20">февраль</text>
    <rect x="185" y="508" width="252" height="20" fill="#1d40ae"/><text x="447" y="525" fill="#15171a" font-size="18">6</text>
    <rect x="185" y="534" width="336" height="20" fill="#6d5a3a"/><text x="531" y="551" fill="#5c626b" font-size="18">8</text>

    <!-- март -->
    <text x="40" y="602" fill="#15171a" font-size="20">март</text>
    <rect x="185" y="584" width="294" height="20" fill="#1d40ae"/><text x="489" y="601" fill="#15171a" font-size="18">7</text>
    <rect x="185" y="610" width="378" height="20" fill="#6d5a3a"/><text x="573" y="627" fill="#5c626b" font-size="18">9</text>
  </g>

  <line x1="40" y1="672" x2="600" y2="672" stroke="#d9dbde" stroke-width="1"/>

  <text x="40" y="712" fill="#1d40ae" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="21" font-weight="700">Чем ближе к весне, тем чище небо</text>
  <text x="40" y="746" fill="#15171a" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">В марте у побережья ясных ночей втрое больше,</text>
  <text x="40" y="772" fill="#15171a" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">чем в октябре, и почти вдвое больше, чем в декабре.</text>
  <text x="40" y="812" fill="#15171a" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">Юг области чище побережья в любой месяц сезона,</text>
  <text x="40" y="838" fill="#15171a" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="18">но он дальше от полосы, где сияние горит чаще.</text>

  <text x="40" y="878" fill="#5c626b" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="16">Источник: климатические таблицы метеостанций Мурманска и Кандалакши.</text>
</svg>
