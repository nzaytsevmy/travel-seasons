<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" width="640" height="860" role="img" aria-label="Схема: край индийского муссона накрывает только южную провинцию Дофар, поэтому у юга Омана летняя зелень, а у севера сухой аравийский календарь">
  <rect width="640" height="860" fill="#131009"/>

  <text x="40" y="62" fill="#e8e0d0" font-family="Golos Text, system-ui, sans-serif" font-size="29" font-weight="600">Куда достаёт муссон</text>
  <text x="40" y="96" fill="#a8a090" font-family="Golos Text, system-ui, sans-serif" font-size="19">Почему сезоны севера и юга не совпадают</text>
  <line x1="40" y1="120" x2="600" y2="120" stroke="#3a3429" stroke-width="1"/>

  <!-- Контур страны: условная вытянутая форма с севера на юг -->
  <path d="M300 168 L420 190 L452 268 L430 372 L372 470 L318 560 L252 640 L206 700 L176 676 L214 592 L252 500 L284 402 L296 300 Z"
        fill="none" stroke="#3a3429" stroke-width="2"/>

  <!-- Зона муссона -->
  <path d="M318 560 L252 640 L206 700 L176 676 L214 592 Z" fill="#c9973a" fill-opacity="0.16" stroke="#c9973a" stroke-width="2"/>

  <!-- Стрелки муссона с юго-запада -->
  <g stroke="#c9973a" stroke-width="2" fill="none" opacity="0.85">
    <path d="M86 620 L166 654" /><path d="M158 646 L166 654 L156 660" />
    <path d="M78 676 L158 700" /><path d="M150 692 L158 700 L148 706" />
    <path d="M96 566 L172 606" /><path d="M164 598 L172 606 L162 612" />
  </g>
  <text x="60" y="536" fill="#c9973a" font-family="Golos Text, system-ui, sans-serif" font-size="18">Ветер с Индийского</text>
  <text x="60" y="558" fill="#c9973a" font-family="Golos Text, system-ui, sans-serif" font-size="18">океана, июнь — сентябрь</text>

  <!-- Метки -->
  <circle cx="420" cy="196" r="7" fill="#e8e0d0"/>
  <text x="440" y="188" fill="#e8e0d0" font-family="Golos Text, system-ui, sans-serif" font-size="21" font-weight="600">Маскат</text>
  <text x="440" y="214" fill="#a8a090" font-family="Golos Text, system-ui, sans-serif" font-size="17">муссон сюда</text>
  <text x="440" y="236" fill="#a8a090" font-family="Golos Text, system-ui, sans-serif" font-size="17">не доходит</text>

  <circle cx="212" cy="656" r="7" fill="#c9973a"/>
  <text x="238" y="652" fill="#c9973a" font-family="Golos Text, system-ui, sans-serif" font-size="21" font-weight="600">Салала, Дофар</text>
  <text x="238" y="678" fill="#a8a090" font-family="Golos Text, system-ui, sans-serif" font-size="17">край муссонной полосы</text>

  <text x="348" y="418" fill="#a8a090" font-family="Golos Text, system-ui, sans-serif" font-size="17">Сухая середина:</text>
  <text x="348" y="440" fill="#a8a090" font-family="Golos Text, system-ui, sans-serif" font-size="17">муссон гасят</text>
  <text x="348" y="462" fill="#a8a090" font-family="Golos Text, system-ui, sans-serif" font-size="17">горы Дофара</text>

  <line x1="40" y1="742" x2="600" y2="742" stroke="#3a3429" stroke-width="1"/>
  <text x="40" y="778" fill="#e8e0d0" font-family="Golos Text, system-ui, sans-serif" font-size="19">Полоса муссона узкая: она задевает побережье Дофара</text>
  <text x="40" y="804" fill="#e8e0d0" font-family="Golos Text, system-ui, sans-serif" font-size="19">и обрывается в горах, не заходя вглубь Аравии.</text>
  <text x="40" y="836" fill="#a8a090" font-family="Golos Text, system-ui, sans-serif" font-size="16">Схема условная: показывает направление и охват, не точные границы</text>
</svg>
