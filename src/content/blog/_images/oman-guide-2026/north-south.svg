<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" role="img" aria-label="Схема: ветер с Индийского океана достаёт только южную провинцию Дофар с Салалой и гаснет в горах, до Маската муссон не доходит">
  <rect width="640" height="820" fill="#fbfbfa"/>

  <text x="36" y="56" fill="#15171a" font-family="Golos Text, system-ui, sans-serif" font-size="28" font-weight="600">Куда достаёт муссон</text>
  <text x="36" y="88" fill="#5c626b" font-family="Golos Text, system-ui, sans-serif" font-size="18">Почему сезоны севера и юга не совпадают</text>
  <line x1="36" y1="110" x2="604" y2="110" stroke="#d9dbde" stroke-width="1"/>

  <!-- Контур страны -->
  <path d="M300 158 L418 180 L450 258 L428 362 L370 460 L316 550 L250 630 L204 690 L174 666 L212 582 L250 490 L282 392 L294 290 Z"
        fill="#ffffff" stroke="#c3c7cc" stroke-width="1.5"/>

  <!-- Зона муссона -->
  <path d="M316 550 L250 630 L204 690 L174 666 L212 582 Z" fill="#1d40ae" fill-opacity="0.12" stroke="#1d40ae" stroke-width="1.5"/>

  <!-- Стрелки муссона с юго-запада -->
  <g stroke="#1d40ae" stroke-width="1.8" fill="none">
    <path d="M74 556 L166 596"/><path d="M158 588 L166 596 L156 602"/>
    <path d="M66 612 L160 646"/><path d="M152 638 L160 646 L150 652"/>
    <path d="M62 668 L152 692"/><path d="M144 684 L152 692 L142 698"/>
  </g>
  <text x="48" y="512" fill="#1d40ae" font-family="Golos Text, system-ui, sans-serif" font-size="17" font-weight="600">Ветер с Индийского океана,</text>
  <text x="48" y="534" fill="#1d40ae" font-family="Golos Text, system-ui, sans-serif" font-size="17" font-weight="600">июнь — сентябрь</text>

  <!-- Метки -->
  <circle cx="418" cy="186" r="5.5" fill="#15171a"/>
  <text x="438" y="180" fill="#15171a" font-family="Golos Text, system-ui, sans-serif" font-size="20" font-weight="600">Маскат</text>
  <text x="438" y="206" fill="#5c626b" font-family="Golos Text, system-ui, sans-serif" font-size="16">муссон сюда</text>
  <text x="438" y="227" fill="#5c626b" font-family="Golos Text, system-ui, sans-serif" font-size="16">не доходит</text>

  <circle cx="210" cy="646" r="5.5" fill="#1d40ae"/>
  <text x="234" y="640" fill="#1d40ae" font-family="Golos Text, system-ui, sans-serif" font-size="20" font-weight="600">Салала, Дофар</text>
  <text x="234" y="666" fill="#5c626b" font-family="Golos Text, system-ui, sans-serif" font-size="16">край муссонной полосы</text>

  <text x="346" y="404" fill="#5c626b" font-family="Golos Text, system-ui, sans-serif" font-size="16">Сухая середина:</text>
  <text x="346" y="426" fill="#5c626b" font-family="Golos Text, system-ui, sans-serif" font-size="16">муссон гасят</text>
  <text x="346" y="448" fill="#5c626b" font-family="Golos Text, system-ui, sans-serif" font-size="16">горы Дофара</text>

  <line x1="36" y1="722" x2="604" y2="722" stroke="#d9dbde" stroke-width="1"/>
  <text x="36" y="756" fill="#15171a" font-family="Golos Text, system-ui, sans-serif" font-size="18">Полоса муссона узкая: она задевает побережье Дофара</text>
  <text x="36" y="780" fill="#15171a" font-family="Golos Text, system-ui, sans-serif" font-size="18">и обрывается в горах, не заходя вглубь Аравии.</text>
  <text x="36" y="808" fill="#5c626b" font-family="Golos Text, system-ui, sans-serif" font-size="15">Схема условная: показывает направление и охват, не точные границы</text>
</svg>
