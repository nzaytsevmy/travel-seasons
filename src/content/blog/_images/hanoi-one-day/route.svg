<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" role="img" aria-labelledby="title desc">
  <title id="title">Ориентиры одного дня в центре Ханоя</title>
  <desc id="desc">Старый квартал расположен севернее озера Хоанкьем. Храм Литературы — западнее, музей Хоало — юго-западнее, Музей женщин — южнее озера. От озера маршрут идёт в квартал, а после обеда к одному из трёх объектов. Направления условные, схема не показывает улицы и расстояния.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#1d40ae" stroke-width="2"/></marker></defs>
  <rect width="400" height="620" fill="#fbfbfa"/>
  <text x="18" y="42" fill="#1d40ae" font-family="Golos Text, sans-serif" font-size="23" font-weight="700">Ориентиры в центре Ханоя</text>
  <text x="18" y="70" fill="#5c626b" font-family="Golos Text, sans-serif" font-size="17">Направления, не улицы и не масштаб</text>
  <path d="M18 87 H382" stroke="#d9dbde" stroke-width="2"/>
  <path d="M355 158 V112" stroke="#15171a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="346" y="181" fill="#15171a" font-family="PT Mono, monospace" font-size="17">С</text>
  <path d="M241 179 C180 173 99 210 76 273 M245 183 C177 251 119 365 127 458 M264 184 C287 262 249 395 245 467" fill="none" stroke="#1d40ae" stroke-width="2" stroke-dasharray="6 7" opacity=".75"/>
  <path d="M211 155 C238 139 278 143 305 168 M209 159 C222 187 267 203 302 185" fill="none" stroke="#d9dbde" stroke-width="2"/>
  <circle cx="255" cy="172" r="8" fill="#1d40ae"/>
  <text x="162" y="128" fill="#15171a" font-family="Golos Text, sans-serif" font-size="19" font-weight="700">Старый квартал</text>
  <path d="M263 369 C285 345 287 310 267 284 C252 260 226 268 221 291 C214 315 236 352 263 369Z" fill="#eef0f2" stroke="#5c626b" stroke-width="2"/>
  <circle cx="256" cy="314" r="8" fill="#1d40ae"/>
  <text x="179" y="400" fill="#15171a" font-family="Golos Text, sans-serif" font-size="19" font-weight="700">Озеро Хоанкьем</text>
  <path d="M255 292 L255 198" fill="none" stroke="#1d40ae" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="71" cy="285" r="8" fill="#1d40ae"/>
  <text x="20" y="252" fill="#15171a" font-family="Golos Text, sans-serif" font-size="18" font-weight="700">Храм</text>
  <text x="20" y="274" fill="#15171a" font-family="Golos Text, sans-serif" font-size="18" font-weight="700">Литературы</text>
  <circle cx="127" cy="470" r="8" fill="#1d40ae"/>
  <text x="77" y="505" fill="#15171a" font-family="Golos Text, sans-serif" font-size="19" font-weight="700">Хоало</text>
  <circle cx="245" cy="479" r="8" fill="#1d40ae"/>
  <text x="222" y="516" fill="#15171a" font-family="Golos Text, sans-serif" font-size="18" font-weight="700">Музей женщин</text>
  <path d="M18 542 H382" stroke="#d9dbde" stroke-width="2"/>
  <text x="18" y="573" fill="#5c626b" font-family="Golos Text, sans-serif" font-size="17">Пунктир: после квартала выберите</text>
  <text x="18" y="598" fill="#5c626b" font-family="Golos Text, sans-serif" font-size="17">одну точку. Время в пути проверьте.</text>
</svg>
