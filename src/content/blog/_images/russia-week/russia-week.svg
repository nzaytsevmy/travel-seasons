<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" width="640" height="550" font-family="system-ui,-apple-system,sans-serif">
<title>Сколько стоит неделя в России на двоих</title>
<desc>Абхазия 35-70 тысяч, Карелия 50-90, Дагестан 80-90, Алтай около ста, Камчатка от 90 до 280 тысяч. Дорога считается отдельно.</desc>
<rect width="640" height="550" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">НЕДЕЛЯ В РОССИИ НА ДВОИХ</text>
<rect x="24" y="84" width="592" height="64" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="84" width="6" height="64" fill="#1a7f4b"/>
<text x="52" y="111" fill="#15171a" font-size="18" font-weight="600">Абхазия</text>
<text x="600" y="111" text-anchor="end" fill="#1a7f4b" font-size="18" font-weight="700">35–70 тыс. ₽</text>
<text x="52" y="134" fill="#5c626b" font-size="15">самый дешёвый вход к морю</text>
<rect x="24" y="160" width="592" height="64" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="160" width="6" height="64" fill="#1a7f4b"/>
<text x="52" y="187" fill="#15171a" font-size="18" font-weight="600">Карелия</text>
<text x="600" y="187" text-anchor="end" fill="#1a7f4b" font-size="18" font-weight="700">50–90 тыс. ₽</text>
<text x="52" y="210" fill="#5c626b" font-size="15">ближе всего к Москве и Петербургу</text>
<rect x="24" y="236" width="592" height="64" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="236" width="6" height="64" fill="#8a6a10"/>
<text x="52" y="263" fill="#15171a" font-size="18" font-weight="600">Дагестан</text>
<text x="600" y="263" text-anchor="end" fill="#8a6a10" font-size="18" font-weight="700">80–90 тыс. ₽</text>
<text x="52" y="286" fill="#5c626b" font-size="15">горы без загранпаспорта</text>
<rect x="24" y="312" width="592" height="64" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="312" width="6" height="64" fill="#8a6a10"/>
<text x="52" y="339" fill="#15171a" font-size="18" font-weight="600">Алтай</text>
<text x="600" y="339" text-anchor="end" fill="#8a6a10" font-size="18" font-weight="700">≈100 тыс. ₽</text>
<text x="52" y="362" fill="#5c626b" font-size="15">автомаршрутом, если готовы за руль</text>
<rect x="24" y="388" width="592" height="64" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="388" width="6" height="64" fill="#b3261e"/>
<text x="52" y="415" fill="#15171a" font-size="18" font-weight="600">Камчатка</text>
<text x="600" y="415" text-anchor="end" fill="#b3261e" font-size="18" font-weight="700">90–280 тыс. ₽</text>
<text x="52" y="438" fill="#5c626b" font-size="15">один раз в жизни</text>
<text x="320" y="492" text-anchor="middle" fill="#5c626b" font-size="16">Жильё, еда и то, ради чего едут: экскурсии, катер, джип</text>
<text x="320" y="516" text-anchor="middle" fill="#8a9099" font-size="15.5">Дорога вынесена отдельно — у Камчатки она меняет всё</text>
</svg>