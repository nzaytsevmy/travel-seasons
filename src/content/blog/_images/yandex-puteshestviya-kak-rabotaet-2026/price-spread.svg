<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="system-ui,-apple-system,sans-serif">
<title>Разница цен Яндекс Путешествий и Островка на восьми одинаковых предложениях</title>
<desc>Одна процентная шкала и два ряда отметок. В верхнем ряду сравниваются открытые цены: семь отметок из восьми стоят левее нуля, то есть у Яндекса дешевле, разрыв доходит до десяти с половиной процентов. В нижнем ряду то же сравнение с ценой Островка после входа в аккаунт: все восемь отметок ушли правее нуля, у Яндекса дороже на величину от половины процента до двенадцати.</desc>
<rect width="640" height="470" fill="#131009"/>

<text x="24" y="42" fill="#c9973a" font-size="21" font-weight="600">Насколько Яндекс дороже Островка</text>
<text x="24" y="70" fill="#a8a090" font-size="15">Одна ночь в Сочи, восемь одинаковых номеров, 27 августа 2026</text>

<line x1="60" y1="360" x2="600" y2="360" stroke="#3a3429" stroke-width="2"/>
<line x1="309" y1="120" x2="309" y2="372" stroke="#a8a090" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="101" y1="354" x2="101" y2="368" stroke="#3a3429" stroke-width="2"/>
<line x1="205" y1="354" x2="205" y2="368" stroke="#3a3429" stroke-width="2"/>
<line x1="413" y1="354" x2="413" y2="368" stroke="#3a3429" stroke-width="2"/>
<line x1="517" y1="354" x2="517" y2="368" stroke="#3a3429" stroke-width="2"/>
<text x="101" y="392" text-anchor="middle" fill="#a8a090" font-size="15">−10%</text>
<text x="205" y="392" text-anchor="middle" fill="#a8a090" font-size="15">−5%</text>
<text x="309" y="392" text-anchor="middle" fill="#e8e0d0" font-size="15">0</text>
<text x="413" y="392" text-anchor="middle" fill="#a8a090" font-size="15">+5%</text>
<text x="517" y="392" text-anchor="middle" fill="#a8a090" font-size="15">+10%</text>

<text x="24" y="140" fill="#e8e0d0" font-size="17">Открытые цены</text>
<circle cx="88" cy="176" r="8" fill="#c9973a"/>
<circle cx="88" cy="196" r="8" fill="#c9973a"/>
<circle cx="105" cy="186" r="8" fill="#c9973a"/>
<circle cx="205" cy="176" r="8" fill="#c9973a"/>
<circle cx="205" cy="196" r="8" fill="#c9973a"/>
<circle cx="222" cy="186" r="8" fill="#c9973a"/>
<circle cx="291" cy="186" r="8" fill="#c9973a"/>
<circle cx="330" cy="186" r="8" fill="#c9973a"/>
<text x="24" y="228" fill="#a8a090" font-size="15">семь отметок из восьми левее нуля — дешевле Яндекс</text>

<text x="24" y="272" fill="#e8e0d0" font-size="17">Цена Островка после входа в аккаунт</text>
<circle cx="318" cy="306" r="8" fill="#e8c062"/>
<circle cx="318" cy="326" r="8" fill="#e8c062"/>
<circle cx="335" cy="316" r="8" fill="#e8c062"/>
<circle cx="425" cy="306" r="8" fill="#e8c062"/>
<circle cx="425" cy="326" r="8" fill="#e8c062"/>
<circle cx="442" cy="316" r="8" fill="#e8c062"/>
<circle cx="520" cy="316" r="8" fill="#e8c062"/>
<circle cx="563" cy="316" r="8" fill="#e8c062"/>

<text x="24" y="432" fill="#e8e0d0" font-size="16">Вход в аккаунт на Островке переворачивает</text>
<text x="24" y="456" fill="#e8e0d0" font-size="16">сравнение на всех восьми строках.</text>
</svg>
