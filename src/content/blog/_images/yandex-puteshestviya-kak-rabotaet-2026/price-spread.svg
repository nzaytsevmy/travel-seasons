<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" width="640" height="660" font-family="system-ui,-apple-system,sans-serif">
<title>Цена одной ночи в четырёх гостиницах Сочи у двух продавцов</title>
<desc>Четыре пары горизонтальных полос в одном масштабе. В каждой паре верхняя полоса — цена Яндекс Путешествий, нижняя — цена Островка для вошедшего в аккаунт. Нижняя полоса короче во всех четырёх парах: Яндекс дороже на 16 рублей в Централ Резиденс, на 210 в Белладжио, на 533 в Денарте и на 667 в Портофино.</desc>
<rect width="640" height="660" fill="#131009"/>

<text x="24" y="40" fill="#c9973a" font-size="22" font-weight="600">Одна ночь у двух продавцов</text>
<text x="24" y="66" fill="#a8a090" font-size="15">Сочи, 10–11 сентября 2026, двое, без питания,</text>
<text x="24" y="86" fill="#a8a090" font-size="15">с бесплатной отменой. Замер 27 августа</text>

<rect x="24" y="104" width="14" height="14" fill="#c9973a"/>
<text x="46" y="116" fill="#e8e0d0" font-size="15">Яндекс Путешествия</text>
<rect x="240" y="104" width="14" height="14" fill="#8f8676"/>
<text x="262" y="116" fill="#e8e0d0" font-size="15">Островок после входа в аккаунт</text>

<text x="24" y="164" fill="#e8e0d0" font-size="17" font-weight="600">Белладжио, стандарт</text>
<rect x="24" y="174" width="232" height="22" fill="#c9973a"/>
<text x="268" y="191" fill="#e8c062" font-size="16">3 990 ₽</text>
<rect x="24" y="202" width="219" height="22" fill="#8f8676"/>
<text x="268" y="219" fill="#a8a090" font-size="16">3 780 ₽</text>
<text x="24" y="244" fill="#a8a090" font-size="15">Яндекс дороже на 210 ₽</text>

<text x="24" y="290" fill="#e8e0d0" font-size="17" font-weight="600">Централ Резиденс, стандарт</text>
<rect x="24" y="300" width="220" height="22" fill="#c9973a"/>
<text x="268" y="317" fill="#e8c062" font-size="16">3 792 ₽</text>
<rect x="24" y="328" width="219" height="22" fill="#8f8676"/>
<text x="268" y="345" fill="#a8a090" font-size="16">3 776 ₽</text>
<text x="24" y="370" fill="#a8a090" font-size="15">Яндекс дороже на 16 ₽</text>

<text x="24" y="416" fill="#e8e0d0" font-size="17" font-weight="600">Денарт, стандарт</text>
<rect x="24" y="426" width="284" height="22" fill="#c9973a"/>
<text x="320" y="443" fill="#e8c062" font-size="16">4 900 ₽</text>
<rect x="24" y="454" width="253" height="22" fill="#8f8676"/>
<text x="320" y="471" fill="#a8a090" font-size="16">4 367 ₽</text>
<text x="24" y="496" fill="#a8a090" font-size="15">Яндекс дороже на 533 ₽</text>

<text x="24" y="542" fill="#e8e0d0" font-size="17" font-weight="600">Портофино, делюкс с видом на море</text>
<rect x="24" y="552" width="420" height="22" fill="#c9973a"/>
<text x="456" y="569" fill="#e8c062" font-size="16">7 237 ₽</text>
<rect x="24" y="580" width="381" height="22" fill="#8f8676"/>
<text x="456" y="597" fill="#a8a090" font-size="16">6 570 ₽</text>
<text x="24" y="622" fill="#a8a090" font-size="15">Яндекс дороже на 667 ₽</text>

<text x="24" y="652" fill="#e8e0d0" font-size="16">Серая полоса короче во всех четырёх парах.</text>
</svg>
