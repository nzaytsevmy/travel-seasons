<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="system-ui,-apple-system,sans-serif">
<title>Потолок начисления баллов за одно бронирование</title>
<desc>График: по горизонтали стоимость бронирования от нуля до тридцати тысяч рублей, по вертикали количество баллов. Наклонная линия растёт вместе со стоимостью, но на тринадцати тысячах трёхстах тридцати трёх рублях упирается в горизонтальный потолок в две тысячи баллов и дальше идёт ровно. Чем дороже бронирование, тем меньше доля возврата.</desc>
<rect width="640" height="470" fill="#fbfbfa"/>

<text x="24" y="42" fill="#1d40ae" font-size="21" font-weight="600">Где заканчивается кешбэк баллами</text>
<text x="24" y="70" fill="#5c626b" font-size="15">Потолок 2 000 баллов за одно бронирование, условия от 5 июня 2026</text>

<line x1="80" y1="120" x2="80" y2="340" stroke="#d9dbde" stroke-width="2"/>
<line x1="80" y1="340" x2="610" y2="340" stroke="#d9dbde" stroke-width="2"/>

<line x1="74" y1="266" x2="80" y2="266" stroke="#d9dbde" stroke-width="2"/>
<line x1="74" y1="193" x2="80" y2="193" stroke="#d9dbde" stroke-width="2"/>
<line x1="74" y1="120" x2="80" y2="120" stroke="#d9dbde" stroke-width="2"/>
<text x="66" y="272" text-anchor="end" fill="#5c626b" font-size="14">1 000</text>
<text x="66" y="199" text-anchor="end" fill="#15171a" font-size="14">2 000</text>
<text x="66" y="126" text-anchor="end" fill="#5c626b" font-size="14">3 000</text>
<text x="66" y="346" text-anchor="end" fill="#5c626b" font-size="14">0</text>

<line x1="253" y1="340" x2="253" y2="346" stroke="#d9dbde" stroke-width="2"/>
<line x1="427" y1="340" x2="427" y2="346" stroke="#d9dbde" stroke-width="2"/>
<line x1="600" y1="340" x2="600" y2="346" stroke="#d9dbde" stroke-width="2"/>
<text x="253" y="368" text-anchor="middle" fill="#5c626b" font-size="14">10 000 ₽</text>
<text x="427" y="368" text-anchor="middle" fill="#5c626b" font-size="14">20 000 ₽</text>
<text x="600" y="368" text-anchor="middle" fill="#5c626b" font-size="14">30 000 ₽</text>

<line x1="80" y1="193" x2="600" y2="193" stroke="#d9dbde" stroke-width="1" stroke-dasharray="4 6"/>
<polyline points="80,340 311,193 600,193" fill="none" stroke="#1d40ae" stroke-width="3"/>
<circle cx="311" cy="193" r="9" fill="#8a6a10"/>
<line x1="311" y1="193" x2="311" y2="340" stroke="#8a6a10" stroke-width="1.5" stroke-dasharray="4 5"/>
<text x="322" y="163" fill="#8a6a10" font-size="17" font-weight="700">13 333 ₽</text>
<text x="322" y="185" fill="#5c626b" font-size="15">дальше потолок</text>

<text x="24" y="412" fill="#15171a" font-size="16">До 13 333 ₽ возврат идёт по объявленной доле.</text>
<text x="24" y="436" fill="#15171a" font-size="16">На брони за 30 000 ₽ те же 2 000 баллов — это</text>
<text x="24" y="460" fill="#15171a" font-size="16">6,7% вместо 15%.</text>
</svg>
