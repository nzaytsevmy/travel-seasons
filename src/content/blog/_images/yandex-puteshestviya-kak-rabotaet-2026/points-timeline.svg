<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui,-apple-system,sans-serif">
<title>Когда за бронирование приходят баллы и на каком отрезке они пропадают</title>
<desc>Вертикальная линия времени с четырьмя отметками: бронь и оплата, заезд, выезд, и через пять дней после выезда — начисление баллов. Отрезок от оплаты до выезда закрашен: отмена или возврат денег на нём обнуляют начисление, потому что такая бронь завершённой не считается.</desc>
<rect width="640" height="560" fill="#131009"/>

<text x="24" y="40" fill="#c9973a" font-size="22" font-weight="600">Когда приходят баллы</text>
<text x="24" y="66" fill="#a8a090" font-size="15">Условия начисления в редакции от 5 июня 2026</text>

<rect x="46" y="112" width="36" height="288" fill="#c9973a" fill-opacity="0.14"/>
<line x1="64" y1="112" x2="64" y2="470" stroke="#3a3429" stroke-width="3"/>

<circle cx="64" cy="112" r="10" fill="#c9973a"/>
<text x="100" y="108" fill="#e8e0d0" font-size="17" font-weight="600">Бронь и оплата</text>
<text x="100" y="132" fill="#a8a090" font-size="15">баллов нет</text>

<circle cx="64" cy="256" r="10" fill="#c9973a"/>
<text x="100" y="252" fill="#e8e0d0" font-size="17" font-weight="600">Заезд</text>
<text x="100" y="276" fill="#a8a090" font-size="15">баллов нет</text>

<circle cx="64" cy="400" r="10" fill="#c9973a"/>
<text x="100" y="396" fill="#e8e0d0" font-size="17" font-weight="600">Выезд</text>
<text x="100" y="420" fill="#a8a090" font-size="15">отсюда отсчёт пяти дней</text>

<circle cx="64" cy="470" r="13" fill="#e8c062"/>
<text x="100" y="466" fill="#e8c062" font-size="17" font-weight="700">Плюс пять дней</text>
<text x="100" y="490" fill="#e8e0d0" font-size="15">баллы на счёте</text>

<line x1="384" y1="112" x2="384" y2="400" stroke="#c9973a" stroke-width="2"/>
<line x1="378" y1="112" x2="390" y2="112" stroke="#c9973a" stroke-width="2"/>
<line x1="378" y1="400" x2="390" y2="400" stroke="#c9973a" stroke-width="2"/>
<text x="402" y="240" fill="#e8c062" font-size="15" font-weight="600">отмена или возврат</text>
<text x="402" y="262" fill="#e8c062" font-size="15" font-weight="600">на этом отрезке —</text>
<text x="402" y="284" fill="#e8c062" font-size="15" font-weight="600">баллов не будет</text>

<text x="24" y="534" fill="#e8e0d0" font-size="16">За первую в жизни бронь баллов не дают в любом случае.</text>
</svg>
