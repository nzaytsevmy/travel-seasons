<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="system-ui,-apple-system,sans-serif">
<title>Какая часть цены билета на витрине приходится на сбор сервиса</title>
<desc>Две пары полос. В каждой паре верхняя полоса — цена того же места у перевозчика, нижняя — цена на витрине сервиса; золотой хвост справа показывает разницу. В плацкарте хвост составляет 13,5 процента, в спальном вагоне — 23,5 процента цены перевозчика.</desc>
<rect width="640" height="430" fill="#131009"/>

<text x="24" y="42" fill="#c9973a" font-size="21" font-weight="600">Сколько в цене билета не билет</text>
<text x="24" y="70" fill="#a8a090" font-size="15">Два места, замер 26 августа 2026, поездка 2 сентября</text>

<text x="24" y="118" fill="#e8e0d0" font-size="17">Плацкарт, поезд 010Н</text>
<rect x="24" y="130" width="423" height="26" fill="#3a3429"/>
<text x="455" y="150" fill="#a8a090" font-size="15">3 568,90 ₽ у перевозчика</text>
<rect x="24" y="164" width="423" height="26" fill="#7a5f24"/>
<rect x="447" y="164" width="57" height="26" fill="#c9973a"/>
<text x="512" y="184" fill="#e8c062" font-size="15">4 051 ₽, это +13,5%</text>

<text x="24" y="248" fill="#e8e0d0" font-size="17">Спальный вагон, поезд 145А</text>
<rect x="24" y="260" width="389" height="26" fill="#3a3429"/>
<text x="421" y="280" fill="#a8a090" font-size="15">16 249,70 ₽ у перевозчика</text>
<rect x="24" y="294" width="389" height="26" fill="#7a5f24"/>
<rect x="413" y="294" width="91" height="26" fill="#e8c062"/>
<text x="512" y="314" fill="#e8c062" font-size="15">20 068 ₽, это +23,5%</text>

<rect x="24" y="346" width="16" height="16" fill="#7a5f24"/>
<text x="50" y="360" fill="#a8a090" font-size="15">цена проезда и места</text>
<rect x="272" y="346" width="16" height="16" fill="#c9973a"/>
<text x="298" y="360" fill="#a8a090" font-size="15">разница с ценой перевозчика</text>

<text x="24" y="398" fill="#e8e0d0" font-size="16">Справка сервиса называет сбор частью цены,</text>
<text x="24" y="422" fill="#e8e0d0" font-size="16">но его размер не публикует.</text>
</svg>
