<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" font-family="system-ui,-apple-system,sans-serif">
<title>Что занимает первый экран сервиса и какая его часть платная</title>
<desc>Схема экрана телефона. Сверху форма поиска: город, даты, число гостей и кнопка «Найти». Сразу под ней блок подборки жилья, помеченный словом «Реклама», — в него попадают объекты платных программ продвижения, выбранные случайным образом. Обычная выдача с сортировкой по цене и рейтингу начинается ниже, за пределами первого экрана.</desc>
<rect width="640" height="620" fill="#131009"/>

<text x="24" y="40" fill="#c9973a" font-size="22" font-weight="600">Что стоит на первом экране</text>
<text x="24" y="66" fill="#a8a090" font-size="15">Главная страница сервиса, снято 27 августа 2026</text>

<rect x="176" y="92" width="288" height="500" rx="18" fill="none" stroke="#3a3429" stroke-width="2"/>

<rect x="196" y="112" width="248" height="26" fill="#2a251c"/>
<text x="208" y="130" fill="#a8a090" font-size="14">Отели · Авиа · Поезда · Туры</text>

<rect x="196" y="150" width="248" height="76" fill="#2a251c"/>
<text x="208" y="172" fill="#e8e0d0" font-size="14">Куда поехать</text>
<text x="208" y="196" fill="#a8a090" font-size="13">Заезд · Выезд · 2 взрослых</text>
<rect x="208" y="204" width="86" height="16" fill="#c9973a"/>
<text x="251" y="216" text-anchor="middle" fill="#131009" font-size="11" font-weight="700">Найти</text>

<rect x="196" y="240" width="248" height="150" fill="#3a2f16" stroke="#c9973a" stroke-width="2"/>
<text x="208" y="260" fill="#e8c062" font-size="12" font-weight="700" letter-spacing="1">РЕКЛАМА</text>
<text x="208" y="282" fill="#e8e0d0" font-size="14">Рекомендуем жильё</text>
<rect x="208" y="294" width="70" height="80" fill="#2a251c"/>
<rect x="288" y="294" width="70" height="80" fill="#2a251c"/>
<rect x="368" y="294" width="64" height="80" fill="#2a251c"/>
<text x="243" y="340" text-anchor="middle" fill="#6b6558" font-size="12">отель</text>
<text x="323" y="340" text-anchor="middle" fill="#6b6558" font-size="12">отель</text>
<text x="400" y="340" text-anchor="middle" fill="#6b6558" font-size="12">отель</text>

<line x1="176" y1="404" x2="464" y2="404" stroke="#a8a090" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="470" y="409" fill="#a8a090" font-size="13">нижний край экрана</text>

<rect x="196" y="424" width="248" height="30" fill="#2a251c"/>
<text x="208" y="444" fill="#a8a090" font-size="13">Сортировка: по цене, по рейтингу</text>
<rect x="196" y="464" width="248" height="46" fill="#2a251c"/>
<rect x="196" y="520" width="248" height="46" fill="#2a251c"/>
<text x="320" y="492" text-anchor="middle" fill="#6b6558" font-size="13">обычная выдача</text>
<text x="320" y="548" text-anchor="middle" fill="#6b6558" font-size="13">обычная выдача</text>

<text x="24" y="480" fill="#e8c062" font-size="15" font-weight="600">В золотой рамке —</text>
<text x="24" y="502" fill="#e8e0d0" font-size="15">платные места. Туда</text>
<text x="24" y="524" fill="#e8e0d0" font-size="15">попадают объекты</text>
<text x="24" y="546" fill="#e8e0d0" font-size="15">программ «Премиум»</text>
<text x="24" y="568" fill="#e8e0d0" font-size="15">и «Премиум PRO»,</text>
<text x="24" y="590" fill="#e8e0d0" font-size="15">выбранные случайно.</text>
</svg>
