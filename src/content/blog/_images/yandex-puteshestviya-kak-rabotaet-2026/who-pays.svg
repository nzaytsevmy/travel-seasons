<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="system-ui,-apple-system,sans-serif">
<title>Какую долю цены бронирования сервис удерживает у объекта размещения</title>
<desc>Три горизонтальные полосы, каждая — цена одного бронирования целиком. Золотой отрезок слева показывает долю сервиса: семнадцать процентов у обычного объекта, двадцать у участника программы Премиум и двадцать пять у Премиум PRO. Остальное уходит отелю или хозяину квартиры.</desc>
<rect width="640" height="430" fill="#131009"/>

<text x="24" y="42" fill="#c9973a" font-size="21" font-weight="600">Из чего складывается цена ночи</text>
<text x="24" y="70" fill="#a8a090" font-size="15">Условия сервиса для объектов размещения с 1 февраля 2026</text>

<text x="24" y="122" fill="#e8e0d0" font-size="17">Обычный объект</text>
<rect x="24" y="134" width="552" height="34" fill="#3a3429"/>
<rect x="24" y="134" width="94" height="34" fill="#c9973a"/>
<text x="71" y="157" text-anchor="middle" fill="#131009" font-size="16" font-weight="700">17%</text>

<text x="24" y="212" fill="#e8e0d0" font-size="17">Объект в программе «Премиум»</text>
<rect x="24" y="224" width="552" height="34" fill="#3a3429"/>
<rect x="24" y="224" width="110" height="34" fill="#c9973a"/>
<text x="79" y="247" text-anchor="middle" fill="#131009" font-size="16" font-weight="700">20%</text>

<text x="24" y="302" fill="#e8e0d0" font-size="17">Объект в программе «Премиум PRO»</text>
<rect x="24" y="314" width="552" height="34" fill="#3a3429"/>
<rect x="24" y="314" width="138" height="34" fill="#e8c062"/>
<text x="93" y="337" text-anchor="middle" fill="#131009" font-size="16" font-weight="700">25%</text>

<rect x="24" y="368" width="16" height="16" fill="#c9973a"/>
<text x="50" y="382" fill="#a8a090" font-size="15">доля сервиса</text>
<rect x="210" y="368" width="16" height="16" fill="#3a3429"/>
<text x="236" y="382" fill="#a8a090" font-size="15">остаётся объекту размещения</text>

<text x="24" y="414" fill="#e8e0d0" font-size="16">Гость платит одну сумму: отдельной строки за услуги сервиса в брони нет.</text>
</svg>
