<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="title desc">
<title id="title">Часы работы Большого Египетского музея</title>
<desc id="desc">Обычные дни: комплекс с 8:30 до 19:00, галереи с 9:00 до 18:00. Среда и суббота: комплекс с 8:30 до 22:00, галереи с 9:00 до 21:00. Все полосы в одной временной шкале.</desc>
<rect width="640" height="450" fill="#fbfbfa"/>
<g font-family="Arial, sans-serif" fill="#15171a">
<text x="30" y="40" font-size="27" font-weight="700">Сколько времени останется на залы</text>
<g stroke="#d9dbde"><path d="M62 97V326 M214 97V326 M366 97V326 M518 97V326 M594 97V326"/></g>
<g font-size="23" text-anchor="middle"><text x="62" y="86">8</text><text x="214" y="86">12</text><text x="366" y="86">16</text><text x="518" y="86">20</text><text x="594" y="86">22</text></g>
<text x="30" y="129" font-size="24" font-weight="700">Обычные дни</text>
<rect x="81" y="149" width="399" height="48" fill="#d9dbde"/><rect x="100" y="156" width="342" height="34" fill="#1d40ae"/>
<text x="271" y="181" font-size="23" fill="white" text-anchor="middle">Галереи 9:00–18:00</text>
<text x="30" y="248" font-size="24" font-weight="700">Среда и суббота</text>
<rect x="81" y="268" width="513" height="48" fill="#d9dbde"/><rect x="100" y="275" width="456" height="34" fill="#1d40ae"/>
<text x="328" y="300" font-size="23" fill="white" text-anchor="middle">Галереи 9:00–21:00</text>
<rect x="30" y="354" width="22" height="22" fill="#d9dbde"/><text x="63" y="373" font-size="23">Весь комплекс</text>
<rect x="328" y="354" width="22" height="22" fill="#1d40ae"/><text x="361" y="373" font-size="23">Галереи</text>
<text x="30" y="420" font-size="23">Последний вход: за час до закрытия галерей</text>
</g></svg>
