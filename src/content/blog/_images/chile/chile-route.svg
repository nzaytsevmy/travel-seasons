<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 670" width="640" height="670" font-family="system-ui,-apple-system,sans-serif">
<title>Маршрут по Чили на 14 дней: север и юг в одной поездке</title>
<desc>Два дня в Сантьяго, день на виноградниках, перелёт в Атакаму на четыре дня, перелёт в Патагонию на пять дней и возвращение через столицу.</desc>
<rect width="640" height="670" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">МАРШРУТ НА 14 ДНЕЙ</text>
<circle cx="46" cy="110" r="10" fill="#1d40ae"/>
<line x1="46" y1="122" x2="46" y2="156" stroke="#d9dbde" stroke-width="2"/>
<text x="74" y="104" fill="#1d40ae" font-size="17" font-weight="700">день 1–2</text>
<text x="74" y="128" fill="#15171a" font-size="20" font-weight="600">Сантьяго</text>
<text x="74" y="150" fill="#5c626b" font-size="16">город, музеи, фуникулёр</text>
<circle cx="46" cy="182" r="10" fill="#1a7f4b"/>
<line x1="46" y1="194" x2="46" y2="228" stroke="#d9dbde" stroke-width="2"/>
<text x="74" y="176" fill="#1a7f4b" font-size="17" font-weight="700">день 3</text>
<text x="74" y="200" fill="#15171a" font-size="20" font-weight="600">Винодельня</text>
<text x="74" y="222" fill="#5c626b" font-size="16">Майпо или Касабланка, тур от $50</text>
<line x1="46" y1="232" x2="46" y2="290" stroke="#d9dbde" stroke-width="2" stroke-dasharray="4 5"/>
<text x="74" y="258" fill="#5c626b" font-size="17">перелёт Сантьяго → Калама</text>
<text x="74" y="280" fill="#8a9099" font-size="15">≈$120, 2 часа плюс трансфер</text>
<circle cx="46" cy="326" r="10" fill="#8a6a10"/>
<line x1="46" y1="338" x2="46" y2="372" stroke="#d9dbde" stroke-width="2"/>
<text x="74" y="320" fill="#8a6a10" font-size="17" font-weight="700">день 4–7</text>
<text x="74" y="344" fill="#15171a" font-size="20" font-weight="600">Атакама</text>
<text x="74" y="366" fill="#5c626b" font-size="16">Долина Луны, гейзеры, звёзды</text>
<line x1="46" y1="376" x2="46" y2="434" stroke="#d9dbde" stroke-width="2" stroke-dasharray="4 5"/>
<text x="74" y="402" fill="#5c626b" font-size="17">перелёт через Сантьяго в Пунта-Аренас</text>
<text x="74" y="424" fill="#8a9099" font-size="15">$200–280, весь день в воздухе</text>
<circle cx="46" cy="470" r="10" fill="#2b6f8a"/>
<line x1="46" y1="482" x2="46" y2="516" stroke="#d9dbde" stroke-width="2"/>
<text x="74" y="464" fill="#2b6f8a" font-size="17" font-weight="700">день 8–12</text>
<text x="74" y="488" fill="#15171a" font-size="20" font-weight="600">Патагония</text>
<text x="74" y="510" fill="#5c626b" font-size="16">Торрес-дель-Пайне, трек или выезды</text>
<circle cx="46" cy="542" r="10" fill="#1d40ae"/>
<text x="74" y="536" fill="#1d40ae" font-size="17" font-weight="700">день 13–14</text>
<text x="74" y="560" fill="#15171a" font-size="20" font-weight="600">Сантьяго</text>
<text x="74" y="582" fill="#5c626b" font-size="16">отдых перед долгой дорогой домой</text>
<text x="320" y="614" text-anchor="middle" fill="#8a9099" font-size="16">Места в кемпингах Торрес-дель-Пайне</text>
<text x="320" y="636" text-anchor="middle" fill="#8a9099" font-size="16">разбирают за восемь месяцев</text>
</svg>