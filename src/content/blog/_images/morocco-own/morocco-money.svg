<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" width="640" height="476" font-family="system-ui,-apple-system,sans-serif">
<title>Деньги в Марокко: главные правила</title>
<desc>Дирхам нельзя купить заранее и нельзя вывезти, остаток меняют до вылета по чеку. Везут доллары или евро, российские карты не работают.</desc>
<rect width="640" height="476" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ДЕНЬГИ В МАРОККО</text>
<rect x="24" y="84" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="84" width="6" height="70" fill="#d44545"/>
<text x="52" y="114" fill="#e8e0d0" font-size="18" font-weight="600">Дирхам нельзя купить заранее</text>
<text x="52" y="138" fill="#a8a090" font-size="15.5">в России его не продают</text>
<rect x="24" y="168" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="168" width="6" height="70" fill="#d44545"/>
<text x="52" y="198" fill="#e8e0d0" font-size="18" font-weight="600">Дирхам нельзя вывозить</text>
<text x="52" y="222" fill="#a8a090" font-size="15.5">остаток меняют до вылета по чеку</text>
<rect x="24" y="252" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="252" width="6" height="70" fill="#5cc97a"/>
<text x="52" y="282" fill="#e8e0d0" font-size="18" font-weight="600">Везти доллары или евро</text>
<text x="52" y="306" fill="#a8a090" font-size="15.5">менять в городе, не в аэропорту</text>
<rect x="24" y="336" width="592" height="70" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="336" width="6" height="70" fill="#e8c062"/>
<text x="52" y="366" fill="#e8e0d0" font-size="18" font-weight="600">Российские карты не работают</text>
<text x="52" y="390" fill="#a8a090" font-size="15.5">наличные правят везде, кроме сетевых</text>
<text x="320" y="462" text-anchor="middle" fill="#6b6455" font-size="15.5">Это главная финансовая тонкость страны</text>
</svg>