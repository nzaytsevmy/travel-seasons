<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" width="640" height="476" font-family="system-ui,-apple-system,sans-serif">
<title>Деньги в Марокко: главные правила</title>
<desc>Дирхам нельзя купить заранее и нельзя вывезти, остаток меняют до вылета по чеку. Везут доллары или евро, российские карты не работают.</desc>
<rect width="640" height="476" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">ДЕНЬГИ В МАРОККО</text>
<rect x="24" y="84" width="592" height="70" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="84" width="6" height="70" fill="#b3261e"/>
<text x="52" y="114" fill="#15171a" font-size="18" font-weight="600">Дирхам нельзя купить заранее</text>
<text x="52" y="138" fill="#5c626b" font-size="15.5">в России его не продают</text>
<rect x="24" y="168" width="592" height="70" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="168" width="6" height="70" fill="#b3261e"/>
<text x="52" y="198" fill="#15171a" font-size="18" font-weight="600">Дирхам нельзя вывозить</text>
<text x="52" y="222" fill="#5c626b" font-size="15.5">остаток меняют до вылета по чеку</text>
<rect x="24" y="252" width="592" height="70" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="252" width="6" height="70" fill="#1a7f4b"/>
<text x="52" y="282" fill="#15171a" font-size="18" font-weight="600">Везти доллары или евро</text>
<text x="52" y="306" fill="#5c626b" font-size="15.5">менять в городе, не в аэропорту</text>
<rect x="24" y="336" width="592" height="70" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="336" width="6" height="70" fill="#8a6a10"/>
<text x="52" y="366" fill="#15171a" font-size="18" font-weight="600">Российские карты не работают</text>
<text x="52" y="390" fill="#5c626b" font-size="15.5">наличные правят везде, кроме сетевых</text>
<text x="320" y="462" text-anchor="middle" fill="#8a9099" font-size="15.5">Это главная финансовая тонкость страны</text>
</svg>