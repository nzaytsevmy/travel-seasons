<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="t d">
<title id="t">Кёнбоккун: короткая и полная прогулка</title>
<desc id="d">От Кванхвамуна на юге через Хыннемун к тронному двору. Кёнхверу находится западнее центральной оси, Хянвончжон дальше на севере. Линия показывает порядок посещения, не точные дорожки. Без масштаба.</desc>
<rect width="600" height="760" fill="#fbfbfa"/>
<g font-family="Arial,sans-serif" fill="#15171a">
<text x="28" y="44" font-size="31" font-weight="700">Как далеко идти?</text>
<text x="28" y="79" font-size="24">Север ↑ · схема без масштаба</text>
<ellipse cx="305" cy="172" rx="88" ry="42" fill="#d9e1f2" stroke="#1d40ae" stroke-width="2"/>
<rect x="290" y="150" width="30" height="28" fill="#1d40ae"/>
<text x="305" y="240" text-anchor="middle" font-size="27">Хянвончжон</text>
