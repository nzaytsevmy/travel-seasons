<ellipse cx="140" cy="379" rx="84" ry="35" fill="#d9e1f2" stroke="#1d40ae" stroke-width="2"/>
<rect x="113" y="365" width="54" height="24" fill="#1d40ae"/>
<text x="140" y="438" text-anchor="middle" font-size="27">Кёнхверу</text>
<path d="M230 385 H360 V474" fill="none" stroke="#1d40ae" stroke-width="4" stroke-dasharray="9 8"/>
<rect x="266" y="482" width="216" height="73" rx="7" fill="none" stroke="#15171a" stroke-width="3"/>
<text x="374" y="512" text-anchor="middle" font-size="26">Кынджончжон</text>
<text x="374" y="542" text-anchor="middle" font-size="23">тронный двор</text>
<path d="M374 562 V589 M374 620 V650" stroke="#1d40ae" stroke-width="4"/>
<text x="374" y="614" text-anchor="middle" font-size="27">Хыннемун</text>
