<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" role="img" aria-labelledby="title desc">
<title id="title">Два аэропорта Пекина и дорога в центр</title>
<desc id="desc">Север сверху, расстояния до центра даны по прямой. Шоуду лежит к северо-востоку от площади Тяньаньмэнь, примерно в 26 км по прямой; экспресс идёт через Саньюаньцяо и Дунчжимэнь до Бэйсиньцяо. Дасин лежит на юге, примерно в 44 км; ветка метро идёт до станции Цаоцяо. Между аэропортами 67 км.</desc>
<rect width="420" height="720" fill="#fbfbfa"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#15171a">
<text x="22" y="36" font-size="22" font-weight="700">Два аэропорта — два конца города</text>
<text x="22" y="60" font-size="14" fill="#5c626b">Север сверху. До центра — по прямой.</text>
<path d="M392 96V70m-6 9 6-9 6 9" fill="none" stroke="#5c626b" stroke-width="2"/>
<text x="392" y="112" font-size="12" text-anchor="middle" fill="#5c626b">С</text>
<line x1="283" y1="116" x2="148" y2="645" stroke="#d9dbde" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="222" y="372" width="112" height="44" fill="#fbfbfa"/>
<text x="278" y="390" font-size="15" font-weight="700" text-anchor="middle">67 км</text>
<text x="278" y="408" font-size="12" text-anchor="middle" fill="#5c626b">между аэропортами</text>
<polyline points="283,116 182,220 166,239 153,240" fill="none" stroke="#1d40ae" stroke-width="4" stroke-linejoin="round"/>
<circle cx="153" cy="240" r="4" fill="#fbfbfa" stroke="#1d40ae" stroke-width="2.5"/>
<text x="20" y="226" font-size="12" fill="#5c626b">Бэйсиньцяо</text>
<line x1="94" y1="229" x2="148" y2="238" stroke="#d9dbde" stroke-width="1"/>
<polyline points="148,645 131,560 106,329" fill="none" stroke="#2b6f8a" stroke-width="4" stroke-linejoin="round"/>
<circle cx="283" cy="116" r="16" fill="#1d40ae"/>
<text x="283" y="120" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">PEK</text>
<text x="300" y="146" font-size="18" font-weight="700">Шоуду</text>
<text x="300" y="166" font-size="13" fill="#5c626b">≈26 км до центра</text>
<text x="300" y="184" font-size="13" fill="#5c626b">экспресс, 25 юаней</text>
<circle cx="182" cy="220" r="5" fill="#fbfbfa" stroke="#1d40ae" stroke-width="2.5"/>
<text x="172" y="206" font-size="12" text-anchor="end" fill="#5c626b">Саньюаньцяо</text>
<circle cx="204" cy="213" r="4" fill="#8a9099"/>
<text x="213" y="219" font-size="12" fill="#8a9099">798</text>
<circle cx="166" cy="239" r="6" fill="#fbfbfa" stroke="#1d40ae" stroke-width="3"/>
<text x="178" y="248" font-size="14" font-weight="700">Дунчжимэнь</text>
<circle cx="134" cy="266" r="5" fill="#15171a"/>
<text x="20" y="262" font-size="14" font-weight="700">Запретный</text>
<text x="20" y="279" font-size="14" font-weight="700">город</text>
<circle cx="134" cy="279" r="4" fill="#fbfbfa" stroke="#15171a" stroke-width="2"/>
<text x="20" y="298" font-size="12" fill="#5c626b">площадь Тяньаньмэнь</text>
<circle cx="106" cy="329" r="6" fill="#fbfbfa" stroke="#2b6f8a" stroke-width="3"/>
<text x="20" y="352" font-size="14" font-weight="700">Цаоцяо</text>
<text x="20" y="369" font-size="12" fill="#5c626b">пересадка на метро</text>
<circle cx="131" cy="560" r="5" fill="#fbfbfa" stroke="#2b6f8a" stroke-width="2.5"/>
<text x="20" y="556" font-size="12" fill="#5c626b">Дасин-Синьчэн</text>
<rect x="86" y="436" width="136" height="62" fill="#fbfbfa"/>
<text x="92" y="456" font-size="13" fill="#2b6f8a" font-weight="700">ветка метро</text>
<text x="92" y="474" font-size="13" fill="#5c626b">19 минут до Цаоцяо</text>
<text x="92" y="492" font-size="13" fill="#5c626b">35 юаней</text>
<circle cx="148" cy="645" r="16" fill="#2b6f8a"/>
<text x="148" y="649" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">PKX</text>
<text x="172" y="640" font-size="18" font-weight="700">Дасин</text>
<text x="172" y="660" font-size="13" fill="#5c626b">≈44 км до центра</text>
<line x1="300" y1="700" x2="384.5" y2="700" stroke="#15171a" stroke-width="2"/>
<line x1="300" y1="694" x2="300" y2="706" stroke="#15171a" stroke-width="2"/>
<line x1="384.5" y1="694" x2="384.5" y2="706" stroke="#15171a" stroke-width="2"/>
<text x="342" y="688" font-size="12" text-anchor="middle" fill="#5c626b">10 км</text>
</g>
</svg>
