<line x1="24" y1="700" x2="616" y2="700" stroke="#3a3429" stroke-width="1"/>
<g font-size="18">
  <rect x="28" y="724" width="30" height="8" rx="4" fill="#c9973a" opacity="0.9"/>
  <text x="74" y="734" fill="#e8e0d0">открыт пассату: волна в лагуне и шум</text>
  <rect x="28" y="762" width="30" height="8" rx="4" fill="#e8e0d0" opacity="0.45"/>
  <text x="74" y="772" fill="#e8e0d0">закрыт нагорьем: сюда и едут купаться</text>
</g>
<text x="28" y="812" fill="#a8a090" font-size="16">Схема. Ветер 20–30 км/ч, порывы за 90 км/ч в июле и августе —</text>
<text x="28" y="832" fill="#a8a090" font-size="16">метеослужба Маврикия, обзор от 29 апреля 2026 года.</text>
</svg>
