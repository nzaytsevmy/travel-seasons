<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 850" width="640" height="850" font-family="system-ui,-apple-system,sans-serif">
<title>Маврикий: куда бьёт юго-восточный пассат</title>
<desc>Схема острова. Юго-восточный пассат приходит справа и бьёт в восточный и юго-восточный берега — там Бель-Мар и аэропорт. Северный и западный берега закрыты островом и центральным нагорьем — там Гранд-Бэ, Флик-ан-Флак, Тамарен и Ле-Морн. Скорость ветра 20–30 км/ч, в июле и августе порывы за 90 км/ч на открытых участках.</desc>
<rect width="640" height="850" fill="#131009"/>

<text x="320" y="46" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">КУДА БЬЁТ ПАССАТ</text>
<text x="320" y="78" text-anchor="middle" fill="#a8a090" font-size="18">берег важнее отеля с мая по сентябрь</text>
<line x1="24" y1="100" x2="616" y2="100" stroke="#3a3429" stroke-width="1"/>

<path d="M300 160
         Q368 170 404 214
         Q440 258 450 326
         Q460 396 442 456
         Q426 516 386 562
         Q346 606 296 610
         Q248 614 216 580
         L194 596
         Q176 580 188 560
         L206 542
         Q178 494 166 430
         Q154 364 168 298
         Q184 230 240 186
         Z"
      fill="#1c1710" stroke="#3a3429" stroke-width="2"/>

<path d="M404 214 Q440 258 450 326 Q460 396 442 456 Q426 516 386 562"
      fill="none" stroke="#c9973a" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
<path d="M300 160 Q368 170 404 214" fill="none" stroke="#e8e0d0" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
<path d="M240 186 Q184 230 168 298 Q154 364 166 430 Q178 494 206 542"
      fill="none" stroke="#e8e0d0" stroke-width="6" stroke-linecap="round" opacity="0.45"/>

<ellipse cx="304" cy="386" rx="76" ry="98" transform="rotate(-14 304 386)" fill="#241d14" stroke="#3a3429" stroke-width="1"/>
<text x="304" y="378" text-anchor="middle" fill="#a8a090" font-size="18" font-weight="600">нагорье</text>
<text x="304" y="402" text-anchor="middle" fill="#a8a090" font-size="18" font-weight="600">и горы</text>

<g stroke="#c9973a" stroke-width="3.5" fill="none" stroke-linecap="round">
  <path d="M618 258 L494 288"/><path d="M494 288 L514 277 M494 288 L515 296"/>
  <path d="M624 376 L496 376"/><path d="M496 376 L516 366 M496 376 L516 386"/>
  <path d="M616 494 L474 470"/><path d="M474 470 L494 462 M474 470 L492 480"/>
</g>
<text x="574" y="212" text-anchor="middle" fill="#c9973a" font-size="19" font-weight="700">ПАССАТ</text>
<text x="574" y="238" text-anchor="middle" fill="#c9973a" font-size="18" font-weight="600">с юго-востока</text>

<g font-size="19" font-weight="600">
  <circle cx="318" cy="166" r="6" fill="#e8e0d0"/>
  <text x="336" y="146" fill="#e8e0d0">Гранд-Бэ</text>

  <circle cx="164" cy="344" r="6" fill="#e8e0d0"/>
  <text x="144" y="350" text-anchor="end" fill="#e8e0d0">Флик-ан-Флак</text>

  <circle cx="174" cy="466" r="6" fill="#e8e0d0"/>
  <text x="154" y="472" text-anchor="end" fill="#e8e0d0">Тамарен</text>

  <circle cx="196" cy="574" r="6" fill="#e8e0d0"/>
  <text x="176" y="592" text-anchor="end" fill="#e8e0d0">Ле-Морн</text>

  <circle cx="454" cy="336" r="6" fill="#c9973a"/>
  <text x="474" y="330" fill="#c9973a">Бель-Мар</text>

  <circle cx="412" cy="530" r="6" fill="#c9973a"/>
  <text x="434" y="556" fill="#c9973a">аэропорт</text>
</g>

<g transform="translate(556 646)">
  <circle cx="0" cy="0" r="28" fill="none" stroke="#3a3429" stroke-width="1"/>
  <path d="M0 20 L0 -20 M0 -20 L-6 -11 M0 -20 L6 -11" stroke="#a8a090" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="0" y="-38" text-anchor="middle" fill="#a8a090" font-size="15" font-weight="600">С</text>
  <text x="0" y="52" text-anchor="middle" fill="#a8a090" font-size="15" font-weight="600">Ю</text>
  <text x="-44" y="6" text-anchor="middle" fill="#a8a090" font-size="15" font-weight="600">З</text>
  <text x="44" y="6" text-anchor="middle" fill="#a8a090" font-size="15" font-weight="600">В</text>
