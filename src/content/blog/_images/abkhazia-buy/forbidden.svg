<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="system-ui,-apple-system,sans-serif">
<title>Что не пропустят через границу из Абхазии</title>
<desc>Фрукты и овощи, домашний сыр без маркировки, чача в бутылке из-под лимонада, напитки крепче семидесяти градусов и эвкалиптовые веники.</desc>
<rect width="640" height="440" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ЧТО НЕ ПРОПУСТЯТ</text>
<text x="26" y="104" fill="#d44545" font-size="20" font-weight="700">×</text>
<text x="52" y="104" fill="#e8e0d0" font-size="18" font-weight="600">Мандарины и любые фрукты</text>
<text x="52" y="124" fill="#a8a090" font-size="15">с ними едет карантинный клоп</text>
<text x="26" y="160" fill="#d44545" font-size="20" font-weight="700">×</text>
<text x="52" y="160" fill="#e8e0d0" font-size="18" font-weight="600">Домашний сыр без маркировки</text>
<text x="52" y="180" fill="#a8a090" font-size="15">инспектор вправе развернуть</text>
<text x="26" y="216" fill="#d44545" font-size="20" font-weight="700">×</text>
<text x="52" y="216" fill="#e8e0d0" font-size="18" font-weight="600">Чача в бутылке из-под лимонада</text>
<text x="52" y="236" fill="#a8a090" font-size="15">домашний алкоголь без заводской тары</text>
<text x="26" y="272" fill="#d44545" font-size="20" font-weight="700">×</text>
<text x="52" y="272" fill="#e8e0d0" font-size="18" font-weight="600">Крепче 70 градусов</text>
<text x="52" y="292" fill="#a8a090" font-size="15">в самолёт нельзя совсем</text>
<text x="26" y="328" fill="#d44545" font-size="20" font-weight="700">×</text>
<text x="52" y="328" fill="#e8e0d0" font-size="18" font-weight="600">Эвкалиптовые веники</text>
<text x="52" y="348" fill="#a8a090" font-size="15">запрет самой Абхазии с 2019 года</text>
<text x="320" y="390" text-anchor="middle" fill="#6b6455" font-size="15.5">«До 15 кг цитрусовых» — цифра, которой нет</text>
<text x="320" y="410" text-anchor="middle" fill="#6b6455" font-size="15.5">ни в одном документе</text>
</svg>