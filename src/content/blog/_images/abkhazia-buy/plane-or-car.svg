<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="system-ui,-apple-system,sans-serif">
<title>Самолёт или машина: разные правила вывоза</title>
<desc>В самолёте действуют и таможенные нормы, и авиационные: домашний алкоголь без заводской тары не берут вовсе. На машине через Псоу остаются только таможенные три литра.</desc>
<rect width="640" height="380" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">САМОЛЁТ ИЛИ МАШИНА</text>
<rect x="24" y="84" width="290" height="240" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="84" width="290" height="5" fill="#8a6a10"/>
<text x="42" y="120" fill="#8a6a10" font-size="19" font-weight="700">САМОЛЁТОМ</text>
<circle cx="48" cy="152" r="3.5" fill="#8a6a10"/>
<text x="62" y="157" fill="#15171a" font-size="15.5">таможенные 3 литра</text>
<circle cx="48" cy="190" r="3.5" fill="#8a6a10"/>
<text x="62" y="195" fill="#15171a" font-size="15.5">плюс авиаправила</text>
<circle cx="48" cy="228" r="3.5" fill="#8a6a10"/>
<text x="62" y="233" fill="#15171a" font-size="15.5">домашний розлив нельзя</text>
<circle cx="48" cy="266" r="3.5" fill="#8a6a10"/>
<text x="62" y="271" fill="#15171a" font-size="15.5">крепче 70% нельзя</text>
<rect x="326" y="84" width="290" height="240" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="326" y="84" width="290" height="5" fill="#1a7f4b"/>
<text x="344" y="120" fill="#1a7f4b" font-size="19" font-weight="700">МАШИНОЙ</text>
<circle cx="350" cy="152" r="3.5" fill="#1a7f4b"/>
<text x="364" y="157" fill="#15171a" font-size="15.5">только таможенные 3 литра</text>
<circle cx="350" cy="190" r="3.5" fill="#1a7f4b"/>
<text x="364" y="195" fill="#15171a" font-size="15.5">авиаправила не действуют</text>
<circle cx="350" cy="228" r="3.5" fill="#1a7f4b"/>
<text x="364" y="233" fill="#15171a" font-size="15.5">розлив любой</text>
<circle cx="350" cy="266" r="3.5" fill="#1a7f4b"/>
<text x="364" y="271" fill="#15171a" font-size="15.5">здравый смысл</text>
<text x="320" y="352" text-anchor="middle" fill="#8a9099" font-size="15.5">Больше пяти литров нельзя никак: ни с доплатой, ни на машине</text>
</svg>