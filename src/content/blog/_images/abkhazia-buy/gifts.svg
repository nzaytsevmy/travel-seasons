<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" width="640" height="512" font-family="system-ui,-apple-system,sans-serif">
<title>Что привезти из Абхазии в подарок кому</title>
<desc>Другу чурчхела и аджика, маме мёд и специи, мужчине чача заводского розлива или джезва, коллегам травяной чай и варенье.</desc>
<rect width="640" height="512" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ЧТО КОМУ ВЕЗТИ</text>
<rect x="24" y="76" width="592" height="74" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="76" width="6" height="74" fill="#5cc97a"/>
<text x="52" y="104" fill="#5cc97a" font-size="18" font-weight="700">Другу</text>
<text x="52" y="128" fill="#e8e0d0" font-size="18">чурчхела и аджика</text>
<text x="52" y="146" fill="#a8a090" font-size="15">дёшево, вкусно, довозится</text>
<rect x="24" y="164" width="592" height="74" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="164" width="6" height="74" fill="#e8c062"/>
<text x="52" y="192" fill="#e8c062" font-size="18" font-weight="700">Маме</text>
<text x="52" y="216" fill="#e8e0d0" font-size="18">мёд и специи</text>
<text x="52" y="234" fill="#a8a090" font-size="15">заводская банка, без вопросов</text>
<rect x="24" y="252" width="592" height="74" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="252" width="6" height="74" fill="#c9973a"/>
<text x="52" y="280" fill="#c9973a" font-size="18" font-weight="700">Мужчине</text>
<text x="52" y="304" fill="#e8e0d0" font-size="18">чача заводского розлива</text>
<text x="52" y="322" fill="#a8a090" font-size="15">или джезва для кофе</text>
<rect x="24" y="340" width="592" height="74" rx="5" fill="none" stroke="#3a3429"/>
<rect x="24" y="340" width="6" height="74" fill="#7fb5c9"/>
<text x="52" y="368" fill="#7fb5c9" font-size="18" font-weight="700">Коллегам</text>
<text x="52" y="392" fill="#e8e0d0" font-size="18">травяной чай и варенье</text>
<text x="52" y="410" fill="#a8a090" font-size="15">делится на много рук</text>
<text x="320" y="488" text-anchor="middle" fill="#6b6455" font-size="15.5">Съедобное здесь бьёт любые магниты:</text>
<text x="320" y="506" text-anchor="middle" fill="#6b6455" font-size="15.5">это то, что в Абхазии делают, а не привозят с базы</text>
</svg>