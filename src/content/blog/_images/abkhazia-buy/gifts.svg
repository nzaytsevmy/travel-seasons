<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" width="640" height="512" font-family="system-ui,-apple-system,sans-serif">
<title>Что привезти из Абхазии в подарок кому</title>
<desc>Другу чурчхела и аджика, маме мёд и специи, мужчине чача заводского розлива или джезва, коллегам травяной чай и варенье.</desc>
<rect width="640" height="512" fill="#fbfbfa"/>
<text x="320" y="44" text-anchor="middle" fill="#1d40ae" font-size="23" font-weight="700">ЧТО КОМУ ВЕЗТИ</text>
<rect x="24" y="76" width="592" height="74" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="76" width="6" height="74" fill="#1a7f4b"/>
<text x="52" y="104" fill="#1a7f4b" font-size="18" font-weight="700">Другу</text>
<text x="52" y="128" fill="#15171a" font-size="18">чурчхела и аджика</text>
<text x="52" y="146" fill="#5c626b" font-size="15">дёшево, вкусно, довозится</text>
<rect x="24" y="164" width="592" height="74" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="164" width="6" height="74" fill="#8a6a10"/>
<text x="52" y="192" fill="#8a6a10" font-size="18" font-weight="700">Маме</text>
<text x="52" y="216" fill="#15171a" font-size="18">мёд и специи</text>
<text x="52" y="234" fill="#5c626b" font-size="15">заводская банка, без вопросов</text>
<rect x="24" y="252" width="592" height="74" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="252" width="6" height="74" fill="#1d40ae"/>
<text x="52" y="280" fill="#1d40ae" font-size="18" font-weight="700">Мужчине</text>
<text x="52" y="304" fill="#15171a" font-size="18">чача заводского розлива</text>
<text x="52" y="322" fill="#5c626b" font-size="15">или джезва для кофе</text>
<rect x="24" y="340" width="592" height="74" rx="5" fill="none" stroke="#d9dbde"/>
<rect x="24" y="340" width="6" height="74" fill="#2b6f8a"/>
<text x="52" y="368" fill="#2b6f8a" font-size="18" font-weight="700">Коллегам</text>
<text x="52" y="392" fill="#15171a" font-size="18">травяной чай и варенье</text>
<text x="52" y="410" fill="#5c626b" font-size="15">делится на много рук</text>
<text x="320" y="488" text-anchor="middle" fill="#8a9099" font-size="15.5">Съедобное здесь бьёт любые магниты:</text>
<text x="320" y="506" text-anchor="middle" fill="#8a9099" font-size="15.5">это то, что в Абхазии делают, а не привозят с базы</text>
</svg>