<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" font-family="system-ui,-apple-system,sans-serif">
<title>Что можно вывезти из Абхазии и сколько</title>
<desc>Сыр и копчёности до пяти килограммов в заводской упаковке, алкоголь три литра без пошлины, специи и варенье без нормы, фрукты и овощи нельзя вовсе.</desc>
<rect width="640" height="460" fill="#131009"/>
<text x="320" y="44" text-anchor="middle" fill="#c9973a" font-size="23" font-weight="700">ЧТО МОЖНО ВЫВЕЗТИ</text>
<text x="24" y="102" fill="#e8e0d0" font-size="18" font-weight="600">Сыр, копчёности, мясное</text>
<text x="616" y="102" text-anchor="end" fill="#e8c062" font-size="18" font-weight="700">до 5 кг</text>
<text x="24" y="122" fill="#6b6455" font-size="14.5">только заводская упаковка</text>
<text x="24" y="160" fill="#e8e0d0" font-size="18" font-weight="600">Мёд и молочное</text>
<text x="616" y="160" text-anchor="end" fill="#e8c062" font-size="18" font-weight="700">в общих пределах</text>
<text x="24" y="180" fill="#6b6455" font-size="14.5">промышленная упаковка</text>
<text x="24" y="218" fill="#e8e0d0" font-size="18" font-weight="600">Алкоголь</text>
<text x="616" y="218" text-anchor="end" fill="#c9973a" font-size="18" font-weight="700">3 л без пошлины</text>
<text x="24" y="238" fill="#6b6455" font-size="14.5">до 5 л с доплатой 10 € за литр</text>
<text x="24" y="276" fill="#e8e0d0" font-size="18" font-weight="600">Специи, чурчхела, варенье</text>
<text x="616" y="276" text-anchor="end" fill="#5cc97a" font-size="18" font-weight="700">без спецнормы</text>
<text x="24" y="296" fill="#6b6455" font-size="14.5">закрытая упаковка, личный объём</text>
<text x="24" y="334" fill="#e8e0d0" font-size="18" font-weight="600">Фрукты, овощи, зелень</text>
<text x="616" y="334" text-anchor="end" fill="#d44545" font-size="18" font-weight="700">нельзя вовсе</text>
<text x="24" y="354" fill="#6b6455" font-size="14.5">запрет Россельхознадзора</text>
<text x="320" y="400" text-anchor="middle" fill="#a8a090" font-size="16">Граница на Псоу — это въезд в Россию,</text>
<text x="320" y="422" text-anchor="middle" fill="#a8a090" font-size="16">действуют российские нормы</text>
</svg>