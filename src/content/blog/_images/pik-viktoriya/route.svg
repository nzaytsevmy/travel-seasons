<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1280" viewBox="0 0 390 640" role="img" aria-labelledby="title desc"><title id="title">Прогулка на Пике Виктория</title><desc id="desc">Полный круг Lugard Road и Harlech Road от верхней станции; сад Victoria Peak Garden требует отдельного подъёма.</desc><rect width="390" height="640" rx="16" fill="#fbfbfa"/><g font-family="sans-serif" fill="#15171a"><text x="22" y="38" font-size="22" font-weight="700" fill="#1d40ae">Прогулка на Пике</text><text x="22" y="68" font-size="16" fill="#5c626b">Условная схема · без масштаба</text><path d="M195 427 C15 427 10 138 165 138 C350 138 380 355 195 427" fill="none" stroke="#1d40ae" stroke-width="7"/><rect x="52" y="99" width="180" height="60" rx="6" fill="#fbfbfa"/><text x="65" y="121" font-size="18" font-weight="700">Lugard Road</text><text x="65" y="147" font-size="16">виды на бухту</text><rect x="205" y="245" width="170" height="58" rx="6" fill="#fbfbfa"/><text x="217" y="267" font-size="18" font-weight="700">Harlech Road</text><text x="217" y="293" font-size="16">возврат к станции</text><rect x="87" y="315" width="215" height="65" rx="9" fill="#eef0f2"/><text x="103" y="340" font-size="19" font-weight="700">Полный круг 3,5 км</text><text x="103" y="366" font-size="16">≈ 1 ч ходьбы + остановки</text><path d="M195 427 L80 520" fill="none" stroke="#5c626b" stroke-width="5"/><path d="M195 427 L325 520" fill="none" stroke="#8a6a10" stroke-width="5" stroke-dasharray="8 6"/><circle cx="195" cy="427" r="12" fill="#fbfbfa" stroke="#1d40ae" stroke-width="5"/><rect x="102" y="448" width="198" height="53" rx="6" fill="#fbfbfa"/><text x="114" y="470" font-size="18" font-weight="700">Верхняя станция</text><text x="114" y="494" font-size="16">Peak Tower · терраса</text><text x="24" y="547" font-size="18" font-weight="700">Central</text><text x="24" y="573" font-size="16">транспорт</text><text x="185" y="547" font-size="18" font-weight="700">Peak Garden</text><text x="185" y="573" font-size="16">ещё ≈ 20 мин вверх</text><text x="185" y="598" font-size="15" fill="#5c626b">по Mount Austin Road</text><text x="24" y="623" font-size="15" fill="#5c626b">Сад — отдельный подъём, не часть круга.</text></g></svg>
